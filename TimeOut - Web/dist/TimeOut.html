<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimeOut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722.5%27 fill=%27%2322D66E%27/%3E%3Cg transform=%27translate(48 50) skewX(-10) translate(-50 -50)%27 fill=%27%2303140A%27%3E%3Crect x=%2719%27 y=%2723%27 width=%2762%27 height=%2716%27 rx=%278%27/%3E%3Crect x=%2742%27 y=%2744%27 width=%2716%27 height=%2733%27 rx=%278%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="description" content="TimeOut helps you set screen-time goals through sports challenges.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* TimeOut app layout. */
:root {
  --bg: #0a0d12;
  --surface: #141922;
  --raised: #1d2430;
  --raised-2: #262f3d;
  --stroke: #283141;
  --text: #f2f5f9;
  --text-2: #a6b0c0;
  --muted: #5e687a;
  --faint: #8e98aa; /* text-only grey; 4.5:1+ on every background incl. --raised-2 */
  --accent: #22d66e;
  --accent-ink: #03140a;
  --accent-soft: rgba(34, 214, 110, 0.13);
  --loss: #ff6267;
  --loss-fill: #c9474b; /* behind white text (4.5:1+) */
  --loss-soft: rgba(255, 90, 95, 0.13);
  --live: #ff6170;
  --live-fill: #db323f; /* behind white text (4.5:1+) */
  --warn: #ffc940;
  --warn-soft: rgba(255, 201, 64, 0.12);
  --blue: #4fb3ff;
  --blue-soft: rgba(79, 179, 255, 0.13);
  --purple: #c58cff;
  --scrim: rgba(0, 0, 0, 0.6);

  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --tabbar-h: 70px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; display: block; }
.num, .display { font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.005em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Full-viewport app surface; native app shells can provide their own safe areas. */
.app-surface { position: relative; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; background: var(--bg); isolation: isolate; }

/* ---------- App shell ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; }

.topbar {
  flex: none;
  height: 52px;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 0 14px 0 8px;
}
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 12px;
  color: var(--text);
  position: relative;
}
.icon-btn:hover { background: var(--surface); }
.icon-btn .dotbadge { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2px var(--bg); }
.brand { display: flex; align-items: center; gap: 7px; min-width: 0; }
.brand-mark { color: var(--accent); }
.brand-word { font-family: var(--font-display); font-weight: 900; font-style: italic; font-size: 25px; letter-spacing: 0.02em; line-height: 1; }
.brand-word b { color: var(--accent); font-weight: 900; }
.top-title { font-family: var(--font-display); font-weight: 800; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bal-pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 12px;
  border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 800; font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.bal-pill.locked { background: var(--raised); color: var(--loss); }

.view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding-bottom: 116px;
}
.view::-webkit-scrollbar { display: none; }

/* Floating pill tab bar: hovers over the content with a darker inner pill on the active tab. */
.tabbar {
  position: absolute;
  left: 14px; right: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  height: var(--tabbar-h);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 6px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(44, 50, 60, 0.94), rgba(30, 35, 43, 0.94));
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  backdrop-filter: blur(18px) saturate(1.4);
  z-index: 5;
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border-radius: 999px;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 14px; font-weight: 800; letter-spacing: 0.01em;
  position: relative;
  transition: background 0.2s, color 0.2s;
}
.tab:hover:not(.on) { background: rgba(255, 255, 255, 0.04); }
.tab.on { color: var(--accent); background: rgba(5, 7, 10, 0.85); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
.tab .badge {
  position: absolute; top: 4px; left: calc(50% + 8px);
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--live-fill); color: #fff;
  font-family: var(--font-body);
  font-size: 11px; font-weight: 800; display: grid; place-items: center;
  box-shadow: 0 0 0 2px rgba(30, 35, 43, 1);
}
.tab .badge.green { background: var(--accent); color: var(--accent-ink); }

.page-head { padding: 4px 16px 10px; }
.page-head h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1; letter-spacing: 0.005em; }
.page-head p { margin: 6px 0 0; color: var(--text-2); font-size: 14px; max-width: 34ch; }

/* ---------- Generic building blocks ---------- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-s { display: flex; align-items: center; gap: 6px; }
.row-layout { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.pad { padding-inline: 16px; }
.mt { margin-top: 14px; }
.muted { color: var(--text-2); }
.faint { color: var(--faint); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.bold { font-weight: 700; }
.green { color: var(--accent); }
.red { color: var(--loss); }
.yellow { color: var(--warn); }
.blue { color: var(--blue); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }

.card {
  background: var(--surface);
  border: 1px solid var(--stroke);
  border-radius: 16px;
  padding: 14px;
}
.card.tight { padding: 12px; }
.card.flush { padding: 0; overflow: hidden; }
.card.tappable { cursor: pointer; transition: border-color 0.15s; }
.card.tappable:hover { border-color: #3a4558; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; }
.section-title h2 { margin: 0; font-size: 17px; font-weight: 800; }
.link-btn { color: var(--accent); font-weight: 700; font-size: 13.5px; }
.count-pill { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 800; }
.count-pill.off { background: var(--raised); color: var(--text-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 18px;
  border-radius: 14px;
  font-weight: 800; font-size: 16px;
  background: var(--raised); color: var(--text);
  border: 1px solid var(--stroke);
  transition: filter 0.15s, transform 0.08s;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: scale(0.985); }
.btn.full { width: 100%; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.btn.xs { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 9px; gap: 5px; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.warn { background: var(--warn); border-color: transparent; color: #1d1600; }
.btn.danger { background: var(--loss-fill); border-color: transparent; color: #fff; }
.btn.ghost { background: transparent; border-color: var(--stroke); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--text-2); }
.btn:disabled { opacity: 0.42; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 13px;
  border-radius: 999px;
  background: var(--surface); border: 1px solid var(--stroke);
  font-size: 14px; font-weight: 700; white-space: nowrap;
}
.chip .n { font-size: 11px; font-weight: 800; color: var(--faint); }
.chip.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.chip.on .n { color: rgba(3, 20, 10, 0.6); }
.chip.dashed { background: transparent; border-style: dashed; color: var(--text-2); }
.chip.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }

.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; }
.hscroll::-webkit-scrollbar { display: none; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px; border-radius: 6px;
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--raised); color: var(--text-2);
  white-space: nowrap;
}
.tag.green { background: var(--accent-soft); color: var(--accent); }
.tag.red { background: var(--loss-soft); color: var(--loss); }
.tag.yellow { background: var(--warn-soft); color: var(--warn); }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.status-pill { display: inline-grid; place-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: 0.05em; }
.status-pill.won { background: var(--accent); color: var(--accent-ink); }
.status-pill.lost { background: var(--loss-fill); color: #fff; }
.status-pill.void, .status-pill.tie { background: var(--muted); color: #fff; }
.status-pill.open { background: var(--raised); color: var(--text); }

.live { display: inline-flex; align-items: center; gap: 4px; color: var(--live); font-size: 11px; font-weight: 900; letter-spacing: 0.04em; }
.live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.3; } }

.team-badge {
  flex: none;
  display: grid; place-items: center;
  width: 26px; height: 26px; border-radius: 50%;
  color: #fff; font-weight: 900; font-size: 9px; letter-spacing: -0.02em;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.14);
  font-family: var(--font-display);
}
.team-badge img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--raised); }
.avatar.lg { width: 64px; height: 64px; }
.avatar.xl { width: 96px; height: 96px; }
.avatar.sm { width: 28px; height: 28px; }

.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s; }

.note {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 10px 12px; border-radius: 12px;
  font-size: 13px; font-weight: 600;
  background: var(--raised); color: var(--text-2);
}
.note .ic { margin-top: 1px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.red { background: var(--loss-soft); color: var(--loss); }
.note.green { background: var(--accent-soft); color: var(--accent); }
.note.blue { background: var(--blue-soft); color: var(--blue); }

.divider { height: 1px; background: var(--stroke); border: 0; margin: 0; }

.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
  padding: 28px 22px;
}
.empty .ic { color: var(--muted); }
.empty h3 { margin: 0; font-size: 18px; }
.empty p { margin: 0; color: var(--text-2); font-size: 14px; max-width: 30ch; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field .label { font-size: 13px; font-weight: 700; color: var(--text-2); }
.input, .textarea, .select {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid var(--stroke);
  background: var(--raised);
  font-size: 16px;
  outline: none;
}
.textarea { height: auto; min-height: 76px; padding: 12px 14px; resize: none; line-height: 1.4; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
.input.bad, .textarea.bad { border-color: var(--loss); }
.field .err { color: var(--loss); font-size: 12.5px; font-weight: 600; }
.field .hint { color: var(--faint); font-size: 12.5px; }
.input-wrap { position: relative; }
.input-wrap .input { padding-right: 44px; }
.input-wrap .icon-btn { position: absolute; right: 4px; top: 4px; color: var(--text-2); }
input[type='date'].input { color-scheme: dark; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--stroke); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { height: 34px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--text-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--raised-2); color: var(--text); }
.seg button .count-pill { height: 18px; min-width: 18px; font-size: 11px; padding: 0 5px; }

.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 15px; background: var(--raised-2); transition: background 0.2s; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.checkbox { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; }
.checkbox.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.list { background: var(--surface); border: 1px solid var(--stroke); border-radius: 16px; overflow: hidden; }
.list-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  min-height: 54px; padding: 10px 14px;
  text-align: left;
  border-top: 1px solid var(--stroke);
}
.list-row:first-child { border-top: 0; }
button.list-row:hover, label.list-row:hover { background: rgba(255, 255, 255, 0.02); }
label.list-row { cursor: pointer; }
.list-row .lr-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--raised); color: var(--text-2); flex: none; }
.list-row .lr-main { flex: 1; min-width: 0; }
.list-row .lr-title { font-weight: 700; font-size: 15px; }
.list-row .lr-sub { color: var(--text-2); font-size: 12.5px; margin-top: 1px; }
.list-row .chev { color: var(--muted); }

/* ---------- Home ---------- */
.wallet { margin: 4px 16px 0; padding: 16px; }
.wallet .big { font-family: var(--font-display); font-weight: 900; font-size: 54px; line-height: 0.9; color: var(--accent); font-variant-numeric: tabular-nums; }
.wallet .big small { font-size: 22px; font-weight: 700; opacity: 0.85; margin-left: 3px; }
.wallet .cd { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.wallet-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; border-top: 1px solid var(--stroke); padding-top: 12px; }
.wallet-stats > div { text-align: center; }
.wallet-stats > div + div { border-left: 1px solid var(--stroke); }
.wallet-stats b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.wallet-stats span { font-size: 11px; font-weight: 700; color: var(--faint); }
.wallet .explain { display: flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--text-2); font-size: 12.5px; font-weight: 600; }
.wallet.locked .lockhead { display: flex; align-items: center; gap: 6px; color: var(--loss); font-size: 12px; font-weight: 900; letter-spacing: 0.06em; }
.wallet.locked .bigcd { font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }

.status-strip {
  margin: 0 16px;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  width: calc(100% - 32px);
  text-align: left;
  overflow: hidden;
}
.status-strip .sp { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.tier-badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: 11px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase;
  color: #06110a; white-space: nowrap; flex: none;
}
.tier-badge.rookie { background: var(--raised); color: var(--text); }
.tier-badge.sm { height: 20px; font-size: 10px; padding: 0 7px; }

.mini-challenges { padding-bottom: 2px; }
.mini-challenge { flex: none; width: 222px; min-height: 96px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.mini-challenge .t { font-weight: 800; font-size: 14px; }

.filterbar { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 10px 0; }
.live-tile { flex: none; height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255, 59, 74, 0.55); border-radius: 999px; background: rgba(255, 59, 74, 0.13); color: var(--live); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.live-tile i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.live-tile .n { font-size: 11px; opacity: 0.8; font-variant-numeric: tabular-nums; }
.live-tile.on { background: var(--live-fill); border-color: transparent; color: #fff; }
.setup-banner { margin: 4px 16px 0; padding: 14px; display: grid; gap: 10px; border: 1px solid rgba(34, 214, 110, 0.4); border-radius: 16px; background: linear-gradient(135deg, rgba(34, 214, 110, 0.17), rgba(34, 214, 110, 0.06)); }
.setup-banner b { display: block; font-size: 16px; font-weight: 800; }
.setup-banner p { margin: 2px 0 0; font-size: 13px; color: var(--text-2); }
.setup-banner .sb-icon { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px; background: var(--accent); color: var(--accent-ink); }
.cfb-select-label { display: block; margin: 9px 16px 4px; color: var(--faint); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.cfb-select { display: block; width: calc(100% - 32px); height: 38px; margin: 0 16px; padding: 0 10px; color: var(--text); background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px; font: inherit; font-weight: 700; }
.league-head { display: flex; align-items: center; gap: 8px; padding: 6px 16px 0; }
.league-head h3 { margin: 0; font-size: 18px; font-weight: 800; }
.league-head .cnt { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--faint); }

.game-card { margin: 0 16px; padding: 12px 10px 12px 12px; }
.gc-status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; min-height: 18px; }
.gc-status .lg { margin-left: auto; color: var(--faint); font-weight: 800; font-size: 11px; letter-spacing: 0.04em; }
.gc-grid { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 60px); gap: 5px; align-items: center; }
.gc-grid.two { grid-template-columns: minmax(0, 1fr) repeat(2, 66px); }
.gc-grid .colh { font-size: 10px; font-weight: 800; color: var(--faint); text-align: center; letter-spacing: 0.04em; text-transform: uppercase; }
.gc-team { display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; height: 46px; }
.gc-team .nm { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc-team .rec { font-size: 11px; color: var(--faint); }
.gc-team .sc { margin-left: auto; padding-right: 2px; flex: none; font-family: var(--font-display); font-weight: 900; font-size: 23px; font-variant-numeric: tabular-nums; }
.gc-team .sc.trail { color: var(--text-2); }
.gc-live-layout { display: grid; grid-template-columns: minmax(112px, .9fr) minmax(0, 1.2fr); gap: 9px; align-items: center; }
.matchup-head { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:8px; margin:8px 0 4px; }
.matchup-team { min-width:0; display:flex; align-items:center; gap:7px; text-align:left; font-weight:750; }
.matchup-team span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.matchup-team b { margin-left:auto; font-variant-numeric:tabular-nums; font-size:19px; }
.matchup-at,.matchup-time { text-align:center; color:var(--text-2); font-size:12px; font-weight:700; }
.matchup-time { margin:4px 0 12px; }
.challenge-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; padding:4px; border-radius:11px; background:var(--raised); margin:8px 0; }
.challenge-tabs button { min-height:34px; border-radius:8px; color:var(--text-2); font-size:12px; font-weight:750; }
.challenge-tabs button.on { background:var(--accent); color:var(--accent-ink); }
.challenge-choices { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
.challenge-choices .challenge-btn { min-height:58px; height:auto; padding:6px; }
.commitment-summary { display:grid; gap:6px; padding:12px; border-radius:12px; background:var(--raised); }
.gc-live-teams { min-width: 0; }
.gc-live-team { min-width: 0; height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 5px; }
.gc-live-team-open { min-width: 0; display: flex; align-items: center; gap: 7px; text-align: left; }
.gc-live-logo { width: 27px; height: 27px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--raised); color: var(--text); font-size: 9px; font-weight: 900; overflow: hidden; }
.gc-live-logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.gc-live-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }
.gc-live-score { min-width: 23px; text-align: right; font-family: var(--font-display); font-weight: 900; font-size: 23px; font-variant-numeric: tabular-nums; }
.gc-live-score.trail { color: var(--text-2); }
.gc-live-challenges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.gc-live-challenges .challenge-btn.big { height: 48px; min-width: 0; border-radius: 8px; }
.gc-live-challenges .challenge-btn.big .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
.gc-live-challenges .challenge-btn .ln { font-size: 11px; }
.gc-live-challenges .challenge-btn .pr { font-size: 12px; }
.gc-more { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--text-2); }
.gc-more .your-challenge { color: var(--accent); display: inline-flex; gap: 4px; align-items: center; }
.bump { animation: bump 0.6s ease; }
@keyframes bump { 0% { color: var(--accent); transform: scale(1.18); } 100% { transform: scale(1); } }

.challenge-btn {
  height: 46px;
  width: 100%;
  border-radius: 10px;
  background: var(--raised);
  border: 1px solid var(--stroke);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: background 0.12s, border-color 0.12s;
}
.challenge-btn:hover:not(:disabled) { border-color: #3d4a5e; }
.challenge-btn .ln { font-size: 12.5px; font-weight: 700; color: var(--text); }
.challenge-btn .pr { font-size: 13.5px; font-weight: 800; color: var(--accent); display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.challenge-btn .pr.solo { font-size: 15px; }
.challenge-btn .mv { font-size: 8px; }
.challenge-btn .mv.up { color: var(--accent); }
.challenge-btn .mv.down { color: var(--loss); }
.challenge-btn.on { background: var(--accent); border-color: transparent; }
.challenge-btn.on .ln, .challenge-btn.on .pr, .challenge-btn.on .mv { color: var(--accent-ink); }
.challenge-btn.locked { opacity: 0.55; }
.challenge-btn.locked .pr { color: var(--faint); }
.challenge-btn.big { height: 56px; }
.challenge-btn.big .lbl { font-size: 12px; font-weight: 700; color: var(--text-2); }
.challenge-btn.big.on .lbl { color: var(--accent-ink); }

.pred-card { margin: 0 16px; }
.pred-card .q { font-weight: 700; font-size: 15.5px; line-height: 1.3; margin: 6px 0 10px; }
.pred-card .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pred-card .prob { height: 4px; border-radius: 2px; background: var(--loss-soft); overflow: hidden; margin-top: 10px; }
.pred-card .prob i { display: block; height: 100%; background: var(--accent); }

.promo {
  margin: 0 16px;
  display: flex; gap: 12px; align-items: center;
  text-align: left;
  background: linear-gradient(120deg, rgba(79, 179, 255, 0.12), rgba(34, 214, 110, 0.08));
  border: 1px solid var(--stroke);
}
.promo .lr-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }

/* ---------- Game detail ---------- */
.scoreboard { margin: 0 16px; padding: 16px 12px; }
.sb-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.sb-team { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.sb-team .team-badge { width: 52px; height: 52px; font-size: 15px; }
.sb-team .nm { font-weight: 800; font-size: 15px; }
.sb-team .rec { font-size: 12px; color: var(--faint); }
.sb-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 120px; }
.sb-score { font-family: var(--font-display); font-weight: 900; font-size: 50px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; gap: 10px; align-items: baseline; }
.sb-score .dash { color: var(--muted); font-size: 30px; }
.sb-score .trail { color: var(--text-2); }
.sb-clock { font-weight: 800; font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }

.market { display: flex; flex-direction: column; gap: 8px; }
.market h4 { margin: 0; font-size: 13px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; }
.market .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }

.cmp-row { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; }
.cmp-row .v { font-family: var(--font-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.cmp-row .v.r { text-align: right; }
.cmp-row .mid { display: flex; flex-direction: column; gap: 5px; }
.cmp-row .lab { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-2); }
.cmp-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; height: 5px; }
.cmp-bars > span { background: var(--raised); border-radius: 3px; overflow: hidden; display: flex; }
.cmp-bars > span:first-child { justify-content: flex-end; }
.cmp-bars i { display: block; height: 100%; border-radius: 3px; }

.play { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--stroke); }
.play:first-child { border-top: 0; }
.play .k { font-weight: 700; font-size: 14px; }
.play .c { font-size: 12px; color: var(--faint); font-weight: 600; }
.play .s { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }

.form-dots { display: inline-flex; gap: 3px; }
.form-dots i { width: 18px; height: 18px; border-radius: 5px; font-style: normal; font-size: 10px; font-weight: 900; display: grid; place-items: center; }
.form-dots i.W { background: var(--accent-soft); color: var(--accent); }
.form-dots i.L { background: var(--loss-soft); color: var(--loss); }
.research { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 12px; align-items: center; font-size: 14px; }
.research .c { text-align: center; font-size: 12px; font-weight: 700; color: var(--faint); }
.research .r { text-align: right; justify-self: end; }
.research .v { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- pledges cards (My pledges) ---------- */
.pledge-card { margin: 0 16px; display: flex; flex-direction: column; gap: 10px; }
.pledge-top { display: flex; align-items: flex-start; gap: 10px; }
.pledge-top .t { font-weight: 800; font-size: 16px; line-height: 1.2; }
.pledge-top .multiplier { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--text-2); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pick { display: flex; gap: 10px; align-items: flex-start; }
.pick + .pick { border-top: 1px dashed var(--stroke); padding-top: 10px; }
.pick-dot { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; margin-top: 1px; background: var(--raised); color: var(--text-2); }
.pick-dot.won { background: var(--accent); color: var(--accent-ink); }
.pick-dot.lost { background: var(--loss-fill); color: #fff; }
.pick-dot.void, .pick-dot.tie { background: var(--muted); color: #fff; }
.pick-dot.winning { background: var(--accent-soft); color: var(--accent); }
.pick-dot.losing { background: var(--loss-soft); color: var(--loss); }
.pick .lt { font-weight: 700; font-size: 14.5px; }
.pick .lm { font-size: 12.5px; color: var(--text-2); }
.livebox { background: var(--bg); border: 1px solid var(--stroke); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.livebox .lb-score { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.livebox .lb-score .sc { font-family: var(--font-display); font-weight: 900; font-size: 20px; font-variant-numeric: tabular-nums; }
.livebox .lb-stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); font-weight: 600; }
.livebox .lb-stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.standing { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; }
.standing.winning { color: var(--accent); }
.standing.losing { color: var(--loss); }
.standing.even, .standing.upcoming { color: var(--text-2); }
.pledge-row { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--bg); border-radius: 12px; padding: 9px 4px; border: 1px solid var(--stroke); }
.pledge-row > div { text-align: center; }
.pledge-row > div + div { border-left: 1px solid var(--stroke); }
.pledge-row b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.pledge-row span { font-size: 11px; font-weight: 700; color: var(--faint); }
.pledge-actions { display: flex; gap: 8px; }
.pledge-actions .btn { flex: 1; }

.record-card { margin: 0 16px; }
.record-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.record-big > div { background: var(--bg); border: 1px solid var(--stroke); border-radius: 12px; padding: 10px; text-align: center; }
.record-big b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.record-big span { font-size: 11px; font-weight: 700; color: var(--faint); }
.sport-bars { display: flex; flex-direction: column; gap: 8px; }
.sport-bar { display: grid; grid-template-columns: 70px 1fr 60px; gap: 10px; align-items: center; font-size: 12.5px; font-weight: 700; }
.sport-bar .bar { height: 8px; }
.sport-bar .bar i.neg { background: var(--loss); }

/* ---------- Social ---------- */
.me-card { margin: 0 16px; display: flex; gap: 14px; align-items: center; }
.lb-row { display: grid; grid-template-columns: 22px 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--stroke); width: 100%; text-align: left; }
.lb-row:first-child { border-top: 0; }
.lb-row.me { background: var(--accent-soft); }
.lb-row .rk { font-family: var(--font-display); font-weight: 900; font-size: 18px; color: var(--text-2); text-align: center; }
.lb-row .nm { font-weight: 800; font-size: 14.5px; }
.lb-row .sub { font-size: 12px; color: var(--text-2); display: flex; gap: 6px; align-items: center; }
.lb-row .val { text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.lb-row .val small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--faint); }
.person-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--stroke); }
.person-row:first-child { border-top: 0; }
.team-card { display: flex; flex-direction: column; gap: 10px; }
.avatars { display: flex; }
.avatars img { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -8px; object-fit: cover; }
.avatars img:first-child { margin-left: 0; }
.pick-friends { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-friend { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px 0 4px; border-radius: 999px; border: 1px solid var(--stroke); background: var(--surface); font-weight: 700; font-size: 13.5px; }
.pick-friend img { width: 30px; height: 30px; border-radius: 50%; }
.pick-friend.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* ---------- Overlays ---------- */
.layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.layer > * { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade 0.2s ease; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 90%;
  display: flex; flex-direction: column;
  background: #0e1218;
  border-top: 1px solid var(--stroke);
  border-radius: 26px 26px 0 0;
  animation: up 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
  box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.45);
}
.sheet.tall { height: 90%; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--raised-2); margin: 8px auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px 10px 18px; flex: none; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 26px; flex: 1; min-width: 0; }
.sheet-body { overflow-y: auto; padding: 0 16px 22px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
.sheet-body::-webkit-scrollbar { display: none; }
.sheet-foot { flex: none; padding: 12px 16px 22px; border-top: 1px solid var(--stroke); display: flex; flex-direction: column; gap: 10px; background: #0e1218; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slidein { from { transform: translateX(100%); } to { transform: none; } }
@keyframes slideleft { from { transform: translateX(-100%); } to { transform: none; } }

.page {
  position: absolute; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  animation: slidein 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
  z-index: 0; /* keeps a page's floating button under sheets opened on top of it */
}
.page .page-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 52px; padding: 0 8px; flex: none; }
.page .page-top .t { text-align: center; font-weight: 800; font-size: 17px; }
.page .page-scroll { flex: 1; overflow-y: auto; padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
.page .page-scroll::-webkit-scrollbar { display: none; }

.drawer {
  position: absolute; top: 0; bottom: 0; left: 0;
  width: 84%;
  background: #0e1218;
  border-right: 1px solid var(--stroke);
  display: flex; flex-direction: column;
  animation: slideleft 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.drawer-head { padding: 18px 18px 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--stroke); }
.drawer nav { flex: 1; overflow-y: auto; padding: 8px 8px 20px; display: flex; flex-direction: column; gap: 2px; }
.drawer .dn { display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 15.5px; text-align: left; }
.drawer .dn:hover { background: var(--surface); }
.drawer .dn .ic { color: var(--text-2); }
.drawer .dn .sub { margin-left: auto; font-size: 12px; color: var(--faint); font-weight: 700; }

.dialog-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
.dialog {
  width: 100%; max-width: 330px;
  background: #151a23; border: 1px solid var(--stroke); border-radius: 22px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px;
  animation: pop 0.2s ease;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
}
.dialog h3 { margin: 0; font-size: 19px; font-weight: 800; }
.dialog .body { color: var(--text-2); font-size: 14.5px; line-height: 1.45; }
.dialog .acts { display: flex; gap: 10px; margin-top: 4px; }
.dialog .acts .btn { flex: 1; }
@keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }

.toasts { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 50; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  pointer-events: auto;
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px;
  background: var(--raised);
  border: 1px solid var(--stroke);
  border-radius: 16px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
  animation: drop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
  cursor: pointer;
  touch-action: none;
  user-select: none;
}
.toast .tt { font-weight: 800; font-size: 14.5px; }
.toast .tm { font-size: 13px; color: var(--text-2); margin-top: 1px; }
.toast.win { border-color: rgba(34, 214, 110, 0.5); }
.toast.win > .ic { color: var(--accent); }
.toast.loss { border-color: rgba(255, 90, 95, 0.5); }
.toast.loss > .ic { color: var(--loss); }
.toast.warn { border-color: rgba(255, 201, 64, 0.5); }
.toast.warn > .ic { color: var(--warn); }
.toast.info > .ic { color: var(--blue); }
.toast.out { opacity: 0; transform: translateY(-8px); transition: 0.25s; }
@keyframes drop { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }

.commitment-bar {
  position: absolute; left: 12px; right: 12px;
  bottom: calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom, 0px));
  z-index: 6;
  display: flex; align-items: center; gap: 10px;
  height: 54px; padding: 0 16px 0 12px;
  border-radius: 16px;
  background: var(--raised-2);
  border: 1px solid #3a4557;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  font-weight: 800;
  animation: drop 0.25s ease;
}
.commitment-bar .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 900; }
.commitment-bar .o { margin-left: auto; font-family: var(--font-display); font-weight: 900; font-size: 19px; color: var(--accent); }
.commitment-bar.combo-goal-finalize { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.commitment-bar.combo-goal-finalize .n { background: rgba(3, 20, 10, 0.15); color: var(--accent-ink); }
.commitment-bar.combo-goal-finalize .o { color: var(--accent-ink); }
.build-combo-goal { width: calc(100% - 32px); min-height: 58px; margin: 0 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(34, 214, 110, 0.28); border-radius: 16px; background: linear-gradient(110deg, rgba(34, 214, 110, 0.13), rgba(34, 214, 110, 0.05)); color: var(--text); text-align: left; }
.build-combo-goal > svg:first-child { color: var(--accent); flex: none; }
.build-combo-goal > svg:last-child { color: var(--muted); margin-left: auto; flex: none; }
.build-combo-goal span:not(.lr-icon) { display: grid; gap: 2px; }
.build-combo-goal b { font-size: 14px; }
.build-combo-goal small { color: var(--faint); font-size: 12px; }
.build-combo-goal.active { background: var(--surface); border-color: var(--stroke); }

<body class="web">
<main class="app-surface" id="screen">
  <div id="app-body"></div>
  <div class="layer" id="layer"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</main>
<script>
/* TimeOut web demo — core helpers: storage, demo clock, hashing, formatting, challenge targets math, icons. */
window.TO = window.TO || {};
(function (TO) {
  'use strict';

  // ---------- Storage (localStorage with in-memory fallback) ----------
  const mem = {};
  TO.store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw != null) return JSON.parse(raw);
      } catch (e) { /* private mode or blocked */ }
      return key in mem ? mem[key] : fallback;
    },
    set(key, value) {
      mem[key] = value;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    },
    del(key) {
      delete mem[key];
      try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
    },
  };

  TO.now = () => Date.now();

  const MIN = 60 * 1000;
  const HOUR = 60 * MIN;
  const DAY = 24 * HOUR;
  TO.MIN = MIN; TO.HOUR = HOUR; TO.DAY = DAY;

  const pad = (n) => String(n).padStart(2, '0');
  TO.dayKey = (ts = TO.now()) => {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  TO.dayStart = (key) => {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  };
  TO.addDays = (key, n) => {
    const [y, m, d] = key.split('-').map(Number);
    return TO.dayKey(new Date(y, m - 1, d + n, 12).getTime());
  };
  TO.nextMidnight = (ts = TO.now()) => {
    const d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
  };
  TO.weekKey = (ts = TO.now()) => {
    const d = new Date(ts);
    const day = (d.getDay() + 6) % 7; // Monday = 0
    return TO.dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - day, 12).getTime());
  };

  // ---------- Hashing / seeded randomness ----------
  TO.hash = (str) => {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  };
  /** Stable value in [-1, 1] for a string. */
  TO.unit = (str) => (TO.hash(str) % 20001) / 10000 - 1;
  /** Stable value in [0, 1). */
  TO.u01 = (str) => (TO.hash(str) % 100000) / 100000;
  TO.rng = (seed) => {
    let a = typeof seed === 'string' ? TO.hash(seed) : seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);

    },
    mlb: {

      teams: [t('NYY', 'Yankees', 'New York', '#0C2340'), t('LAD', 'Dodgers', 'Los Angeles', '#005A9C'), t('ATL', 'Braves', 'Atlanta', '#CE1141'), t('HOU', 'Astros', 'Houston', '#EB6E1F'), t('CHC', 'Cubs', 'Chicago', '#0E3386'), t('BOS', 'Red Sox', 'Boston', '#BD3039'), t('SEA', 'Mariners', 'Seattle', '#005C5C'), t('SD', 'Padres', 'San Diego', '#7A5C3A'), t('PHI', 'Phillies', 'Philadelphia', '#E81828'), t('TOR', 'Blue Jays', 'Toronto', '#134A8E')],

    },
  };
  const REAL_LEAGUES = ['nfl', 'ncaaf', 'nba', 'mlb', 'nhl', 'epl'];
  const LEAGUE_ORDER = ['nfl', 'ncaaf', 'nba', 'mlb', 'nhl', 'epl', 'sim'];

  const strength = (league, team) => 0.9 * TO.unit(`str-${league}-${team.abbr}`);

  function record(league, team) {
    const L = LEAGUES[league];
    const s = strength(league, team);
    const gp = L.gp;
    if (L.sport === 'soccer') {
      const w = TO.clamp(Math.round(gp * (0.42 + 0.3 * s) + TO.unit(`rw-${team.abbr}`)), 0, gp);
      const d = TO.clamp(Math.round((gp - w) * 0.35), 0, gp - w);
      return `${w}-${d}-${gp - w - d}`;
    }
    const w = TO.clamp(Math.round(gp * (0.5 + 0.3 * s) + 1.2 * TO.unit(`rw-${league}-${team.abbr}`)), 0, gp);
    return `${w}-${gp - w}`;
  }

  function form(league, team) {
    const s = strength(league, team);
    return Array.from({ length: 5 }, (_, i) => (TO.u01(`form-${league}-${team.abbr}-${i}`) < 0.5 + 0.3 * s ? 'W' : 'L'));
  }

  // ---------- Scoring timeline ----------
  const timelines = new Map();

  function scoringRoll(sport, r, r2, mult, step) {
    switch (sport) {
      case 'football': {
        if (r < 0.0165 * mult) {
          const pts = r2 < 0.9 ? 7 : r2 < 0.95 ? 6 : 8;
          const yds = 1 + Math.floor(r2 * 1000) % 45;
          return { pts, kind: (Math.floor(r2 * 100) % 2 ? `${yds}-yd TD pass` : `${yds}-yd TD run`) + (pts === 6 ? ' (missed PAT)' : pts === 8 ? ' + 2-pt conversion' : '') };
        }
        if (r < (0.0165 + 0.0115) * mult) return { pts: 3, kind: `${25 + (Math.floor(r2 * 1000) % 30)}-yd field goal` };
        return null;
      }
      case 'basketball': {
        if (r < 0.335 * mult) {
          const three = r2 < 0.3;
          const kinds = three ? ['3-pointer', 'Corner three', 'Step-back three'] : ['Layup', 'Jumper', 'Dunk', 'Floater', 'Free throws (2)'];
          return { pts: three ? 3 : 2, kind: kinds[Math.floor(r2 * 1000) % kinds.length] };
        }
        return null;
      }
      case 'baseball': {
        if (r < 0.042 * mult) {
          const runs = r2 < 0.68 ? 1 : r2 < 0.88 ? 2 : r2 < 0.97 ? 3 : 4;
          const kinds = { 1: ['RBI single', 'Solo home run', 'Sacrifice fly', 'RBI double'], 2: ['2-run double', '2-run homer'], 3: ['3-run homer', 'Bases-clearing double'], 4: ['Grand slam'] }[runs];
          return { pts: runs, kind: kinds[Math.floor(r2 * 1000) % kinds.length] };
        }
        return null;
      }
      case 'hockey': {
        if (r < 0.021 * mult) {
          const kinds = ['Even-strength goal', 'Power-play goal', 'Wrist shot goal', 'Rebound goal', 'Breakaway goal'];
          return { pts: 1, kind: kinds[Math.floor(r2 * 1000) % kinds.length] };
        }
        return null;
      }
      case 'soccer': {
        if (r < 0.0095 * mult) {
          const kinds = ['Goal (header)', 'Goal (left foot)', 'Goal (right foot)', 'Penalty goal', 'Goal (volley)'];
          return { pts: 1, kind: kinds[Math.floor(r2 * 1000) % kinds.length] };
        }
        return null;
      }
    }
    return null;
  }

  function timeline(game) {
    if (timelines.has(game.id)) return timelines.get(game.id);
    const L = LEAGUES[game.league];
    const S = SPORTS[L.sport];
    const rand = TO.rng(`game-${game.id}`);
    const d = strength(game.league, game.home) - strength(game.league, game.away);
    const homeBoost = S.homeEdge / S.perTeam;
    const multHome = Math.max(0.3, 1 + 0.06 * d + homeBoost);
    const multAway = Math.max(0.3, 1 - 0.06 * d);
    const events = [];
    let h = 0, a = 0;
    for (let step = 0; step < STEPS; step++) {
      for (const side of ['away', 'home']) {
        const r = rand(), r2 = rand();
        if (L.sport === 'baseball') {
          const half = Math.floor(step / (STEPS / 18));
          if ((half % 2 === 0) !== (side === 'away')) continue;
        }
        const ev = scoringRoll(L.sport, r, r2, side === 'home' ? multHome : multAway, step);
        if (ev) {
          if (side === 'home') h += ev.pts; else a += ev.pts;
          events.push({ step, side, pts: ev.pts, kind: ev.kind });
        }
      }
    }
    let extra = null;
    if (h === a && !S.draw) {
      const r = rand();
      const side = r < 0.5 + 0.1 * d ? 'home' : 'away';
      let pts = 1, kind = 'Overtime winner', lose = 0, label = 'OT';
      if (L.sport === 'football') { pts = rand() < 0.6 ? 3 : 6; kind = pts === 3 ? 'Overtime field goal' : 'Overtime touchdown'; }
      if (L.sport === 'basketball') { pts = 4 + Math.floor(rand() * 7); lose = Math.max(0, pts - 1 - Math.floor(rand() * 5)); kind = 'Won in overtime'; }
      if (L.sport === 'baseball') { kind = side === 'home' ? 'Walk-off single in the 10th' : 'Go-ahead run in the 10th'; label = '10'; }
      if (L.sport === 'hockey') { kind = rand() < 0.5 ? 'Overtime goal' : 'Shootout winner'; }
      extra = { side, pts, lose, kind, label };
      if (side === 'home') { h += pts; a += lose; } else { a += pts; h += lose; }
    }
    const tl = { events, extra, finalHome: h, finalAway: a };
    timelines.set(game.id, tl);
    return tl;
  }

  // ---------- Clock text ----------
  function clockText(sport, prog) {
    const S = SPORTS[sport];
    prog = TO.clamp(prog, 0, 0.9999);
    if (sport === 'baseball') {
      const half = Math.floor(prog * 18);
      return `${half % 2 === 0 ? 'Top' : 'Bot'} ${TO.ordinal(Math.floor(half / 2) + 1)}`;
    }
    if (sport === 'soccer') {
      const minute = Math.floor(prog * 90) + 1;
      return `${minute}'`;
    }
    const x = prog * S.periods;
    const per = Math.floor(x);
    const secsLeft = Math.round((1 - (x - per)) * S.periodMin * 60);
    const clock = `${Math.floor(secsLeft / 60)}:${String(secsLeft % 60).padStart(2, '0')}`;
    if (sport === 'hockey') return `${TO.ordinal(per + 1)} · ${clock}`;
    return `Q${per + 1} · ${clock}`;
  }

  // ---------- Games ----------
  function teamsFor(league, slot) {
    const L = LEAGUES[league];
    const order = TO.shuffle(L.teams.map((_, i) => i), TO.rng(`slot-${league}-${slot}`));
    return order;
  }

  function game(id, now = TO.now()) {
    const [league, slotStr, idxStr] = id.split('-');
    const L = LEAGUES[league];
    if (!L) return null;
    const slot = Number(slotStr), idx = Number(idxStr);
    const order = teamsFor(league, slot);
    const home = L.teams[order[idx * 2]];
    const away = L.teams[order[idx * 2 + 1]];
    const start = slot * SLOT + L.offset + idx * L.stagger;
    const S = SPORTS[L.sport];
    const g = {
      id, league, sport: L.sport, slot, idx, start, end: start + DURATION, home, away,
      state: 'scheduled', homeScore: 0, awayScore: 0, progress: 0, statusText: '', clock: '', ot: null,
      simulated: !!L.simulated,
    };
    const elapsed = now - start;
    const naturalPpd = !L.simulated && TO.hash(`ppd-${id}`) % 29 === 0;
    if (naturalPpd && now >= start - 8 * MIN) {
      g.state = 'postponed';
      g.statusText = 'Postponed';
      return g;
    }
    if (elapsed < 0) {
      g.statusText = TO.fmtTime(start);
      return g;
    }
    const tl = timeline(g);
    if (elapsed >= DURATION) {
      g.state = 'final';
      g.progress = 1;
      g.homeScore = tl.finalHome;
      g.awayScore = tl.finalAway;
      g.ot = tl.extra;
      g.statusText = tl.extra ? `Final/${tl.extra.label}` : 'Final';
      g.endedAt = start + DURATION;
      return g;
    }
    const steps = Math.floor(elapsed / STEP);
    let h = 0, a = 0;
    for (const ev of tl.events) {
      if (ev.step >= steps) break;
      if (ev.side === 'home') h += ev.pts; else a += ev.pts;
    }
    g.state = 'live';
    g.homeScore = h;
    g.awayScore = a;
    g.progress = elapsed / DURATION;
    g.clock = clockText(L.sport, g.progress);
    g.statusText = g.clock;
    g.stepsPlayed = steps;
    return g;
  }

  /** Live team stats for the game page and open-pledges cards. */
  function stats(g) {
    if (g.state !== 'live' && g.state !== 'final') return [];
    const p = g.progress;
    const u = (k) => TO.unit(`${g.id}-${k}`);
    const u01 = (k) => TO.u01(`${g.id}-${k}`);
    const A = g.awayScore, H = g.homeScore;
    const row = (label, a, h, opts = {}) => ({ label, a, h, ...opts });
    switch (g.sport) {
      case 'football': {
        const yd = (pts, k) => Math.round(p * (250 + 14 * pts) * (1 + 0.12 * u(k)));
        const ya = yd(A, 'ya'), yh = yd(H, 'yh');
        const sa = 0.55 + 0.15 * u('pa'), sh = 0.55 + 0.15 * u('ph');
        const top = Math.round(50 + 8 * u('top'));
        return [
          row('Total yards', ya, yh),
          row('Passing yards', Math.round(ya * sa), Math.round(yh * sh)),
          row('Rushing yards', ya - Math.round(ya * sa), yh - Math.round(yh * sh)),
          row('First downs', Math.round(ya / 17), Math.round(yh / 17)),
          row('Turnovers', Math.floor(p * 2.4 * u01('toa')), Math.floor(p * 2.4 * u01('toh')), { lowerBetter: true }),
          row('Possession', top, 100 - top, { suffix: '%' }),
        ];
      }
      case 'basketball': {
        const fg = (pts, opp, k) => Math.round(TO.clamp(45 + 4 * u(k) + (pts - opp) / 8, 34, 58));
        return [
          row('Field goal %', fg(A, H, 'fga'), fg(H, A, 'fgh'), { suffix: '%' }),
          row('3-pointers made', Math.round(p * 12 * (1 + 0.25 * u('3a'))), Math.round(p * 12 * (1 + 0.25 * u('3h')))),
          row('Rebounds', Math.round(p * 44 * (1 + 0.1 * u('ra'))), Math.round(p * 44 * (1 + 0.1 * u('rh')))),
          row('Assists', Math.round(p * 25 * (1 + 0.15 * u('aa'))), Math.round(p * 25 * (1 + 0.15 * u('ah')))),
          row('Turnovers', Math.round(p * 13 * (1 + 0.25 * u('ta'))), Math.round(p * 13 * (1 + 0.25 * u('th'))), { lowerBetter: true }),
        ];
      }
      case 'baseball': {
        const hits = (r, k) => Math.max(r, Math.round(p * 7.5 * (1 + 0.25 * u(k)) + r * 0.5));
        return [
          row('Hits', hits(A, 'ha'), hits(H, 'hh')),
          row('Home runs', Math.min(A, Math.floor(p * 1.6 * u01('hra') + A * 0.2)), Math.min(H, Math.floor(p * 1.6 * u01('hrh') + H * 0.2))),
          row('Strikeouts (pitching)', Math.round(p * 9 * (1 + 0.2 * u('ka'))), Math.round(p * 9 * (1 + 0.2 * u('kh')))),
          row('Errors', Math.floor(p * 1.6 * u01('ea')), Math.floor(p * 1.6 * u01('eh')), { lowerBetter: true }),
          row('Left on base', Math.round(p * 6.5 * (1 + 0.3 * u('la'))), Math.round(p * 6.5 * (1 + 0.3 * u('lh'))), { lowerBetter: true }),
        ];
      }
      case 'hockey': {
        const sog = (gl, k) => Math.max(gl * 3, Math.round(p * 30 * (1 + 0.15 * u(k))));
        const fo = Math.round(50 + 6 * u('fo'));
        const ppa = Math.floor(p * 4 * u01('ppa')), pph = Math.floor(p * 4 * u01('pph'));
        return [
          row('Shots on goal', sog(A, 'sa'), sog(H, 'sh')),
          row('Power plays', ppa, pph, { text: [`${Math.min(ppa, Math.floor(A / 2))}/${ppa}`, `${Math.min(pph, Math.floor(H / 2))}/${pph}`] }),
          row('Faceoff %', fo, 100 - fo, { suffix: '%' }),
          row('Hits', Math.round(p * 24 * (1 + 0.2 * u('hia'))), Math.round(p * 24 * (1 + 0.2 * u('hih')))),
          row('Blocked shots', Math.round(p * 14 * (1 + 0.2 * u('ba'))), Math.round(p * 14 * (1 + 0.2 * u('bh')))),
        ];
      }
      case 'soccer': {
        const pos = Math.round(50 + 10 * u('pos'));
        const sh = (gl, k) => Math.max(gl, Math.round(p * 13 * (1 + 0.25 * u(k))));
        const sa = sh(A, 'sa'), shh = sh(H, 'sh');
        return [
          row('Possession', pos, 100 - pos, { suffix: '%' }),
          row('Shots', sa, shh),
          row('Shots on target', Math.max(A, Math.round(sa * 0.38)), Math.max(H, Math.round(shh * 0.38))),
          row('Corners', Math.round(p * 5.5 * (1 + 0.3 * u('ca'))), Math.round(p * 5.5 * (1 + 0.3 * u('ch')))),
          row('Fouls', Math.round(p * 11 * (1 + 0.2 * u('fa'))), Math.round(p * 11 * (1 + 0.2 * u('fh'))), { lowerBetter: true }),
          row('Yellow cards', Math.floor(p * 2.4 * u01('ya')), Math.floor(p * 2.4 * u01('yh')), { lowerBetter: true }),
        ];
      }
    }
    return [];
  }

  /** Season research for the game page. */
  function research(g) {
    const S = SPORTS[g.sport];
    const side = (team) => {
      const s = strength(g.league, team);
      return {
        team,
        record: record(g.league, team),
        form: form(g.league, team),
        pf: +(S.perTeam * (1 + 0.1 * s)).toFixed(1),
        pa: +(S.perTeam * (1 - 0.1 * s + 0.03 * TO.unit(`pa-${team.abbr}`))).toFixed(1),
      };
    };
    const hw = TO.u01(`h2h-${g.league}-${[g.home.abbr, g.away.abbr].sort().join('')}`) < 0.5;
    const winner = hw ? g.home : g.away, loser = hw ? g.away : g.home;
    const w = Math.round(S.perTeam * (1.05 + 0.2 * TO.u01(`h2hw-${g.id}`)));
    const l = Math.max(0, Math.round(w - 1 - S.marginSigma * 0.6 * TO.u01(`h2hl-${g.id}`)));
    return { away: side(g.away), home: side(g.home), lastMeeting: `${winner.abbr} ${w}, ${loser.abbr} ${l}`, unit: S.unit };
  }

  /** Games on the board right now: recent finals, live games and the next ~45 minutes. */
  function board(now = TO.now(), { offDay = false, leagues = LEAGUE_ORDER } = {}) {
    const list = [];
    for (const league of leagues) {
      if (offDay && league !== 'sim') continue;
      const L = LEAGUES[league];
      const base = Math.floor((now - L.offset) / SLOT);
      for (let slot = base - 1; slot <= base + 2; slot++) {
        for (let i = 0; i < L.perSlot; i++) {
          const g = game(`${league}-${slot}-${i}`, now);
          if (g.state === 'scheduled' && g.start - now > 45 * MIN) continue;
          if (g.state === 'final' && now - (g.endedAt || g.end) > 8 * MIN) continue;
          if (g.state === 'postponed' && now > g.end) continue;
          list.push(g);
        }
      }
    }
    const rank = { live: 0, scheduled: 1, postponed: 2, final: 3 };
    return list.sort((a, b) => rank[a.state] - rank[b.state] || a.start - b.start);
  }

  // ---------- challenge targets ----------
  const pointValueCache = new Map();

  function expectedMargin(g, now) {
    const S = SPORTS[g.sport];
    const d = strength(g.league, g.home) - strength(g.league, g.away);
    let mu = S.perTeam * 0.12 * d + S.homeEdge;
    if (g.state === 'scheduled') mu += 0.05 * S.marginSigma * TO.unit(`drift-${g.id}-${Math.floor(now / VALUE_BUCKET_PRE)}`);
    return mu;
  }

  function computePointValue(g, now) {
    const S = SPORTS[g.sport];
    const rem = g.state === 'live' ? 1 - g.progress : 1;
    const suspended = !(g.state === 'scheduled' || g.state === 'live') || (g.state === 'live' && rem < 0.03);
    const mu0 = expectedMargin(g, now);
    const minSD = S.discrete ? 0.35 : 0.8;
    let mu, sd;
    if (g.state === 'live') {
      mu = (g.homeScore - g.awayScore) + mu0 * rem;
      sd = Math.max(S.marginSigma * Math.pow(rem, 0.4), minSD);
    } else { mu = mu0; sd = S.marginSigma; }
    const sel = (market, side, line, p) => ({ id: `${g.id}|${market}|${side}`, kind: 'game', gameId: g.id, market, side, line, price: TO.pointValue.fromProb(p) });

    let winner;
    if (S.draw) {
      const pHome = 1 - TO.phi((0.5 - mu) / sd);
      const pAway = TO.phi((-0.5 - mu) / sd);
      const pDraw = Math.max(1 - pHome - pAway, 0.02);
      winner = [sel('winner', 'away', null, pAway), sel('winner', 'draw', null, pDraw), sel('winner', 'home', null, pHome)];
    } else {
      const pHome = TO.phi(mu / sd);
      winner = [sel('winner', 'away', null, 1 - pHome), sel('winner', 'home', null, pHome)];
    }
    let margin = [];
    if (S.margin) {
      const homeLine = S.margin === 'fixed' ? (mu >= 0 ? -1.5 : 1.5) : -TO.hook(mu);
      const pCover = 1 - TO.phi((-homeLine - mu) / sd);
      margin = [sel('margin', 'away', -homeLine, 1 - pCover), sel('margin', 'home', homeLine, pCover)];
    }
    const base = LEAGUES[g.league].id === 'sim' ? 222 : S.perTeam * 2;
    const baseTotal = base * (1 + 0.06 * TO.unit(`total-${g.id}`));
    let projected, sdT;
    if (g.state === 'live') {
      projected = g.homeScore + g.awayScore + baseTotal * rem;
      sdT = Math.max(S.totalSigma * Math.pow(rem, 0.4), minSD);
    } else { projected = baseTotal; sdT = S.totalSigma; }
    const line = TO.hook(projected);
    const pOver = 1 - TO.phi((line - projected) / sdT);
    const total = [sel('total', 'higher', line, pOver), sel('total', 'lower', line, 1 - pOver)];
    return { winner, margin, total, suspended, all: [...winner, ...margin, ...total] };
  }

  /** Current challenge targets for a game. Live prices refresh every 15 seconds; pre-game every 2 minutes. */
  function pointValue(id, now = TO.now()) {
    const g = game(id, now);
    if (!g) return null;
    const bucketLen = g.state === 'live' ? VALUE_BUCKET_LIVE : VALUE_BUCKET_PRE;
    const bucket = Math.floor(now / bucketLen) * bucketLen;
    const key = `${id}|${bucket}|${g.state}`;
    if (!pointValueCache.has(key)) {
      const gb = g.state === 'live' ? game(id, Math.max(bucket, g.start)) : g;
      const o = computePointValue(gb.state === 'live' || gb.state === 'scheduled' ? gb : g, bucket);
      if (g.state !== 'live' && g.state !== 'scheduled') o.suspended = true;
      if (g.state === 'live' && 1 - g.progress < 0.03) o.suspended = true;
      o.updatedAt = bucket;
      // Movement vs the previous refresh, for the up/down arrows.
      const prevT = bucket - bucketLen;
      const gp = game(id, prevT);
      if (gp && (gp.state === 'live' || gp.state === 'scheduled')) {
        const prev = computePointValue(gp, prevT);
        o.move = {};
        for (const s of o.all) {
          const p = prev.all.find((x) => x.id === s.id);
          if (p && p.price !== s.price) o.move[s.id] = s.price > p.price ? 1 : -1;
        }
      } else o.move = {};
      pointValueCache.set(key, o);
      if (pointValueCache.size > 3000) pointValueCache.clear();
    }
    return pointValueCache.get(key);
  }

  // ---------- Prediction markets (Could-have) ----------
  const PRED_CYCLE = 60 * MIN;
  const PREDICTIONS = [
    { q: 'Will the top movie this weekend earn over $60M?', cat: 'Movies', p: 0.42 },
    { q: 'Will it rain in Salt Lake City tomorrow?', cat: 'Weather', p: 0.3 },
    { q: 'Will a brand-new song debut at #1 on the charts this week?', cat: 'Music', p: 0.36 },
    { q: 'Will the next rocket launch from Cape Canaveral go up on schedule?', cat: 'Science', p: 0.68 },
    { q: 'Will average gas prices in Utah drop below $3.40 this week?', cat: 'Economy', p: 0.45 },
    { q: 'Will any Sim League team score 130+ in the next hour?', cat: 'Sim League', p: 0.4 },
    { q: 'Will a first-time winner take the next pro golf tournament?', cat: 'Sports', p: 0.55 },
  ];

  function prediction(id, now = TO.now()) {
    const [, iStr, cStr] = id.split('-');
    const i = Number(iStr), cycle = Number(cStr);
    const def = PREDICTIONS[i];
    if (!def) return null;
    const opens = cycle * PRED_CYCLE + i * 8 * MIN;
    const resolves = opens + PRED_CYCLE;
    const closes = resolves - 2 * MIN;
    const drift = 0.12 * TO.unit(`${id}-${Math.floor(now / VALUE_BUCKET_PRE)}`);
    const pYes = TO.clamp(def.p + drift, 0.08, 0.92);
    const outcome = TO.u01(`out-${id}`) < def.p ? 'yes' : 'no';
    const state = now >= resolves ? 'resolved' : now >= closes ? 'closed' : 'open';
    const prevDrift = 0.12 * TO.unit(`${id}-${Math.floor(now / VALUE_BUCKET_PRE) - 1}`);
    const prevYes = TO.clamp(def.p + prevDrift, 0.08, 0.92);
    const yes = { id: `${id}|pred|yes`, kind: 'pred', predId: id, market: 'pred', side: 'yes', line: null, price: TO.pointValue.fromProb(pYes) };
    const no = { id: `${id}|pred|no`, kind: 'pred', predId: id, market: 'pred', side: 'no', line: null, price: TO.pointValue.fromProb(1 - pYes) };
    const move = {};
    const py = TO.pointValue.fromProb(prevYes), pn = TO.pointValue.fromProb(1 - prevYes);
    if (py !== yes.price) move[yes.id] = yes.price > py ? 1 : -1;
    if (pn !== no.price) move[no.id] = no.price > pn ? 1 : -1;
    return { id, q: def.q, cat: def.cat, opens, closes, resolves, state, outcome: state === 'resolved' ? outcome : null, pYes, yes, no, move, suspended: state !== 'open' };
  }

  function predictions(now = TO.now()) {
    return PREDICTIONS.map((_, i) => {
      const cycle = Math.floor((now - i * 8 * MIN) / PRED_CYCLE);
      return prediction(`pm-${i}-${cycle}`, now);
    }).sort((a, b) => a.resolves - b.resolves);
  }

  // ---------- Selections ----------
  /** Current version of a selection (same pick, latest line and price). */
  function currentSelection(selId, now = TO.now()) {
    const [ref, market, side] = selId.split('|');
    if (market === 'race') return TO.races ? TO.races.currentSelection(selId, now) : null;
    if (market === 'pred') {
      const p = prediction(ref, now);
      if (!p) return null;
      return { sel: side === 'yes' ? p.yes : p.no, open: p.state === 'open' };
    }
    const o = pointValue(ref, now);
    if (!o) return null;
    const sel = o.all.find((s) => s.id === selId);
    return { sel, open: !!sel && !o.suspended };
  }

  function teamOf(g, side) { return side === 'home' ? g.home : side === 'away' ? g.away : null; }

  /** e.g. "Chiefs −3.5", "Over 44.5", "Lakers ML", "Draw", "Yes". */
  function selectionLabel(sel, g) {
    if (sel.market === 'race') return TO.races ? TO.races.selectionLabel(sel) : '';
    if (sel.market === 'pred') return sel.side === 'yes' ? 'Yes' : 'No';
    const team = g ? teamOf(g, sel.side) : null;
    switch (sel.market) {
      case 'winner': return team ? `${team.name} to win` : 'Draw';
      case 'margin': return `${team.name} ${TO.pointValue.fmtLine(sel.line)}`;
      case 'total': return `Combined score ${sel.side === 'higher' ? 'above' : 'below'} ${TO.pointValue.fmtLine(sel.line, false)}`;
    }
    return '';
  }

  function marketLabel(sel, g) {
    if (sel.market === 'race') return 'Race winner';
    if (sel.market === 'pred') return 'Prediction';
    if (sel.market === 'winner') return 'Winner';
    if (sel.market === 'margin') return g ? SPORTS[g.sport].marginLabel : 'Margin';
    return 'Total';
  }

  /** Grades a pick against a game or prediction. Returns pending | won | lost | tie | void. */
  function grade(sel, now = TO.now()) {
    if (sel.market === 'race') return TO.races ? TO.races.grade(sel, now) : 'pending';
    if (sel.market === 'pred') {
      const p = prediction(sel.predId || sel.id.split('|')[0], now);
      if (!p || p.state !== 'resolved') return 'pending';
      return p.outcome === sel.side ? 'won' : 'lost';
    }
    const g = game(sel.gameId, now);
    if (!g) return 'pending';
    if (g.state === 'postponed') return 'void';
    if (g.state !== 'final') return 'pending';
    return gradeScore(sel, g.homeScore, g.awayScore);
  }

  function gradeScore(sel, H, A) {
    switch (sel.market) {
      case 'winner':
        if (sel.side === 'draw') return H === A ? 'won' : 'lost';
        if (H === A) return 'lost';
        return (sel.side === 'home') === (H > A) ? 'won' : 'lost';
      case 'margin': {
        const m = (sel.side === 'home' ? H - A : A - H) + sel.line;
        return m > 0 ? 'won' : m < 0 ? 'lost' : 'tie';
      }
      case 'total': {
        const tot = H + A;
        if (tot === sel.line) return 'tie';
        return (sel.side === 'higher') === (tot > sel.line) ? 'won' : 'lost';
      }
    }
    return 'pending';
  }

  /** How an open pick is doing right now: winning | losing | even | upcoming. */
  function liveStanding(sel, now = TO.now()) {
    if (sel.market === 'pred') {
      const p = prediction(sel.predId || sel.id.split('|')[0], now);
      if (!p) return 'upcoming';
      return (sel.side === 'yes' ? p.pYes : 1 - p.pYes) >= 0.5 ? 'winning' : 'losing';
    }
    const g = game(sel.gameId, now);
    if (!g || g.state === 'scheduled') return 'upcoming';
    if (g.state === 'postponed') return 'void';
    if (sel.market === 'total') {
      // Compare pace, not the raw score, so a high total isn't "losing" in the first minute.
      const pace = g.progress > 0.05 ? (g.homeScore + g.awayScore) / g.progress : sel.line;
      if (Math.abs(pace - sel.line) < 0.5) return 'even';
      return (sel.side === 'higher') === (pace > sel.line) ? 'winning' : 'losing';
    }
    const r = gradeScore(sel, g.homeScore, g.awayScore);
    if (r === 'tie') return 'even';
    if (sel.market === 'winner' && g.homeScore === g.awayScore) return sel.side === 'draw' ? 'winning' : 'even';
    return r === 'won' ? 'winning' : 'losing';
  }

  TO.sim = {
    SLOT, DURATION, STEP, SPORTS, LEAGUES, REAL_LEAGUES, LEAGUE_ORDER, PREDICTIONS,
    game, board, pointValue, stats, research, record, form, strength,
    prediction, predictions, currentSelection, selectionLabel, marketLabel, grade, gradeScore, liveStanding, teamOf,
  };
})(window.TO);

    { username: 'nate_w', name: 'Nate Walker', color: '#6D28D9', w: 15, l: 15, net: 0, tier: 'starter', streak: 1, share: { record: true, minutes: true, challenges: true } },

  PEOPLE.forEach((p) => { p.photo = TO.initialsAvatar(p.name, p.color); p.fake = true; });

  // ---------- Events ----------
  const listeners = {};

  class AppError extends Error {
    constructor(code, message, extra) { super(message); this.code = code; Object.assign(this, extra || {}); }
  }

  TO.unavailableMessage = 'TimeOut can\'t reach your account right now. Please try again in a few minutes.';
  /** Words people should see for any error. */
  TO.friendlyMessage = (e) => {
    if (e instanceof AppError) return e.message;
    if (!navigator.onLine) return 'You\'re offline. Check your connection and try again.';

  // ---------- Accounts ----------
  const ACC_KEY = 'timeout.accounts';
  const accounts = () => TO.store.get(ACC_KEY, {});
  const saveAccounts = (a) => TO.store.set(ACC_KEY, a);
  const dataKey = (id) => `timeout.data.${id}`;

  function findAccount(identifier) {

    username = username.trim(); email = email.trim();

    if (!String(identifier).trim()) throw new AppError('invalid', 'Enter your username or email.', { fields: { identifier: 'Required' } });

  }

  /** Server mode: copies the database user into this browser so the features still saved here keep working.
   *  acc.server always holds the latest values from the database (last login, login count...). */
  function adoptServerUser(user, remoteState = null) {
    const id = `srv_${user.id}`;
    let shared = null;
    let serverStreak = null;
    let balanceSource = 'server';
    const all = accounts();
    const acc = all[id] || { id, salt: null, pw: null };
    Object.assign(acc, {
      username: user.username, email: user.email, demo: !!user.isDemo, createdAt: Date.parse(user.createdAt), server: user,
      photo: user.photoUrl || acc.photo || TO.initialsAvatar(user.isDemo ? 'Demo User' : user.username, user.isDemo ? '#1AA560' : undefined),
    });
    all[id] = acc; saveAccounts(all);
    if (remoteState) {

      const cached = TO.store.get(dataKey(id), null);

        const remoteChallenges = remoteState.challenges || [];
        const mergedChallenges = new Map(remoteChallenges.map((challenge) => [challenge.supabaseId ? `db:${challenge.supabaseId}` : `id:${challenge.id}`, challenge]));
        for (const challenge of cached.challenges || []) {
          const key = challenge.supabaseId ? `db:${challenge.supabaseId}` : `id:${challenge.id}`;
          const saved = mergedChallenges.get(key);
          const combined = saved ? Object.assign({}, saved, challenge) : challenge;
          // Another device already resolved it: the server's result beats a local copy that is still open.
          if (saved && challenge.status === 'open' && saved.status !== 'open') {
            Object.assign(combined, { status: saved.status, reward: saved.reward, resolvedAt: saved.resolvedAt, supabaseSynced: true });
            combined.picks = (challenge.picks || []).map((pick) => {
              const match = (saved.picks || []).find((p) => p.gameId === pick.gameId && p.market === pick.market && p.side === pick.side);
              return match ? { ...pick, result: match.result } : pick;
            });
          }
          mergedChallenges.set(key, combined);
        }
        const hasUnsyncedChallenges = (cached.challenges || []).some((challenge) => syncsToServer(challenge) && !challenge.supabaseId);
        const remoteHasPreferences = remoteState.appPreferencesReady && Object.keys(remoteState.settings || {}).length > 1;
        const preferences = remoteHasPreferences
          ? Object.assign({}, cached.settings || {}, remoteState.settings || {})
          : Object.assign({}, remoteState.settings || {}, cached.settings || {});

        remoteState = Object.assign({}, cached, remoteState, { challenges: [...mergedChallenges.values()], settings: preferences });

        // placed, so a lagging server day must never pull this wallet back: that would close the same day
        // again and bump the streak on every sync.
        if (hasUnsyncedChallenges || !remoteState.wallet) balanceSource = 'keep';
