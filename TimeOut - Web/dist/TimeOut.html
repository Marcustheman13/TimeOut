            }
            const challengeId = typeof saved === 'string' ? saved : saved.id;
            if (!challengeId) throw new TO.AppError('supabase_error', TO.unavailableMessage, { debug: 'No challenge ID came back.' });
            challenge.supabaseId = challengeId;
            challenge.supabaseSynced = false;
            const current = TO.data?.challenges?.find((b) => b.id === challenge.id);
            if (current) { current.supabaseId = challengeId; current.supabaseSynced = false; TO.store.set(`timeout.data.${TO.account.id}`, TO.data); }
          } finally { placing.delete(challenge.id); }
        }
        if (challenge.supabaseId && challenge.status !== 'open' && !challenge.supabaseSynced && !settling.has(challenge.supabaseId)) {
          settling.add(challenge.supabaseId);
          try {
            const resolved = await rest('rpc/timeout_resolve_challenge', { method: 'POST', body: JSON.stringify({
              p_challenge_id: challenge.supabaseId, p_status: ({ tie: 'tied', void: 'voided' })[challenge.status] || challenge.status,
              p_actual_reward: Number(challenge.reward || 0),
              p_pick_results: challenge.picks.map((pick) => ({ espn_event_id: String(pick.gameId), market: pick.market, side: pick.side, line: pick.line, result: pick.result })),
            }) });
            challenge.supabaseSynced = resolved !== false;
            const current = TO.data?.challenges?.find((b) => b.supabaseId === challenge.supabaseId);
            if (current) { current.supabaseSynced = challenge.supabaseSynced; TO.store.set(`timeout.data.${TO.account.id}`, TO.data); }
          } finally { settling.delete(challenge.supabaseId); }
        }
      }
      lastSaveAt = Date.now();
      api.syncError = null;
    } catch (e) {
      if (e.outOfPredictingMinutes || e.tierBonusMigrationMissing || e.tierPerkMigrationMissing || e.tierPerkExhausted) {
        const rejectedId = e.failedChallengeId;
        const rejected = (data.challenges || []).find((challenge) => challenge.id === rejectedId);
        pendingState = null;
        data.challenges = (data.challenges || []).filter((challenge) => challenge.id !== rejectedId);
        if (rejected && data.wallet) {
          data.wallet.balance = Math.max(0, Number(data.wallet.balance || 0) + Number(rejected.pledgeMinutes || 0));
          data.wallet.lockedOut = data.wallet.balance <= 0;
        }
        if (TO.data) {
          TO.data.challenges = TO.data.challenges.filter((challenge) => challenge.id !== rejectedId);
          if (rejected && TO.data.wallet) {
            TO.data.wallet.balance = Math.max(0, Number(TO.data.wallet.balance || 0) + Number(rejected.pledgeMinutes || 0));
            TO.data.wallet.lockedOut = TO.data.wallet.balance <= 0;
          }
          if (TO.account) TO.store.set(`timeout.data.${TO.account.id}`, TO.data);
        }
        if (e.tierPerkMigrationMissing) notifyTierPerkMigrationRequired();
        else if (e.tierPerkExhausted) notifyTierPerkAlreadyUsed();
        else if (e.tierBonusMigrationMissing) notifyTierBonusMigrationRequired();
        else notifyOutOfPredictingMinutes();
        TO.app?.render?.();
        return;
      }
      pendingState = data;
      throw e;
    }
  };
  api.updateProfile = async (patch) => {
    await ensureFreshSession();
    const userId = tokenUserId();
    if (!userId) throw new TO.AppError('bad_token', 'Your session is invalid. Log in again.');
    const body = { id: userId };
    if (patch.username != null) body.username = patch.username;
    if (patch.photoUrl != null) body.avatar_url = patch.photoUrl;
    if (Object.keys(body).length > 1) await rest(`profiles?id=eq.${encodeURIComponent(userId)}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ username: body.username, avatar_url: body.avatar_url }) });
    if (patch.email || patch.password) {
      const res = await fetch(`${config.url}/auth/v1/user`, { method: 'PUT', headers: authHeaders(true), body: JSON.stringify({ ...(patch.email ? { email: patch.email } : {}), ...(patch.password ? { password: patch.password } : {}) }) });
      await parseResponse(res);
    }
  };
  api.logout = async () => {
    await api.flushState().catch(() => {});
    if (token()) {
      try { const res = await fetch(`${config.url}/auth/v1/logout`, { method: 'POST', headers: authHeaders(true) }); await parseResponse(res); } catch (e) { /* session can already be expired */ }
    }
    api.clearToken();
    lastSettingsSnapshot = '';
    inviteCode = null;
  };

  /** Permanently deletes the signed-in account and its data (server/db/supabase-delete-account.sql). */
  api.deleteAccount = async () => {
    try {
      await rest('rpc/timeout_delete_account', { method: 'POST', body: '{}' });
    } catch (e) {
      if (/timeout_delete_account/i.test(rawText(e)) && /schema cache|function.*(not found|does not exist|could not find)/i.test(rawText(e))) {
        throw new TO.AppError('not_set_up', 'We can\'t delete your account right now. Please try again later, or contact support from the Help page.');
      }
      throw e;
    }
    pendingState = null;
    api.clearToken();
    lastSettingsSnapshot = '';
    inviteCode = null;
  };

  /** Emails a password-reset link. Opening it signs the person in here, where Account can set a new password. */
  api.sendPasswordReset = async (email) => {
    const res = await fetch(`${config.url}/auth/v1/recover?redirect_to=${encodeURIComponent(returnUrl())}`, {
      method: 'POST', headers: authHeaders(false), body: JSON.stringify({ email: String(email).trim() }),
    });
    await parseResponse(res);
  };

  // ---------- Friends ----------
  /** Friends and requests from the server. Null when it can't be reached or doesn't have the friends update yet. */
  api.socialState = async () => {
    if (!api.configured || !token()) return null;
    try {
      const json = await rest('rpc/timeout_social_state', { method: 'POST', signal: AbortSignal.timeout(6000), body: '{}' });
      if (!json || !Array.isArray(json.friends)) return null;
      const request = (r) => ({ id: String(r.id), username: r.username, name: r.name || r.username, photo: r.photo || null, at: Date.parse(r.at) || TO.now() });
      return {
        friends: json.friends.filter((f) => f && f.username).map((f) => ({
          username: f.username, name: f.name || f.username, photo: f.photo || null, w: Number(f.w || 0), l: Number(f.l || 0), net: Number(f.net || 0),
          tier: f.tier || 'rookie', streak: Number(f.streak || 0), share: f.share || { record: false, minutes: false, challenges: false },
          picks: (f.picks || []).map((c) => {
            const legs = c.picks || [];
            return { label: legs.map((k) => pickLabel(k.market, k.side, k.line, k.matchup)).join(' + '), matchup: legs.length > 1 ? `${legs.length}-pick Combo Goal` : (legs[0]?.matchup || ''),
              price: TO.pointValue.fromDecimal(Number(c.combinedValue || 1)), pledgeMinutes: Number(c.pledgeMinutes || 0) };
          }),
        })),
        requestsIn: (json.requestsIn || []).map(request),
        requestsOut: (json.requestsOut || []).map(request),
      };
    } catch (e) { return null; }
  };

  // ---------- Weekly report ----------
  /** The person's published weekly reports, newest first. Null when it can't be reached or the database doesn't have them yet. */
  api.weeklyReports = async () => {
    if (!api.configured || !token()) return null;
    try {
      const rows = await rest('rpc/timeout_my_weekly_reports', { method: 'POST', signal: AbortSignal.timeout(6000), body: JSON.stringify({ p_limit: 12 }) });
      return Array.isArray(rows) ? rows : null;
    } catch (e) { return null; }
  };
  api.markWeeklyReportRead = async (week) => {
    if (!api.configured || !token()) return;
    try { await rest('rpc/timeout_mark_weekly_report_read', { method: 'POST', signal: AbortSignal.timeout(6000), body: JSON.stringify({ p_week: week }) }); } catch (e) { /* it shows as unread again next time */ }
  };

  /** Runs one friends function. Turns "the database doesn't have it yet" into a sentence people can act on. */
  async function friendCall(name, body) {
    try {
      return await rest(`rpc/${name}`, { method: 'POST', signal: AbortSignal.timeout(8000), body: JSON.stringify(body) });
    } catch (e) {
      if (new RegExp(name, 'i').test(rawText(e)) && /schema cache|function.*(not found|does not exist|could not find)/i.test(rawText(e))) {
        throw new TO.AppError('not_set_up', 'Friends aren\'t available right now. Please try again in a few minutes.');
      }
      throw e;
    }
  }
  /** 'requested', or 'friends' when they had already asked you. */
  api.sendFriendRequest = (username) => friendCall('timeout_send_friend_request', { p_username: username });
  api.answerFriendRequest = async (username, accept) => {
    const done = await friendCall('timeout_answer_friend_request', { p_username: username, p_accept: accept });
    // The server answers false when it couldn't find that request. Don't pretend it worked.
    if (done === false) throw new TO.AppError('request_missing', `Couldn't ${accept ? 'accept' : 'decline'} the request from @${username}. Pull to refresh and try again.`);
    return done;
  };
  api.cancelFriendRequest = (username) => friendCall('timeout_cancel_friend_request', { p_username: username });
  api.removeFriend = (username) => friendCall('timeout_remove_friend', { p_username: username });
  /** 'friends', 'requested' (no valid code, so it is an ordinary request) or 'self'. */
  api.acceptFriendInvite = (username, code) => friendCall('timeout_accept_friend_invite', { p_username: username, p_code: code || '' });
  /** The secret for this account's invite links. Null when the server can't provide one; the link then sends a request. */
  api.myInviteCode = async () => {
    if (inviteCode) return inviteCode;
    if (!api.configured || !token()) return null;
    try {
      inviteCode = await rest('rpc/timeout_my_invite_code', { method: 'POST', signal: AbortSignal.timeout(4000), body: '{}' });
      return typeof inviteCode === 'string' ? inviteCode : null;
    } catch (e) { return null; }
  };
  api.teamStandings = async (id, key) => {
    if (!api.configured || !token()) return null;
    try {
      const rows = await rest('rpc/timeout_team_standings', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: id, p_key: key }) });
      return Array.isArray(rows) ? rows.filter((r) => r && r.username) : null;
    } catch (e) { return null; }
  };

  /** Usernames that match a query, from Supabase profiles (when signed in) and this app's API.
   *  Either source can be missing — GitHub Pages has no API, and profiles may be hidden — so a failure is just no extra rows. */
  api.searchUsers = async (query) => {
    const safe = String(query || '').trim().replace(/^@/, '').slice(0, 20).replace(/[^a-zA-Z0-9_.]/g, '');
    if (!safe) return [];
    const me = String(TO.account?.username || '').toLowerCase();
    const found = new Map();
    const add = (username, name, photo) => {
      const u = String(username || '').trim();
      const key = u.toLowerCase();
      if (!u || key === me || found.has(key) || !/^[a-zA-Z0-9_.]{1,20}$/.test(u)) return;
      found.set(key, { username: u, name: name || u, photo: photo || null, remote: true });
    };
    const tasks = [];
    if (api.configured && token()) {
      tasks.push((async () => {
        try {
          const rows = await rest('rpc/timeout_search_users', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_query: safe }) });
          if (Array.isArray(rows)) for (const r of rows) add(r.username, r.name, r.photo);
        } catch (searchError) {
          // A database without the friends update: read profiles directly.
          try {
            const like = safe.replace(/[_\\*]/g, (ch) => `\\${ch}`);
            const rows = await rest(`profiles?select=username,display_name,avatar_url&username=ilike.*${encodeURIComponent(like)}*&limit=8`, { signal: AbortSignal.timeout(4000) });
            if (Array.isArray(rows)) for (const r of rows) add(r.username, r.display_name, r.avatar_url);
          } catch (e) { /* RLS or a slow network: local results still show */ }
        }
      })());
    }
    tasks.push((async () => {
      try {
        const res = await fetch(`/api/users/search?q=${encodeURIComponent(safe)}`, { signal: AbortSignal.timeout(4000), headers: { accept: 'application/json' } });
        if (!res.ok) return;
        const json = await res.json().catch(() => ({}));
        for (const r of json.users || []) add(r.username, r.username, r.photoUrl);
      } catch (e) { /* opened as a static page, or the API is down */ }
    })());
    await Promise.all(tasks);
    return [...found.values()].slice(0, 8);
  };

  let expressReady = null;
  async function expressUp() {
    if (expressReady != null) return expressReady;
    try {
      const res = await fetch('/api/health', { signal: AbortSignal.timeout(1500), headers: { accept: 'application/json' } });
      const json = await res.json().catch(() => null);
      expressReady = !!(res.ok && json && json.ok);
    } catch (e) { expressReady = false; }
    return expressReady;
  }

  const teamBody = (team, extra) => JSON.stringify({ ...extra, key: team.shareKey });

  async function expressTeam(path, options) {
    const res = await fetch(path, { ...options, signal: AbortSignal.timeout(4000), headers: { 'content-type': 'application/json', accept: 'application/json', ...(options.headers || {}) } });
    if (res.status === 404) return false;
    if (!res.ok) return null;
    const json = await res.json().catch(() => null);
    return json && Object.prototype.hasOwnProperty.call(json, 'team') ? json.team : null;
  }

  /** Save one new team. A repeat with the same link returns the roster and does not add people again. */
  api.publishTeam = async (team) => {
    if (!team?.shareKey) return null;
    try {
      if (await expressUp()) {
        return await expressTeam('/api/teams', { method: 'POST', body: JSON.stringify({ id: team.id, name: team.name, start: team.start, end: team.end, owner: team.owner, key: team.shareKey, members: team.members }) });
      }
      if (!(api.configured && token())) return null;
      return await rest('rpc/timeout_save_team', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: team.id, p_name: team.name, p_start: team.start, p_end: team.end, p_key: team.shareKey, p_members: team.members }) });
    } catch (e) { return null; }
  };

  api.addTeamMember = async (team, username) => {
    if (!team?.shareKey || !username) return null;
    const send = async () => {
      if (await expressUp()) return expressTeam(`/api/teams/${encodeURIComponent(team.id)}/members`, { method: 'POST', body: teamBody(team, { username }) });
      if (!(api.configured && token())) return null;
      return rest('rpc/timeout_add_team_member', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: team.id, p_key: team.shareKey, p_username: username }) });
    };
    try {
      let result = await send();
      if (result === false) {
        await api.publishTeam(team);
        result = await send();
      }
      return result === false ? null : result;
    } catch (e) { return null; }
  };

  api.leaveTeamRemote = async (team, username) => {
    if (!team?.shareKey || !username) return null;
    try {
      if (await expressUp()) return expressTeam(`/api/teams/${encodeURIComponent(team.id)}/leave`, { method: 'POST', body: teamBody(team, { username }) });
      if (!(api.configured && token())) return null;
      return await rest('rpc/timeout_leave_team', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: team.id, p_key: team.shareKey, p_username: username }) });
    } catch (e) { return null; }
  };

  /** The roster, false when the link is wrong or the team is gone, null when the server can't be reached. */
  api.fetchTeam = async (id, key) => {
    if (!id || !key) return null;
    try {
      if (await expressUp()) return expressTeam(`/api/teams/${encodeURIComponent(id)}?key=${encodeURIComponent(key)}`, { method: 'GET', headers: { accept: 'application/json' } });
      if (!(api.configured && token())) return null;
      const row = await rest('rpc/timeout_get_team', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: id, p_key: key }) });
      return row && row.id ? row : false;
    } catch (e) { return null; }
  };

  /** Teams this signed-in Supabase profile is on. Null means "don't change the local list". */
  api.myTeams = async () => {
    if (await expressUp()) return null;
    if (!(api.configured && token())) return null;
    try {
      const rows = await rest('rpc/timeout_my_teams', { method: 'POST', signal: AbortSignal.timeout(4000), body: '{}' });
      return Array.isArray(rows) ? rows : null;
    } catch (e) { return null; }
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — shared UI: rendering helpers, sheets, dialogs, toasts and small components. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;

  const ui = (TO.ui = {});
  TO.actions = {};   // click handlers, keyed by data-act
  TO.inputs = {};    // input handlers, keyed by element id
  TO.changes = {};   // change handlers, keyed by data-change
  TO.views = {};
  ui.root = () => document.getElementById('screen');
  ui.layer = () => document.getElementById('layer');

  // ---------- Components ----------
  ui.teamBadge = (team, size) =>
    `<span class="team-badge" style="background:${team.color || 'var(--raised)'}${size ? `;width:${size}px;height:${size}px;font-size:${Math.round(size * 0.3)}px` : ''}">${team.logo ? `<img src="${esc(team.logo)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">` : ''}<span style="${team.logo ? 'display:none' : ''}">${esc(team.abbr)}</span></span>`;

  ui.tierBadge = (tierId, sm) => {
    const t = TO.state.tierById(tierId);
    return `<span class="tier-badge ${t.id === 'rookie' ? 'rookie' : ''} ${sm ? 'sm' : ''}" style="${t.id === 'rookie' ? '' : `background:${t.color}`}">${icon(t.icon, sm ? 11 : 13)}${esc(t.title)}</span>`;
  };

  ui.avatar = (src, cls = '') => `<img class="avatar ${cls}" src="${esc(src)}" alt="">`;

  ui.statusPill = (status) => {
    const label = { won: 'Won', lost: 'Lost', void: 'Void', tie: 'Tie', open: 'Open' }[status] || status;
    return `<span class="status-pill ${status}">${label.toUpperCase()}</span>`;
  };

  ui.multiplierText = (price) => TO.multiplierText(price);

  ui.leagueTitle = (id) => (id === 'pred' ? 'Predictions' : id === 'todo' ? 'To-Do' : id === 'combo-goal' ? 'Combo Goals' : (S.LEAGUES[id] || {}).title || id);
  ui.leagueShort = (id) => (id === 'pred' ? 'PRED' : id === 'todo' ? 'TO-DO' : id === 'combo-goal' ? 'combo-goal' : (S.LEAGUES[id] || {}).short || id);

  ui.gameStatus = (g) => {
    if (g.state === 'live') return `<span class="live">LIVE</span><span style="color:var(--text)">${esc(g.clock)}</span>`;
    if (g.state === 'scheduled') {
      const mins = Math.round((g.start - TO.now()) / TO.MIN);
      return `<span>${TO.fmtDay(g.start)} · ${TO.fmtTime(g.start)}</span>${mins <= 60 ? `<span class="faint">· starts in ${mins < 1 ? '<1' : mins} min</span>` : ''}`;
    }
    if (g.state === 'final') return `<span>${esc(g.statusText)}</span>`;
    if (g.state === 'canceled') return `<span class="yellow row-s">${icon('alert', 13)} Canceled · all challenges cancelled, pledged minutes returned</span>`;
    return `<span class="yellow row-s">${icon('alert', 13)} Postponed · all challenges cancelled, pledged minutes returned</span>`;
  };

  /** One matchup choice. Tapping adds or removes it from the daily commitment. */
  ui.challengeChoiceButton = (sel, { suspended, move, big, label } = {}) => {
    const on = TO.comboGoalBuilder.has(sel.id);
    const locked = suspended;
    let ln = '';
    if (sel.market === 'margin') ln = sel.line < 0 ? `Win by ${Math.ceil(Math.abs(sel.line))}+` : `Stay within ${Math.floor(sel.line)}`;
    if (sel.market === 'total') ln = `Total Score ${sel.side === 'higher' ? 'Higher' : 'Lower'} ${TO.pointValue.fmtLine(sel.line, false)}`;
    const mult = TO.convertPointValueToMultiplier(sel.price);
    const inner = locked
      ? `${icon('lock', 14)}`
      : `${big && label ? `<span class="lbl">${esc(label)}</span>` : ''}${ln ? `<span class="ln">${ln}</span>` : ''}<span class="pr ${ln || (big && label) ? '' : 'solo'}">${TO.multiplierText(sel.price)}</span>`;
    return `<button class="challenge-btn ${on ? 'on' : ''} ${locked ? 'locked' : ''} ${big ? 'big' : ''}" data-act="pick" data-sel="${esc(sel.id)}" ${locked ? 'disabled' : ''} aria-pressed="${on}" aria-label="${esc(label || '')} ${ln} ${TO.multiplierText(sel.price)}${locked ? ' unavailable' : ''}">${inner}</button>`;
  };

  ui.countdownEl = (target, cls = '') => `<span class="${cls}" data-countdown="${target}">${TO.countdown(target - TO.now())}</span>`;

  ui.field = ({ id, label, type = 'text', value = '', placeholder = '', err, hint, attrs = '' }) => `
    <div class="field">
      <label for="${id}">${esc(label)}</label>
      ${type === 'password'
        ? `<div class="input-wrap"><input class="input ${err ? 'bad' : ''}" id="${id}" name="${id}" type="password" value="${esc(value)}" placeholder="${esc(placeholder)}" ${attrs}><button type="button" class="icon-btn" data-act="toggle-pw" data-for="${id}" aria-label="Show password">${icon('eye', 18)}</button></div>`
        : `<input class="input ${err ? 'bad' : ''}" id="${id}" name="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${attrs}>`}
      ${err ? `<div class="err">${esc(err)}</div>` : hint ? `<div class="hint">${esc(hint)}</div>` : ''}
    </div>`;

  ui.switchEl = (id, checked, attrs = '') => `<span class="switch"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${attrs}><span></span></span>`;

  // ---------- Sheets ----------
  let sheetSeq = 0;
  /** Opens a bottom sheet. Returns its id. `render` returns {title, body, foot}. */
  ui.sheet = (name, opts = {}) => {
    ui.closeSheet(name, true);
    const id = `sheet-${++sheetSeq}`;
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.dataset.sheet = name;
    wrap.id = id;
    wrap.style.cssText = 'position:absolute;inset:0;';
    wrap.innerHTML = `<div class="scrim" data-act="close-sheet" data-name="${name}"></div><div class="sheet ${opts.tall ? 'tall' : ''}" role="dialog" aria-modal="true" aria-labelledby="${id}-title"><div class="grab"></div><div class="sheet-head"><h2 id="${id}-title"></h2><button class="icon-btn" data-act="close-sheet" data-name="${name}" aria-label="Close">${icon('x', 20)}</button></div><div class="sheet-body"></div><div class="sheet-foot" hidden></div></div>`;
    ui.layer().appendChild(wrap);
    wrap._opts = opts;
    ui.refreshSheet(name);
    return id;
  };

  ui.refreshSheet = (name, parts) => {
    const wrap = ui.layer().querySelector(`[data-sheet="${name}"]`);
    if (!wrap) return false;
    const r = wrap._opts.render ? wrap._opts.render() : {};
    const sheet = wrap.querySelector('.sheet');
    const which = parts || ['title', 'body', 'foot'];
    if (which.includes('title')) sheet.querySelector('.sheet-head h2').innerHTML = r.title || '';
    if (which.includes('body')) {
      const body = sheet.querySelector('.sheet-body');
      const st = body.scrollTop;
      body.innerHTML = r.body || '';
      body.scrollTop = st;
    }
    if (which.includes('foot')) {
      const foot = sheet.querySelector('.sheet-foot');
      foot.hidden = !r.foot;
      foot.innerHTML = r.foot || '';
    }
    if (wrap._opts.after) wrap._opts.after(sheet);
    return true;
  };

  ui.sheetOpen = (name) => !!ui.layer().querySelector(`[data-sheet="${name}"]`);
  ui.closeSheet = (name, silent) => {
    const wrap = ui.layer().querySelector(`[data-sheet="${name}"]`);
    if (!wrap) return;
    wrap.remove();
    if (!silent && wrap._opts.onClose) wrap._opts.onClose();
  };
  ui.closeAllSheets = () => ui.layer().querySelectorAll('[data-sheet]').forEach((w) => ui.closeSheet(w.dataset.sheet));

  // ---------- Pages (full-screen overlays: game detail, settings) ----------
  ui.openPage = (name, opts) => {
    ui.closePage(name, true);
    const el = document.createElement('div');
    el.className = 'page';
    el.dataset.page = name;
    el._opts = opts;
    el.innerHTML = `<div class="page-top"><button class="icon-btn" data-act="close-page" data-name="${name}" aria-label="Back">${icon('chevL', 22)}</button><div class="t"></div><div class="pt-right"></div></div><div class="page-scroll"></div>`;
    // Newer pages stack above older ones (a game opened from the Combo Goal builder), but below sheets and dialogs.
    const pages = ui.layer().querySelectorAll('[data-page]');
    ui.layer().insertBefore(el, pages.length ? pages[pages.length - 1].nextSibling : ui.layer().firstChild);
    ui.refreshPage(name);
    return el;
  };
  ui.refreshPage = (name) => {
    const el = ui.layer().querySelector(`[data-page="${name}"]`);
    if (!el) return false;
    const r = el._opts.render();
    el.querySelector('.page-top .t').innerHTML = r.title || '';
    el.querySelector('.pt-right').innerHTML = r.right || '';
    const sc = el.querySelector('.page-scroll');
    const st = sc.scrollTop;
    sc.innerHTML = r.body || '';
    sc.scrollTop = st;
    if (el._opts.after) el._opts.after(el);
    return true;
  };
  ui.pageOpen = (name) => !!ui.layer().querySelector(`[data-page="${name}"]`);
  ui.closePage = (name, silent) => {
    const el = ui.layer().querySelector(`[data-page="${name}"]`);
    if (el) { el.remove(); if (!silent && el._opts.onClose) el._opts.onClose(); }
  };
  ui.closeAllPages = () => ui.layer().querySelectorAll('[data-page]').forEach((p) => p.remove());

  // ---------- Dialogs (the artifact viewer blocks window.confirm, so this is in-page) ----------
  ui.confirm = ({ title, body, confirm = 'Confirm', cancel = 'Cancel', danger = false, tone }) =>
    new Promise((resolve) => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;inset:0;z-index:40';
      wrap.innerHTML = `<div class="scrim"></div><div class="dialog-wrap"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${title}</h3><div class="body">${body || ''}</div><div class="acts">${cancel ? `<button class="btn ghost" data-r="0">${esc(cancel)}</button>` : ''}<button class="btn ${danger ? 'danger' : tone || 'primary'}" data-r="1">${esc(confirm)}</button></div></div></div>`;
      ui.layer().appendChild(wrap);
      const done = (v) => { wrap.remove(); resolve(v); };
      wrap.addEventListener('click', (e) => {
        const b = e.target.closest('[data-r]');
        if (b) done(b.dataset.r === '1');
        else if (e.target.classList.contains('scrim') || e.target.classList.contains('dialog-wrap')) done(false);
      });
      setTimeout(() => { const b = wrap.querySelector('[data-r="1"]'); if (b) b.focus(); }, 30);
    });

  // ---------- Toasts ----------
  ui.toast = ({ title, msg = '', kind = 'info', ms = 4200 }) => {
    const host = document.getElementById('toasts');
    if (!host) return;
    const ic = { win: 'check', loss: 'x', warn: 'alert', info: 'info' }[kind] || 'info';
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.setAttribute('role', 'status');
    el.innerHTML = `${icon(ic, 20)}<div class="grow"><div class="tt">${esc(title)}</div>${msg ? `<div class="tm">${esc(msg)}</div>` : ''}</div>`;
    const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
    el.addEventListener('click', () => { if (!el.dataset.swiped) kill(); });
    // Swipe up dismisses the banner. A small movement still counts as a tap.
    let startY = 0;
    let dy = 0;
    let tracking = false;
    el.addEventListener('pointerdown', (e) => {
      tracking = true;
      startY = e.clientY;
      dy = 0;
      delete el.dataset.swiped;
      el.style.transition = 'none';
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* already released */ }
    });
    el.addEventListener('pointermove', (e) => {
      if (!tracking) return;
      dy = Math.min(0, e.clientY - startY);
      el.style.transform = `translateY(${dy}px)`;
      el.style.opacity = String(Math.max(0.15, 1 + dy / 90));
    });
    const release = () => {
      if (!tracking) return;
      tracking = false;
      if (dy < -36) {
        el.dataset.swiped = '1';
        el.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        el.style.transform = 'translateY(-120%)';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 200);
        return;
      }
      el.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      el.style.transform = '';
      el.style.opacity = '';
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    host.appendChild(el);
    while (host.children.length > 3) host.firstChild.remove();
    setTimeout(kill, ms);
  };
  TO.on('toast', (t) => ui.toast(t));

  /** For actions that need a connection (placing pledges). False, with a toast, when offline. */
  TO.net.guard = () => {
    if (TO.net.online()) return true;
    ui.toast({ kind: 'loss', title: 'No internet connection', msg: 'New pledges pause until you\'re back online.' });
    return false;
  };

  // ---------- Images ----------
  /** Reads an uploaded photo and returns a square 256px JPEG data URL. */
  ui.readPhoto = (file) =>
    new Promise((resolve, reject) => {
      if (!file || !/^image\//.test(file.type)) return reject(new Error('Choose an image file.'));
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const size = 256;
          const c = document.createElement('canvas');
          c.width = c.height = size;
          const ctx = c.getContext('2d');
          const s = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => reject(new Error('That image could not be read.'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('That image could not be read.'));
      reader.readAsDataURL(file);
    });

  ui.copy = async (text, input) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      if (input) { input.focus(); input.select(); }
      return false;
    }
  };

  /** True when running inside the claude.ai artifact viewer (downloads are blocked there). */
  ui.embedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
})(window.TO);

</script>
<script>
/* TimeOut web demo — pledges commitment (Screen 3). */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;

  const commitment = (TO.comboGoalBuilder = {
    selectedPicks: [],
    comboGoalMode: false, // picks stack up only in Combo Goal mode; otherwise a new pick replaces the old one
    pledgeMinutes: null,
    boost: false,
    insure: false,
    error: null,
    capped: false,
    notifiedChange: '',
    has(id) { return this.selectedPicks.some((l) => l.selId === id); },
    clear() {
      Object.assign(this, { selectedPicks: [], comboGoalMode: false, pledgeMinutes: null, boost: false, insure: false, error: null, capped: false, notifiedChange: '' });
    },
  });

  const refOf = (sel) => sel.gameId || sel.predId || sel.raceId;

  /** Tap on an challenge targets button. Outside Combo Goal mode the pick replaces whatever is on the commitment and opens it;
   *  in Combo Goal mode (Build Combo Goal on Home, or Add another pick) it's added, or swapped for a second pick on the same game. */
  commitment.toggle = (selId) => {
    if (commitment.has(selId)) {
      commitment.selectedPicks = commitment.selectedPicks.filter((l) => l.selId !== selId);
      afterChange();
      return;
    }
    const cur = S.currentSelection(selId);
    if (!cur || !cur.sel || !cur.open) { ui.toast({ kind: 'warn', title: 'This pick is closed' }); return; }
    const sel = cur.sel;
    const hasRace = commitment.selectedPicks.some((l) => String(l.ref).startsWith('race-'));
    if (commitment.comboGoalMode && (sel.kind === 'race' || hasRace)) {
      ui.toast({ kind: 'warn', title: 'Virtual races are single picks', msg: 'Use a virtual race pledge on its own, outside a Combo Goal.' });
      return;
    }
    const sameGame = commitment.selectedPicks.findIndex((l) => l.ref === refOf(sel));
    const pick = { selId: sel.id, price: sel.price, multiplier: TO.convertPointValueToMultiplier(sel.price), line: sel.line, ref: refOf(sel) };
    if (!commitment.comboGoalMode) {
      commitment.selectedPicks = [pick];
      commitment.error = null;
      open();
      afterChange();
      return;
    }
    if (sameGame >= 0) {
      ui.toast({ kind: 'warn', title: 'One choice per matchup', msg: 'Remove the current choice before selecting another for this game.' });
      return;
    } else {
      if (commitment.selectedPicks.length >= TO.RULES.maxMatchupPicks) {
        ui.toast({ kind: 'warn', title: `Combo Goals allow up to ${TO.RULES.maxMatchupPicks} choices`, msg: 'Remove a choice to add another.' });
        return;
      }
      commitment.selectedPicks.push(pick);
    }
    commitment.error = null;
    if (ui.sheetOpen('commitment')) open();
    afterChange();
  };

  TO.actions['toggle-combo-goal'] = () => {
    const entering = !commitment.comboGoalMode;
    commitment.comboGoalMode = entering;
    commitment.selectedPicks = [];
    commitment.error = null;
    ui.closeSheet('commitment', true); // not discard(): that would also switch Combo Goal mode back off
    ui.closePage('combo-goal', true);
    TO.app.render();
  };

  function afterChange() {
    if (!commitment.selectedPicks.length) { ui.closeSheet('commitment'); ui.closePage('combo-goal', true); }
    else if (ui.sheetOpen('commitment')) ui.refreshSheet('commitment');
    TO.app.renderChrome();
    TO.app.refreshPointValueButtons();
  }

  /** Closing the commitment (X, tapping outside, Escape) throws the picks away, so nothing lingers on Home. */
  function discard() {
    commitment.clear();
    ui.closePage('combo-goal', true);
    TO.app.renderChrome();
    TO.app.refreshPointValueButtons();
  }

  function pickState(pick) {
    const cur = S.currentSelection(pick.selId);
    const closed = !cur || !cur.sel || !cur.open;
    const changed = !closed && (cur.sel.price !== pick.price || cur.sel.line !== pick.line);
    return { cur, closed, changed };
  }

  commitment.status = () => {
    const states = commitment.selectedPicks.map(pickState);
    return { states, closed: states.some((s) => s.closed), changed: states.some((s) => s.changed) };
  };

  function numbers() {
    const wl = TO.state.wallet();
    const pledgeMinutes = parseInt(commitment.pledgeMinutes, 10);
    const dec = commitment.selectedPicks.reduce((acc, pick) => acc * pick.multiplier, 1);
    let mult = wl.multiplier;
    if (commitment.boost && wl.boostsLeft > 0) mult *= 1 + TO.RULES.boostPercent;
    const s = Number.isFinite(pledgeMinutes) ? pledgeMinutes : 0;
    const rawTarget = s + Math.round((Math.round(s * dec) - s) * mult);
    const targetMinutes = Math.min(rawTarget, TO.MAX_ALLOWED_MINUTES);
    const winnings = Math.max(0, targetMinutes - s);
    return { wl, pledgeMinutes, dec, targetMultiplier: +dec.toFixed(2), rawTarget, targetMinutes, capApplied: rawTarget > TO.MAX_ALLOWED_MINUTES, mult, winnings, valid: Number.isInteger(pledgeMinutes) && pledgeMinutes >= 1 && pledgeMinutes <= wl.balance && TO.net.online() };
  }

  // ---------- Rendering ----------
  function picksHtml() {
    const st = commitment.status();
    const picks = commitment.selectedPicks.map((pick, i) => {
      const { cur, closed, changed } = st.states[i];
      const sel = cur && cur.sel;
      let title, sub, liveLine = '';
      if (String(pick.ref).startsWith('race-')) {
        const race = TO.races.get(pick.ref);
        const runner = sel && TO.races.horse(sel.horseId || sel.side);
        title = runner ? runner.name : 'Virtual race pick';
        sub = `Virtual Racing · Race #${esc(String(pick.ref).replace('race-', ''))}`;
        if (race && race.status === 'running') liveLine = `<div class="row-s tiny" style="margin-top:4px"><span class="live">LIVE</span><span class="muted bold">Race in progress</span></div>`;
        if (race && race.status === 'final') liveLine = `<div class="tiny muted bold" style="margin-top:4px">Race finished</div>`;
      } else if (pick.ref.startsWith('pm-')) {
        const p = S.prediction(pick.ref);
        title = sel ? S.selectionLabel(sel) : '';
        sub = `Prediction · ${esc(p.q)}`;
      } else {
        const g = S.game(pick.ref);
        title = sel ? S.selectionLabel(Object.assign({}, sel, { line: changed ? sel.line : pick.line }), g) : '';
        sub = `${esc(g.away.name)} @ ${esc(g.home.name)}`;
        if (g.state === 'live') liveLine = `<div class="row-s tiny" style="margin-top:4px"><span class="live">LIVE</span><span class="muted bold">${g.away.abbr} ${g.awayScore} – ${g.home.abbr} ${g.homeScore} · ${esc(g.clock)}</span></div>`;
        if (g.state === 'postponed') liveLine = `<div class="tiny yellow bold" style="margin-top:4px">Postponed</div>`;
        if (g.state === 'final') liveLine = `<div class="tiny muted bold" style="margin-top:4px">Game over · ${esc(g.statusText)}</div>`;
      }
      const priceHtml = closed
        ? `<span class="tag red">Closed</span>`
        : changed
          ? `<div style="text-align:right"><span class="old">${TO.multiplierText(pick.price)}</span><span class="price" style="color:var(--warn)">${TO.multiplierText(sel.price)}</span>${sel.line !== pick.line ? `<div class="tiny yellow bold">Challenge target changed</div>` : ''}</div>`
          : `<span class="price">${TO.multiplierText(pick.price)}</span>`;
      return `<div class="commitment-pick ${closed ? 'closed' : changed ? 'changed' : ''}">
        <div class="grow"><div class="bold" style="font-size:15.5px">${esc(title)}</div><div class="small muted">${sub}</div>${liveLine}</div>
        ${priceHtml}
        <button class="icon-btn" style="width:30px;height:30px;margin:-4px -6px 0 0" data-act="commitment-remove" data-sel="${esc(pick.selId)}" aria-label="Remove pick">${icon('x', 16)}</button>
      </div>`;
    }).join('');
    let banner = '';
    if (st.closed) banner = `<div class="note red">${icon('alert', 16)}<span>A choice is no longer available (the game ended, was postponed, or challenges closed). Remove it to continue.</span></div>`;
    else if (st.changed) banner = `<div class="note warn">${icon('alert', 16)}<span>A challenge target changed while your commitment was open. Review it, then accept the update to continue.</span></div>`;
    const comboTarget = commitment.selectedPicks.reduce((acc, pick) => acc * pick.multiplier, 1);
    const combo = commitment.selectedPicks.length > 1 && !st.closed ? `<div class="row-layout small"><span class="muted bold">${commitment.selectedPicks.length}-pick Combo Goal · all choices count</span><span class="display" style="font-size:19px;color:var(--accent)">${comboTarget.toFixed(2)}x</span></div>` : '';
    return banner + picks + combo;
  }

  function summaryHtml() {
    const n = numbers();
    const { wl } = n;
    if (wl.lockedOut || wl.balance <= 0) return '';
    const pledgeMinutes = Number.isFinite(n.pledgeMinutes) ? n.pledgeMinutes : 0;
    let err = '';
    if (commitment.capped) err = `<div class="note red">${icon('alert', 16)}<span><b>Not enough screen time.</b> You have ${wl.balance} min available today.</span></div>`;
    else if (Number.isFinite(n.pledgeMinutes) && n.pledgeMinutes > wl.balance) err = `<div class="note red">${icon('alert', 16)}<span><b>Not enough screen time.</b> You have ${wl.balance} min available today.</span></div>`;
    else if (commitment.pledgeMinutes !== null && commitment.pledgeMinutes !== '' && (!Number.isFinite(n.pledgeMinutes) || n.pledgeMinutes < 1)) err = `<div class="note red">${icon('alert', 16)}<span>Enter a pledge of at least 1 minute.</span></div>`;
    const after = Math.max(wl.balance - pledgeMinutes, 0);
    return `${err}
      <div class="commitment-summary">
        <div class="row-layout small"><span>Committed Today</span><b>${n.valid ? pledgeMinutes : 0} min</b></div>
        <div class="row-layout small"><span>Combined Target</span><b class="green">${n.targetMultiplier.toFixed(2)}x</b></div>
        <div class="row-layout small"><span>Tomorrow's Projected Allowance</span><b class="green">${wl.tomorrowLimit + (n.valid ? n.winnings : 0)} min</b></div>
        ${n.capApplied ? '<span class="tag yellow">Max Daily Cap Applied (120m max)</span>' : ''}
      </div>
      <div class="outcomes">
        <div class="w"><span>Earned Minutes</span><b>+${n.valid ? n.winnings : 0} min</b><span>added to tomorrow's phone time</span></div>
        <div class="l"><span>If a challenge is missed</span><b>−${n.valid ? pledgeMinutes : 0} min</b><span>from tomorrow's phone time</span></div>
      </div>
      <div class="row-layout small"><span class="muted">Available today after pledge</span><b class="num">${n.valid ? after : wl.balance} of ${wl.balance} min</b></div>
      ${n.mult > 1 ? `<div class="row-layout small"><span class="muted">Earned-minutes multiplier${commitment.boost ? ' (streak + boost)' : ' (clean streak)'}</span><b class="green">${TO.state.fmtMult(+n.mult.toFixed(3))}</b></div>` : ''}
      ${commitment.error ? `<div class="form-error">${esc(commitment.error)}</div>` : ''}`;
  }

  function footHtml() {
    const st = commitment.status();
    const more = commitment.selectedPicks.length < TO.RULES.maxMatchupPicks && !st.closed ? `<button class="btn quiet sm" data-act="commitment-more">${icon('plus', 16)} Add another matchup choice</button>` : '';
    if (!TO.net.online()) return `<div class="note red">${icon('wifiOff', 16)}<span><b>No internet connection.</b> New pledges pause until you're back online.</span></div><button class="btn full" disabled>${icon('wifiOff', 18)} Waiting for connection</button>`;
    if (st.closed) return `<button class="btn primary full" disabled>Remove unavailable picks to continue</button>`;
    if (st.changed) return `<button class="btn warn full" data-act="commitment-accept">Accept updated target</button>`;
    const n = numbers();
    if (n.wl.lockedOut || n.wl.balance <= 0) return `<button class="btn full" disabled>${icon('lock', 18)} New pledges resume at midnight</button>`;
    return `<button class="btn primary full" data-act="commitment-place" ${n.valid ? '' : 'disabled'}>${commitment.selectedPicks.length > 1 ? `Lock In ${commitment.selectedPicks.length}-Pick Combo Goal (${n.pledgeMinutes}m)` : `Confirm ${n.pledgeMinutes}m Pledge`}</button>${more}`;
  }

  function bodyHtml() {
    const wl = TO.state.wallet();
    if (commitment.pledgeMinutes === null) commitment.pledgeMinutes = String(Math.max(1, Math.min(TO.data.lastPledge || 5, wl.balance || 1)));
    let controls;
    if (wl.lockedOut || wl.balance <= 0) {
      controls = `<div class="card" style="border-color:rgba(255,90,95,.4)"><div class="row-s red tiny bold" style="letter-spacing:.06em">${icon('lock', 14)} OUT OF PLEDGE MINUTES</div>
        <div class="bold" style="margin-top:6px">New challenges are blocked until midnight.</div>
        <div class="display" style="font-size:36px;margin-top:4px">${ui.countdownEl(TO.nextMidnight())}</div>
        <div class="small muted">Your available pledge minutes reset at midnight.</div></div>`;
    } else {
      const quick = [15, 30, 45].map((v) => `<button data-act="commitment-quick" data-v="${v}" class="${String(v) === String(commitment.pledgeMinutes) ? 'on' : ''}" ${v > wl.balance ? 'disabled style="opacity:.35"' : ''}>${v}m</button>`).join('');
      const perks = [];
      if (wl.boostsLeft > 0) perks.push(`<label class="perk-row" for="commitment-boost"><span class="lr-icon" style="background:var(--blue-soft);color:var(--blue)">${icon('bolt', 17)}</span><span class="grow"><b>Allowance boost</b><div class="tiny muted">+10% earned minutes · ${wl.boostsLeft} left today (${esc(wl.tier.title)} perk)</div></span>${ui.switchEl('commitment-boost', commitment.boost, 'data-change="commitment-boost"')}</label>`);
      if (commitment.selectedPicks.length > 1 && wl.insuranceLeft > 0) perks.push(`<label class="perk-row" for="commitment-insure"><span class="lr-icon" style="background:rgba(197,140,255,.14);color:var(--purple)">${icon('shield', 17)}</span><span class="grow"><b>Miss-one protection</b><div class="tiny muted">Miss one choice and recover your committed minutes · 1 per week</div></span>${ui.switchEl('commitment-insure', commitment.insure, 'data-change="commitment-insure"')}</label>`);
      controls = `
        <div class="field">
          <label for="commitment-pledge">Minutes to commit</label>
          <div class="pledge-box">
            <button class="step" data-act="commitment-step" data-d="-1" aria-label="One minute less">${icon('minus', 20)}</button>
            <div class="pledge-input"><input id="commitment-pledge" type="number" inputmode="numeric" min="1" max="${wl.balance}" value="${esc(commitment.pledgeMinutes)}"><span>min</span></div>
            <button class="step" data-act="commitment-step" data-d="1" aria-label="One minute more">${icon('plus', 20)}</button>
          </div>
          <div class="quick">${quick}<button data-act="commitment-quick" data-v="${wl.balance}">Max Available</button></div>
        </div>
        <div class="note blue">${icon('info', 16)}<span>You're committing <b>tomorrow's phone time</b>. Minutes come from today's ${wl.balance} available minutes; successful challenges add to tomorrow's allowance.</span></div>
        ${perks.join('')}`;
    }
    return `<div class="stack-s" id="commitment-picks">${picksHtml()}</div>
      ${controls}
      <div class="stack-s" id="commitment-summary">${summaryHtml()}</div>`;
  }

  function open() {
    if (ui.sheetOpen('commitment')) { ui.refreshSheet('commitment'); return; }
    ui.sheet('commitment', {
      render: () => ({
        title: commitment.selectedPicks.length > 1 ? `${commitment.selectedPicks.length}-Pick Combo Goal` : 'Single Matchup Pledge',
        body: bodyHtml(),
        foot: footHtml(),
      }),
      onClose: discard,
    });
    TO.app.renderChrome();
  }
  commitment.open = open;

  /** Live refresh without touching the inputs the user may be typing in. */
  commitment.update = () => {
    const wrap = ui.layer().querySelector('[data-sheet="commitment"]');
    if (!wrap) return;
    const picks = wrap.querySelector('#commitment-picks');
    if (picks) picks.innerHTML = picksHtml();
    const sum = wrap.querySelector('#commitment-summary');
    if (sum) sum.innerHTML = summaryHtml();
    const foot = wrap.querySelector('.sheet-foot');
    if (foot) foot.innerHTML = footHtml();
    wrap.querySelector('.sheet-head h2').textContent = commitment.selectedPicks.length > 1 ? `${commitment.selectedPicks.length}-Pick Combo Goal` : 'Single Matchup Pledge';
  };

  // ---------- Combo Goal builder: a page of games to add picks from ----------
  function comboPage() {
    const games = TO.views.home.boardGames().filter((g) => g.state === 'live' || g.state === 'scheduled');
    const inSlip = new Set(commitment.selectedPicks.map((l) => l.ref));
    const groups = S.LEAGUE_ORDER.filter((l) => games.some((g) => g.league === l)).map((l) => {
      const lg = games.filter((g) => g.league === l);
      return `<div class="league-head"><h3>${esc(S.LEAGUES[l].title)}</h3><span class="cnt">${lg.length} games</span></div>${lg.map((g) => TO.views.home.gameCard(g)).join('')}`;
    }).join('');
    const n = commitment.selectedPicks.length;
    const dec = commitment.selectedPicks.reduce((p, l) => p * TO.pointValue.decimal(l.price), 1);
    const full = n >= TO.RULES.maxMatchupPicks;
    return {
      title: 'Build a Combo Goal',
      body: `<div class="note blue">${icon('info', 16)}<span>Pick up to ${TO.RULES.maxMatchupPicks} sides from <b>different games</b>. Every pick has to win for the Combo Goal to pay. ${inSlip.size ? `Games already on your commitment are highlighted.` : ''}</span></div>
        <div class="combo-goal-days">${TO.views.home.dayBar()}</div>
        ${full ? `<div class="note warn">${icon('alert', 16)}<span>Your Combo Goal is full. Remove a pick on the commitment to add a different one.</span></div>` : ''}
        <div class="stack combo-goal-list">${groups || `<div class="empty">${icon('target', 36)}<h3>No games open for challenges</h3><p>Check back when the next games start.</p></div>`}</div>
        <div class="page-fab combo-goal-fab"><button class="btn primary full" data-act="combo-goal-review" ${n ? '' : 'disabled'}><span class="count-pill" style="background:var(--accent-ink);color:var(--accent)">${n}</span>${n > 1 ? `Review ${n}-pick Combo Goal` : 'Review challenge commitment'}${n > 1 ? `<span class="display" style="margin-left:auto;font-size:19px">${TO.pointValue.fmt(TO.pointValue.fromDecimal(dec))}</span>` : ''}</button></div>`,
    };
  }
  function openComboPage() {

      onClose: () => { if (commitment.selectedPicks.length && !ui.sheetOpen('commitment')) open(); },

  }

  commitment.docked = () => false;

  // ---------- Actions ----------
  const A = TO.actions;

  A.pick = (el) => commitment.toggle(el.dataset.sel);
  A['commitment-remove'] = (el) => { commitment.selectedPicks = commitment.selectedPicks.filter((l) => l.selId !== el.dataset.sel); afterChange(); };
  A['commitment-more'] = () => {
    commitment.comboGoalMode = true;
    if (!commitment.docked()) ui.closeSheet('commitment', true); // hide it without discarding the picks
    openComboPage();
    TO.app.renderChrome();
  };
  A['open-commitment'] = () => open();
  A['commitment-quick'] = (el) => { commitment.pledgeMinutes = el.dataset.v; commitment.error = null; commitment.capped = false; ui.refreshSheet('commitment', ['body', 'foot']); };
  A['commitment-step'] = (el) => {

    commitment.pledgeMinutes = String(Math.max(1, Math.min(v, max)));

  };
  A['commitment-accept'] = () => {
    for (const pick of commitment.selectedPicks) {
      const cur = S.currentSelection(pick.selId);
      if (cur && cur.sel) { pick.price = cur.sel.price; pick.multiplier = TO.convertPointValueToMultiplier(cur.sel.price); pick.line = cur.sel.line; }
    }
    commitment.error = null;
    ui.refreshSheet('commitment');
  };
  A['commitment-place'] = () => {
    if (!TO.net.online()) { ui.refreshSheet('commitment'); return; }
    const n = numbers();
    try {
      const challenge = TO.state.submitPledge({ picks: commitment.selectedPicks, pledgeMinutes: n.pledgeMinutes, boost: commitment.boost, insure: commitment.insure });
      const label = challenge.picks.length > 1 ? `${challenge.picks.length}-pick Combo Goal` : challenge.picks[0].label;
      ui.toast({ kind: 'win', title: 'Pledge locked in', msg: `${label} · ${challenge.pledgeMinutes} min committed. Track it in My Challenges.` });
      commitment.clear();
      ui.closeSheet('commitment');
      ui.closePage('combo-goal', true);
      TO.app.render();
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      commitment.error = e.code === 'value_changed' ? null : e.message;
      if (e.code === 'value_changed') ui.toast({ kind: 'warn', title: 'Challenge target changed', msg: 'Review the new target and confirm again.' });
      ui.refreshSheet('commitment');
    }
  };

  // The pledge can't go above today's challenging balance: a bigger number snaps back to it.
  TO.inputs['commitment-pledge'] = (el) => {
    const max = TO.state.wallet().balance;
    const n = parseInt(el.value, 10);
    commitment.capped = Number.isFinite(n) && n > max;
    if (commitment.capped) el.value = String(max);
    commitment.pledgeMinutes = el.value;
    commitment.error = null;
    el.classList.remove('bad');
    document.querySelectorAll('.quick button').forEach((b) => b.classList.toggle('on', b.dataset.v === el.value && b.textContent !== 'Max'));
    commitment.update();
  };
  TO.changes['commitment-boost'] = (el) => { commitment.boost = el.checked; commitment.update(); };
  TO.changes['commitment-insure'] = (el) => { commitment.insure = el.checked; commitment.update(); };
})(window.TO);

<script>
/* TimeOut virtual horse racing: track animation and screen-time race selections. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;

  const horses = [
    { id: 1, number: 1, name: 'Midnight Surge', americanPointValue: 180, form: '2-1-2', jockey: 'R. Vance', color: '#4fb3ff', speed: 1.025, variance: 0.18 },
    { id: 2, number: 2, name: 'Silicon Sprint', americanPointValue: 220, form: '1-3-1', jockey: 'K. Chen', color: '#22d66e', speed: 1.018, variance: 0.19 },
    { id: 3, number: 3, name: 'Digital Blitz', americanPointValue: 260, form: '3-2-1', jockey: 'T. Hayes', color: '#ffc940', speed: 1.010, variance: 0.20 },
    { id: 4, number: 4, name: 'Golden Hour', americanPointValue: 310, form: '2-1-4', jockey: 'L. Moreno', color: '#ff718d', speed: 1.002, variance: 0.21 },
    { id: 5, number: 5, name: 'Circuit Breaker', americanPointValue: 380, form: '1-4-2', jockey: 'D. Sterling', color: '#c58cff', speed: 0.995, variance: 0.22 },
  ];
  const KEY = 'timeout.virtualRaces';
  const saved = TO.store.get(KEY, null) || { next: 48, current: null, history: [] };
  let data = saved;
  let mounted = null;
  let frame = 0;
  let lastComment = 0;

  function persist() { TO.store.set(KEY, data); }
  function current() {
    if (!data.current) data.current = { number: data.next || 48, status: 'open' };
    return data.current;
  }
  function get(raceId) {
    const number = Number(String(raceId).replace(/^race-/, ''));
    const active = current();
    if (active.number === number) return active;
    return data.history.find((race) => race.number === number) || null;
  }
  const horse = (id) => horses.find((item) => item.id === Number(id)) || horses[0];
  const selectionId = (race, runner) => `race-${race.number}|race|${runner.id}`;
  function selection(race, runner) {
    return { id: selectionId(race, runner), raceId: `race-${race.number}`, horseId: runner.id, kind: 'race', market: 'race', side: String(runner.id), line: null, price: runner.americanPointValue };
  }
  function currentSelection(selId) {
    const [ref, market, side] = String(selId).split('|');
    if (market !== 'race') return null;
    const race = get(ref);
    const runner = horse(side);
    return { sel: selection(race || { number: Number(ref.replace(/^race-/, '')) }, runner), open: !!race && race.status === 'open' };
  }
  function selectionLabel(sel) { return horse(sel.horseId || sel.side).name; }
  function implied(american) { return american > 0 ? 100 / (american + 100) : Math.abs(american) / (Math.abs(american) + 100); }
  function weightedWinner(seed) {
    const rng = TO.rng(seed);
    const total = horses.reduce((sum, h) => sum + implied(h.americanPointValue), 0);
    let roll = rng() * total;
    for (const h of horses) { roll -= implied(h.americanPointValue); if (roll <= 0) return h.id; }
    return horses[0].id;
  }
  function beginRace(race, seed, now = TO.now(), pledgeId = null) {
    const winnerId = weightedWinner(`${race.number}-${seed}-${now}`);
    const rest = horses.filter((h) => h.id !== winnerId).sort((a, b) => {
      const ra = TO.u01(`${seed}-${a.id}`) * a.speed;
      const rb = TO.u01(`${seed}-${b.id}`) * b.speed;
      return rb - ra;
    });
    race.status = 'running';
    race.startedAt = now;
    race.finishAt = now + 12000;
    race.winnerId = winnerId;
    race.order = [winnerId, ...rest.map((h) => h.id)];
    race.pledgeId = pledgeId;
    persist();
  }
  function startForChallenge(pledge, now = TO.now()) {
    const race = current();
    const pick = pledge.picks[0];
      if (race.status !== 'open' || pick.raceId !== `race-${race.number}`) throw new TO.AppError('closed', 'That race challenge is closed.');
    beginRace(race, pledge.id, now, pledge.id);
  }
  function startForViewing() {
    const race = current();
    if (race.status !== 'open') return;
    beginRace(race, `watch-${TO.uid('race')}`);
  }
  function finalize(race, now) {
    if (!race || race.status !== 'running' || now < race.finishAt) return;
    race.status = 'final';
    race.finishedAt = race.finishAt;
    data.history.unshift({ ...race });
    data.history = data.history.slice(0, 20);
    data.next = race.number + 1;
    data.current = { number: data.next, status: 'open' };
    persist();
  }
  function grade(sel, now = TO.now()) {
    const race = get(sel.raceId || sel.id.split('|')[0]);
    if (!race) return 'void';
    finalize(race, now);
    if (race.status !== 'final') return 'pending';
    return race.winnerId === Number(sel.horseId || sel.side) ? 'won' : 'lost';
  }

  function statusText(race) {
    if (race.status === 'running') return 'Race in progress';
    return race.status === 'final' ? `Race #${race.number} finished` : 'Challenge open';
  }
  function latestResultHtml(race) {
    return race ? `<div class="card race-card race-result"><span class="eyebrow">Last result · Race #${race.number}</span><b>${esc(horse(race.winnerId).name)} won</b><span class="small muted">${race.order.map((id, i) => `${i + 1}. ${esc(horse(id).name)}`).join(' · ')}</span></div>` : '';
  }
  function rosterHtml(race) {
    return horses.map((runner) => {
      const sel = selection(race, runner);
      const isWinner = race.status === 'final' && race.winnerId === runner.id;
      return `<div class="race-entry ${isWinner ? 'race-winner' : ''}">
        <div class="race-horse-info"><span class="race-silk" style="--silk:${runner.color}">#${runner.number}</span><span class="race-horse-copy"><b>${esc(runner.name)}</b><small>Form ${runner.form} · ${esc(runner.jockey)}</small></span></div>
        <div class="race-target">${TO.ui.challengeChoiceButton(sel, { suspended: race.status !== 'open', big: true, label: runner.name })}</div>
      </div>`;
    }).join('');
  }
  function render() {
    const race = current();
    const latest = data.history[0];
    return `<div class="stack race-page" data-race-id="${race.number}" data-race-status="${race.status}">
      <div class="page-head"><h1>Virtual Racing</h1><p>Pick a winner and pledge screen-time minutes using your regular Daily Commitment.</p></div>
      <div class="card race-card">
        <div class="race-card-head"><div><span id="race-status" class="tag ${race.status === 'running' ? 'red' : 'green'}">${esc(statusText(race))}</span><span class="race-caption">· 1,200m Cyber Turf Classic #${race.number}</span></div><span class="race-clock" id="race-clock">12 sec</span></div>
        <div class="race-track-wrap"><canvas class="race-track" id="race-track" aria-label="Animated virtual horse race"></canvas><div class="race-finish-line" aria-hidden="true"></div></div>
        <div class="race-caller"><span>${icon('radio', 14)} Caller</span><span id="race-commentary">${race.status === 'running' ? 'The field is underway!' : 'Welcome to Silicon Downs. Select a horse to add it to your Daily Commitment.'}</span></div>
        <button class="btn primary full" id="race-start" data-act="race-start" ${race.status === 'open' ? '' : 'disabled'}>${race.status === 'open' ? 'Start race now' : race.status === 'running' ? 'Race in progress' : 'Race finished'}</button>
      </div>
      <div class="card race-card stack-s">
        <div class="row-layout"><div><h2 class="race-heading">Race targets</h2><div class="small muted">Choose a target to open your standard screen-time Daily Commitment.</div></div><span class="tag">5 runners</span></div>
        <div id="race-roster" class="race-roster">${rosterHtml(race)}</div>
        <div class="note blue">${icon('info', 16)}<span>Lock in pledge to start the race with your pick, or start it now to watch without a pledge. Pledges use your available screen-time minutes.</span></div>
      </div>
      ${latestResultHtml(latest)}
    </div>`;
  }

  function drawHorse(ctx, x, y, runner, elapsed) {
    const phase = elapsed / 90 + runner.id;
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = runner.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.fillStyle = runner.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -2); ctx.lineTo(17, -13); ctx.lineTo(22, -10); ctx.lineTo(19, -1); ctx.fill();
    ctx.fillStyle = '#f2f5f9'; ctx.beginPath(); ctx.arc(0, -10, 3, 0, Math.PI * 2); ctx.fill();
    const swing = Math.sin(phase) * 7;
    for (const [ax, dir] of [[-8, -1], [-3, 1], [6, -1], [10, 1]]) {
      ctx.beginPath(); ctx.moveTo(ax, 4); ctx.lineTo(ax + swing * dir, 15); ctx.stroke();
    }
    ctx.fillStyle = '#080d14'; ctx.beginPath(); ctx.roundRect(-5, -4, 10, 8, 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '700 7px system-ui'; ctx.textAlign = 'center'; ctx.fillText(String(runner.number), 0, 2);
    ctx.restore();
  }
  function paint(canvas, race, now) {
    if (!canvas || !canvas.isConnected) return;
    const box = canvas.getBoundingClientRect();
    if (!box.width) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.round(box.width * dpr) || canvas.height !== Math.round(250 * dpr)) {
      canvas.width = Math.round(box.width * dpr);
      canvas.height = Math.round(250 * dpr);
    }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = box.width, h = 250;
    ctx.fillStyle = '#0a0d12'; ctx.fillRect(0, 0, w, h);
    const top = 20, lane = 42, start = 40, finish = w - 36;
    for (let i = 0; i < horses.length; i++) {
      const y = top + i * lane;
      ctx.fillStyle = i % 2 ? '#111720' : '#151d27'; ctx.fillRect(0, y, w, lane);
      ctx.strokeStyle = '#283141'; ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.moveTo(0, y + lane); ctx.lineTo(w, y + lane); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#5e687a'; ctx.font = '11px system-ui'; ctx.fillText(String(i + 1), 12, y + 24);
    }
    ctx.strokeStyle = '#8c96a8'; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.moveTo(start, top); ctx.lineTo(start, top + lane * horses.length); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#f2f5f9';
    for (let y = top; y < top + lane * horses.length; y += 9) ctx.fillRect(finish - 3, y, 5, 5);
    const elapsed = race.status === 'running' ? Math.max(0, now - race.startedAt) : race.status === 'final' ? 12000 : 0;
    const order = race.order || horses.map((h) => h.id);
    const ranks = new Map(order.map((id, i) => [id, i]));
    horses.forEach((runner, idx) => {
      let progress = 0;
      if (race.status === 'running' || race.status === 'final') {
        const rank = ranks.get(runner.id) || 0;
        const duration = 9400 + rank * 450;
        progress = Math.min(1, elapsed / duration);
      }
      const x = start + progress * (finish - start - 12);
      const y = top + idx * lane + lane / 2;
      drawHorse(ctx, x, y, runner, elapsed);
    });
  }
  function updateMounted() {
    if (!mounted || !mounted.isConnected) { mounted = null; return; }
    const race = current();
    const page = mounted.querySelector('.race-page');
    if (page && page.dataset.raceId !== String(race.number)) {
      page.dataset.raceId = race.number;
      page.dataset.raceStatus = race.status;
      const statusTag = mounted.querySelector('#race-status');
      if (statusTag) statusTag.outerHTML = `<span id="race-status" class="tag green">Challenge open</span>`;
      const caption = mounted.querySelector('.race-caption');
      if (caption) caption.textContent = `· 1,200m Cyber Turf Classic #${race.number}`;
      const roster = mounted.querySelector('#race-roster');
      if (roster) roster.innerHTML = rosterHtml(race);
      const result = mounted.querySelector('.race-result');
      if (result) result.outerHTML = latestResultHtml(data.history[0]);
      else if (data.history[0]) page.insertAdjacentHTML('beforeend', latestResultHtml(data.history[0]));
      const comment = mounted.querySelector('#race-commentary');
      if (comment) comment.textContent = 'The previous race is official. Choose your next screen-time challenge.';
    } else if (page && page.dataset.raceStatus !== race.status) {
      page.dataset.raceStatus = race.status;
      const roster = mounted.querySelector('#race-roster');
      if (roster) roster.innerHTML = rosterHtml(race);
    }
    const statusTag = mounted.querySelector('#race-status');

    const startButton = mounted.querySelector('#race-start');
    if (startButton) {
      startButton.disabled = race.status !== 'open';
      startButton.textContent = race.status === 'open' ? 'Start race now' : race.status === 'running' ? 'Race in progress' : 'Race finished';
    }
    const clock = mounted.querySelector('#race-clock');
    if (clock) clock.textContent = race.status === 'running' ? `${Math.max(0, Math.ceil((race.finishAt - TO.now()) / 1000))} sec` : '12 sec';
    const canvas = mounted.querySelector('#race-track');
    paint(canvas, race, TO.now());
    if (race.status === 'running' && TO.now() >= race.finishAt) {
      finalize(race, TO.now());
      TO.app.tick(true);
    }
    if (race.status === 'running' && TO.now() - lastComment > 2200) {
      lastComment = TO.now();
      const leader = (race.order || []).find((id, index) => (TO.now() - race.startedAt) / (9400 + index * 450) < 1) || race.order[0];
      const comment = mounted.querySelector('#race-commentary');
      if (comment) comment.textContent = `#${horse(leader).number} ${horse(leader).name} is driving for the lead.`;
    }
    if (mounted) frame = requestAnimationFrame(updateMounted);
  }
  function mount(page) {
    mounted = page;
    cancelAnimationFrame(frame);
    updateMounted();
  }

  TO.races = { horses, current, get, horse, currentSelection, selectionLabel, startForChallenge, grade, mount };
  TO.actions['race-start'] = startForViewing;
  TO.views.races = { render };
})(window.TO);

<script>
/* TimeOut web demo — Home (Screen 1). */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;

  const prevScores = {};
  const activeChallenge = new Map();

  const followed = () => TO.data.settings.sports?.length ? TO.data.settings.sports : S.REAL_LEAGUES;
  const offDay = () => TO.store.get('timeout.offDay', false);
  const activeFilter = () => ['pred', 'todo', 'sim', 'live'].includes(TO.data.feedFilter) ? 'all' : (TO.data.feedFilter || 'all');
  // The Live switch on its own line. It narrows whichever sport is picked.
  const liveOnly = () => !!TO.data.feedLive;
  const filterName = () => { const f = activeFilter(); return f === 'all' ? 'all sports' : f === 'ncaaf' ? 'College Football' : S.LEAGUES[f].short; };
  const sportsOnly = (challenge) => challenge.kind === 'race' || (challenge.kind === 'sports' && challenge.picks.every((pick) => pick.gameId && S.game(pick.gameId)?.league !== 'sim'));

  // Which day the board shows: 0 = today, 1 = tomorrow. Live games are always today.
  let feedDay = 0;
  const activeDay = () => (liveOnly() ? 0 : feedDay);

  function boardGames(day = activeDay(), peek = false) {
    return S.board(TO.now(), { offDay: offDay(), day, peek, leagues: S.LEAGUE_ORDER.filter((l) => l !== 'sim' && followed().includes(l)) }).filter((g) => !g.simulated && g.league !== 'sim');
  }

  function dayLabel(offset) {
    if (offset === 0) return 'Today';
    if (offset === 1) return 'Tomorrow';
    const d = new Date(TO.now() + offset * TO.DAY);
    return `${d.toLocaleDateString([], { weekday: 'short' })} ${d.getMonth() + 1}/${d.getDate()}`;
  }

  /** Today and tomorrow. Counts are games still to be played that day, in the sports being shown. */
  function dayBar(lead = '') {
    if (liveOnly() || TO.live.offline) return lead ? `<div class="hscroll day-bar" data-hkey="days">${lead}</div>` : '';
    const f = activeFilter();
    const chips = lead ? [lead] : [];
    for (let i = 0; i <= TO.live.days; i++) {
      const games = boardGames(i, true).filter((g) => g.state !== 'final' && (f === 'all' || g.league === f));
      const n = games.length;
      chips.push(`<button class="chip sm day-chip ${feedDay === i ? 'on' : ''}" data-act="feed-day" data-day="${i}" aria-pressed="${feedDay === i}">${esc(dayLabel(i))}${n ? `<span class="n">${n}</span>` : ''}</button>`);
    }
    return `<div class="hscroll day-bar" data-hkey="days" aria-label="Pick a day">${chips.join('')}</div>`;
  }

  function myOpenChallengeOn(ref) {
    return TO.data.challenges.filter((b) => b.status === 'open' && b.picks.some((l) => l.gameId === ref || l.predId === ref || l.raceId === ref));
  }

  // ---------- Wallet header (PRD: screen time + current pledges always at the top) ----------
  function walletCard(wl) {
    if (wl.lockedOut || wl.balance <= 0) {
      return `<div class="card wallet locked" style="border-color:rgba(255,90,95,.45)">
        <div class="lockhead">${icon('lock', 14)} OUT OF PLEDGE MINUTES</div>
        <div class="bold" style="margin-top:8px;font-size:16px">Pledges are paused. They reopen at midnight.</div>
        <div class="bigcd" style="margin-top:6px">${ui.countdownEl(TO.nextMidnight())}</div>
        <div class="small muted" style="margin-top:4px">Active challenges still resolve and update tomorrow's phone time.</div>
        ${statsRow(wl)}
      </div>`;
    }
    const pct = Math.min(100, (wl.balance / (TO.RULES.daily + wl.bonusToday)) * 100);
    return `<div class="card wallet">
      <div class="row-layout" style="align-items:flex-end">
        <div>
          <div class="row-layout" style="justify-content:flex-start;gap:8px"><div class="eyebrow">Available minutes today</div>${wl.bonusToday ? `<span class="tiny green bold">+${wl.bonusToday} min ${esc(wl.tier.title)} bonus included</span>` : ''}</div>
          <div class="big" style="margin-top:4px">${wl.balance}<small>min</small></div>
        </div>
        <div style="text-align:right">
          <div class="eyebrow" style="color:var(--faint)">Resets in</div>
          ${ui.countdownEl(TO.nextMidnight(), 'cd')}
        </div>
      </div>
      <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
      ${statsRow(wl)}
      <button class="explain" data-act="how">${icon('info', 14)} Pledges use tomorrow's phone time. How it works</button>
    </div>`;
  }

  function statsRow(wl) {
    const tomorrowDelta = wl.tomorrowLimit - TO.RULES.daily;
    const tColor = tomorrowDelta > 0 ? 'green' : tomorrowDelta < 0 ? 'red' : '';
    const pColor = wl.appsLocked ? 'red' : wl.phoneLeft <= TO.data.settings.lowWarn ? 'yellow' : '';
    return `<div class="wallet-stats">
      <div><b class="${pColor}">${TO.data.settings.enforce ? `${wl.phoneLeft} min` : 'Off'}</b><span>Phone time left</span></div>
      <div><b class="${wl.atRisk ? 'yellow' : ''}">${wl.atRisk} min</b><span>Committed to active challenges</span></div>
      <div><b class="${tColor}">${wl.tomorrowLimit} min</b><span>Tomorrow's limit</span></div>
    </div>`;
  }

  function statusStrip(wl) {
    const parts = [ui.tierBadge(wl.tier.id)];
    parts.push(`<span class="sp ${wl.streak ? 'yellow' : 'faint'}">${icon('flame', 14)}${wl.streak ? `${wl.streak}-day streak` : 'No streak yet'}</span>`);
    if (wl.multiplier > 1) parts.push(`<span class="sp green">${icon('trend', 14)}${TO.state.fmtMult(wl.multiplier)} wins</span>`);
    if (wl.boostsLeft > 0) parts.push(`<span class="sp blue">${icon('bolt', 14)}${wl.boostsLeft} boost${wl.boostsLeft === 1 ? '' : 's'}</span>`);
    return `<button class="status-strip" data-act="settings" data-section="status">${parts.join('')}<span style="margin-left:auto" class="faint">${icon('chevR', 16)}</span></button>`;
  }

  function miniChallenge(challenge) {
    const title = challenge.kind === 'todo' ? `To-do Combo Goal (${challenge.picks.length})` : challenge.picks.length > 1 ? `${challenge.picks.length}-pick Combo Goal` : challenge.picks[0].label;
    let line = '';
    const pick = challenge.picks.find((l) => l.result === 'pending') || challenge.picks[0];
    if (challenge.kind === 'todo') line = `${challenge.picks.filter((l) => l.result === 'won').length}/${challenge.picks.length} done · due midnight`;
    else if (pick.kind === 'pred') line = `Resolves in ${TO.fmtIn(pick.start - TO.now())}`;
    else if (pick.kind === 'race') {
      const race = TO.races.get(pick.raceId);
      line = race && race.status === 'running' ? `<span class="live">LIVE</span> Virtual Race #${race.number}` : `Virtual Race #${String(pick.raceId).replace('race-', '')} · ${race && race.status === 'final' ? 'Finished' : 'Starting soon'}`;
    }
    else {
      const g = S.game(pick.gameId);
      if (!g) line = 'Loading the latest score…';
      else if (g.state === 'live') line = `<span class="live">LIVE</span> ${g.away.abbr} ${g.awayScore} – ${g.home.abbr} ${g.homeScore} · ${esc(g.clock)}`;
      else if (g.state === 'scheduled') line = `${g.away.abbr} @ ${g.home.abbr} · ${TO.fmtTime(g.start)}`;
      else line = `${g.away.abbr} ${g.awayScore} – ${g.home.abbr} ${g.homeScore} · ${esc(g.statusText)}`;
    }
    const bottom = `<div class="row-s small bold"><span class="muted">${challenge.pledgeMinutes} min</span>${icon('chevR', 12)}<span class="green">${Math.round(challenge.pledgeMinutes * challenge.decimal) - challenge.pledgeMinutes > 0 ? `win ${Math.round((Math.round(challenge.pledgeMinutes * challenge.decimal) - challenge.pledgeMinutes) * (challenge.multiplier || 1))} min` : ''}</span></div>`;
    return `<button class="card tight mini-challenge" data-act="tab" data-tab="challenges">
      <div class="row-layout"><span class="t ellipsis">${esc(title)}</span><span class="display muted" style="font-size:15px">${TO.multiplierText(TO.pointValue.fromDecimal(challenge.decimal))}</span></div>
      <div class="small muted row-s ellipsis" style="font-weight:600">${line}</div>
      <div style="margin-top:auto">${bottom}</div>
    </button>`;
  }

  function openChallengesStrip() {
    const open = TO.data.challenges.filter((b) => b.status === 'open' && sportsOnly(b)).sort((a, b) => b.placedAt - a.placedAt);
    return `<div class="stack-s open-challenges">
      <div class="section-title"><div class="row-s"><h2>Active challenges</h2><span class="count-pill ${open.length ? '' : 'off'}">${open.length}</span></div>${open.length ? `<button class="link-btn" data-act="tab" data-tab="challenges">See all</button>` : ''}</div>
      ${open.length
        ? `<div class="hscroll mini-challenges" data-hkey="minichallenges">${open.map(miniChallenge).join('')}</div>`
        : `<div class="card tight small muted" style="margin:0 16px">No active challenges. Choose a matchup target below to begin.</div>`}
    </div>`;
  }

  // ---------- Filters ----------
  function filterBar(games) {
    const f = activeFilter();
    const on = liveOnly();
    // With Live on, each sport's number is how many games it has live right now.
    const today = boardGames(0, true);
    const liveNow = today.filter((g) => g.state === 'live' && (f === 'all' || g.league === f)).length;
    const chip = (key, label, n, ic) => `<button class="chip ${f === key ? 'on' : ''}" data-act="filter" data-f="${key}">${ic ? icon(ic, 14) : ''}${esc(label)}${n ? `<span class="n">${n}</span>` : ''}</button>`;
    const chips = [chip('all', 'All', 0, 'grid')];
    for (const l of S.LEAGUE_ORDER) {
      if (l === 'sim' || !followed().includes(l)) continue;
      const n = on ? today.filter((g) => g.league === l && g.state === 'live').length : games.filter((g) => g.league === l && g.state !== 'final').length;
      chips.push(chip(l, l === 'ncaaf' ? 'College Football' : S.LEAGUES[l].short === 'SIM' ? 'Sim League' : S.LEAGUES[l].short, n));
    }
    chips.push(`<button class="chip dashed" data-act="settings" data-section="sports">${icon('sliders', 14)}Edit</button>`);
    const cfb = (f === 'ncaaf' || f === 'all') && !TO.live.offline ? `<label class="cfb-select-label" for="cfb-group">College Football</label><select id="cfb-group" class="cfb-select" aria-label="College football conference">${TO.live.groups.map(([id, name]) => `<option value="${id}" ${TO.live.selectedGroup() === id ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select>` : '';
    const liveTile = `<button class="live-tile ${on ? 'on' : ''}" data-act="feed-live" aria-pressed="${on}" aria-label="Live games only, ${liveNow} live now in ${esc(filterName())}"><i></i>Live${liveNow ? `<span class="n">${liveNow}</span>` : ''}</button>`;
    return `<div class="filterbar"><div class="hscroll" data-hkey="filters">${chips.join('')}</div>${dayBar(liveTile)}${cfb}</div>`;
  }

  // ---------- Game card ----------
  function scoreCls(g, side) {
    const key = `${g.id}-${side}`;
    const val = side === 'home' ? g.homeScore : g.awayScore;
    const changed = prevScores[key] !== undefined && prevScores[key] !== val;
    prevScores[key] = val;
    return changed ? 'bump' : '';
  }

  function gameCard(g) {
    const o = S.pointValue(g.id);
    const bettable = (g.state === 'live' || g.state === 'scheduled') && !o.suspended;
    const mine = myOpenChallengeOn(g.id);
    let body;
    if (bettable) {
      const tabs = [['winner','Match Winner',o.winner],['margin','Margin',o.margin],['total','Total Points',o.total]].filter(([, , choices]) => choices.length >= 2);
      const chosen = activeChallenge.get(g.id) || tabs[0]?.[0];
      const current = tabs.find(([key]) => key === chosen) || tabs[0];
      const choices = current ? current[2].filter((sel) => sel.side !== 'draw').slice(0, 2) : [];
      const choiceLabel = (sel) => {
        if (sel.market === 'winner') return `${sel.side === 'away' ? g.away.name : g.home.name} to win`;
        if (sel.market === 'margin') {
          const team = sel.side === 'away' ? g.away.name : g.home.name;
          return sel.line < 0 ? `${team} to win by ${Math.ceil(Math.abs(sel.line))}+` : `${team} to stay within ${Math.floor(sel.line)}`;
        }
        return `Combined score ${sel.side === 'higher' ? 'above' : 'below'} ${sel.line}`;
      };
      const statusLine = g.state === 'live' ? `<span class="live">LIVE</span> · ${g.awayScore}–${g.homeScore} · ${esc(g.clock)}` : `${esc(TO.fmtDay(g.start))} · ${esc(TO.fmtTime(g.start))}`;
      body = `<div class="matchup-head">
        <button class="matchup-team" data-act="open-game" data-id="${g.id}">${ui.teamBadge(g.away, 30)}<span>${esc(g.away.name)}</span>${g.state === 'live' ? `<b>${g.awayScore}</b>` : ''}</button>
        <span class="matchup-at">@</span>
        <button class="matchup-team" data-act="open-game" data-id="${g.id}">${ui.teamBadge(g.home, 30)}<span>${esc(g.home.name)}</span>${g.state === 'live' ? `<b>${g.homeScore}</b>` : ''}</button>
      </div><div class="matchup-time">${statusLine}</div>
      <div class="challenge-tabs" role="tablist" aria-label="Challenge type">${tabs.map(([key,label]) => `<button role="tab" aria-selected="${current?.[0] === key}" class="${current?.[0] === key ? 'on' : ''}" data-act="challenge-tab" data-game="${esc(g.id)}" data-market="${key}">${label}</button>`).join('')}</div>
