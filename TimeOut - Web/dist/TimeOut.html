<script>
/* TimeOut web demo — ESPN live scores and challenge app lines. */
(function (TO) {
  'use strict';

  const S = TO.sim;
  const ESPN = 'https://site.api.espn.com/apis/site/v2/sports';
  const ESPN_CORE = 'https://sports.core.api.espn.com/v2/sports';
  const CFB_GROUPS = [
    ['all', 'All College Football'], ['80', 'Top 25'], ['8', 'SEC'], ['4', 'Big 12'], ['1', 'ACC'], ['5', 'Big Ten'],
    ['9', 'Pac-12'], ['151', 'American'], ['17', 'Mountain West'], ['37', 'Sun Belt'],
    ['15', 'MAC'], ['12', 'Conference USA'], ['18', 'Independents'],
  ];
  const LEAGUES = {
    nfl: ['football/nfl', 'football', 'nfl'], ncaaf: ['football/college-football', 'football', 'college-football'],
    nba: ['basketball/nba', 'basketball', 'nba'], mlb: ['baseball/mlb', 'baseball', 'mlb'],
    nhl: ['hockey/nhl', 'hockey', 'nhl'], epl: ['soccer/eng.1', 'soccer', 'eng.1'],
  };
  const cache = new Map();
  const pointValueCache = new Map();
  let updatedAt = 0;
  let updatedDayKey = '';
  let loading = false;
  let loadingDayKey = '';
  let refreshQueued = false;
  let loadError = false;
  let unreachable = false; // ESPN couldn't be reached at all (no network, or a page that can't call other sites)
  let cfbGroup = 'all';

  function todayBounds(now) {
    const d = new Date(now);
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    return [start, new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime()];
  }

  function localDayKey(now) {
    const d = new Date(now);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function espnDayKey(now) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit',
    }).formatToParts(new Date(now));
    const part = (type) => parts.find((item) => item.type === type)?.value;
    return `${part('year')}${part('month')}${part('day')}`;
  }

  function shiftDayKey(key, days) {
    const year = Number(key.slice(0, 4)), month = Number(key.slice(4, 6)), day = Number(key.slice(6, 8));
    const d = new Date(Date.UTC(year, month - 1, day + days));
    return `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, '0')}${String(d.getUTCDate()).padStart(2, '0')}`;
  }

  // ESPN indexes schedules by Eastern calendar day; local days can overlap two or three of them.
  function scoreboardDays(now) {
    const [start, end] = todayBounds(now);
    const first = espnDayKey(start), last = espnDayKey(end - 1);
    return [...new Set([shiftDayKey(first, -1), first, last])];
  }

  function gameFrom(event, league, sport) {
    const comp = event.competitions?.[0];
    const home = comp?.competitors?.find((c) => c.homeAway === 'home');
    const away = comp?.competitors?.find((c) => c.homeAway === 'away');
    if (!comp || !home?.team || !away?.team) return null;
    const start = Date.parse(event.date || comp.date || '');
    if (!Number.isFinite(start)) return null;
    const status = comp.status?.type || event.status?.type || {};
    const state = /POSTPONED/.test(status.name || '') ? 'postponed'
      : /CANCELED|CANCELLED|ABANDONED|FORFEIT/.test(status.name || '') ? 'canceled'
        : status.state === 'in' ? 'live' : status.state === 'post' ? 'final' : 'scheduled';
    const team = (c) => ({
      id: c.team.id, abbr: c.team.abbreviation || c.team.shortDisplayName || c.team.displayName,
      name: c.team.shortDisplayName || c.team.displayName || c.team.name,
      fullName: c.team.displayName || c.team.name, city: '', color: `#${c.team.color || '5A6475'}`,
      logo: c.team.logo || c.team.logos?.[0]?.href || null,
      rank: c.curatedRank?.current && c.curatedRank.current <= 25 ? c.curatedRank.current : null,
      record: c.records?.find((record) => record.type === 'total')?.summary || c.records?.[0]?.summary || null,
    });
    return {
      id: `espn-${league}-${event.id}`, eventID: event.id, league, sport, start,
      competitionID: comp.id || event.id,
      end: start + 4 * TO.HOUR, state, home: team(home), away: team(away),
      homeScore: Number(home.score || 0), awayScore: Number(away.score || 0),
      progress: state === 'live' ? 0.5 : state === 'final' ? 1 : 0,
      period: comp.status?.period || 0, clock: status.shortDetail || comp.status?.displayClock || '',
      statusText: status.shortDetail || status.detail || status.description || 'Scheduled',
      conferenceName: comp.groups?.shortName || comp.groups?.name || '',
      simulated: false, _competition: comp,
    };
  }

  function american(value) {
    const n = Number(value);
    return Number.isFinite(n) && n !== 0 ? Math.round(n) : null;
  }

  function hasPrice(value) { return american(value) != null; }

  function marketPrice(teamPointValue, market) {
    const value = (entry) => entry?.american ?? entry?.alternateDisplayValue
      ?? (typeof entry === 'number' || typeof entry === 'string' ? entry : null);
    return value(teamPointValue?.[market]) ?? value(teamPointValue?.current?.[market]);
  }

  function winnerPrice(book, side) {
    if (side === 'draw') {
      return marketPrice(book?.drawOdds, 'moneyLine')
        ?? book?.drawOdds?.moneyLine
        ?? book?.moneyline?.draw?.current?.odds
        ?? book?.moneyline?.draw?.close?.odds
        ?? book?.moneyline?.draw?.open?.odds;
    }
    const teamPointValue = side === 'home' ? book?.homeTeamOdds : book?.awayTeamOdds;
    return marketPrice(teamPointValue, 'moneyLine')
      ?? teamPointValue?.moneyline
      ?? book?.moneyline?.[side]?.current?.odds
      ?? book?.moneyline?.[side]?.close?.odds
      ?? book?.moneyline?.[side]?.open?.odds;
  }

  function marginPrice(book, side) {
    const teamPointValue = side === 'home' ? book?.homeTeamOdds : book?.awayTeamOdds;
    const market = book?.pointSpread?.[side];
    return marketPrice(teamPointValue, 'spread')
      ?? teamPointValue?.spreadOdds
      ?? market?.current?.odds
      ?? market?.close?.odds
      ?? market?.open?.odds
      ?? (side === 'home' ? book?.homeSpreadOdds : book?.awaySpreadOdds);
  }

  function totalPrice(book, side) {
    const espnSide = side === 'higher' ? 'over' : side === 'lower' ? 'under' : side;
    const flat = espnSide === 'over' ? (book?.overOdds ?? book?.overUnderOdds) : (book?.underOdds ?? book?.underUnderOdds);
    const market = book?.total?.[espnSide] || book?.overUnder?.[espnSide];
    return flat ?? market?.current?.odds ?? market?.close?.odds ?? market?.open?.odds;
  }

  function totalLine(book) {
    const raw = Number(book?.overUnder ?? book?.total);
    return Number.isFinite(raw) && raw > 0 ? raw : null;
  }

  function isQuoteSource(book) {
    if (!book) return false;
    const name = String(book?.provider?.name || '').toLowerCase();
    if (/numberfire|predictor|win probability/.test(name)) return false;
    return true;
  }

  function marginFor(book, game, homePointValue, awayPointValue) {
    const homeMarketLine = homePointValue.current?.pointSpread?.alternateDisplayValue
      ?? homePointValue.current?.pointSpread?.american
      ?? homePointValue.pointSpread?.alternateDisplayValue
      ?? homePointValue.pointSpread?.american
      ?? book.pointSpread?.home?.current?.line
      ?? book.pointSpread?.home?.close?.line
      ?? book.pointSpread?.home?.open?.line;
    const awayMarketLine = awayPointValue.current?.pointSpread?.alternateDisplayValue
      ?? awayPointValue.current?.pointSpread?.american
      ?? awayPointValue.pointSpread?.alternateDisplayValue
      ?? awayPointValue.pointSpread?.american
      ?? book.pointSpread?.away?.current?.line
      ?? book.pointSpread?.away?.close?.line
      ?? book.pointSpread?.away?.open?.line;
    const direct = Number(homeMarketLine ?? homePointValue.spread ?? book.homeSpread);
    if (Number.isFinite(direct) && direct !== 0) return direct;
    const awayLine = Number(awayMarketLine);
    if (Number.isFinite(awayLine) && awayLine !== 0) return -awayLine;
    // ESPN's MLB `details` is the outright winner favorite and price, not a run margin.
    if (game.sport === 'baseball') return null;
    const detail = String(book.details || '');
    const match = detail.match(/([+-]\s*\d+(?:\.\d+)?)/);
    const value = match ? Number(match[1].replace(/\s/g, '')) : Number(book.spread);
    if (!Number.isFinite(value) || value === 0 || Math.abs(value) > 50) return null;
    if (homePointValue.favorite === true) return -Math.abs(value);
    if (awayPointValue.favorite === true) return Math.abs(value);
    const namedHome = [game.home.abbr, game.home.name, game.home.fullName].filter(Boolean).some((name) => detail.toLowerCase().includes(name.toLowerCase()));
    const namedAway = [game.away.abbr, game.away.name, game.away.fullName].filter(Boolean).some((name) => detail.toLowerCase().includes(name.toLowerCase()));
    if (namedHome) return value;
    if (namedAway) return -value;
    const signedHomeMargin = Number(book.spread);
    return Number.isFinite(signedHomeMargin) && signedHomeMargin !== 0 ? signedHomeMargin : null;
  }

  function makePointValue(game, now = TO.now()) {
    const comp = game._competition || {};
    const candidates = game._pointValueBooks?.length
      ? [...game._pointValueBooks, ...(game.state === 'live' ? [] : (comp.odds || []))]
      : [game._pointValueBook || comp.odds?.[0]].filter(Boolean);
    const books = candidates.filter(isQuoteSource);
    const liveBooks = books.filter((book) => /live odds/i.test(book.provider?.name || ''));
    const marketBooks = game.state === 'live' && liveBooks.length ? liveBooks : books;
    const add = (market, side, n, price, title) => {
      const parsedPrice = american(price);
      return parsedPrice == null ? null : {
        id: `${game.id}|${market}|${side}`, kind: 'game', gameId: game.id, market, side,
        line: n, price: parsedPrice, source: title || '',
      };
    };
    const winner = ['away', 'home', 'draw'].map((side) => {
      const source = marketBooks.find((book) => hasPrice(winnerPrice(book, side)));
      const team = side === 'home' ? source?.homeTeamOdds?.team : source?.awayTeamOdds?.team;
      return source ? add('winner', side, null, winnerPrice(source, side), side === 'draw' ? 'Draw' : team?.displayName) : null;
    }).filter(Boolean);
    const margins = marketBooks.map((book) => ({ book, line: marginFor(book, game, book.homeTeamOdds || {}, book.awayTeamOdds || {}) }))
      .filter((entry) => entry.line != null && (hasPrice(marginPrice(entry.book, 'home')) || hasPrice(marginPrice(entry.book, 'away'))));
    const marginSource = margins.find((entry) => hasPrice(marginPrice(entry.book, 'home')) && hasPrice(marginPrice(entry.book, 'away'))) || margins[0];
    const marginLine = marginSource?.line;
    const priceAtLine = (side) => {
      const entry = margins.find((candidate) => candidate.line === marginLine && hasPrice(marginPrice(candidate.book, side)));
      return entry ? marginPrice(entry.book, side) : null;
    };
    const margin = marginLine != null ? [
      add('margin', 'away', -marginLine, priceAtLine('away'), 'Away'),
      add('margin', 'home', marginLine, priceAtLine('home'), 'Home'),
    ].filter(Boolean) : [];
    const totals = marketBooks.map((book) => ({ book, line: totalLine(book) }))
      .filter((entry) => entry.line != null && (hasPrice(totalPrice(entry.book, 'higher')) || hasPrice(totalPrice(entry.book, 'lower'))));
    const totalSource = totals.find((entry) => hasPrice(totalPrice(entry.book, 'higher')) && hasPrice(totalPrice(entry.book, 'lower'))) || totals[0];
    const selectedTotalLine = totalSource?.line;
    const totalAtLine = (side) => {
      const entry = totals.find((candidate) => candidate.line === selectedTotalLine && hasPrice(totalPrice(candidate.book, side)));
      return entry ? totalPrice(entry.book, side) : null;
    };
    const total = selectedTotalLine != null ? [
      add('total', 'higher', selectedTotalLine, totalAtLine('higher'), 'Higher'),
      add('total', 'lower', selectedTotalLine, totalAtLine('lower'), 'Lower'),
    ].filter(Boolean) : [];
    const suspended = !['scheduled', 'live'].includes(game.state) || (books.length > 0 && books.every((book) => book.isClosed === true));
    return { winner, margin, total, suspended, all: [...winner, ...margin, ...total], move: {}, updatedAt };
  }

  function selectedGroup() { return cfbGroup; }
  async function fetchLeague(league, group = '80', now = TO.now(), dates = scoreboardDays(now)) {
    const [path] = LEAGUES[league];
    const results = await Promise.allSettled(dates.map(async (date) => {
      const params = new URLSearchParams({ dates: date });
      if (league === 'ncaaf') {
        if (group !== 'all') params.set('groups', group);
        params.set('limit', '100');
      }
      const response = await fetch(`${ESPN}/${path}/scoreboard?${params}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`ESPN returned ${response.status}`);
      return response.json();
    }));
    const payloads = results.filter((result) => result.status === 'fulfilled').map((result) => result.value);
    if (!payloads.length) throw new Error(`All ESPN scoreboard requests failed for ${league}.`);
    const events = new Map();
    payloads.forEach((payload) => (payload.events || []).forEach((event) => events.set(event.id, event)));
    return [...events.values()].map((event) => gameFrom(event, league, LEAGUES[league][1])).filter(Boolean);
  }

  // Keep old unresolved tickets gradeable after their games fall out of the current scoreboard cache.
  async function loadOldChallengeGames(now) {
    const wantedByGroup = new Map();
    for (const challenge of TO.data?.challenges || []) {
      if (challenge.status !== 'open') continue;
      for (const pick of challenge.picks || []) {
        if (pick.result !== 'pending' || !pick.gameId || !LEAGUES[pick.league] || byId(pick.gameId)) continue;
        // A challenge can be on tomorrow's game, so look on the game's own day when it's known.
        // Picks loaded from the server don't carry a start time, so check the next day for those too.
        const placedDay = TO.dayKey(challenge.placedAt);
        for (const day of pick.start ? [TO.dayKey(pick.start)] : [placedDay, TO.addDays(placedDay, 1)]) {
          const key = `${pick.league}|${day}`;
          if (!wantedByGroup.has(key)) wantedByGroup.set(key, { league: pick.league, day, ids: new Set() });
          wantedByGroup.get(key).ids.add(String(pick.gameId));
        }
      }
    }
    const jobs = [...wantedByGroup.values()];
    let loaded = false;
    const results = await Promise.allSettled(jobs.map(({ league, day, ids }) =>
      fetchLeague(league, cfbGroup, TO.dayStart(day) + 12 * TO.HOUR).then((games) => games.filter((game) =>
        ids.has(String(game.id)) || ids.has(String(game.eventID)) || [...ids].some((id) => id.endsWith(`-${game.eventID}`))))));
    results.forEach((result) => {
      if (result.status !== 'fulfilled') return;
      for (const game of result.value) {
        game.pointValue = { winner: [], margin: [], total: [], all: [], suspended: true };
        const games = cache.get(game.league) || [];
        if (!games.some((item) => item.id === game.id)) {
          cache.set(game.league, [...games, game]);
          loaded = true;
        }
      }
    });
    return loaded;
  }

  async function resolvePointValueItem(item) {
    if (!item?.$ref) return item;
    const response = await fetch(item.$ref.replace(/^http:/, 'https:'), { cache: 'no-store' });
    if (!response.ok) throw new Error(`ESPN point value returned ${response.status}`);
    return response.json();
  }

  async function fetchEventPointValue(game, now) {
    const cached = pointValueCache.get(game.id);
    if (cached && now - cached.at < 25000) return cached.books || (cached.book ? [cached.book] : []);
    const [,, coreLeague] = LEAGUES[game.league];
    const endpoint = `${ESPN_CORE}/${game.sport}/leagues/${coreLeague}/events/${game.eventID}/competitions/${game.competitionID}/odds?limit=10`;
    try {
      const response = await fetch(endpoint, { cache: 'no-store' });
      if (!response.ok) throw new Error(`ESPN point value returned ${response.status}`);
      const payload = await response.json();
      const items = payload.items || (payload.provider || payload.homeTeamOdds ? [payload] : []);
      const refs = items.filter((item) => isQuoteSource(item)).slice(0, 8);
      const books = await Promise.allSettled(refs.map(resolvePointValueItem));
      const availableBooks = books.filter((result) => result.status === 'fulfilled').map((result) => result.value)
        .filter((book) => isQuoteSource(book) && (book.overUnder != null || book.spread != null || book.homeTeamOdds?.spread != null
          || hasPrice(winnerPrice(book, 'home')) || hasPrice(winnerPrice(book, 'away')) || hasPrice(winnerPrice(book, 'draw')))
          && (hasPrice(book.overOdds ?? book.overUnderOdds) || hasPrice(book.underOdds ?? book.underUnderOdds)
            || hasPrice(book.homeTeamOdds?.spreadOdds) || hasPrice(book.awayTeamOdds?.spreadOdds)
            || hasPrice(winnerPrice(book, 'home')) || hasPrice(winnerPrice(book, 'away')) || hasPrice(winnerPrice(book, 'draw'))));
      const preferred = game.state === 'live'
        ? availableBooks.sort((a, b) => Number(/live odds/i.test(b.provider?.name || '')) - Number(/live odds/i.test(a.provider?.name || '')))
        : availableBooks.sort((a, b) => Number(/live odds/i.test(a.provider?.name || '')) - Number(/live odds/i.test(b.provider?.name || '')));
      pointValueCache.set(game.id, { at: now, books: preferred });
      return preferred;
    } catch (error) {
      console.warn('ESPN point value unavailable:', error);
      pointValueCache.set(game.id, { at: now, books: [] });
      return [];
    }
  }

  async function loadPointValue(games, now) {
    let cursor = 0;
    const worker = async () => {
      while (cursor < games.length) {
        const game = games[cursor++];
        const scoreboardBook = game._competition.odds?.[0];
        const hasScoreboardLines = game.state !== 'live' && isQuoteSource(scoreboardBook)
          && hasPrice(scoreboardBook.homeTeamOdds?.spreadOdds)
          && hasPrice(scoreboardBook.awayTeamOdds?.spreadOdds)
          && hasPrice(scoreboardBook.overOdds) && hasPrice(scoreboardBook.underOdds)
          && hasPrice(winnerPrice(scoreboardBook, 'home'))
          && hasPrice(winnerPrice(scoreboardBook, 'away'));
        if (!hasScoreboardLines) game._pointValueBooks = await fetchEventPointValue(game, now);
        game.pointValue = makePointValue(game, now);
      }
    };
    await Promise.all(Array.from({ length: Math.min(6, games.length) }, worker));
    TO.emit('live:updated');
  }

  async function loadDetails(id) {
    const game = byId(id);
    if (!game || game._detailLoaded || game._detailLoading) return game?._details || null;
    game._detailLoading = true;
    try {
      const [path] = LEAGUES[game.league];
      const response = await fetch(`${ESPN}/${path}/summary?event=${encodeURIComponent(game.eventID)}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`ESPN summary returned ${response.status}`);
      game._details = await response.json();
      game._detailLoaded = true;
      return game._details;
    } catch (error) {
      console.warn('ESPN game details unavailable:', error);
      return null;
    } finally {
      game._detailLoading = false;
      TO.emit('live:details-updated', game.id);
    }
  }

  function realStats(game) {
    const boxscore = game?._details?.boxscore;
    const teams = boxscore?.teams || [];
    const home = teams.find((item) => String(item.team?.id) === String(game.home.id));
    const away = teams.find((item) => String(item.team?.id) === String(game.away.id));
    if (!home || !away) return [];
    const indexStats = (team) => new Map((team.statistics || []).map((stat) => [stat.name || stat.label, stat]));
    const awayStats = indexStats(away), homeStats = indexStats(home);
    return [...awayStats.keys()].flatMap((key) => {
      const a = awayStats.get(key), h = homeStats.get(key);
      if (!h) return [];
      const label = a.label || a.displayName || a.name || key;
      const av = a.displayValue ?? a.value;
      const hv = h.displayValue ?? h.value;
      if (av == null || hv == null) return [];
      return [{ label, awayValue: String(av), homeValue: String(hv) }];
    });
  }

  async function refresh(now = TO.now(), force = false) {
    const requestedDay = localDayKey(now);
    if (loading) {
      if (force || requestedDay !== loadingDayKey) refreshQueued = true;
      return;
    }
    if (!force && requestedDay === updatedDayKey && now - updatedAt < 25000) return;
    loading = true;
    loadingDayKey = requestedDay;
    loadError = false;
    TO.emit('live:updated');
    const selectedLeagues = TO.data?.settings?.sports?.filter((key) => LEAGUES[key]) || [];
    const leagues = selectedLeagues.length ? selectedLeagues : Object.keys(LEAGUES);
    const results = await Promise.allSettled(leagues.map((league) => fetchLeague(league, cfbGroup, now)));
    const completedAt = TO.now();
    if (localDayKey(completedAt) !== requestedDay) {
      loading = false;
      loadingDayKey = '';
      updatedAt = 0;
      updatedDayKey = '';
      refreshQueued = false;
      return refresh(completedAt);
    }
    const [dayStart, dayEnd] = todayBounds(completedAt);
    let failed = false;
    results.forEach((result, index) => {
      if (result.status !== 'fulfilled') { failed = true; return; }
      const league = leagues[index];
      const relevantGames = result.value.filter((game) => (game.start >= dayStart && game.start < dayEnd)
        || game.state === 'live' || (game.state === 'final' && game.start >= dayStart - TO.DAY));
      const fetched = league === 'ncaaf' && cfbGroup === '80'
        ? relevantGames.filter((game) => game.home.rank || game.away.rank)
        : relevantGames;
      const previousGames = cache.get(league) || [];
      const fetchedIds = new Set(fetched.map((game) => game.id));
      const keepCurrentGames = previousGames.filter((game) => game.start >= dayStart && game.start < dayEnd
        && ['scheduled', 'live'].includes(game.state) && !fetchedIds.has(game.id));
      const keepRecentFinals = previousGames.filter((game) => game.state === 'final' && game.start >= dayStart - TO.DAY);
      const gamesById = new Map(keepRecentFinals.map((game) => [game.id, game]));
      keepCurrentGames.forEach((game) => gamesById.set(game.id, game));
      fetched.forEach((game) => gamesById.set(game.id, game));
      const games = [...gamesById.values()];
      games.forEach((game) => { game.pointValue = makePointValue(game, now); });
      cache.set(league, games);
    });
    loadError = failed && !results.some((r) => r.status === 'fulfilled');
    unreachable = loadError;
    updatedAt = completedAt;
    updatedDayKey = requestedDay;
    loading = false;
    loadingDayKey = '';
    TO.emit('live:updated');
    loadOldChallengeGames(completedAt).then((loaded) => {
      if (loaded) TO.emit('live:updated');
    }).catch((error) => console.warn('Could not load scores for an old open challenge:', error));
    const todaysGames = [...cache.values()].flat().filter((game) => game.start >= dayStart - TO.DAY);
    loadPointValue(todaysGames, completedAt);
    if (refreshQueued) {
      refreshQueued = false;
      updatedAt = 0;
      refresh();
    }
  }

  // ---------- Tomorrow's games (Home's Today / Tomorrow picker) ----------
  // Fetched in the background and refreshed every 10 minutes. Raise UPCOMING_DAYS to offer more days ahead
  // (ESPN's scoreboard takes one day per request). challenge targets for a future day load when someone opens that day.
  const UPCOMING_DAYS = 1;
  const UPCOMING_TTL = 10 * TO.MIN;
  const upcoming = new Map(); // league -> scheduled games after today, up to UPCOMING_DAYS ahead
  let upcomingAt = 0;
  let upcomingDayKey = '';
  let upcomingLoading = false;

  /** 0 = today, 1 = tomorrow, ... in the viewer's own time zone. */
  function dayOffset(start, now) {
    const [today] = todayBounds(now);
    const d = new Date(start);
    return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() - today) / TO.DAY);
  }

  const followedLeagues = () => TO.data?.settings?.sports?.filter((key) => LEAGUES[key]) || Object.keys(LEAGUES);

  async function refreshUpcoming(now = TO.now()) {
    const leagues = followedLeagues();
    const fresh = localDayKey(now) === upcomingDayKey && now - upcomingAt < UPCOMING_TTL && leagues.every((l) => upcoming.has(l));
    if (upcomingLoading || fresh) return;
    upcomingLoading = true;
    const [, todayEnd] = todayBounds(now);
    const weekEnd = todayEnd + UPCOMING_DAYS * TO.DAY;
    const first = espnDayKey(todayEnd);
    const days = Array.from({ length: UPCOMING_DAYS + 1 }, (_, i) => shiftDayKey(first, i));
    const results = await Promise.allSettled(leagues.map((league) => fetchLeague(league, cfbGroup, now, days)));
    results.forEach((result, index) => {
      const league = leagues[index];
      // A failed league keeps what it had (or nothing) until the next scheduled refresh, so a dead network
      // can't turn into a tight retry loop.
      if (result.status !== 'fulfilled') { if (!upcoming.has(league)) upcoming.set(league, []); return; }
      let games = result.value.filter((game) => game.start >= todayEnd && game.start < weekEnd && game.state !== 'final');
      if (league === 'ncaaf' && cfbGroup === '80') games = games.filter((game) => game.home.rank || game.away.rank);
      const before = new Map((upcoming.get(league) || []).map((game) => [game.id, game]));
      games.forEach((game) => {
        const old = before.get(game.id);
        if (old) { game._pointValueBooks = old._pointValueBooks; game._pointValueRequested = old._pointValueRequested; }
        game.pointValue = makePointValue(game, now);
      });
      upcoming.set(league, games);
    });
    upcomingAt = TO.now();
    upcomingDayKey = localDayKey(now);
    upcomingLoading = false;
    if (results.some((r) => r.status === 'fulfilled')) TO.emit('live:updated');
  }

  function byId(id) {
    for (const games of [...cache.values(), ...upcoming.values()]) {
      const game = games.find((item) => item.id === id || item.eventID === id);
      if (game) return game;
    }
    return null;
  }

  // Keep the existing selection, commitment and resolution code, but supply ESPN game data and prices.
  const simGame = S.game, simBoard = S.board, simPointValue = S.pointValue, simCurrent = S.currentSelection, simGrade = S.grade;
  S.game = (id, now) => byId(id) || simGame(id, now);
  /** options.day: 0 = today (live and today's games), 1 = tomorrow (up to UPCOMING_DAYS).
   *  options.peek: just look (for counts), don't start loading challenge targets. */
  S.board = (now = TO.now(), options = {}) => {
    if (localDayKey(now) !== updatedDayKey || now - updatedAt > 25000) refresh(now);
    refreshUpcoming(now);
    // Without ESPN, fall back to the simulated games so the demo still works (today only).
    if (unreachable) return options.day ? [] : simBoard(now, options);
    const leagues = options.leagues || S.LEAGUE_ORDER;
    const day = options.day || 0;
    if (day > 0) {
      const games = leagues.flatMap((league) => upcoming.get(league) || [])
        .filter((game) => dayOffset(game.start, now) === day)
        .sort((a, b) => a.start - b.start);
      const needPointValue = options.peek ? [] : games.filter((game) => !game._pointValueRequested);
      if (needPointValue.length) { needPointValue.forEach((game) => { game._pointValueRequested = true; }); loadPointValue(needPointValue, now); }
      return games;
    }
    const [start, end] = todayBounds(now);
    return leagues.flatMap((league) => {
      const games = [...(cache.get(league) || [])];
      return games;
    }).filter((game) => {
      return (game.start >= start && game.start < end) || game.state === 'live';
    }).sort((a, b) => (a.state === 'live' ? 0 : 1) - (b.state === 'live' ? 0 : 1) || a.start - b.start);
  };
  S.pointValue = (id, now) => byId(id)?.pointValue || simPointValue(id, now);
  S.currentSelection = (id, now) => {
    const [ref] = id.split('|');
    const game = byId(ref);
    if (!game) return simCurrent(id, now);
    const selection = game.pointValue.all.find((item) => item.id === id);
    return { sel: selection || null, open: !!selection && !game.pointValue.suspended && game.state !== 'final' };
  };
  S.grade = (selection, now) => {
    const game = byId(selection.gameId);
    if (!game) return simGrade(selection, now);
    if (game.state === 'postponed' || game.state === 'canceled') return 'void';
    if (game.state !== 'final') return 'pending';
    return S.gradeScore(selection, game.homeScore, game.awayScore);
  };

  TO.live = {
    refresh, loadDetails, stats: realStats, selectedGroup, setGroup(group) {
      cfbGroup = CFB_GROUPS.some(([id]) => id === group) ? group : 'all';
      cache.delete('ncaaf'); updatedAt = 0; updatedDayKey = '';
      upcoming.delete('ncaaf'); upcomingAt = 0;
      if (loading) refreshQueued = true;
      else refresh();
    },
    groups: CFB_GROUPS, get loading() { return loading; }, get failed() { return loadError; }, get offline() { return unreachable; },
    days: UPCOMING_DAYS, get upcomingLoading() { return upcomingLoading || !upcomingAt; },
  };
})(window.TO);

  let lastLedgerSnapshot = '';

  function isOutOfPredictingMinutes(error) {
    return /insufficient|not enough|out of (challenging )?(minutes|balance)|challenging minutes/i.test(rawText(error));
  }
  function isTierSystemRpcUnavailable(error) {

  function notifyOutOfPredictingMinutes() {

    lastTierBonusMigrationAlertAt = Date.now();

  }
  function notifyTierPerkMigrationRequired() {

  }

    lastTierPerkMigrationAlertAt = Date.now();

  const config = window.TIMEOUT_SUPABASE || {};

  /** Turns Supabase and Postgres errors (like "duplicate key value violates unique constraint") into messages people understand. */
  function friendlyError(raw, errorCode, status) {

    const err = (c, message, field, fieldText) => new TO.AppError(c, message, { status, fields: field ? { [field]: fieldText || message } : {} });
    if (m.includes('profiles_username_key') || (m.includes('duplicate key') && m.includes('username'))) return err('taken', 'That username is taken. Try another.', 'username');
    if (m.includes('database error saving new user')) return err('taken', 'We couldn\u2019t create your account. That username may already be taken, so try another.', 'username', 'Try a different username.');
    if (code === 'user_already_exists' || code === 'email_exists' || m.includes('user already registered')) return err('taken', 'An account with this email already exists. Log in instead.', 'email', 'An account with this email already exists.');
    if (code === 'email_not_confirmed' || m.includes('email not confirmed')) return err('email_not_confirmed', 'Confirm your email first. Open the link we sent you, or send a new one.');
    if (code === 'invalid_credentials' || m.includes('invalid login credentials')) return err('bad_login', 'That email or password is incorrect.', 'password', 'Check your email and password, then try again.');
    if (m.includes('rate limit') || code.includes('rate_limit')) return err('rate_limit', 'Too many emails or tries in a short time. Wait a few minutes, then try again.');
    if (m.includes('unable to validate email') || m.includes('invalid format') || code === 'email_address_invalid') return err('invalid', 'Enter a valid email address.', 'email');
    if (code === 'weak_password' || m.includes('password should') || m.includes('password is')) return err('invalid', raw, 'password');
    if (m.includes('duplicate key')) return err('taken', 'That\u2019s already taken. Try something else.');
    if (m.includes('jwt')) return err('bad_token', 'Your session expired. Log in again.');

    if (code === 'p0001') {

      return new TO.AppError('supabase_error', known[m] || raw, { status, debug: raw, fields: {} });
