    try { await TO.api.answerFriendRequest(r.from, false); await TO.app.syncSocial(true); }
    catch (e) { undo(); ui.toast({ kind: 'loss', title: 'Couldn\'t decline that request', msg: TO.friendlyMessage(e) }); }
    rerender();
  };
  A['remove-friend'] = async (el) => {
    const u = el.dataset.u;
    if (!(await ui.confirm({ title: `Remove @${esc(u)}?`, body: 'You can add them again later.', confirm: 'Remove', danger: true }))) return;
    if (await perform(() => TO.api.removeFriend(u), () => St.removeFriend(u))) {
      ui.closeSheet('profile');
      TO.app.render();
    }
  };
  A['goto-social'] = () => { ui.closeAllSheets(); ui.closeAllPages(); TO.app.go('social'); };
  A.team = (el) => { teamSheet(el.dataset.id); St.refreshTeams(); };
  A['team-new'] = () => newTeamSheet();
  A['team-how'] = () => teamHow();
  A['team-pick'] = (el) => {
    const u = el.dataset.u;
    draft.members = draft.members.includes(u) ? draft.members.filter((x) => x !== u) : [...draft.members, u];
    el.classList.toggle('on');
  };
  A['team-create'] = () => {
    const nameEl = document.getElementById('team-name');
    const startEl = document.getElementById('team-start');
    const endEl = document.getElementById('team-end');
    if (!nameEl || !startEl || !endEl) return;
    draft.name = nameEl.value;
    draft.start = startEl.value;
    draft.end = endEl.value;
    try {
      const t = St.createTeam(draft);
      ui.closeSheet('team-new');
      const invited = t.members.length - 1;
      ui.toast({ kind: 'win', title: `${t.name} created`, msg: invited ? `${invited} friend${invited === 1 ? '' : 's'} invited.` : 'You can invite friends from the team.' });
      view.tab = 'teams';
      TO.app.render();
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      draft.errors = e.fields || {};
      ui.refreshSheet('team-new', ['body']);
    }
  };
  A['team-invite'] = (el) => { St.inviteToTeam(el.dataset.id, [el.dataset.u]); ui.toast({ kind: 'win', title: `Invited @${el.dataset.u}` }); ui.refreshSheet('team'); TO.app.render(); };
  A['copy-team'] = async (el) => {
    const t = TO.data.teams.find((x) => x.id === el.dataset.id);
    if (!t) return;
    St.ensureTeamKey(t);
    const link = teamLink(t, await myCode());
    const ok = await ui.copy(link);
    ui.toast({ kind: ok ? 'win' : 'info', title: ok ? 'Team link copied' : 'Team link', msg: ok ? link : `Copy this: ${link}`, ms: 5000 });
  };
  A['share-team'] = async (el) => {
    const t = TO.data.teams.find((x) => x.id === el.dataset.id);
    if (!t) return;
    St.ensureTeamKey(t);
    shareOrCopy(teamLink(t, await myCode()), `Join ${t.name} on TimeOut`, 'Team link copied');
  };
  A['invite-accept'] = () => acceptInvite();
  A['invite-dismiss'] = () => { clearInvite(); ui.closeSheet('invite'); };
  A['team-leave'] = async (el) => {
    if (!(await ui.confirm({ title: 'Leave this team?', body: 'Your results stop counting toward its standings.', confirm: 'Leave team', danger: true }))) return;
    St.leaveTeam(el.dataset.id);
    ui.closeSheet('team');
    TO.app.render();
  };

  function rerender() {
    TO.app.render();
    if (ui.sheetOpen('profile')) ui.refreshSheet('profile');
  }

  TO.inputs['social-search'] = (el) => {
    view.query = el.value;
    view.remote = [];
    const seq = ++view.searchSeq;
    const q = el.value.trim();
    view.searching = !!q && typeof TO.api.searchUsers === 'function';
    const paint = () => {
      if (seq !== view.searchSeq) return;
      const box = document.getElementById('search-results');
      if (box) box.innerHTML = searchResults();
    };
    paint();
    if (!q || !view.searching) {
      return;
    }
    TO.api.searchUsers(q).then((rows) => {
      if (seq !== view.searchSeq) return;
      view.searching = false;
      view.remote = (rows || []).map((r) => ({
        username: r.username,
        name: r.name || r.username,
        photo: r.photo || TO.initialsAvatar(r.username),
        remote: true,
      }));
      paint();
    }).catch(() => {
      if (seq !== view.searchSeq) return;
      view.searching = false;
      paint();
    });
  };
})(window.TO);

</script>
<script>
/* TimeOut web — the weekly report (menu > Weekly report). The server writes each report once a week; this only draws it. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const ui = TO.ui;

  /** Reports newest first, as the server returned them. `loaded` stays false until the first answer. */
  const weekly = (TO.weekly = { list: [], loaded: false, sel: 0 });

  const BADGE = { crushed: 'green', steady: 'blue', slipped: 'yellow', risky: 'red' };
  const unread = () => weekly.list.filter((r) => !r.read).length;
  weekly.unread = unread;

  const shouldLoad = () => !!(TO.account && TO.account.server && TO.api && TO.api.weeklyReports);

  /** Fetches the latest reports and updates the menu dots. Quiet when the server has none or can't be reached. */
  weekly.refresh = async () => {
    if (!shouldLoad()) return;
    const rows = await TO.api.weeklyReports();
    if (!rows || !TO.data) return;
    // A week opened a moment ago may not be marked read on the server yet, so keep what this device already knows.
    const seen = new Set(weekly.list.filter((r) => r.read).map((r) => r.week));
    weekly.list = rows.filter((r) => r && r.report && r.report.headline).map((r) => ({ week: String(r.weekStart), read: !!r.read || seen.has(String(r.weekStart)), report: r.report }));
    weekly.loaded = true;
    weekly.sel = Math.min(weekly.sel, Math.max(0, weekly.list.length - 1));
    if (TO.app && TO.app.renderChrome) TO.app.renderChrome();
    if (document.querySelector('[data-page="settings"] .weekly-page')) {
      ui.refreshPage('settings');
      weekly.markShown();
    }
  };

  /** Opening a report counts as reading it. */
  weekly.markShown = () => {
    const shown = weekly.list[weekly.sel];
    if (!shown || shown.read) return;
    shown.read = true;
    TO.api.markWeeklyReportRead(shown.week);
    if (TO.app && TO.app.renderChrome) TO.app.renderChrome();
  };

  const toneOf = (status) => (status === 'under' ? 'green' : status === 'over' ? 'red' : 'faint');

  function dayTable(days) {
    if (!days) return '';
    const rows = days.map((d) => `<div class="wr-day"><span>${esc(d.weekday)}</span><span class="num">${d.used === null ? '–' : `${Number(d.used)} min`}</span><span class="num faint">${Number(d.limit)} min</span><b class="${toneOf(d.status)}">${d.status === 'none' ? '–' : d.status === 'over' ? 'Over' : 'Under'}</b></div>`).join('');
    return `<div class="stack-s"><div class="eyebrow">Day by day</div><div class="wr-days">${rows}</div></div>`;
  }

  function reportCard(r) {
    const tiles = (r.tiles || []).map((t) => `<div class="wr-tile"><b class="num">${esc(t.value)}</b><span>${esc(t.label)}</span></div>`).join('');
    return `<div class="card stack weekly-report">
      <div class="row-layout"><span class="tag ${BADGE[r.weekType] || 'blue'}">${esc(r.label || '')}</span><span class="small faint">${esc(r.range || '')}</span></div>
      <h2 class="wr-headline">${esc(r.headline)}</h2>
      <p class="wr-text">${esc(r.summary)}</p>
      ${tiles ? `<div class="wr-tiles">${tiles}</div>` : ''}
      <div class="wr-note"><div class="eyebrow">Worth noticing</div><p>${esc(r.insight)}</p></div>
      <div class="wr-note alt"><div class="eyebrow">Try this next week</div><p>${esc(r.suggestion && r.suggestion.text)}</p></div>
      ${dayTable(r.days)}
      <div class="tiny faint">Written by an AI from your own numbers. TimeOut pledges phone minutes, never money.</div>
    </div>`;
  }

  /** The body of the Weekly report page. */
  weekly.render = () => {
    if (!shouldLoad()) {
      return `<div class="card stack-s"><h2 style="margin:0;font-size:17px">Weekly report</h2><div class="small muted">Weekly reports are written for accounts that are signed in and synced. Log in to see yours.</div></div>`;
    }
    if (!weekly.loaded) return `<div class="small muted">Loading your reports…</div>`;
    if (!weekly.list.length) {
      return `<div class="card stack-s"><div class="row-s">${icon('chart', 18)}<h2 style="margin:0;font-size:17px">No report yet</h2></div>
        <div class="small muted">Every Monday morning TimeOut looks back at your week and writes you a short review: your challenge record, your net minutes and, once your phone has synced screen time, how you did against your limits. Your first one shows up here after a week with some activity.</div></div>`;
    }
    const shown = weekly.list[Math.min(weekly.sel, weekly.list.length - 1)];
    const earlier = weekly.list.map((r, i) => ({ r, i })).filter((x) => x.i !== weekly.sel);
    return `${reportCard(shown.report)}
      ${earlier.length ? `<div class="eyebrow">Other weeks</div><div class="list">${earlier.map(({ r, i }) => `<button class="list-row" data-act="weekly-open" data-i="${i}"><span class="lr-main"><div class="lr-title">${esc(r.report.headline)}</div><div class="lr-sub">${esc(r.report.range || '')}</div></span>${r.read ? '' : '<span class="tag green">New</span>'}</button>`).join('')}</div>` : ''}`;
  };

  TO.actions['weekly-open'] = (el) => {
    weekly.sel = Math.max(0, Math.min(weekly.list.length - 1, Number(el.dataset.i) || 0));
    weekly.markShown();
    if (ui.pageOpen('settings')) ui.refreshPage('settings');
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — menu drawer and Screentime & Settings (Screen 7). */
(function (TO) {
  'use strict';

  const SECTION_GROUP = { status: 'screentime', races: 'sports', privacy: 'notifications' };
  const canonicalSection = (section) => SECTION_GROUP[section] || section;

  // ---------- Drawer ----------
  function openDrawer() {

      <button class="drawer-head" data-act="settings" data-section="account" title="Account" style="width:100%;text-align:left">${ui.avatar(TO.account.photo, 'lg')}<div class="grow" style="min-width:0"><b class="ellipsis" style="display:block;font-size:17px">@${esc(TO.account.username)}</b><div class="small muted ellipsis">${esc(TO.account.email)}</div><div style="margin-top:6px">${ui.tierBadge(wl.tier.id, true)}</div></div></button>
      <nav>
        ${item('screentime', `${wl.phoneLeft} min left`)}
        ${TO.weekly.unread() ? item('weekly', '<b class="tag green">New</b>') : item('weekly')}
        ${item('sports')}
        ${item('notifications')}
        ${item('account')}
        <button class="dn" data-act="how">${icon('help', 20)}App walkthrough</button>
        <a class="dn" href="support.html" target="_blank" rel="noopener">${icon('info', 20)}Help & support</a>
        <button class="dn" data-act="logout">${icon('logout', 20)}Log out</button>
      </nav></aside>`;
    ui.layer().appendChild(wrap);
  }
  function closeDrawer() { ui.layer().querySelectorAll('[data-drawer]').forEach((d) => d.remove()); }

  // ---------- Sections ----------
  const listRow = (ic, title, sub, right, attrs = '') => `<label class="list-row" ${attrs}><span class="lr-icon">${icon(ic, 17)}</span><span class="lr-main"><div class="lr-title">${title}</div>${sub ? `<div class="lr-sub">${sub}</div>` : ''}</span>${right}</label>`;
  const brow = (label, value, cls = '') => `<div class="row-layout small"><span class="muted">${label}</span><b class="num ${cls}">${value}</b></div>`;

  function screentime() {
    const wl = St.wallet();
    const s = TO.data.settings;
    const usedPct = Math.min(100, (wl.used / Math.max(wl.todayLimit, 1)) * 100);
    const overridesLeft = TO.RULES.maxOverrides - wl.overridesUsed;
    return `
      <div class="card stack-s">
        <h2 style="margin:0;font-size:17px">How your screen time works</h2>
        <div class="how-card"><span class="n">1</span><div><h3>${TO.RULES.daily} pledge minutes a day</h3><p>Your available minutes start at ${TO.RULES.daily}${wl.tier.bonus ? ` (plus ${wl.tier.bonus} from your ${esc(wl.tier.title)} tier)` : ''} and reset at midnight, your local time.</p></div></div>
        <div class="how-card"><span class="n">2</span><div><h3>Challenges affect tomorrow's phone time</h3><p>Successful challenges add minutes to tomorrow's allowance. Missed challenges subtract the committed minutes.</p></div></div>
        <div class="how-card"><span class="n">3</span><div><h3>The calculation</h3><p>Tomorrow's allowance = ${TO.RULES.daily} min + today's earned minutes − emergency unlock adjustments.</p></div></div>
      </div>

      <div class="card stack-s">
        <div class="row-layout"><h2 style="margin:0;font-size:17px">Today</h2><span class="tiny muted bold">Resets in ${ui.countdownEl(TO.nextMidnight())}</span></div>
        ${brow('Base limit', `${TO.RULES.daily} min`)}
        ${brow("Yesterday's challenges", TO.signedMin(wl.yesterdayNet), wl.yesterdayNet > 0 ? 'green' : wl.yesterdayNet < 0 ? 'red' : '')}
        ${wl.penaltyToday ? brow('Emergency unlock penalty', `−${wl.penaltyToday} min`, 'red') : ''}
        ${s.minLimit && TO.RULES.daily + wl.yesterdayNet - wl.penaltyToday < s.minLimit ? brow('Raised to your minimum', `${s.minLimit} min`) : ''}
        ${wl.emergencyToday ? brow('Emergency unlocks used', `+${wl.emergencyToday} min`, 'yellow') : ''}
        <hr class="divider">
        ${brow('Phone time allowed today', `${wl.todayLimit} min`)}
        <div class="bar" style="height:8px"><i style="width:${usedPct}%;background:${wl.appsLocked ? 'var(--loss)' : usedPct > 80 ? 'var(--warn)' : 'var(--accent)'}"></i></div>
        <div class="row-layout tiny bold"><span class="muted">${wl.used} min used on locked apps</span><span class="${wl.appsLocked ? 'red' : ''}">${s.enforce ? `${wl.phoneLeft} min left` : 'Limits are off'}</span></div>
      </div>

      <div class="card stack-s">
        <h2 style="margin:0;font-size:17px">Tomorrow, so far</h2>
        ${brow('Base limit', `${TO.RULES.daily} min`)}
        ${brow("Today's resolved challenges", TO.signedMin(wl.todayNet), wl.todayNet > 0 ? 'green' : wl.todayNet < 0 ? 'red' : '')}
        ${wl.penaltyTomorrow ? brow('Emergency unlock penalty', `−${wl.penaltyTomorrow} min`, 'red') : ''}
        <hr class="divider">
        ${brow("Tomorrow's phone time", `${wl.tomorrowLimit} min`, wl.tomorrowLimit > TO.RULES.daily ? 'green' : wl.tomorrowLimit < TO.RULES.daily ? 'red' : '')}
        ${wl.atRisk ? `<div class="tiny faint">${wl.atRisk} min in open challenges will change this when they resolve.</div>` : ''}
      </div>

      <div class="card stack-s" style="border-color:rgba(255,201,64,.35)">
        <div class="row"><span class="lr-icon" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)">${icon('unlock', 18)}</span><div class="grow"><h2 style="margin:0;font-size:17px">Emergency unlock</h2><div class="small muted">${overridesLeft} of ${TO.RULES.maxOverrides} left today</div></div></div>
        <div class="small muted">Need your phone right now? Get ${TO.RULES.overrideMinutes} more minutes today. It costs ${TO.RULES.overridePenalty} minutes from tomorrow's limit and resets your clean streak.</div>
        <button class="btn warn" data-act="emergency" ${overridesLeft > 0 ? '' : 'disabled'}>${overridesLeft > 0 ? `Unlock ${TO.RULES.overrideMinutes} minutes now` : 'No unlocks left today'}</button>
      </div>

      <div class="stack-s">
        <div class="eyebrow">Controls</div>
        <div class="list">
          ${listRow('shield', 'Enforce app limits', s.lockedApps.length || s.deviceLockPoints > 0 ? 'Blocks your locked apps when today\'s phone time runs out' : '<span class="yellow">Lock at least one app or site below to turn this on</span>', ui.switchEl('set-enforce', s.enforce && (s.lockedApps.length > 0 || s.deviceLockPoints > 0), 'data-change="set-enforce"'), 'for="set-enforce"')}
          <button class="list-row" data-act="locked-apps"><span class="lr-icon">${icon('lock', 17)}</span><span class="lr-main"><div class="lr-title">Locked apps & sites</div><div class="lr-sub">${s.lockedApps.length} locked · ${St.lockPoints()} lock points</div></span>${icon('chevR', 18, 'chev')}</button>
          <div class="list-row" style="flex-wrap:wrap"><span class="lr-icon">${icon('clock', 17)}</span><span class="lr-main"><div class="lr-title">Minimum phone time per day</div><div class="lr-sub">Losses can't push your limit below this</div></span><div class="seg" style="width:100%;margin-top:4px">${[0, 15, 30].map((v) => `<button class="${s.minLimit === v ? 'on' : ''}" data-act="set-minlimit" data-v="${v}">${v ? `${v} min` : 'None'}</button>`).join('')}</div></div>
          <div class="list-row" style="flex-wrap:wrap"><span class="lr-icon">${icon('bell', 17)}</span><span class="lr-main"><div class="lr-title">Warn me when phone time is low</div><div class="lr-sub">Shows a heads-up before apps lock</div></span><div class="seg" style="width:100%;margin-top:4px">${[5, 10, 15].map((v) => `<button class="${s.lowWarn === v ? 'on' : ''}" data-act="set-lowwarn" data-v="${v}">${v} min left</button>`).join('')}</div></div>
        </div>
        <div class="tiny faint">Changes to limits ask you to confirm first, so nothing changes by accident.</div>
      </div>`;
  }

  function status() {
    const wl = St.wallet();
    const t = wl.tier;
    const next = St.TIERS[St.TIERS.indexOf(t) + 1];
    const ladder = St.TIERS.slice(1).map((r) => {
      const reached = St.TIERS.indexOf(t) >= St.TIERS.indexOf(r);
      return `<div class="row" style="align-items:flex-start"><span style="color:${reached ? r.color : 'var(--muted)'};margin-top:1px">${icon(reached ? 'check' : r.icon, 18)}</span><div class="grow"><div class="row-s"><b style="${reached ? '' : 'color:var(--text-2)'}">${esc(r.title)}</b><span class="tiny faint bold">${r.min}+ pts</span></div><div class="small ${reached ? 'muted' : 'faint'}">${St.tierPerks(r).join(' · ')}</div></div></div>`;
    }).join('');
    const ms = St.nextStreakMilestone(wl.streak);
    return `<div class="card stack">
        <div class="row-layout"><h2 style="margin:0;font-size:17px">Your tier</h2>${ui.tierBadge(t.id)}</div>
        ${next ? `<div class="stack-s"><div class="row-layout small"><b>${wl.points} lock point${wl.points === 1 ? '' : 's'}</b><span class="muted">${next.min - wl.points} more for ${esc(next.title)}</span></div><div class="bar"><i style="width:${Math.min(100, ((wl.points - t.min) / (next.min - t.min)) * 100)}%;background:${next.color}"></i></div></div>` : `<div class="bold" style="color:${t.color}">Top tier. ${wl.points} lock points.</div>`}
        ${!TO.data.settings.enforce ? `<div class="note warn">${icon('info', 15)}<span>App limits are off, so your lock points don't count. Turn them on in Screen time.</span></div>` : ''}
        <div class="stack-s">${ladder}</div>
        <div class="tiny faint">Lock more of your real screen time to climb. Apps and websites are 1 point; whole categories (like Social) are 3.</div>
        <button class="btn ghost sm" data-act="locked-apps">${icon('lock', 16)} Choose locked apps</button>
      </div>
      <div class="card stack-s">
        <div class="row-layout"><div class="row-s">${icon('flame', 20, wl.streak ? 'yellow' : 'faint')}<b style="font-size:16px">${wl.streak ? `${wl.streak}-day clean streak` : 'No clean streak yet'}</b></div>${wl.multiplier > 1 ? `<span class="tag green" style="height:24px;font-size:12px">Wins ${St.fmtMult(wl.multiplier)}</span>` : ''}</div>
        ${ms ? `<div class="bar"><i style="width:${(wl.streak / ms.days) * 100}%;background:var(--warn)"></i></div><div class="small muted bold">${ms.days - wl.streak} more clean day${ms.days - wl.streak === 1 ? '' : 's'} for ${St.fmtMult(ms.mult)} earned minutes.</div>` : '<div class="small green bold">Max multiplier reached. Keep it going.</div>'}
        <div class="small muted">A clean day means limits were on, you stayed under your phone time, and you didn't use an emergency unlock. Earned minutes get ×1.1 at 3 days and ×1.25 at 7. An emergency unlock resets the streak.</div>
      </div>`;
  }

  function sports() {
    const s = TO.data.settings;
    const row = (id, title, sub, checked, change) => listRow('grid', title, sub, ui.switchEl(`sp-${id}`, checked, `data-change="${change}" data-id="${id}"`), `for="sp-${id}"`).replace(`<span class="lr-icon">${icon('grid', 17)}</span>`, `<span class="sport-opt"><span class="sq">${esc(id === 'pred' ? 'PRED' : id === 'todo' ? 'TODO' : S.LEAGUES[id] ? S.LEAGUES[id].short : '')}</span></span>`);
    return `<div class="small muted">Choose what shows up on your Home feed. You can change this any time.</div>
      <div class="list">${S.LEAGUE_ORDER.filter((l) => l !== 'sim').map((l) => row(l, esc(S.LEAGUES[l].title), `${S.LEAGUES[l].sport[0].toUpperCase()}${S.LEAGUES[l].sport.slice(1)}`, s.sports.includes(l), 'set-sport')).join('')}</div>`;
  }

  function notifications() {
    const n = TO.data.settings.notify;
    const row = (k, t, sub, ic) => listRow(ic, t, sub, ui.switchEl(`nt-${k}`, n[k], `data-change="set-notify" data-k="${k}"`), `for="nt-${k}"`);
    return `<div class="small muted">These show as banners at the top of the screen while TimeOut is open. The iPhone app also sends real notifications when it's closed.</div><div class="list">
      ${row('weekly', 'Weekly report', 'A review of your week, every Monday, in the menu', 'chart')}
      ${row('resolved', 'Challenge results', 'When a matchup challenge is completed', 'target')}
      ${row('friends', 'Friend requests', 'When someone adds or accepts you', 'userPlus')}
      ${row('lowTime', 'Low phone time', 'Before your locked apps close', 'phone')}
    </div>`;
  }

  function privacy() {
    const p = TO.data.settings.privacy;
    const row = (k, t, sub, ic) => listRow(ic, t, sub, ui.switchEl(`pv-${k}`, p[k], `data-change="set-privacy" data-k="${k}"`), `for="pv-${k}"`);
    return `<div class="small muted">Friends only see what you turn on here. Anything off shows as "Private" to them.</div><div class="list">
      ${row('record', 'My record', 'Wins and losses', 'chart')}
      ${row('minutes', 'Minutes won or lost', 'Your leaderboard number', 'hourglass')}
      ${row('challenges', 'My active challenges', 'Picks you currently have open', 'target')}
    </div>`;
  }

  let acctErr = {};
  const fmtStamp = (iso) => (iso ? `${TO.fmtDate(Date.parse(iso))}, ${TO.fmtTime(Date.parse(iso))}` : 'Never');

  /** Values read from PostgreSQL through GET /api/auth/me — the login vertical slice. */
  function serverAccountCard(s) {
    const line = (k, v, id) => `<div class="row-layout"><span class="muted">${k}</span><b${id ? ` id="${id}"` : ''}>${esc(String(v))}</b></div>`;
    return `<div class="card stack-s" id="db-account">
      <div class="row-s">${icon('check', 16)}<b>Your account is synced</b></div>
      ${line('User ID', s.id)}
      ${line('Member since', TO.fmtDate(Date.parse(s.createdAt)))}
    </div>`;
  }

  function account() {
    const a = TO.account;
    if (TO.api.online && a.server) {
      return `<div class="photo-pick"><label class="ph" for="acct-photo" style="cursor:pointer"><img src="${esc(a.photo)}" alt="Profile photo"><span class="cam">${icon('camera', 15)}</span></label><div><b>@${esc(a.username)}</b><div class="small muted">${esc(a.email)}</div><div class="small muted">Tap the photo to change it.</div></div><input type="file" id="acct-photo" accept="image/*" class="sr" data-change="acct-photo"></div>
        ${serverAccountCard(a.server)}
        <div class="card stack">
          <h2 style="margin:0;font-size:17px">Profile</h2>
          ${ui.field({ id: 'acct-username', label: 'Username', value: a.username, err: acctErr.username, attrs: 'autocapitalize="off" spellcheck="false"' })}
          ${ui.field({ id: 'acct-email', label: 'Email', type: 'email', value: a.email, err: acctErr.email })}
          <button class="btn primary" data-act="acct-save">Save changes</button>
        </div>
        <div class="card stack">
          <h2 style="margin:0;font-size:17px">Change password</h2>
          ${ui.field({ id: 'acct-new', label: 'New password', type: 'password', err: acctErr.newPassword, hint: 'At least 8 characters' })}
          <button class="btn ghost" data-act="acct-pw">Update password</button>
        </div>
        <div class="stack-s"><a class="btn ghost" href="privacy.html" target="_blank" rel="noopener">${icon('shield', 18)} Privacy policy</a><button class="btn ghost" data-act="logout">${icon('logout', 18)} Log out</button><button class="btn quiet" style="color:var(--loss)" data-act="acct-delete">Delete account</button></div>`;
    }
    return `<div class="photo-pick"><label class="ph" for="acct-photo" style="cursor:pointer"><img src="${esc(a.photo)}" alt="Profile photo"><span class="cam">${icon('camera', 15)}</span></label><div><b>Profile photo</b><div class="small muted">Tap the photo to change it.</div></div><input type="file" id="acct-photo" accept="image/*" class="sr" data-change="acct-photo"></div>
      <div class="card stack">
        ${ui.field({ id: 'acct-username', label: 'Username', value: a.username, err: acctErr.username, attrs: 'autocapitalize="off" spellcheck="false"' })}
        ${ui.field({ id: 'acct-email', label: 'Email', type: 'email', value: a.email, err: acctErr.email })}
        <button class="btn primary" data-act="acct-save">Save changes</button>
      </div>
      <div class="card stack">
        <h2 style="margin:0;font-size:17px">Change password</h2>
        ${ui.field({ id: 'acct-cur', label: 'Current password', type: 'password', err: acctErr.currentPassword })}
        ${ui.field({ id: 'acct-new', label: 'New password', type: 'password', err: acctErr.newPassword, hint: 'At least 8 characters' })}
        <button class="btn ghost" data-act="acct-pw">Update password</button>
      </div>
      <div class="stack-s">
        <a class="btn ghost" href="privacy.html" target="_blank" rel="noopener">${icon('shield', 18)} Privacy policy</a>
        <button class="btn ghost" data-act="logout">${icon('logout', 18)} Log out</button>
        <button class="btn quiet" style="color:var(--loss)" data-act="acct-delete">Delete account</button>
        <div class="tiny faint" style="text-align:center">Demo accounts are stored only in this browser.</div>
      </div>`;
  }

  function render(section) {
    const key = canonicalSection(section);
    const map = {
      screentime: () => `${screentime()}<div class="eyebrow">Tier & streak</div>${status()}`,
      sports: () => `${sports()}<div class="eyebrow">Virtual racing</div>${TO.views.races.render()}`,
      notifications: () => `${notifications()}<div class="eyebrow">What friends can see</div>${privacy()}`,
      account,
      weekly: () => `<div class="weekly-page">${TO.weekly.render()}</div>`,
    };
    return { title: SECTIONS[key].title, body: map[key]() };
  }

  function openSection(section) {
    const key = canonicalSection(section);
    closeDrawer();
    acctErr = {};
    ui.openPage('settings', { render: () => render(key), after: key === 'sports' ? (el) => TO.races.mount(el) : undefined });
    if (key === 'weekly') { TO.weekly.sel = 0; TO.weekly.markShown(); TO.weekly.refresh(); }
  }

  // ---------- App walkthrough ----------
  /** One page of the walkthrough plus its dots. `mode` is 'sheet' (opened from the menu) or 'onboard' (after sign-up). */
  function walkthroughPage(i, mode) {
    const W = TO.WALKTHROUGH, last = i === W.length - 1, w = W[i];
    const dots = `<div class="wt-dots" role="tablist">${W.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>`;
    const body = `<div class="wt-page"><span class="wt-ic">${icon(w.icon, 30)}</span><h2 class="wt-title">${w.title}</h2><p class="wt-text">${w.text}</p>
      <ul class="wt-points">${w.points.map((t) => `<li>${icon('check', 15)}<span>${t}</span></li>`).join('')}</ul></div>${dots}`;
    const nav = `<div class="wt-nav">${i > 0 ? `<button class="btn ghost" data-act="wt-go" data-d="-1" data-mode="${mode}">Back</button>` : ''}<button class="btn primary grow" data-act="wt-go" data-d="1" data-mode="${mode}">${last ? (mode === 'onboard' ? 'Next' : 'Got it') : 'Next'}</button></div>`;
    return { body, nav, i, last };
  }
  let wtPage = 0;
  function howItWorks() {
    wtPage = 0;
    ui.sheet('how', {
      tall: true,
      render: () => {
        const p = walkthroughPage(wtPage, 'sheet');
        return { title: 'App walkthrough', body: p.body, foot: p.nav };
      },
    });
  }
  TO.walkthroughPage = walkthroughPage;
  TO.actions['wt-go'] = (el) => {
    const d = Number(el.dataset.d), n = TO.WALKTHROUGH.length;
    if (el.dataset.mode === 'onboard') { TO.actions['ob-wt'](d); return; }
    const next = wtPage + d;
    if (next >= n) { ui.closeSheet('how'); return; }
    wtPage = Math.max(0, next);
    ui.refreshSheet('how');
  };

  // ---------- Locked apps ----------
  let lockDraft = [];
  function lockedAppsSheet() {
    lockDraft = TO.data.settings.lockedApps.slice();
    ui.sheet('locked', {
      tall: true,
      render: () => {
        const pts = lockDraft.reduce((s, id) => s + St.LOCKABLE.find((x) => x.id === id).pts, 0);
        const t = St.tierForPoints(TO.data.settings.enforce ? pts : 0);
        const group = (kind) => St.LOCKABLE.filter((x) => x.kind === kind).map((x) => `<button class="list-row" data-act="lock-toggle" data-id="${x.id}"><span class="lr-icon" style="background:${x.color}22;color:${x.color}">${icon(kind === 'Category' ? 'grid' : kind === 'Website' ? 'globe' : 'phone', 17)}</span><span class="lr-main"><div class="lr-title">${esc(x.name)}</div><div class="lr-sub">${x.note ? `${esc(x.note)} · ` : ''}${x.pts} pt${x.pts === 1 ? '' : 's'}</div></span><span class="checkbox ${lockDraft.includes(x.id) ? 'on' : ''}">${icon('check', 15)}</span></button>`).join('');
        return {
          title: 'Locked apps & sites',
          body: `<div class="small muted">These are the apps TimeOut blocks when your phone time runs out. The more you lock, the higher your tier. A browser can't block apps, so the real block happens in the TimeOut iPhone app.</div>
            <div class="card tight row-layout"><span class="bold">${pts} lock points</span>${ui.tierBadge(t.id)}</div>
            <div class="eyebrow">Categories · 3 pts each</div><div class="list">${group('Category')}</div>
            <div class="eyebrow">Apps · 1 pt each</div><div class="list">${group('App')}</div>
            <div class="eyebrow">Websites · 1 pt each</div><div class="list">${group('Website')}</div>`,
          foot: `<button class="btn primary full" data-act="lock-save">Save locked apps</button>`,
        };
      },
    });
  }

  // ---------- Actions ----------
  const A = TO.actions;
  A.menu = () => openDrawer();
  A['close-drawer'] = () => closeDrawer();
  A.settings = (el) => { ui.closeAllSheets(); openSection(el.dataset.section); };
  A.how = () => { closeDrawer(); howItWorks(); };
  A['locked-apps'] = () => lockedAppsSheet();
  A['lock-toggle'] = (el) => {
    const id = el.dataset.id;
    lockDraft = lockDraft.includes(id) ? lockDraft.filter((x) => x !== id) : [...lockDraft, id];
    ui.refreshSheet('locked');
  };
  A['lock-save'] = async () => {
    const before = TO.data.settings.lockedApps;
    const removed = before.filter((x) => !lockDraft.includes(x));
    const oldTier = St.tier();
    const willEnforce = lockDraft.length > 0 && (TO.data.settings.enforce || !before.length); // matches St.setSetting
    const newTier = St.tierForPoints(willEnforce ? lockDraft.reduce((s, id) => s + St.LOCKABLE.find((x) => x.id === id).pts, 0) : 0);
    const body = `${lockDraft.length} apps, sites and categories will be locked when your phone time runs out.${newTier.id !== oldTier.id ? `<br><br>Your tier changes from <b>${esc(oldTier.title)}</b> to <b>${esc(newTier.title)}</b>.` : ''}${removed.length ? '<br><br>Unlocked apps stop counting right away.' : ''}${!lockDraft.length && TO.data.settings.enforce ? '<br><br><b>App limits turn off</b> because nothing is locked.' : ''}${lockDraft.length && !before.length ? '<br><br>App limits turn on.' : ''}`;
    if (!(await ui.confirm({ title: 'Update locked apps?', body, confirm: 'Save' }))) return;
    St.setSetting('lockedApps', lockDraft.slice());
    ui.closeSheet('locked');
    ui.toast({ kind: 'win', title: 'Locked apps updated', msg: `You're ${St.tier().title} now.` });
    refresh();
  };
  A.emergency = async () => {
    // Screen time is enforced on the phone, so that's where an unlock has to happen.
    if (TO.account?.server) {
      ui.toast({ kind: 'warn', title: 'Use the iPhone app', msg: 'Emergency unlocks are made in the TimeOut iPhone app.' });
      return;
    }
    const wl = St.wallet();
    const ok = await ui.confirm({
      title: `Unlock ${TO.RULES.overrideMinutes} minutes now?`,
      body: `You'll get ${TO.RULES.overrideMinutes} more minutes of phone time today.<br><br><b style="color:var(--loss)">It costs ${TO.RULES.overridePenalty} minutes from tomorrow's limit</b>${wl.streak ? ` and ends your ${wl.streak}-day clean streak` : ''}. You have ${TO.RULES.maxOverrides - wl.overridesUsed} of ${TO.RULES.maxOverrides} unlocks left today.`,
      confirm: 'Unlock now',
      tone: 'warn',
    });
    if (!ok) return;
    try {
      St.useEmergencyUnlock();
      ui.toast({ kind: 'warn', title: `+${TO.RULES.overrideMinutes} min unlocked`, msg: `Tomorrow's limit dropped by ${TO.RULES.overridePenalty} min.` });
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      ui.toast({ kind: 'loss', title: 'No unlocks left', msg: e.message });
    }
    refresh();
  };
  A['set-minlimit'] = async (el) => {
    const v = Number(el.dataset.v);
    if (v === TO.data.settings.minLimit) return;
    const ok = await ui.confirm({ title: 'Change your minimum phone time?', body: v ? `No matter how many challenges you lose, you'll always get at least <b>${v} minutes</b> of phone time a day.` : 'Losses will be able to take your phone time all the way to 0 minutes.', confirm: 'Change it' });
    if (!ok) return;
    St.setSetting('minLimit', v);
    refresh();
  };
  A['set-lowwarn'] = (el) => { St.setSetting('lowWarn', Number(el.dataset.v)); refresh(); };
  A.logout = async () => {
    closeDrawer();
    if (!(await ui.confirm({ title: 'Log out?', body: 'Your challenges and settings stay saved on this device.', confirm: 'Log out' }))) return;
    TO.comboGoalBuilder.clear();
    if (TO.api.online) await TO.api.logout();
    St.logout();
    TO.app.boot();
  };
  A['acct-save'] = async () => {
    acctErr = {};
    try {
      const patch = { username: document.getElementById('acct-username').value, email: document.getElementById('acct-email').value };
      if (TO.account.server) await TO.api.updateProfile(patch);
      St.updateAccount(patch);
      ui.toast({ kind: 'win', title: 'Account saved' });
    } catch (e) {
      acctErr = e.fields || {};
      if (!Object.keys(acctErr).length) ui.toast({ kind: 'loss', title: 'Couldn\'t save your changes', msg: TO.friendlyMessage(e) });
    }
    refresh();
  };
  A['acct-pw'] = async () => {
    acctErr = {};
    try {
      const newPassword = document.getElementById('acct-new').value;
      const invalid = St.validatePassword(newPassword);
      if (invalid) throw new TO.AppError('invalid', invalid, { fields: { newPassword: invalid } });
      if (TO.account.server) await TO.api.updateProfile({ password: newPassword });
      else St.updateAccount({ currentPassword: document.getElementById('acct-cur').value, newPassword });
      ui.toast({ kind: 'win', title: 'Password updated' });
    } catch (e) {
      acctErr = e.fields || {};
      if (!Object.keys(acctErr).length) ui.toast({ kind: 'loss', title: 'Couldn\'t update your password', msg: TO.friendlyMessage(e) });
    }
    refresh();
  };
  A['acct-delete'] = async () => {
    const server = !!TO.account.server;
    const body = server
      ? 'This permanently deletes your TimeOut account, challenges, wallet and settings from TimeOut\'s servers and this device, and takes you off your teams. It can\'t be undone.'
      : 'This removes your account, challenges and friends from this device. It can\'t be undone.';
    if (!(await ui.confirm({ title: 'Delete your account?', body, confirm: 'Delete account', danger: true }))) return;
    if (server) {
      try { await TO.api.deleteAccount(); } catch (e) {
        ui.toast({ kind: 'loss', title: 'Couldn\'t delete your account', msg: TO.friendlyMessage(e) });
        return;
      }
    }
    St.deleteAccount();
    TO.comboGoalBuilder.clear();
    TO.app.boot();
  };

  const C = TO.changes;
  C['set-enforce'] = async (el) => {
    const want = el.checked;
    el.checked = !want;
    if (want && !TO.data.settings.lockedApps.length && !(TO.data.settings.deviceLockPoints > 0)) {
      const pick = await ui.confirm({ title: 'Lock an app first', body: 'App limits need at least one locked app, site or category to block. Choose what TimeOut locks when your phone time runs out, and limits turn on with it.', confirm: 'Choose apps', cancel: 'Not now' });
      if (pick) lockedAppsSheet();
      return;
    }
    const ok = await ui.confirm(want
      ? { title: 'Turn app limits on?', body: 'Your locked apps will close when today\'s phone time runs out.', confirm: 'Turn on' }
      : { title: 'Turn app limits off?', body: 'Your locked apps won\'t close anymore. Your tier drops to Rookie and today won\'t count as a clean day.', confirm: 'Turn off', danger: true });
    if (!ok) return;
    St.setSetting('enforce', want);
    refresh();
  };
  C['set-sport'] = (el) => {
    const id = el.dataset.id;
    const cur = TO.data.settings.sports;
    St.setSetting('sports', el.checked ? S.LEAGUE_ORDER.filter((l) => l !== 'sim' && (cur.includes(l) || l === id)) : cur.filter((l) => l !== id && l !== 'sim'));
    TO.data.feedFilter = 'all';
    TO.app.render();
  };
  C['set-notify'] = (el) => St.setSetting(`notify.${el.dataset.k}`, el.checked);
  C['set-privacy'] = (el) => St.setSetting(`privacy.${el.dataset.k}`, el.checked);
  C['acct-photo'] = async (el) => {
    try {
      const url = await ui.readPhoto(el.files[0]);
      if (TO.account.server) await TO.api.updateProfile({ photoUrl: url });
      St.updateAccount({ photo: url });
      ui.toast({ kind: 'win', title: 'Photo updated' });
      refresh();
      TO.app.renderChrome();
    } catch (e) { ui.toast({ kind: 'loss', title: 'Couldn\'t update your photo', msg: e instanceof TO.AppError ? e.message : 'That image could not be read.' }); }
  };

  function refresh() {
    ui.refreshPage('settings');
    TO.app.render();
  }

  TO.views.settings = { openSection, howItWorks, closeDrawer, openDrawer, refresh };
})(window.TO);

</script>
<script>
/* TimeOut web demo — welcome, log in, create account and onboarding. */
(function (TO) {
  'use strict';
  const { esc, icon, brandIcon } = TO;
  const S = TO.sim;
  const ui = TO.ui;
  const St = TO.state;

  const av = { screen: 'welcome', errors: {}, formError: '', values: {}, photo: null, step: 1, wt: 0, sports: null, locks: [] };

  function ticker() {
    const games = S.board(TO.now()).filter((g) => g.state === 'live' && !g.simulated).slice(0, 8);
    if (!games.length) return '';
    const items = games.map((g) => `<span class="tk"><span class="live"></span>${esc(g.away.abbr)} <b>${g.awayScore}</b> ${esc(g.home.abbr)} <b>${g.homeScore}</b> <span class="faint">${esc(g.clock)}</span></span>`).join('');
    return `<div class="ticker" aria-hidden="true"><div class="ticker-track">${items}${items}</div></div>`;
  }

  function welcome() {
    return `<div class="auth">
      <div class="welcome-hero">
        ${ticker()}
        <div style="margin-top:auto"></div>
        ${brandIcon(64)}
        <div class="wordmark">TIME<b>OUT</b></div>
        <div class="tagline">Build healthier screen-time habits with sports challenges.</div>
        <div class="welcome-points">
          <div>${icon('hourglass', 18)}<span>60 pledge minutes a day. Successful challenges add phone time tomorrow.</span></div>
          <div>${icon('radio', 18)}<span>Live scores and matchup targets for NFL, NBA, MLB, NHL, college football and soccer.</span></div>
          <div>${icon('users', 18)}<span>Compare screen-time records and compete on teams.</span></div>
        </div>
      </div>
      <div class="auth-inner" style="flex:none;gap:10px">
        <button class="btn primary full" data-act="auth-go" data-s="login">Log in</button>
        <button class="btn ghost full" data-act="auth-go" data-s="signup">Create account</button>
        ${TO.api.configured ? '' : `<button class="btn quiet full sm" data-act="auth-demo">${icon('flask', 16)} Try the demo account</button>`}
      </div>
    </div>`;
  }

  function back() {
    return `<button type="button" class="icon-btn" style="margin-left:-10px" data-act="auth-go" data-s="welcome" aria-label="Back">${icon('chevL', 22)}</button>`;
  }

  function login() {
    const v = av.values;
    return `<div class="auth"><form class="auth-inner" data-form="login" novalidate>
      ${back()}
      ${brandIcon(52)}
      <h1>Welcome back</h1>
      <p class="sub">Log in with your email and password.</p>
      ${av.formError ? `<div class="form-error">${esc(av.formError)}</div>` : ''}
      ${ui.field({ id: 'li-id', label: 'Email', type: 'email', value: v['li-id'] || '', err: av.errors.identifier || av.errors.email, attrs: 'autocomplete="email" autocapitalize="off" spellcheck="false"' })}
      ${ui.field({ id: 'li-pw', label: 'Password', type: 'password', value: '', err: av.errors.password, attrs: 'autocomplete="current-password"' })}
      <button type="submit" class="btn primary full">Log in</button>
      <button type="button" class="btn quiet sm" data-act="forgot">Forgot password?</button>
      <div class="divider"></div>
      ${TO.api.configured ? '' : `<button type="button" class="btn ghost full" data-act="auth-demo">${icon('flask', 16)} Log in with the demo account</button>`}
      <div class="small muted" style="text-align:center">New here? <button type="button" class="link-btn" data-act="auth-go" data-s="signup">Create an account</button></div>
    </form></div>`;
  }

  function signup() {
    const v = av.values;
    const photo = av.photo || TO.initialsAvatar(v['su-user'] || '?', '#1d2430');
    return `<div class="auth"><form class="auth-inner" data-form="signup" novalidate>
      ${back()}
      ${brandIcon(52)}
      <h1>Create your account</h1>
      <p class="sub">Friends find you by your username.</p>
      ${av.formError ? `<div class="form-error">${esc(av.formError)}</div>` : ''}
      <div class="photo-pick">
        <label class="ph" for="su-photo" style="cursor:pointer"><img id="su-photo-img" src="${esc(photo)}" alt="Profile photo"><span class="cam">${icon('camera', 15)}</span></label>
        <div><b>Profile photo</b><div class="small muted">${av.photo ? 'Looking good. Tap to change it.' : 'Tap to add a photo. Optional, but it helps friends find you.'}</div>${av.errors.photo ? `<div class="small red bold">${esc(av.errors.photo)}</div>` : ''}</div>
        <input type="file" id="su-photo" accept="image/*" class="sr" data-change="su-photo">
      </div>
      ${ui.field({ id: 'su-user', label: 'Username', value: v['su-user'] || '', err: av.errors.username, hint: '3–20 letters, numbers, dots or underscores', attrs: 'autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20"' })}
      ${ui.field({ id: 'su-email', label: 'Email', type: 'email', value: v['su-email'] || '', err: av.errors.email, attrs: 'autocomplete="email"' })}
      ${ui.field({ id: 'su-pw', label: 'Password', type: 'password', value: v['su-pw'] || '', err: av.errors.password, hint: 'At least 8 characters', attrs: 'autocomplete="new-password"' })}
      ${ui.field({ id: 'su-pw2', label: 'Confirm password', type: 'password', value: v['su-pw2'] || '', err: av.errors.confirm, attrs: 'autocomplete="new-password"' })}
      <button type="submit" class="btn primary full">Create account</button>
      <div class="tiny faint" style="text-align:center">${TO.api.configured ? 'Your account and pledges are saved securely.' : 'Offline demo: accounts are saved in this browser, not on a server.'}</div>
      <div class="small muted" style="text-align:center">Already have an account? <button type="button" class="link-btn" data-act="auth-go" data-s="login">Log in</button></div>
    </form></div>`;
  }

  function onboard() {
    const step = av.step;
    const steps = `<div class="steps">${[1, 2, 3].map((i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
    let body, next;
    if (step === 1) {
      const p = TO.walkthroughPage(av.wt, 'onboard');
      body = `<h1>${av.wt === 0 ? `Here's the deal, @${esc(TO.account.username)}` : 'How TimeOut works'}</h1>${p.body}`;
      next = `${p.nav}<button class="btn quiet sm" data-act="ob-next">Skip walkthrough</button>`;
    } else if (step === 2) {
      const sel = av.sports;
      body = `<h1>Pick your sports</h1><p class="sub">These show up on your Home feed. You can change them in Settings.</p>
        <div class="list">${S.LEAGUE_ORDER.map((l) => `<button class="list-row" data-act="ob-sport" data-id="${l}"><span class="sport-opt"><span class="sq">${esc(S.LEAGUES[l].short)}</span></span><span class="lr-main"><div class="lr-title">${esc(S.LEAGUES[l].title)}</div><div class="lr-sub">${l === 'sim' ? 'Simulated games for days without sports' : esc(S.LEAGUES[l].sport[0].toUpperCase() + S.LEAGUES[l].sport.slice(1))}</div></span><span class="checkbox ${sel.includes(l) ? 'on' : ''}">${icon('check', 15)}</span></button>`).join('')}</div>`;
      next = `<button class="btn primary full" data-act="ob-next" ${sel.length ? '' : 'disabled'}>${sel.length ? 'Next' : 'Pick at least one'}</button>`;
    } else {
      const pts = av.locks.reduce((s, id) => s + St.LOCKABLE.find((x) => x.id === id).pts, 0);
      const t = St.tierForPoints(pts);
      body = `<h1>Lock your time-wasters</h1><p class="sub">When today's phone time runs out, these apps lock. Lock more to reach a higher tier with bonus minutes and allowance boosts.</p>
        <div class="card tight margins"><span class="bold">${pts} lock points</span>${ui.tierBadge(t.id)}</div>
        <div class="list">${St.LOCKABLE.filter((x) => x.kind !== 'Website').map((x) => `<button class="list-row" data-act="ob-lock" data-id="${x.id}"><span class="lr-icon" style="background:${x.color}22;color:${x.color}">${icon(x.kind === 'Category' ? 'grid' : 'phone', 17)}</span><span class="lr-main"><div class="lr-title">${esc(x.name)}</div><div class="lr-sub">${x.kind} · ${x.pts} pt${x.pts === 1 ? '' : 's'}</div></span><span class="checkbox ${av.locks.includes(x.id) ? 'on' : ''}">${icon('check', 15)}</span></button>`).join('')}</div>`;
      next = `<button class="btn primary full" data-act="ob-finish">Start a challenge</button><button class="btn quiet sm" data-act="ob-finish" data-skip="1">Skip for now</button>`;
    }
    return `<div class="auth"><div class="auth-inner">${steps}${step > 1 ? `<button class="icon-btn" style="margin-left:-10px" data-act="ob-back" aria-label="Back">${icon('chevL', 22)}</button>` : ''}${body}<div class="stack-s" style="margin-top:auto">${next}</div></div></div>`;
  }

  // ---------- Verify email (after Create account, until the link in the email is opened) ----------
  const VERIFY_POLL_MS = 5000;
  const VERIFY_GIVE_UP_MS = 30 * TO.MIN;
  const RESEND_WAIT_MS = 60 * 1000;
  // The password is kept in memory only, so this page can log in by itself once the email is confirmed.
  const pending = { email: '', password: '', since: 0, resentAt: 0, timer: null, checking: false, note: '' };

  function verify() {
    const wait = Math.max(0, pending.resentAt + RESEND_WAIT_MS - Date.now());
    const stopped = Date.now() - pending.since > VERIFY_GIVE_UP_MS;
    return `<div class="auth"><div class="auth-inner verify-email">
      <button type="button" class="icon-btn" style="margin-left:-10px" data-act="verify-cancel" aria-label="Back">${icon('chevL', 22)}</button>
      <span class="verify-ic">${icon('send', 30)}</span>
      <h1>Verify your email</h1>
      <p class="sub">We sent a confirmation link to <b style="color:var(--text)">${esc(pending.email)}</b>. Open it to finish creating your account.</p>
      ${av.formError ? `<div class="form-error">${esc(av.formError)}</div>` : ''}
      <div class="note ${stopped ? '' : 'green'}">${stopped ? icon('clock', 16) : '<span class="verify-dot"></span>'}<span>${stopped
        ? 'Still waiting. Once you\'ve opened the link, tap the button below.'
        : 'Waiting for you to confirm. You\'ll be logged in automatically as soon as you do, on this page or from the link.'}</span></div>
      ${pending.note ? `<div class="small muted" style="text-align:center">${esc(pending.note)}</div>` : ''}
      <button type="button" class="btn primary full" data-act="verify-check" ${pending.checking ? 'disabled' : ''}>${pending.checking ? 'Checking…' : 'I\'ve confirmed my email'}</button>
      <button type="button" class="btn ghost full" data-act="verify-resend" ${wait ? 'disabled' : ''}>${icon('refresh', 16)} ${wait ? `Resend email in ${Math.ceil(wait / 1000)}s` : 'Resend email'}</button>
      <div class="small muted" style="text-align:center">Can't find it? Check spam or promotions. Wrong email? <button type="button" class="link-btn" data-act="verify-cancel">Start over</button></div>
    </div></div>`;
  }

  function stopVerifyPolling() {
    clearInterval(pending.timer);
    pending.timer = null;
  }

  /** Tries to log in with the new account. Supabase refuses with "Email not confirmed" until the link is opened. */
  async function checkVerified(manual) {
    if (pending.checking || !pending.email) return;
    if (!manual && (document.hidden || Date.now() - pending.since > VERIFY_GIVE_UP_MS)) return;
    pending.checking = true;
    if (manual) render();
    try {
      // Another tab may already have signed in from the email link.
      if (TO.api.hasToken()) { await finishVerified(await TO.api.me()); return; }
      const { user } = await TO.api.login(pending.email, pending.password);
      await finishVerified(user);
    } catch (e) {
      const unconfirmed = e instanceof TO.AppError && /not confirmed|confirm/i.test(e.message);
      if (manual) av.formError = unconfirmed ? 'Your email isn\'t confirmed yet. Open the link we sent, then try again.' : TO.friendlyMessage(e);
    } finally {
      pending.checking = false;
      if (av.screen === 'verify') render();
    }
  }

  async function finishVerified(user) {
    stopVerifyPolling();
    pending.password = '';
    St.adoptServerUser(user, await TO.api.loadState());
    av.values = {}; av.photo = null;
    av.screen = 'onboard';
    TO.app.boot(); // new accounts land in onboarding
    ui.toast({ kind: 'win', title: 'Email verified', msg: `Welcome to TimeOut, @${user.username}.` });
  }

  function startVerify(email, password) {
    stopVerifyPolling();
    Object.assign(pending, { email, password, since: Date.now(), resentAt: Date.now(), checking: false, note: '' });
    av.screen = 'verify'; av.errors = {}; av.formError = '';
    render();
    pending.timer = setInterval(() => {
      if (av.screen !== 'verify') { stopVerifyPolling(); return; }
      checkVerified(false);
      render(); // keeps the resend countdown current
    }, VERIFY_POLL_MS);
  }

  // The email link signs in whichever tab it opens in. When that tab saves the session, this one follows.
  window.addEventListener('storage', (e) => {
    if (av.screen === 'verify' && e.key === TO.api.sessionKey && e.newValue) checkVerified(true);
  });

  function render() {
    const root = document.getElementById('app-body');
    const map = { welcome, login, signup, onboard, verify };
    root.innerHTML = map[av.screen]();
    const first = root.querySelector('input:not([type=file])');
    if (first && av.screen !== 'welcome' && !av.errors.password && av.screen !== 'onboard') setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
  }

  function show(screen) {
    if (screen !== 'verify') { stopVerifyPolling(); pending.password = ''; }
    av.screen = screen; av.errors = {}; av.formError = '';
    if (screen === 'welcome') { av.values = {}; av.photo = null; }
    render();
  }

  function startOnboarding() {
    av.screen = 'onboard'; av.step = 1; av.wt = 0; av.sports = TO.data.settings.sports.slice(); av.locks = [];
    render();
  }

  function collect(form) {
    form.querySelectorAll('input:not([type=file])').forEach((i) => { av.values[i.id] = i.value; });
  }

  function showError(e) {
    if (!(e instanceof TO.AppError)) console.error(e);
    Object.assign(av.errors, e.fields || {});
    av.formError = TO.friendlyMessage(e);
    render();
  }

  function setBusy(form, label) {
    const btn = form.querySelector('button[type=submit]');
    if (btn) { btn.disabled = true; btn.textContent = label; }
  }

  /** Vertical slice: POST /api/auth/login -> server updates users.last_login_at and login_count -> show them. */
  async function serverLogin(email, password) {
    const { user } = await TO.api.login(email, password);
    St.adoptServerUser(user, await TO.api.loadState());
    av.values = {};
    TO.app.boot();
    ui.toast({
      kind: 'win',
      title: `Logged in as @${user.username}`,
      msg: 'Your challenges and settings are synced.',
    });
  }

  async function submit(form) {
    collect(form);
    av.errors = {}; av.formError = '';
    if (!TO.net.online()) { av.formError = 'No internet connection. Check your Wi-Fi or data and try again.'; render(); return; }
    const v = av.values;
    if (form.dataset.form === 'login') {
      try {
        if (TO.api.online) {
          setBusy(form, 'Logging in…');
          await serverLogin(v['li-id'] || '', v['li-pw'] || '');
          return;
        }
        St.login(v['li-id'], v['li-pw']);
        av.values = {};
        TO.app.boot();
      } catch (e) {
        av.errors = {};
        showError(e);
      }
      return;
    }
    // signup
    if (v['su-pw'] !== v['su-pw2']) av.errors.confirm = 'Passwords don\'t match.';
    if (TO.api.online) {
      try {
        if (av.errors.confirm) throw new TO.AppError('invalid', 'Fix the highlighted fields.');
        setBusy(form, 'Creating account…');
        const result = await TO.api.register({ username: (v['su-user'] || '').trim(), email: (v['su-email'] || '').trim(), password: v['su-pw'] || '', photoUrl: av.photo });
        if (result.needsConfirmation) { startVerify(result.email, v['su-pw'] || ''); return; }
        const { user, state } = result;
        St.adoptServerUser(user, state);
        av.values = {}; av.photo = null;
        startOnboarding();
      } catch (e) { showError(e); }
      return;
    }
    try {
      if (av.errors.confirm) {
        // Still report other field errors in the same pass.
        const probe = { username: St.validateUsername((v['su-user'] || '').trim()), email: St.validateEmail((v['su-email'] || '').trim()), password: St.validatePassword(v['su-pw'] || '') };
        for (const k of Object.keys(probe)) if (probe[k]) av.errors[k] = probe[k];
        throw new TO.AppError('invalid', 'Fix the highlighted fields.');
      }
      const acc = St.createAccount({ username: v['su-user'] || '', email: v['su-email'] || '', password: v['su-pw'] || '', photo: av.photo });
      St.startSession(acc.id);
      av.values = {}; av.photo = null;
      startOnboarding();
    } catch (e) { showError(e); }
  }

  TO.views.auth = { render, show, startOnboarding, submit };

  const A = TO.actions;
  A['auth-go'] = (el) => show(el.dataset.s);
  A['verify-check'] = () => checkVerified(true);
  A['verify-cancel'] = () => { av.values = { 'su-user': av.values['su-user'], 'su-email': pending.email }; show('signup'); };
  A['verify-resend'] = async () => {
    if (Date.now() < pending.resentAt + RESEND_WAIT_MS) return;
    try {
      await TO.api.resendConfirmation(pending.email);
      pending.resentAt = Date.now();
      pending.note = `Sent a new link to ${pending.email}.`;
      av.formError = '';
    } catch (e) {
      av.formError = TO.friendlyMessage(e);
    }
    render();
  };
  A['auth-demo'] = async (el) => {
    if (TO.api.configured) return;
    if (!TO.net.online()) { ui.toast({ kind: 'loss', title: 'No internet connection', msg: 'Check your Wi-Fi or data and try again.' }); return; }
    if (!TO.api.online) { St.loginDemo(); TO.app.boot(); return; }
    el.disabled = true;
    try {
      await serverLogin(St.DEMO.username, St.DEMO.password);
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      el.disabled = false;
      ui.toast({ kind: 'loss', title: 'Couldn\'t log in to the demo account', msg: e.message });
    }
  };
  A.forgot = async () => {
    if (!TO.api.configured) {
      ui.confirm({ title: 'Reset your password', body: 'TimeOut can\'t reach its server right now, so password reset emails can\'t be sent. Try again when you\'re back online.', confirm: 'OK', cancel: null });
      return;
    }
    const email = String(document.getElementById('li-id')?.value || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      ui.toast({ kind: 'warn', title: 'Enter your email first', msg: 'Type it above, then tap Forgot password.' });
      return;
    }
    try {
      await TO.api.sendPasswordReset(email);
      ui.confirm({ title: 'Check your email', body: `If ${esc(email)} has a TimeOut account, we sent it a link to reset your password. Open it to sign in, then set a new password in <b>Account</b>.`, confirm: 'OK', cancel: null });
    } catch (e) { ui.toast({ kind: 'loss', title: 'Couldn\'t send the email', msg: TO.friendlyMessage(e) }); }
  };
  A['toggle-pw'] = (el) => {
    const input = document.getElementById(el.dataset.for);
    if (!input) return;
    input.type = input.type === 'password' ? 'text' : 'password';
    el.innerHTML = icon(input.type === 'password' ? 'eye' : 'eyeOff', 18);
  };
  A['ob-next'] = () => { av.step++; render(); };
  TO.actions['ob-wt'] = (d) => {
    const n = TO.WALKTHROUGH.length;
    if (av.wt + d >= n) { av.step++; av.wt = 0; } else av.wt = Math.max(0, av.wt + d);
    render();
  };
  A['ob-back'] = () => { av.step--; render(); };
  A['ob-sport'] = (el) => { const id = el.dataset.id; av.sports = av.sports.includes(id) ? av.sports.filter((x) => x !== id) : [...av.sports, id]; render(); };
  A['ob-lock'] = (el) => { const id = el.dataset.id; av.locks = av.locks.includes(id) ? av.locks.filter((x) => x !== id) : [...av.locks, id]; render(); };
  A['ob-finish'] = (el) => {
    St.setSetting('sports', S.LEAGUE_ORDER.filter((l) => av.sports.includes(l)));
    if (!el.dataset.skip) St.setSetting('lockedApps', av.locks.slice());
    TO.data.onboarded = true;
    St.grantTierBonus();
    St.save();
    TO.app.boot();
    ui.toast({ kind: 'win', title: `Welcome to TimeOut, @${TO.account.username}`, msg: `You have ${TO.data.wallet.balance} pledge minutes today. Choose a matchup challenge to start.` });
  };
  TO.changes['su-photo'] = async (el) => {
    try {
      const form = el.closest('form');
      if (form) collect(form);
      av.photo = await ui.readPhoto(el.files[0]);
      av.errors.photo = null;
    } catch (e) { av.errors.photo = e.message; }
    render();
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — app shell, navigation, live refresh loop and event wiring. */
(function (TO) {
  'use strict';
  const { esc, icon, brandMark } = TO;
  const ui = TO.ui;
  const St = TO.state;

  const app = (TO.app = { tab: 'home', pressing: false });
  const TABS = [
    ['home', 'Home', 'home'],
    ['challenges', 'My Challenges', 'target'],
    ['social', 'Social', 'users'],
  ];

  /** The app shell. The browser version (web.js) swaps in its own layout. */
  app.shellHtml = () => `<div class="app" id="shell">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view" tabindex="-1"></main>
      <div id="commitment-bar-host"></div>
      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    </div>`;

  app.boot = () => {
    ui.closeAllSheets();
    ui.closeAllPages();
    TO.views.settings.closeDrawer();
    const body = document.getElementById('app-body');
    if (!St.loadSession()) {
      body.innerHTML = '';
      TO.views.auth.show('welcome');
      return;
    }
    if (!TO.data.onboarded) {
      body.innerHTML = '';
      TO.views.auth.startOnboarding();
      return;
    }
    body.innerHTML = app.shellHtml();
    app.tab = 'home';
    app.render();
    TO.live.refresh();
    app.syncSocial().then(() => { if (St.refreshTeams) St.refreshTeams(); });
    TO.weekly.refresh();
    if (TO.invites) TO.invites.offer();
  };

  /** Friends and requests from the server, with a banner for anything new.
   *  `quiet` is for after the user's own action, which already says what happened. */
  app.syncSocial = async (quiet = false) => {
    if (!TO.data || !St.usesServerSocial() || !TO.api.socialState) return;
    const state = await TO.api.socialState();
    if (!state || !TO.data) return;
    const changes = St.applySocial(state);
    if (!quiet && TO.data.settings.notify.friends) {
      for (const u of changes.newRequests) ui.toast({ kind: 'info', title: `@${u} sent you a friend request`, msg: 'Open Social to accept it.' });
      for (const u of changes.newFriends) ui.toast({ kind: 'win', title: `You and @${u} are now friends` });
    }
    if (inShell() && !isTyping()) {
      app.renderChrome();
      if (app.tab === 'social') app.renderView();
    }
    if (ui.sheetOpen('profile')) ui.refreshSheet('profile');
  };

  const inShell = () => !!document.getElementById('shell') && !!TO.data;

  app.renderChrome = () => {
    if (!inShell()) return;
    const wl = St.wallet();
    const locked = wl.lockedOut || wl.balance <= 0;
    const socialBadge = TO.views.social.badge();
    document.getElementById('topbar').innerHTML = `
      <button class="icon-btn" data-act="menu" aria-label="Menu and settings">${icon('menu', 22)}${wl.appsLocked || TO.weekly.unread() ? '<span class="dotbadge"></span>' : ''}</button>
      <div class="brand">${brandMark(18, 'brand-mark')}<span class="brand-word">TIME<b>OUT</b></span></div>
      <button class="bal-pill ${locked ? 'locked' : ''}" data-act="settings" data-section="screentime" aria-label="${locked ? 'New pledges resume at midnight' : `${wl.balance} minutes available to pledge`}">${icon(locked ? 'lock' : 'hourglass', 15)}${locked ? 'Locked' : `${wl.balance} min`}</button>`;
    const open = TO.data.challenges.filter((b) => b.status === 'open' && (b.kind === 'sports' || b.kind === 'race') && b.picks.length && b.picks.every((pick) => pick.kind === 'race' || pick.kind === 'game' || (pick.kind === 'sports' && pick.gameId))).length;
    document.getElementById('tabbar').innerHTML = TABS.map(([k, label, ic]) => {
      const badge = k === 'challenges' && open ? `<span class="badge green">${open}</span>` : k === 'social' && socialBadge ? `<span class="badge">${socialBadge}</span>` : '';
      return `<button class="tab ${app.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}" aria-current="${app.tab === k ? 'page' : 'false'}">${icon(ic, 23)}<span>${label}</span>${badge}</button>`;
    }).join('');
    app.refreshSlipbar();
  };

  app.refreshSlipbar = () => {
    if (!inShell()) return;
    const host = document.getElementById('commitment-bar-host');
    const commitment = TO.comboGoalBuilder;
    let markup = '';
    if (commitment.comboGoalMode && commitment.selectedPicks.length && !ui.sheetOpen('commitment')) {
      const st = commitment.status();
      const dec = commitment.selectedPicks.reduce((p, l) => p * TO.convertPointValueToMultiplier(l.price), 1);
      const detail = st.closed ? 'Choice unavailable' : st.changed ? 'Target updated' : `${dec.toFixed(2)}x Target`;
      const title = commitment.selectedPicks.length > 1 ? 'Review Combo Goal' : 'Review Single Matchup Pledge';
      markup = `<button class="commitment-bar combo-goal-finalize" data-act="open-commitment" aria-label="${title}"><span class="n">${commitment.selectedPicks.length}</span><span>${title}</span><span class="o">${detail}</span></button>`;
    } else if (commitment.selectedPicks.length && !commitment.comboGoalMode && !ui.sheetOpen('commitment')) {
      const st = commitment.status();
      const dec = commitment.selectedPicks.reduce((p, l) => p * TO.pointValue.decimal(l.price), 1);
      markup = `<button class="commitment-bar" data-act="open-commitment"><span class="n">${commitment.selectedPicks.length}</span><span>Daily Commitment</span>${st.changed || st.closed ? `<span class="o row-s" style="font-family:var(--font-body);font-size:13px;color:var(--warn)">${icon('alert', 15)} ${st.closed ? 'Choice unavailable' : 'Target updated'}</span>` : `<span class="o">${TO.convertPointValueToMultiplier(commitment.selectedPicks[0].price).toFixed(2)}x Target</span>`}</button>`;
    }
    if (host.innerHTML !== markup) host.innerHTML = markup;
  };

  app.renderView = () => {
    if (!inShell()) return;
    const view = document.getElementById('view');
    const h = {};
    view.querySelectorAll('[data-hkey]').forEach((el) => { h[el.dataset.hkey] = el.scrollLeft; });
    const st = view.scrollTop;
    view.innerHTML = TO.views[app.tab].render();
    view.scrollTop = st;
    view.querySelectorAll('[data-hkey]').forEach((el) => { if (h[el.dataset.hkey]) el.scrollLeft = h[el.dataset.hkey]; });
  };

  app.render = () => { app.renderChrome(); app.renderView(); };
  app.refreshPointValueButtons = () => {
    app.renderView();
    if (ui.pageOpen('game')) TO.views.game.refresh();
    if (ui.pageOpen('combo-goal')) ui.refreshPage('combo-goal');
  };

  app.go = (tab) => {
    ui.closeAllPages();
    TO.views.settings.closeDrawer();
    app.tab = tab;
    app.render();
    const v = document.getElementById('view');
    if (v) v.scrollTop = 0;
  };

  // ---------- Live loop ----------
  let lastFull = 0;
  let lastSlipUiSig = '';
  function challengeTitle(b) { return TO.views.challenges.challengeTitle(b); }

  function refreshSlip() {
    const commitment = TO.comboGoalBuilder;
    if (!commitment.selectedPicks.length) { lastSlipUiSig = ''; return; }
    const sig = commitment.selectedPicks.map((pick) => {
      const cur = TO.sim.currentSelection(pick.selId);
      return cur?.sel ? `${cur.sel.price}|${cur.sel.line}|${cur.open}` : 'x';
    }).join(',');
    if (sig !== lastSlipUiSig) {
      lastSlipUiSig = sig;
      commitment.update();
    }
  }

  function notifyResolved(list) {
    const n = TO.data.settings.notify;
    for (const b of list) {
      if (!n.resolved) continue;
      if (b.status === 'won') ui.toast({ kind: 'win', title: `Challenge complete: ${challengeTitle(b)}`, msg: `+${b.reward - b.pledgeMinutes} earned minutes added to tomorrow's phone time.` });
      else if (b.status === 'lost') ui.toast({ kind: 'loss', title: `Challenge missed: ${challengeTitle(b)}`, msg: `${b.pledgeMinutes} committed minutes deducted from tomorrow's phone time.` });
      else ui.toast({ kind: 'info', title: `Challenge returned: ${challengeTitle(b)}`, msg: `${b.insurancePaid ? 'Miss-one protection returned your minutes.' : 'The game was postponed.'} ${b.pledgeMinutes} minutes are available again.` });
    }
  }

  app.tick = (force) => {
    const now = TO.now();
    // Every second: clocks and countdowns.
    document.querySelectorAll('[data-countdown]').forEach((el) => { el.textContent = TO.countdown(Number(el.dataset.countdown) - now); });
    if (!force && Date.now() - lastFull < 5000) return;
    lastFull = Date.now();
    if (!inShell()) return;

    TO.live.refresh();

    // Midnight reset, pledges resolution and friend activity.
    const rolledOver = St.rollover(now);
    if (rolledOver) {
      St.save();
      ui.toast({ kind: 'info', title: 'Your daily minutes refreshed', msg: `Today's phone limit is ${St.wallet().todayLimit} min after yesterday's challenge results.` });
    }
    const resolved = St.resolve(now);
    notifyResolved(resolved);
    const socialEvents = St.socialTick(now);
    for (const ev of socialEvents) {
      if (ev.type === 'friend' && TO.data.settings.notify.friends) ui.toast({ kind: 'win', title: `@${ev.username} accepted your friend request` });
    }
    St.checkPhoneTime();

    const commitment = TO.comboGoalBuilder;
    if (commitment.selectedPicks.length) {
      refreshSlip();
    }

    const stateChanged = rolledOver || resolved.length || socialEvents.length;
    if (stateChanged && !app.pressing && !isTyping()) {
      app.renderChrome();
      app.renderView();
      if (ui.pageOpen('game')) TO.views.game.refresh();
      if (ui.pageOpen('combo-goal')) ui.refreshPage('combo-goal');
      const sp = document.querySelector('[data-page="settings"] .page-top .t');
      if (sp && ['Screen time', 'Tier & streak'].includes(sp.textContent)) ui.refreshPage('settings');
    } else {
      app.refreshSlipbar();
    }
  };

  function isTyping() {
    const a = document.activeElement;
    return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'checkbox';
  }

  // ---------- Connection ----------
  /** Red banner while offline; the commitment refuses pledges until the connection returns. */
  function renderNet() {
    const root = ui.root();
    if (!root) return;
    let el = document.getElementById('net-banner');
    if (!el) {
      el = document.createElement('div');
      el.id = 'net-banner';
      el.className = 'net-banner';
      el.setAttribute('role', 'alert');
      el.innerHTML = `${icon('wifiOff', 17)}<span><b>No internet connection.</b> New pledges pause until you're back online.</span>`;
      root.appendChild(el);
    }
    const off = !TO.net.online();
    el.hidden = !off;
    document.body.classList.toggle('is-offline', off);
  }
  app.netChanged = () => {
    renderNet();
    if (ui.sheetOpen('commitment')) ui.refreshSheet('commitment', ['body', 'foot']);
    if (TO.net.online()) ui.toast({ kind: 'win', title: 'Back online', msg: 'Matchup targets are updating again.' });
  };
  window.addEventListener('online', app.netChanged);
  window.addEventListener('offline', app.netChanged);

  // ---------- Core actions ----------
  const A = TO.actions;
  A.tab = (el) => { ui.closeAllSheets(); app.go(el.dataset.tab); };
  A['close-sheet'] = (el) => {
    if (el.dataset.name === 'commitment') {
      TO.comboGoalBuilder.clear();
      ui.closeSheet('commitment');
      app.render();
      return;
    }
    ui.closeSheet(el.dataset.name);
  };
  A['close-page'] = (el) => {
    const name = el.dataset.name;
    ui.closePage(name);
    app.render();
    // Phone shell: the settings list is the menu drawer. Back from a section returns there, not Home.
    if (name === 'settings' && !document.getElementById('side')) TO.views.settings.openDrawer();
  };

  // ---------- Event wiring ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' && el.dataset.act !== 'share-saved') e.preventDefault();
    // A click on a label wrapper shouldn't also fire the nested control's action twice.
    fn(el, e);
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'cfb-group') TO.live.setGroup(e.target.value);
  });
  TO.on('live:updated', () => {
    if (!inShell()) return;
    const resolved = St.resolve(TO.now());
    notifyResolved(resolved);
    if (resolved.length) app.renderChrome();
    if (app.tab === 'home') TO.views.home.refreshLive();
    if (app.tab === 'challenges') app.renderView();
    if (ui.pageOpen('game')) TO.views.game.refresh();
    refreshSlip();
    app.refreshSlipbar();
  });
  TO.on('live:details-updated', () => {
    if (inShell() && app.tab === 'challenges') app.renderView();
  });
  document.addEventListener('input', (e) => { const fn = TO.inputs[e.target.id]; if (fn) fn(e.target); });
  document.addEventListener('change', (e) => { const k = e.target.dataset && e.target.dataset.change; if (k && TO.changes[k]) TO.changes[k](e.target); });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    TO.views.auth.submit(form);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const layer = ui.layer();
    const last = layer.lastElementChild;
    if (!last) return;
    if (last.dataset.sheet) ui.closeSheet(last.dataset.sheet);
    else if (last.dataset.drawer) TO.views.settings.closeDrawer();
    else if (last.dataset.page) A['close-page']({ dataset: { name: last.dataset.page } });
  });
  document.addEventListener('pointerdown', () => { app.pressing = true; });
  document.addEventListener('pointerup', () => { setTimeout(() => { app.pressing = false; }, 60); });
  document.addEventListener('pointercancel', () => { app.pressing = false; });

  /** Server mode: the database decides who is logged in. Re-reads the user on every page load,
   *  so values the server changed (last login, login count) survive a refresh. */
  async function restoreServerSession() {
    if (!TO.api.hasToken()) { St.logout(); return; }
    try {
      const user = await TO.api.me();
      St.adoptServerUser(user, await TO.api.loadState());
    } catch (e) {
      // A dropped connection shouldn't stop the page from opening: keep the session saved on this device.
      if (!(e instanceof TO.AppError)) { console.warn('Could not reach the server:', e); return; }
      // A saved session the server no longer accepts (expired, or its refresh token is gone) just means "logged out", not an error.
      const sessionGone = [400, 401, 403].includes(e.status) || e.code === 'bad_token';
      if (sessionGone) TO.api.clearToken();
      St.logout();
      if (!sessionGone) ui.toast({ kind: 'loss', title: 'Couldn\'t load your account', msg: e.message });
    }
  }

  // A browser session can stay open while pledges are placed in another one. Refresh the
  // shared account snapshot when this tab returns and periodically while it is visible.
  const REMOTE_SYNC_MS = 15000;
  let remoteSyncAt = 0;
  let remoteSync = null;
  function syncRemoteState(force = false) {
    if (!inShell() || document.hidden || !TO.api.configured || !TO.api.hasToken() || !TO.account?.server) return;
    if (remoteSync) return remoteSync;
    if (!force && Date.now() - remoteSyncAt < REMOTE_SYNC_MS - 1000) return;
    remoteSyncAt = Date.now();
    app.syncSocial();
    // Save first, so a change made on this device isn't overwritten by the older copy on the server.
    remoteSync = TO.api.flushState().then(() => TO.api.loadState()).then((state) => {
      if (!state || !inShell()) return;
      St.adoptServerUser(TO.account.server, state);
      app.render();
    }).catch((error) => {
      console.warn('Could not refresh TimeOut data from Supabase:', error.message);
    }).finally(() => { remoteSync = null; });
    return remoteSync;
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncRemoteState(true); });
  window.addEventListener('focus', () => syncRemoteState(true));

  async function start() {
    renderNet();
    if (TO.invites) TO.invites.capture();
    // Arriving from the link in a confirmation email: the URL carries the new session (or why it failed).
    const redirect = TO.api.configured && TO.api.consumeAuthRedirect ? TO.api.consumeAuthRedirect() : null;
    if (await TO.api.init()) await restoreServerSession();
    else St.ensureDemoAccount();
    app.boot();
    if (redirect && redirect.signedIn && TO.account) {
      ui.toast({ kind: 'win', title: 'Email verified', msg: `You're logged in as @${TO.account.username}.` });
    } else if (redirect && redirect.error && !TO.account) {
      TO.views.auth.show('login');
      ui.toast({ kind: 'loss', title: 'That link didn\'t work', msg: `${redirect.error}. Log in, or create your account again to get a new link.`, ms: 8000 });
    }
    setInterval(() => app.tick(false), 1000);
    setInterval(() => syncRemoteState(), REMOTE_SYNC_MS);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(window.TO);

</script>
<script>
/* TimeOut web app — the responsive browser layout. Loaded by index.html, after app.js.
   Same app, data and actions as the app version, laid out for a desktop browser: a sidebar instead of the
   tab bar and menu drawer, a wide content area, and the pledges commitment docked on the right. */
(function (TO) {
  'use strict';
  const { esc, icon, brandMark } = TO;
  const ui = TO.ui;
  const St = TO.state;
  const app = TO.app;
  const A = TO.actions;

  /** Wide enough to dock the pledges commitment on the right. Below this the commitment opens as a dialog. */
  const wide = window.matchMedia('(min-width: 900px)');
  const isWeb = () => !!document.getElementById('side') && !!TO.data;

  const TABS = [
    ['home', 'Home', 'home'],
    ['challenges', 'My Challenges', 'target'],
    ['social', 'Social', 'users'],
  ];
  // Titles match the settings page titles so the open page can be highlighted.
  const MENU = [
    ['screentime', 'Screen time', 'hourglass'],
    ['weekly', 'Weekly report', 'chart'],
    ['sports', 'Sports & races', 'grid'],
    ['notifications', 'Notifications & privacy', 'bell'],
    ['account', 'Account', 'user'],
  ];

  const isAdmin = () => !!TO.admin?.isAdmin();

  app.shellHtml = () => `<div class="app web-shell" id="shell">
      <aside class="side" id="side" aria-label="Main"></aside>
      <div class="side-scrim" data-act="side-toggle"></div>
      <div class="main">
        <header class="topbar web-top" id="topbar"></header>
        <main class="view" id="view" tabindex="-1"></main>
        <div id="commitment-bar-host"></div>
      </div>
      <aside class="rail" id="rail" aria-label="Daily Commitment"></aside>
      <nav id="tabbar" hidden></nav>
    </div>`;

  /** Title of the settings page that's open, if any. */
  function openSection() {
    const t = document.querySelector('[data-page="settings"] .page-top .t');
    return t ? t.textContent : null;
  }

  function sideHtml() {
    const wl = St.wallet();
    const open = TO.data.challenges.filter((b) => b.status === 'open').length;
    const socialBadge = TO.views.social.badge();
    const section = openSection();
    const tabs = TABS.map(([k, label, ic]) => {
      const on = !section && app.tab === k;
      const n = k === 'challenges' ? open : k === 'social' ? socialBadge : 0;
      return `<button class="sn primary ${on ? 'on' : ''}" data-act="tab" data-tab="${k}" title="${label}" aria-current="${on ? 'page' : 'false'}">${icon(ic, 21)}<span class="sn-l">${label}</span>${n ? `<span class="sn-n ${k === 'challenges' ? 'green' : ''}">${n}</span>` : ''}</button>`;
    }).join('');
    const subs = { screentime: `${wl.phoneLeft} min left${wl.streak ? ` · ${wl.streak}-day streak` : ''}` };
    const item = (key, title, ic, cls = '') => {
      const on = section === title;
      return `<button class="sn ${cls} ${on ? 'on' : ''}" data-act="settings" data-section="${key}" title="${title}" aria-current="${on ? 'page' : 'false'}">${icon(ic, 19)}<span class="sn-l">${title}</span>${subs[key] ? `<span class="sn-sub">${subs[key]}</span>` : ''}${(key === 'screentime' && wl.appsLocked) || (key === 'weekly' && TO.weekly.unread()) ? '<span class="sn-dot"></span>' : ''}</button>`;
    };
    return `<div class="side-brand"><div class="brand">${brandMark(21, 'brand-mark')}<span class="brand-word">TIME<b>OUT</b></span></div></div>
      <nav class="side-nav">
        ${tabs}
