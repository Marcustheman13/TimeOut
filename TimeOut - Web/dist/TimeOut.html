      ${tabs.length ? `<div class="challenge-choices">${choices.map((sel) => ui.challengeChoiceButton(sel, { suspended: false, big: true, label: choiceLabel(sel) })).join('')}</div>` : '<div class="tiny faint" style="margin-top:6px">Challenge targets are not available for this game yet.</div>'}`;
    } else {
      const row = (team, score, won) => `<button class="gc-team" style="width:100%" data-act="open-game" data-id="${g.id}">${ui.teamBadge(team)}<span class="nm" style="${won ? '' : 'color:var(--text-2)'}">${esc(team.name)}</span>${g.state === 'final' || g.state === 'live' ? `<span class="sc ${won ? '' : 'trail'}">${score}</span>` : ''}</button>`;
      body = row(g.away, g.awayScore, g.awayScore >= g.homeScore) + row(g.home, g.homeScore, g.homeScore >= g.awayScore);
      if (g.state === 'postponed') body += `<div class="note warn" style="margin-top:6px">${icon('info', 15)}<span>This game was postponed. Any related pledge will be returned.</span></div>`;
    }
    const status = `${ui.gameStatus(g)}${o.suspended && g.state === 'live' ? `<span class="tag">${icon('lock', 10)} Challenges closed</span>` : ''}`;
    return `<div class="card game-card" data-game="${g.id}">
      <div class="gc-status">${status}<span class="lg">${g.otherConferenceLive ? `LIVE · ${esc(g.conferenceName || 'UNRANKED')}` : g.simulated ? 'SIMULATED' : esc(S.LEAGUES[g.league].short)}</span></div>
      ${body}
      <div class="gc-more">${mine.length ? `<span class="your-challenge">${icon('target', 14)} ${mine.length} active challenge${mine.length === 1 ? '' : 's'} here</span>` : '<span></span>'}<button class="row-s link-btn" style="font-size:12.5px" data-act="open-game" data-id="${g.id}">Stats & challenge details ${icon('chevR', 14)}</button></div>
    </div>`;
  }

  function emptyBoard(f) {
    const day = activeDay();
    const when = day === 0 ? 'today' : day === 1 ? 'tomorrow' : `on ${dayLabel(day)}`;
    const loading = day > 0 && TO.live.upcomingLoading;
    const isLive = liveOnly();
    const title = isLive ? (f === 'all' ? 'No live games right now' : `No live ${esc(filterName())} games right now`) : loading ? 'Loading the schedule…' : `Sorry, no games are happening for this sport ${when}.`;
    const next = !isLive && !loading ? Array.from({ length: TO.live.days + 1 }, (_, i) => i).find((i) => i !== day && boardGames(i, true).some((g) => f === 'all' || g.league === f)) : null;
    if (TO.live.failed) {
      return `<div class="empty">${icon('alert', 40)}<h3>Sports couldn’t load</h3><p>Check your connection and try again.</p><button class="btn primary" data-act="refresh-live">Try again</button></div>`;
    }
    return `<div class="empty">
      ${icon(loading ? 'clock' : 'target', 40)}
      <h3>${title}</h3>
      ${isLive ? '<p>Check back when a game is underway.</p><button class="btn primary" data-act="feed-live-off">Show all games</button>' : ''}
      ${next != null ? `<button class="btn primary" data-act="feed-day" data-day="${next}">See games ${next === 1 ? 'tomorrow' : `on ${esc(dayLabel(next))}`}</button>` : ''}
    </div>`;
  }

  function buildComboControl() {
    const builder = TO.comboGoalBuilder;
    if (!builder.comboGoalMode) return `<button class="build-combo-goal" data-act="toggle-combo-goal">${icon('target', 18)}<span><b>Build a Combo Goal</b><small>Link choices from up to four matchups</small></span>${icon('chevR', 18)}</button>`;
    return `<div class="build-combo-goal active"><span class="lr-icon">${icon('target', 18)}</span><span class="grow"><b>Choose Combo Goal picks</b><small>${builder.selectedPicks.length} of ${TO.RULES.maxMatchupPicks} choices · one per matchup</small></span><button class="link-btn" data-act="toggle-combo-goal">Cancel</button></div>`;
  }

  function feed(games) {
    const f = activeFilter();
    let list = f === 'all' ? games : games.filter((g) => g.league === f);
    if (liveOnly()) list = list.filter((g) => g.state === 'live');
    if (!list.length && f !== 'pred' && f !== 'todo') return emptyBoard(f);
    if (f === 'all') {
      const groups = S.LEAGUE_ORDER.filter((l) => l !== 'sim' && list.some((g) => g.league === l)).map((l) => {
        const lg = list.filter((g) => g.league === l);
        return `<div class="league-head"><h3>${esc(S.LEAGUES[l].title)}</h3>${S.LEAGUES[l].simulated ? '<span class="tag">Simulated</span>' : ''}<span class="cnt">${lg.filter((g) => g.state === 'live').length} live · ${lg.length} games</span></div>${lg.map(gameCard).join('')}`;
      });
      return groups.join('');
    }
    return list.map(gameCard).join('');
  }

  /** The big prompt at the top of Home until app limits are set up. A browser can't block apps, so the real block is in the iPhone app. */
  function setupBanner() {
    const s = TO.data.settings;
    const hasLocks = s.lockedApps.length > 0 || s.deviceLockPoints > 0;
    if (s.enforce && hasLocks) return '';
    const title = hasLocks ? 'App limits are off' : 'Set up your app limits';
    const text = hasLocks
      ? 'Your apps won\'t lock when your phone time runs out, and your tier stays at Rookie.'
      : 'Choose the apps TimeOut locks when your phone time runs out. It takes about 30 seconds. Real blocking happens in the TimeOut iPhone app.';
    const action = hasLocks ? 'Turn limits back on' : 'Choose apps';
    return `<div class="setup-banner"><div class="row" style="align-items:flex-start"><span class="sb-icon">${icon('shield', 20)}</span><div class="grow"><b>${title}</b><p>${text}</p></div></div><button class="btn primary full" data-act="${hasLocks ? 'setup-limits-on' : 'locked-apps'}">${action}</button></div>`;
  }

  function render() {
    const wl = TO.state.wallet();
    const games = boardGames();
    const lock = wl.appsLocked
      ? `<button class="app-lock" data-act="settings" data-section="screentime">${icon('phone', 22, 'red')}<span class="grow"><b class="red">Your locked apps are blocked</b><div class="small muted">You've used all ${wl.todayLimit} min of today's phone time. Emergency unlocks are in Settings.</div></span>${icon('chevR', 16)}</button>`
      : '';
    return `<div class="stack home" style="padding-top:2px">
      ${setupBanner()}
      ${walletCard(wl)}
      ${lock}
      ${statusStrip(wl)}
      ${openChallengesStrip()}
      <div class="stack feed" style="gap:12px">
        ${filterBar(games)}
        ${buildComboControl()}
        ${TO.live.offline ? `<div class="note blue simulated-note">${icon('info', 16)}<span>Live matchup targets can't be reached here, so these are simulated games with real team names. Everything else works the same.</span></div>` : ''}
        ${feed(games)}
      </div>
    </div>`;
  }

  function syncNode(current, fresh) {
    if (!current || !fresh || current.nodeType !== fresh.nodeType
      || (current.nodeType === 1 && current.tagName !== fresh.tagName)) {
      current?.parentNode?.replaceChild(fresh.cloneNode(true), current);
      return;
    }
    if (current.nodeType === 3) {
      if (current.nodeValue !== fresh.nodeValue) current.nodeValue = fresh.nodeValue;
      return;
    }
    const currentAttrs = [...current.attributes];
    for (const attr of currentAttrs) if (!fresh.hasAttribute(attr.name)) current.removeAttribute(attr.name);
    for (const attr of [...fresh.attributes]) if (current.getAttribute(attr.name) !== attr.value) current.setAttribute(attr.name, attr.value);
    const next = [...fresh.childNodes];
    for (let i = 0; i < next.length; i++) {
      const old = current.childNodes[i];
      if (!old) current.appendChild(next[i].cloneNode(true));
      else syncNode(old, next[i]);
    }
    while (current.childNodes.length > next.length) current.lastChild.remove();
  }

  function refreshLive() {
    const view = document.getElementById('view');
    if (!view || TO.app.tab !== 'home' || !view.firstElementChild) return;
    const next = document.createElement('div');
    next.innerHTML = render();
    if (next.firstElementChild) syncNode(view.firstElementChild, next.firstElementChild);
  }

  TO.views.home = { render, gameCard, refreshLive, boardGames, dayBar };

  // ---------- Actions ----------
  const A = TO.actions;
  A['challenge-tab'] = (el) => { activeChallenge.set(el.dataset.game, el.dataset.market); TO.app.renderView(); };
  A['feed-day'] = (el) => {
    feedDay = Number(el.dataset.day) || 0;
    TO.app.render();
    if (TO.ui.pageOpen('combo-goal')) TO.ui.refreshPage('combo-goal');
    const v = document.getElementById('view');
    const fb = v && v.querySelector('.filterbar');
    if (fb && v.scrollTop > fb.offsetTop) v.scrollTop = fb.offsetTop;
  };
  A.filter = (el) => { TO.data.feedFilter = el.dataset.f; TO.state.save(); TO.app.render(); const v = document.getElementById('view'); const fb = v.querySelector('.filterbar'); if (fb && v.scrollTop > fb.offsetTop) v.scrollTop = fb.offsetTop; };
  const setLive = (on) => {
    TO.data.feedLive = on;
    TO.state.save();
    TO.app.render();
    const v = document.getElementById('view');
    const fb = v && v.querySelector('.filterbar');
    if (fb && v.scrollTop > fb.offsetTop) v.scrollTop = fb.offsetTop;
  };
  A['feed-live'] = () => setLive(!liveOnly());
  A['feed-live-off'] = () => setLive(false);
  A['setup-limits-on'] = () => { TO.state.setSetting('enforce', true); TO.app.render(); };
  A['refresh-live'] = () => TO.live.refresh(TO.now(), true);
  A['go-sim'] = () => {
    if (!followed().includes('sim')) TO.state.setSetting('sports', [...followed(), 'sim']);
    TO.data.feedFilter = 'sim';
    TO.state.save();
    TO.app.render();
  };
  A.how = () => TO.views.settings.howItWorks();
})(window.TO);

</script>
<script>
/* TimeOut web demo — Game detail (Screen 2): live score, stats, research and every market. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;

  let currentId = null;
  const activeMarket = new Map();

  function scoreboard(g) {
    const live = g.state === 'live', fin = g.state === 'final';
    const showScore = live || fin;
    const aTrail = g.awayScore < g.homeScore, hTrail = g.homeScore < g.awayScore;
    let mid;
    if (showScore) {
      mid = `<div class="sb-score"><span class="${aTrail ? 'trail' : ''}">${g.awayScore}</span><span class="dash">–</span><span class="${hTrail ? 'trail' : ''}">${g.homeScore}</span></div>
        <div class="sb-clock">${live ? `<span class="live">LIVE</span>${esc(g.clock)}` : esc(g.statusText)}</div>`;
    } else if (g.state === 'postponed' || g.state === 'canceled') {
      mid = `<div class="tag yellow" style="height:26px;font-size:12px">${g.state === 'canceled' ? 'Canceled' : 'Postponed'}</div>`;
    } else {
      mid = `<div class="display" style="font-size:26px">${TO.fmtTime(g.start)}</div><div class="sb-clock">${TO.fmtDay(g.start)} · in ${TO.fmtIn(g.start - TO.now())}</div>`;
    }
    const team = (t) => `<div class="sb-team">${ui.teamBadge(t, 52)}<div class="nm">${esc(!t.city || t.city === t.name ? t.name : `${t.city} ${t.name}`)}</div>${t.rank ? `<div class="rec">#${t.rank}</div>` : ''}</div>`;
    return `<div class="card scoreboard">
      <div class="row-layout tiny bold faint" style="margin-bottom:12px"><span>${esc(S.LEAGUES[g.league].title)}${g.simulated ? ' · Simulated' : ''}</span><span>Away @ Home</span></div>
      <div class="sb-grid">${team(g.away)}<div class="sb-mid">${mid}</div>${team(g.home)}</div>
    </div>`;
  }

  function banner(g, o) {
    if (g.state === 'postponed') return `<div class="note warn">${icon('alert', 16)}<span><b>This game was postponed.</b> Related pledges will be returned in full and won't affect your record.</span></div>`;
    if (g.state === 'canceled') return `<div class="note warn">${icon('alert', 16)}<span>This game was canceled. Related pledges will be returned.</span></div>`;
    if (g.state === 'final') return `<div class="note">${icon('lock', 16)}<span><b>Final: ${esc(g.away.abbr)} ${g.awayScore}, ${esc(g.home.abbr)} ${g.homeScore}${g.ot ? ` (${g.ot.label === '10' ? '10 innings' : 'OT'})` : ''}.</b> Challenges are closed on this game.</span></div>`;
    if (o.suspended) return `<div class="note">${icon('lock', 16)}<span>Challenges are closed for the final moments of this game.</span></div>`;
    return '';
  }

  function myChallenges(g) {
    const challenges = TO.data.challenges.filter((b) => b.picks.some((l) => l.gameId === g.id)).sort((a, b) => (a.status === 'open' ? -1 : 1) - (b.status === 'open' ? -1 : 1));
    if (!challenges.length) return '';
    return `<div class="stack-s"><div class="eyebrow">Your pledges on this game</div>${challenges.map((b) => TO.views.challenges.challengeCard(b, { compact: true })).join('')}</div>`;
  }

  function markets(g, o) {
    if (g.state !== 'live' && g.state !== 'scheduled') return '';
    const tabs = [['winner','Match Winner',o.winner],['margin','Margin',o.margin],['total','Total Points',o.total]].filter(([, , sels]) => sels.filter((s) => s.side !== 'draw').length >= 2);
    const current = tabs.find(([key]) => key === activeMarket.get(g.id)) || tabs[0];
    if (!current) return `<div class="card small muted">Challenge targets are not available for this game yet.</div>`;
    const choices = current[2].filter((s) => s.side !== 'draw').slice(0, 2);
    const label = (s) => {
      const team = s.side === 'away' ? g.away.name : g.home.name;
      if (s.market === 'winner') return `${team} · Outright Winner`;
      if (s.market === 'margin') return s.line < 0 ? `${team} to win by ${Math.ceil(Math.abs(s.line))}+` : `${team} to stay within ${Math.floor(s.line)}`;
      return `${s.side === 'higher' ? 'Total Score Over' : 'Total Score Under'} ${s.line}`;
    };
    return `<div class="card stack" id="game-markets">
      <div class="row-layout"><h2 style="margin:0;font-size:17px">Matchup Challenge</h2><span class="tiny faint bold">Targets refresh every 25 seconds</span></div>
      <div class="challenge-tabs" role="tablist" aria-label="Challenge type">${tabs.map(([key,title]) => `<button role="tab" aria-selected="${current[0] === key}" class="${current[0] === key ? 'on' : ''}" data-act="game-challenge-tab" data-game="${esc(g.id)}" data-market="${key}">${title}</button>`).join('')}</div>
      <div class="challenge-choices">${choices.map((s) => ui.challengeChoiceButton(s, { suspended: o.suspended, big: true, label: label(s) })).join('')}</div>
      <div class="tiny faint">Choose an option to add it to your Daily Commitment.</div>
    </div>`;
  }

  function statsCard(g) {
    if (!g.eventID) return '';
    const rows = TO.live.stats(g);
    if (!rows.length) return `<div class="card small muted">ESPN live stats are not available for this game yet.</div>`;
    return `<div class="card stack">
      <div class="row-layout"><h2 style="margin:0;font-size:17px">${g.state === 'live' ? 'Live stats' : 'Final stats'}</h2><span class="row-s tiny bold faint">${ui.teamBadge(g.away, 18)} vs ${ui.teamBadge(g.home, 18)}</span></div>
      ${rows.map((r) => {
        return `<div class="cmp-row"><span class="v">${esc(r.awayValue)}</span><div class="mid"><span class="lab">${esc(r.label)}</span></div><span class="v r">${esc(r.homeValue)}</span></div>`;
      }).join('')}
    </div>`;
  }

  function researchCard(g) {
    const teams = g.eventID ? [g.away, g.home].filter((team) => team.rank || team.record) : [];
    if (!teams.length) return '';
    return `<div class="card stack"><h2 style="margin:0;font-size:17px">ESPN team information</h2>${teams.map((team) => `<div class="row-layout"><span class="row-s bold">${ui.teamBadge(team, 22)}${esc(team.name)}</span><span class="small muted">${[team.rank ? `#${team.rank}` : '', team.record || ''].filter(Boolean).map(esc).join(' · ')}</span></div>`).join('')}</div>`;
  }

  /** Floating button: jumps to the challenge targets, or back to the commitment once there's a pick on it. */
  function fab(g, o) {
    if (g.state !== 'live' && g.state !== 'scheduled') return '';
    const n = TO.comboGoalBuilder.selectedPicks.length;
    if (n) return `<div class="page-fab game-fab has-commitment"><button class="btn primary full" data-act="open-commitment">${icon('target', 18)} Open Daily Commitment · ${n} choice${n === 1 ? '' : 's'}</button></div>`;
    return `<div class="page-fab game-fab"><button class="btn primary full" data-act="game-challenge" ${o.suspended ? 'disabled' : ''}>${icon(o.suspended ? 'lock' : 'target', 18)} ${o.suspended ? 'Challenges are closed' : 'Choose a challenge'}</button></div>`;
  }

  function render() {
    const g = S.game(currentId);
    const o = S.pointValue(currentId);
    return {
      title: `${esc(g.away.abbr)} @ ${esc(g.home.abbr)}`,
      body: `${scoreboard(g)}${banner(g, o)}${myChallenges(g)}${markets(g, o)}${statsCard(g)}${researchCard(g)}${fab(g, o)}`,
    };
  }

  function open(id) {
    currentId = id;
    ui.openPage('game', { render });
    if (S.game(id)?.eventID) TO.live.loadDetails(id);
  }

  TO.on('live:details-updated', (id) => { if (id === currentId && ui.pageOpen('game')) TO.views.game.refresh(); });

  TO.views.game = { open, refresh: () => ui.refreshPage('game') };
  TO.actions['open-game'] = (el) => open(el.dataset.id);
  TO.actions['game-challenge-tab'] = (el) => { activeMarket.set(el.dataset.game, el.dataset.market); ui.refreshPage('game'); };
  TO.actions['game-challenge'] = () => {
    const m = document.getElementById('game-markets');
    if (!m) return;
    m.scrollIntoView({ behavior: 'smooth', block: 'start' });
    m.classList.remove('flash');
    void m.offsetWidth; // restart the highlight
    m.classList.add('flash');
    ui.toast({ kind: 'info', title: 'Choose a challenge', msg: 'Select an option to add it to your Daily Commitment.', ms: 2600 });
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — My pledges (Screen 4), pledges sharing and to-do Combo Goals. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;

  const view = { tab: 'open', filter: 'all' };

  // Minutes a win would add, after the 120-minute cap.
  const toWin = (b) => Math.max(0, Math.min(b.pledgeMinutes + Math.round((Math.round(b.pledgeMinutes * b.decimal) - b.pledgeMinutes) * (b.multiplier || 1)), TO.MAX_ALLOWED_MINUTES) - b.pledgeMinutes);
  const challengeTitle = (b) => (b.kind === 'todo' ? `To-do Combo Goal · ${b.picks.length} task${b.picks.length === 1 ? '' : 's'}` : b.picks.length > 1 ? `${b.picks.length}-pick Combo Goal` : b.picks[0].label);

  function pickStanding(pick) {
    if (pick.result !== 'pending') return pick.result;
    if (pick.kind === 'todo') return 'upcoming';
    if (pick.kind === 'race') {
      const race = TO.races.get(pick.raceId);
      if (!race || race.status === 'open') return 'upcoming';
      if (race.status === 'running') return race.winnerId === Number(pick.horseId) ? 'winning' : 'losing';
      return 'even';
    }
    return S.liveStanding(pick);
  }

  function standingTag(st) {
    const map = { winning: ['Winning right now', 'trend'], losing: ['Losing right now', 'trend'], even: ['Too close to call', 'minus'], upcoming: ['Not started', 'clock'], void: ['Voided', 'x'] };
    const [t, ic] = map[st] || map.upcoming;
    return `<span class="standing ${st}">${icon(ic, 13)}${t}</span>`;
  }

  function overallStanding(pledge) {
    const sts = pledge.picks.filter((l) => l.result === 'pending').map(pickStanding);
    if (sts.includes('losing')) return 'losing';
    if (sts.length && sts.every((s) => s === 'winning')) return 'winning';
    if (sts.every((s) => s === 'upcoming')) return 'upcoming';
    return 'even';
  }

  /** Live score + key stats for a pick, so users can follow a pledges without leaving My pledges. */
  function liveBox(pick) {
    if (pick.kind === 'race') {
      const race = TO.races.get(pick.raceId);
      const horse = TO.races.horse(pick.horseId);
      const status = !race ? 'Race result unavailable' : race.status === 'open' ? 'Challenges open' : race.status === 'running' ? 'Race in progress' : `Race #${race.number} finished`;
      const leader = race && race.status === 'running' ? TO.races.horse(race.winnerId).name : '';
      return `<div class="livebox"><div class="row-layout small"><b>${esc(horse.name)} · ${esc(pick.matchup)}</b><span class="${race && race.status === 'running' ? 'live' : 'muted'}">${esc(status)}</span></div>${leader ? `<div class="small muted" style="margin-top:4px">Current leader: ${esc(leader)}</div>` : ''}</div>`;
    }
    if (pick.kind === 'pred') {
      const p = S.prediction(pick.predId);
      const chance = Math.round((pick.side === 'yes' ? p.pYes : 1 - p.pYes) * 100);
      return `<div class="livebox"><div class="small muted">${esc(p.q)}</div><div class="row-layout small"><span class="bold">${chance}% chance your side hits</span><span class="faint bold">${p.state === 'resolved' ? `Resolved ${p.outcome.toUpperCase()}` : `Resolves in ${TO.fmtIn(p.resolves - TO.now())}`}</span></div></div>`;
    }
    const g = S.game(pick.gameId);
    if (!g) return `<div class="livebox"><div class="small bold">${esc(pick.matchup || 'Sports game')}</div><div class="small muted">Loading the latest score…</div></div>`;
    let head;
    if (g.state === 'live' || g.state === 'final') {
      head = `<div class="lb-score">${ui.teamBadge(g.away, 22)}<span>${esc(g.away.abbr)}</span><span class="sc">${g.awayScore}</span><span class="faint">–</span><span class="sc">${g.homeScore}</span><span>${esc(g.home.abbr)}</span>${ui.teamBadge(g.home, 22)}<span style="margin-left:auto" class="small ${g.state === 'live' ? '' : 'muted'}">${g.state === 'live' ? `<span class="live">LIVE</span> ${esc(g.clock)}` : esc(g.statusText)}</span></div>`;
    } else if (g.state === 'postponed') {
      head = `<div class="lb-score">${esc(g.away.name)} @ ${esc(g.home.name)}<span class="tag yellow" style="margin-left:auto">Postponed</span></div>`;
    } else {
      head = `<div class="lb-score">${ui.teamBadge(g.away, 22)}${esc(g.away.abbr)} @ ${esc(g.home.abbr)}${ui.teamBadge(g.home, 22)}<span style="margin-left:auto" class="small muted">${TO.fmtDay(g.start)} ${TO.fmtTime(g.start)} · in ${TO.fmtIn(g.start - TO.now())}</span></div>`;
    }
    if (g.eventID) TO.live.loadDetails(g.id);
    const stats = g.eventID ? TO.live.stats(g).slice(0, 3) : [];
    const statsHtml = stats.length && g.state === 'live' ? `<div class="lb-stats">${stats.map((r) => `<span>${esc(r.label)} <b>${esc(r.awayValue)}–${esc(r.homeValue)}</b></span>`).join('')}</div>` : '';
    return `<div class="livebox" data-act="open-game" data-id="${g.id}" style="cursor:pointer">${head}${statsHtml}</div>`;
  }

  function nowPointValue(pick) {
    if (pick.result !== 'pending' || pick.kind === 'todo') return '';
    const cur = S.currentSelection(pick.selId);
    if (!cur || !cur.sel) return '';
    if (!cur.open) return `<span class="tag">Challenges closed</span>`;
    if (cur.sel.price === pick.price && cur.sel.line === pick.line) return `<span class="tag">Target now ${TO.multiplierText(cur.sel.price)}</span>`;
    const improved = TO.convertPointValueToMultiplier(cur.sel.price) > TO.convertPointValueToMultiplier(pick.price);
    return `<span class="tag ${improved ? 'green' : 'red'}">Target now ${TO.multiplierText(cur.sel.price)}</span>`;
  }

  function openCard(pledge, opts) {
    const single = pledge.picks.length === 1;
    const st = pledge.kind === 'todo' ? null : overallStanding(pledge);
    let picks;
    if (pledge.kind === 'todo') {
      picks = pledge.picks.map((l, i) => `<div class="pick" style="align-items:center">
        <button class="checkbox ${l.result === 'won' ? 'on' : ''}" data-act="todo-done" data-pledge="${pledge.id}" data-i="${i}" ${l.result === 'won' ? 'disabled' : ''} aria-label="Mark done">${icon('check', 15)}</button>
        <div class="grow"><div class="lt" style="${l.result === 'won' ? 'text-decoration:line-through;color:var(--text-2)' : ''}">${esc(l.text)}</div><div class="lm">${esc(l.difficulty)} · ${TO.multiplierText(l.price)}${l.result === 'won' ? ` · ${esc(l.final)}` : ''}</div></div></div>`).join('');
      picks += `<div class="note">${icon('clock', 15)}<span>Finish every task before midnight (${ui.countdownEl(pledge.deadline)} left). Tap a box when it's done. Honor system.</span></div>`;
    } else if (single) {
      const pick = pledge.picks[0];
      picks = `${liveBox(pick)}<div class="row-layout">${standingTag(st)}${nowPointValue(pick)}</div>`;
    } else {
      picks = pledge.picks.map((l) => {
        const ls = pickStanding(l);
        const dotIc = { won: 'check', lost: 'x', void: 'minus', tie: 'minus', winning: 'trend', losing: 'trend' }[ls] || 'clock';
        return `<div class="pick"><span class="pick-dot ${ls}">${icon(dotIc, 12)}</span><div class="grow stack-s" style="gap:6px"><div><div class="lt">${esc(l.label)} <span class="faint" style="font-weight:600">${TO.multiplierText(l.price)}</span></div><div class="lm">${esc(l.marketLabel)} · ${esc(l.matchup)}</div></div>${l.result === 'pending' ? liveBox(l) : `<div class="lm bold">${esc(l.final || '')}</div>`}</div></div>`;
      }).join('') + `<div class="row-layout">${standingTag(st)}${pledge.insured ? '<span class="tag" style="color:var(--purple)">Insured</span>' : ''}</div>`;
    }
    const sub = pledge.kind === 'todo' ? 'Personal task goal' : single ? `${esc(pledge.picks[0].marketLabel)} · ${esc(pledge.picks[0].matchup)}` : 'Complete each selected target';
    const pledgeRow = `<div class="pledge-row"><div><b>${pledge.pledgeMinutes}</b><span>Min committed</span></div><div><b class="green">+${toWin(pledge)}</b><span>Target earned minutes</span></div><div><b>${TO.fmtTime(pledge.placedAt)}</b><span>Started ${TO.fmtDay(pledge.placedAt).toLowerCase()}</span></div></div>`;
    const perks = [pledge.boosted ? `<span class="tag blue">${icon('bolt', 10)} Boosted</span>` : '', pledge.multiplier > 1 && !pledge.boosted ? `<span class="tag green">${TO.state.fmtMult(pledge.multiplier)} streak</span>` : ''].join('');
    const actions = opts && opts.compact ? '' : `<div class="pledge-actions">
      ${pledge.kind !== 'todo' ? `<button class="btn sm ghost" data-act="share" data-pledge="${pledge.id}">${icon('share', 16)} Share</button>` : ''}
    </div>`;
    return `<div class="card pledge-card">
      <div class="pledge-top"><div class="grow"><div class="t">${esc(challengeTitle(pledge))}</div><div class="small muted" style="margin-top:2px">${sub}</div></div><div class="multiplier">${TO.multiplierText(TO.pointValue.fromDecimal(pledge.decimal))}</div></div>
      ${perks ? `<div class="row-s">${perks}</div>` : ''}
      ${picks}
      ${pledgeRow}
      ${actions}
    </div>`;
  }

  function historyCard(pledge, opts) {
    const single = pledge.picks.length === 1;
    let result;
    if (pledge.status === 'won') result = `<span class="display green" style="font-size:22px">+${pledge.reward - pledge.pledgeMinutes} min</span>`;
    else if (pledge.status === 'lost') result = `<span class="display red" style="font-size:22px">−${pledge.pledgeMinutes} min</span>`;
    else result = `<span class="small bold muted">${pledge.insurancePaid ? 'Miss-one protection returned your minutes' : 'Committed minutes returned'} · ${pledge.pledgeMinutes} min</span>`;
    const picks = pledge.picks.map((l) => `<div class="pick"><span class="pick-dot ${l.result}">${icon({ won: 'check', lost: 'x' }[l.result] || 'minus', 12)}</span><div class="grow"><div class="lt">${esc(l.label)} <span class="faint" style="font-weight:600">${TO.multiplierText(l.price)}</span></div><div class="lm">${esc(l.kind === 'todo' ? l.marketLabel : l.matchup)}${l.final ? ` · <b>${esc(l.final)}</b>` : ''}</div></div></div>`).join('');
    const why = pledge.status === 'void' ? `<div class="note warn">${icon('info', 15)}<span>${pledge.kind === 'todo' ? '' : 'The game was postponed or cancelled, so your committed minutes were returned.'}</span></div>` : '';
    return `<div class="card pledge-card">
      <div class="pledge-top"><div class="grow"><div class="row-s" style="margin-bottom:4px">${ui.statusPill(pledge.status)}${single ? '' : `<span class="tag">${pledge.kind === 'todo' ? 'To-do' : 'Combo Goal'}</span>`}</div><div class="t">${esc(challengeTitle(pledge))}</div></div><div style="text-align:right"><div class="multiplier" style="font-size:16px">${TO.multiplierText(TO.pointValue.fromDecimal(pledge.decimal))}</div>${result}</div></div>
      ${picks}
      ${why}
      <div class="row-layout tiny faint bold"><span>${pledge.pledgeMinutes} min committed · started ${TO.fmtDay(pledge.placedAt)} ${TO.fmtTime(pledge.placedAt)}</span><span>Updated ${TO.ago(pledge.resolvedAt)}</span></div>
      ${opts && opts.compact ? '' : pledge.kind !== 'todo' ? `<div class="pledge-actions"><button class="btn sm ghost" data-act="share" data-pledge="${pledge.id}">${icon('share', 16)} Share</button></div>` : ''}
    </div>`;
  }

  const challengeCard = (pledge, opts) => (pledge.status === 'open' ? openCard(pledge, opts) : historyCard(pledge, opts));
  const gamePick = (pick) => pick.kind === 'race' || pick.kind === 'game' || (pick.kind === 'sports' && !!pick.gameId);
  const isLiveChallenge = (pledge) => pledge.picks.some((pick) => pick.result === 'pending' && (pick.kind === 'race' ? TO.races.get(pick.raceId)?.status === 'running' : gamePick(pick) && S.game(pick.gameId)?.state === 'live'));

  function recordCard() {
    const st = TO.state.myStats();
    const wl = TO.state.wallet();
    const sports = Object.entries(st.bySport).sort((a, b) => (b[1].w + b[1].l) - (a[1].w + a[1].l)).slice(0, 5);
    const maxAbs = Math.max(1, ...sports.map(([, v]) => Math.abs(v.net)));
    return `<div class="card record-card stack">
      <div class="row-layout"><h2 style="margin:0;font-size:17px">Your record</h2>${st.recent.length ? `<span class="form-dots">${st.recent.map((x) => `<i class="${x}">${x}</i>`).join('')}</span>` : ''}</div>
      <div class="record-big">
        <div><b>${st.w}-${st.l}${st.v ? `-${st.v}` : ''}</b><span>Won-Lost${st.v ? '-Void' : ''}</span></div>
        <div><b>${st.pct === null ? '—' : `${st.pct}%`}</b><span>Win rate</span></div>
        <div><b class="${st.net > 0 ? 'green' : st.net < 0 ? 'red' : ''}">${TO.signed(st.net)}</b><span>Total minutes</span></div>
      </div>
      ${sports.length ? `<div class="sport-bars">${sports.map(([k, v]) => `<div class="sport-bar"><span class="muted">${esc(ui.leagueShort(k))}</span><div class="bar"><i class="${v.net < 0 ? 'neg' : ''}" style="width:${(Math.abs(v.net) / maxAbs) * 100}%"></i></div><span style="text-align:right" class="${v.net > 0 ? 'green' : v.net < 0 ? 'red' : 'muted'}">${TO.signedMin(v.net)}</span></div>`).join('')}</div>` : ''}
      <div class="row-layout small muted"><span>Today: <b class="${wl.todayNet > 0 ? 'green' : wl.todayNet < 0 ? 'red' : ''}">${TO.signedMin(wl.todayNet)}</b> so far</span></div>
    </div>`;
  }

  function render() {
    const challenges = TO.data.challenges.filter((b) => (b.kind === 'sports' || b.kind === 'race') && b.picks.length && b.picks.every(gamePick));
    const open = challenges.filter((b) => b.status === 'open').sort((a, b) => b.placedAt - a.placedAt);
    const liveNow = open.filter(isLiveChallenge);
    const otherOpen = open.filter((b) => !isLiveChallenge(b));
    let resolved = challenges.filter((b) => b.status !== 'open').sort((a, b) => b.resolvedAt - a.resolvedAt);
    const counts = { all: resolved.length, won: 0, lost: 0, void: 0 };
    resolved.forEach((b) => { if (b.status === 'won') counts.won++; else if (b.status === 'lost') counts.lost++; else counts.void++; });
    if (view.filter !== 'all') resolved = resolved.filter((b) => (view.filter === 'void' ? b.status === 'void' || b.status === 'tie' : b.status === view.filter));

    let list;
    if (view.tab === 'open') {
      list = open.length
        ? `${liveNow.length ? `<div class="eyebrow row-s" style="padding:2px 16px;margin-top:4px"><span class="live"></span>Live now <span class="count-pill">${liveNow.length}</span></div>${liveNow.map((b) => openCard(b)).join('')}` : ''}${otherOpen.length ? `<div class="eyebrow" style="padding:2px 16px;margin-top:4px">Upcoming</div>${otherOpen.map((b) => openCard(b)).join('')}` : ''}`
        : `<div class="empty">${icon('target', 40)}<h3>No active challenges</h3><p>Choose a challenge target from a matchup to start a pledge.</p><button class="btn primary" data-act="tab" data-tab="home">Find a matchup</button></div>`;
    } else {
      const chip = (k, t) => `<button class="chip sm ${view.filter === k ? 'on' : ''}" data-act="challenges-filter" data-f="${k}">${t}<span class="n">${counts[k]}</span></button>`;
      list = `<div class="hscroll">${chip('all', 'All')}${chip('won', 'Won')}${chip('lost', 'Lost')}${chip('void', 'Voided')}</div>`
        + (resolved.length ? resolved.map((b) => historyCard(b)).join('') : `<div class="empty">${icon('chart', 40)}<h3>${challenges.length ? 'Nothing here yet' : 'No completed challenges yet'}</h3><p>Completed challenges appear here after the matchup ends.</p>${challenges.length ? '' : '<button class="btn primary" data-act="tab" data-tab="home">Choose your first challenge</button>'}</div>`);
    }
    return `<div class="page-head"><h1>My Challenges</h1><p>Follow active challenges and review your earned minutes.</p></div>
      <div class="stack">
        ${recordCard()}
        <div class="pad"><div class="seg">
          <button class="${view.tab === 'open' ? 'on' : ''}" data-act="challenges-tab" data-t="open">Active <span class="count-pill ${open.length ? '' : 'off'}">${open.length}</span></button>
          <button class="${view.tab === 'history' ? 'on' : ''}" data-act="challenges-tab" data-t="history">Completed <span class="count-pill off">${counts.all}</span></button>
        </div></div>
        ${list}
      </div>`;
  }

  TO.views.challenges = { render, challengeCard, challengeTitle, toWin, view };
  TO.views.challenges = TO.views.challenges;

  // ---------- Share ----------
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrapText(ctx, text, x, y, maxW, lineH, maxLines = 3) {
    const words = String(text).split(' ');
    let line = '', lines = 0;
    for (let i = 0; i < words.length; i++) {
      const test = line ? `${line} ${words[i]}` : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x, y); y += lineH; line = words[i]; lines++;
        if (lines >= maxLines - 1) { line = words.slice(i).join(' '); break; }
      } else line = test;
    }
    ctx.fillText(line, x, y);
    return y + lineH;
  }

  /** Draws the share image: teams, pick, challenge targets and pledge (PRD pledges sharing requirement). */
  async function drawShare(pledge) {
    try { await document.fonts.ready; } catch (e) { /* ignore */ }
    const W = 1080, H = 1350;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    const D = '"Barlow Condensed", "Arial Narrow", sans-serif', B = 'Barlow, Arial, sans-serif';
    ctx.fillStyle = '#0a0d12'; ctx.fillRect(0, 0, W, H);
    const glow = ctx.createRadialGradient(W * 0.85, 60, 10, W * 0.85, 60, 700);
    glow.addColorStop(0, 'rgba(34,214,110,0.28)'); glow.addColorStop(1, 'rgba(34,214,110,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    // Wordmark
    ctx.font = `italic 900 84px ${D}`;
    ctx.fillStyle = '#f2f5f9'; ctx.fillText('Time', 80, 150);
    const tw = ctx.measureText('Time').width;
    ctx.fillStyle = '#22d66e'; ctx.fillText('Out', 80 + tw, 150);
    ctx.font = `700 30px ${B}`; ctx.fillStyle = '#8c96a8';
    ctx.fillText(`@${TO.account.username}'s pledge`, 80, 200);

    // Status pill
    const status = pledge.status.toUpperCase();
    const pillColor = { OPEN: '#1d2430', WON: '#22d66e', LOST: '#ff5a5f', VOID: '#5e687a', PUSH: '#5e687a' }[status];
    ctx.font = `900 30px ${B}`;
    const pw = ctx.measureText(status).width + 48;
    roundRect(ctx, W - 80 - pw, 104, pw, 56, 28); ctx.fillStyle = pillColor; ctx.fill();
    ctx.fillStyle = status === 'WON' ? '#03140a' : '#fff'; ctx.fillText(status, W - 80 - pw + 24, 143);

    // Card
    roundRect(ctx, 60, 260, W - 120, 800, 44); ctx.fillStyle = '#141922'; ctx.fill();
    ctx.strokeStyle = '#283141'; ctx.lineWidth = 3; ctx.stroke();

    let y = 340;
    const single = pledge.picks.length === 1 && pledge.picks[0].kind === 'game' && !!S.game(pledge.picks[0].gameId);
    if (single) {
      const g = S.game(pledge.picks[0].gameId);
      if (!g) return null;
      const disc = (team, cx) => {
        ctx.beginPath(); ctx.arc(cx, y + 90, 90, 0, Math.PI * 2); ctx.fillStyle = team.color; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = `900 ${team.abbr.length > 3 ? 52 : 64}px ${D}`; ctx.textAlign = 'center'; ctx.fillText(team.abbr, cx, y + 112);
        ctx.font = `700 34px ${B}`; ctx.fillStyle = '#f2f5f9'; ctx.fillText(team.name, cx, y + 240);
      };
      disc(g.away, 300); disc(g.home, W - 300);
      ctx.font = `900 60px ${D}`; ctx.fillStyle = '#5e687a'; ctx.textAlign = 'center';
      ctx.fillText(g.state === 'live' || g.state === 'final' ? `${g.awayScore} – ${g.homeScore}` : '@', W / 2, y + 112);
      ctx.font = `700 26px ${B}`; ctx.fillStyle = '#8c96a8';
      ctx.fillText(g.state === 'live' ? `LIVE · ${g.clock}` : g.state === 'final' ? g.statusText : g.state === 'postponed' ? 'Postponed' : `${TO.fmtDay(g.start)} ${TO.fmtTime(g.start)}`, W / 2, y + 160);
      ctx.textAlign = 'left';
      y += 320;
      ctx.fillStyle = '#283141'; ctx.fillRect(110, y - 20, W - 220, 3);
      ctx.font = `700 30px ${B}`; ctx.fillStyle = '#8c96a8'; ctx.fillText(`${pledge.picks[0].marketLabel.toUpperCase()} · MY PICK`, 110, y + 40);
      ctx.font = `900 88px ${D}`; ctx.fillStyle = '#f2f5f9';
      y = wrapText(ctx, pledge.picks[0].label, 110, y + 130, W - 220, 90, 2);
    } else {
      ctx.font = `700 30px ${B}`; ctx.fillStyle = '#8c96a8';
      ctx.fillText(pledge.picks.length > 1 ? `${pledge.picks.length}-PICK Combo Goal` : 'MY PICK', 110, y + 10);
      y += 80;
      for (const l of pledge.picks) {
        ctx.font = `900 60px ${D}`; ctx.fillStyle = '#f2f5f9';
        ctx.fillText(l.label, 110, y + 30);
        ctx.font = `600 28px ${B}`; ctx.fillStyle = '#8c96a8';
        y = wrapText(ctx, `${l.marketLabel} · ${l.matchup}`, 110, y + 76, W - 360, 34, 2);
        ctx.font = `900 50px ${D}`; ctx.fillStyle = '#22d66e'; ctx.textAlign = 'right';
        ctx.fillText(`${TO.convertPointValueToMultiplier(l.price).toFixed(2).replace(/0+$/, '').replace(/\.$/, '')}x`, W - 110, y - 60);
        ctx.textAlign = 'left';
        y += 30;
      }
    }

    // Bottom stats
    const by = 900;
    ctx.fillStyle = '#283141'; ctx.fillRect(110, by - 30, W - 220, 3);
    const col = (label, value, x, color) => {
      ctx.font = `700 26px ${B}`; ctx.fillStyle = '#8c96a8'; ctx.fillText(label, x, by + 20);
      ctx.font = `900 76px ${D}`; ctx.fillStyle = color; ctx.fillText(value, x, by + 100);
    };
    col('TARGET', `${Number(pledge.decimal).toFixed(2).replace(/0+$/, '').replace(/\.$/, '')}x`, 110, '#f2f5f9');
    col('PLEDGE', `${pledge.pledgeMinutes} min`, 420, '#f2f5f9');
    col(pledge.status === 'lost' ? 'LOST' : pledge.status === 'won' ? 'WON' : 'TO WIN', pledge.status === 'lost' ? `−${pledge.pledgeMinutes}` : `+${pledge.status === 'won' ? pledge.reward - pledge.pledgeMinutes : toWin(pledge)}`, 730, pledge.status === 'lost' ? '#ff5a5f' : '#22d66e');

    ctx.font = `600 30px ${B}`; ctx.fillStyle = '#8c96a8'; ctx.textAlign = 'center';
    ctx.fillText('Screen time on the line, not money.', W / 2, 1160);
    ctx.font = `italic 900 40px ${D}`; ctx.fillStyle = '#22d66e';
    ctx.fillText('TimeOut', W / 2, 1230);
    ctx.textAlign = 'left';
    return c.toDataURL('image/png');
  }

  function shareText(pledge) {
    const picks = pledge.picks.map((l) => `${l.label} (${TO.multiplierText(l.price)}) · ${l.matchup}`).join('\n');
    const pledgeMinutes = `${pledge.pledgeMinutes} min of screen time to earn ${toWin(pledge)} min`;
    return `My TimeOut ${pledge.picks.length > 1 ? 'Combo Goal' : 'pledge'}:\n${picks}\n${TO.multiplierText(TO.pointValue.fromDecimal(pledge.decimal))} · ${pledgeMinutes}`;
  }

  TO.actions.share = async (el) => {
    const pledge = TO.data.challenges.find((b) => b.id === el.dataset.pledge);
    if (!pledge) return;
    let url = '';
    ui.sheet('share', {
      render: () => ({
        title: 'Share pledge',
        body: `${url ? `<img class="share-img" src="${url}" alt="pledge card image showing the teams, pick, target and pledge">` : '<div class="card muted small">Creating image…</div>'}
          <div class="small muted">${ui.embedded ? 'To save the image, right-click it or press and hold it.' : 'Save the image and post it anywhere.'}</div>
          <textarea class="textarea sr" id="share-text" readonly>${esc(shareText(pledge))}</textarea>`,
        foot: `${!ui.embedded && url ? `<a class="btn primary full" href="${url}" download="timeout-pledge.png" data-act="share-saved">${icon('share', 18)} Save image</a>` : ''}
          <div class="row"><button class="btn ghost grow" data-act="share-copy">${icon('copy', 16)} Copy pledge text</button></div>`,
      }),
    });
    url = await drawShare(pledge);
    ui.refreshSheet('share');
  };
  TO.actions['share-copy'] = async () => {
    const ok = await ui.copy(document.getElementById('share-text').value);
    ui.toast({ kind: ok ? 'win' : 'info', title: ok ? 'Pledge copied' : 'Copy the text manually', msg: ok ? 'Paste it into any chat.' : '' });
  };
  TO.actions['share-saved'] = () => { /* default link behavior downloads the image */ };

  // ---------- My pledges actions ----------
  TO.actions['challenges-tab'] = (el) => { view.tab = el.dataset.t; TO.app.render(); };
  TO.actions['challenges-filter'] = (el) => { view.filter = el.dataset.f; TO.app.render(); };

  // ---------- To-do Combo Goal (Could-have) ----------
  const PRESETS = [['Read 20 pages', 'medium'], ['Wash the dishes', 'easy'], ['Fold laundry', 'easy'], ['Work out for 30 min', 'medium'], ['Study for 1 hour', 'hard'], ['Clean my room', 'medium'], ['No phone after 10 PM', 'hard']];
  const todo = { tasks: [{ text: '', difficulty: 'easy' }], pledgeMinutes: '10', error: '' };

  function todoBody() {
    const wl = TO.state.wallet();
    const picks = todo.tasks.filter((t) => t.text.trim());
    const dec = picks.reduce((p, t) => p * TO.pointValue.decimal(TO.state.TODO_VALUE[t.difficulty]), 1);
    const pledgeMinutes = parseInt(todo.pledgeMinutes, 10) || 0;
    const win = picks.length ? Math.round((Math.round(pledgeMinutes * dec) - pledgeMinutes) * wl.multiplier) : 0;
    return `<div class="small muted">Pledge minutes on getting things done today. Finish every task before midnight and you win; miss one and you lose the pledged minutes. Up to ${TO.RULES.maxPicks} tasks.</div>
      ${todo.tasks.map((t, i) => `<div class="card tight stack-s">
        <div class="row"><input class="input grow" id="todo-${i}" placeholder="Task ${i + 1}, like 'Read 20 pages'" value="${esc(t.text)}" maxlength="60">${todo.tasks.length > 1 ? `<button class="icon-btn" data-act="todo-del" data-i="${i}" aria-label="Remove task">${icon('x', 18)}</button>` : ''}</div>
        <div class="seg">${['easy', 'medium', 'hard'].map((d) => `<button class="${t.difficulty === d ? 'on' : ''}" data-act="todo-diff" data-i="${i}" data-d="${d}">${d[0].toUpperCase() + d.slice(1)} <span class="faint">${TO.pointValue.fmt(TO.state.TODO_VALUE[d])}</span></button>`).join('')}</div>
      </div>`).join('')}
      ${todo.tasks.length < TO.RULES.maxPicks ? `<button class="btn ghost sm" data-act="todo-add">${icon('plus', 16)} Add a task</button>` : ''}
      <div class="field"><span class="label">Quick add</span><div class="hscroll" style="padding:0">${PRESETS.map(([t, d]) => `<button class="chip sm" data-act="todo-preset" data-t="${esc(t)}" data-d="${d}">${esc(t)}</button>`).join('')}</div></div>
      <div class="field"><label for="todo-pledge">Minutes to pledge (max ${TO.RULES.todoMaxPledge})</label><input class="input" id="todo-pledge" type="number" min="1" max="${TO.RULES.todoMaxPledge}" value="${esc(todo.pledgeMinutes)}"></div>
      <div class="outcomes"><div class="w"><span>Finish them all</span><b>+${win} min</b><span>for tomorrow · ${picks.length ? TO.pointValue.fmt(TO.pointValue.fromDecimal(dec)) : '—'}</span></div><div class="l"><span>Miss one</span><b>−${pledgeMinutes} min</b><span>from tomorrow</span></div></div>
      ${todo.error ? `<div class="form-error">${esc(todo.error)}</div>` : ''}`;
  }

  TO.actions['todo-builder'] = () => {
    todo.error = '';
    ui.sheet('todo', { tall: true, render: () => ({ title: 'To-do Combo Goal', body: todoBody(), foot: `<button class="btn primary full" data-act="todo-place">Place to-do Combo Goal</button>` }) });
  };
  const refreshTodo = () => ui.refreshSheet('todo', ['body']);
  TO.actions['todo-add'] = () => { todo.tasks.push({ text: '', difficulty: 'easy' }); refreshTodo(); };
  TO.actions['todo-del'] = (el) => { todo.tasks.splice(Number(el.dataset.i), 1); refreshTodo(); };
  TO.actions['todo-diff'] = (el) => { todo.tasks[Number(el.dataset.i)].difficulty = el.dataset.d; refreshTodo(); };
  TO.actions['todo-preset'] = (el) => {
    const empty = todo.tasks.find((t) => !t.text.trim());
    if (empty) { empty.text = el.dataset.t; empty.difficulty = el.dataset.d; }
    else if (todo.tasks.length < TO.RULES.maxPicks) todo.tasks.push({ text: el.dataset.t, difficulty: el.dataset.d });
    else { ui.toast({ kind: 'warn', title: `Up to ${TO.RULES.maxPicks} tasks per Combo Goal` }); return; }
    refreshTodo();
  };
  TO.inputs['todo-pledge'] = (el) => { todo.pledgeMinutes = el.value; };
  for (let i = 0; i < 3; i++) TO.inputs[`todo-${i}`] = (el) => { todo.tasks[i].text = el.value; };
  TO.actions['todo-place'] = () => {
    if (!TO.net.guard()) return;
    try {
      TO.state.placeTodoCombo({ tasks: todo.tasks, pledgeMinutes: parseInt(todo.pledgeMinutes, 10) });
      ui.closeSheet('todo');
      ui.toast({ kind: 'win', title: 'To-do Combo Goal placed', msg: 'Check off each task in My Challenges before midnight.' });
      todo.tasks = [{ text: '', difficulty: 'easy' }]; todo.pledgeMinutes = '10'; todo.error = '';
      view.tab = 'open';
      TO.app.render();
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      todo.error = e.message;
      refreshTodo();
    }
  };
  TO.actions['todo-done'] = async (el) => {
    const pledge = TO.data.challenges.find((b) => b.id === el.dataset.pledge);
    const pick = pledge && pledge.picks[Number(el.dataset.i)];
    if (!pick) return;
    const ok = await ui.confirm({ title: 'Mark this task done?', body: `"${esc(pick.text)}"<br><br>TimeOut runs on the honor system for to-do combos. You can't undo this.`, confirm: 'It\'s done' });
    if (!ok) return;
    const resolved = TO.state.completeTodo(pledge.id, Number(el.dataset.i));
    if (resolved && resolved.status === 'won') ui.toast({ kind: 'win', title: `To-do Combo Goal won: +${resolved.reward - resolved.pledgeMinutes} min`, msg: 'Added to tomorrow\'s phone time.' });
    TO.app.render();
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — Social: friends, leaderboard, requests and teams. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const ui = TO.ui;
  const St = TO.state;

  const view = { tab: 'board', query: '', remote: [], searching: false, searchSeq: 0 };

  // Invite links stay on this page so they open the app (phone or computer view).
  // ?invite=username&code=... is the friend link; the code makes it a two-way yes. ?join=username is accepted too,
  // so another share-link change can use either name. A team link adds team, teamName, start, end, and key.
  function friendLink(username = TO.account.username, code = null) {
    const url = new URL(`${location.origin}${location.pathname}`);
    url.searchParams.set('invite', username);
    if (code) url.searchParams.set('code', code);
    return url.toString();
  }
  function teamLink(team, code = null) {
    // The code belongs to the person sharing, so the link has to name that person too.
    const url = new URL(friendLink(code ? TO.account.username : (team.owner || TO.account.username), code));
    url.searchParams.set('team', team.id);
    url.searchParams.set('teamName', team.name);
    url.searchParams.set('start', team.start);
    url.searchParams.set('end', team.end);
    if (team.shareKey) url.searchParams.set('key', team.shareKey);
    return url.toString();
  }
  const myCode = async () => (TO.api.myInviteCode ? TO.api.myInviteCode() : null);
  const inviteLink = async () => friendLink(TO.account.username, await myCode());

  /** The system share sheet where there is one, otherwise the clipboard. */
  async function shareOrCopy(link, title, copiedTitle) {
    if (navigator.share) {
      try { await navigator.share({ title, url: link }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const ok = await ui.copy(link);
    ui.toast({ kind: ok ? 'win' : 'info', title: ok ? copiedTitle : title, msg: ok ? link : `Copy this: ${link}`, ms: 5000 });
  }

  // Kept in localStorage, not sessionStorage: a new account confirms its email in a new tab, and the invite has to survive that.
  const INVITE_KEY = 'timeout.invite';
  const readInvite = () => TO.store.get(INVITE_KEY, null);
  const clearInvite = () => TO.store.del(INVITE_KEY);
  function captureInvite() {
    const q = new URLSearchParams(location.search);
    const invite = String(q.get('invite') || q.get('join') || '').replace(/^@/, '').trim();
    const team = String(q.get('team') || '').trim();
    if (!invite && !team) return null;
    const pending = { invite, team, teamName: q.get('teamName') || '', start: q.get('start') || '', end: q.get('end') || '', key: q.get('key') || '', code: q.get('code') || '' };
    TO.store.set(INVITE_KEY, pending);
    setTimeout(() => tryOpenApp(pending), 0);
    ['invite', 'join', 'team', 'teamName', 'start', 'end', 'key', 'code'].forEach((k) => q.delete(k));
    const next = `${location.pathname}${q.toString() ? `?${q}` : ''}${location.hash}`;
    history.replaceState(null, '', next);
    return pending;
  }
  /** On an iPhone with the app, the same invite opens there. */
  function appLink(p) {
    const params = new URLSearchParams();
    for (const k of ['invite', 'team', 'teamName', 'start', 'end', 'key', 'code']) if (p[k]) params.set(k, p[k]);
    return `timeout://invite?${params}`;
  }
  const onIPhone = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
  /** Share links open the app by default on an iPhone. Flip `autoOpen` to true once TimeOut is on the App Store:
   *  without the app installed, Safari shows an error for the timeout:// address. Put the store page in `appStoreUrl`
   *  (https://apps.apple.com/app/id...) and people without the app get an Install button instead. */
  TO.appLink = TO.appLink || { autoOpen: false, appStoreUrl: '' };
  const AUTO_TRIED = 'timeout.appOpenTried';
  function tryOpenApp(p) {
    if (!p || !onIPhone() || !TO.appLink.autoOpen) return;
    try { if (sessionStorage.getItem(AUTO_TRIED)) return; sessionStorage.setItem(AUTO_TRIED, '1'); } catch (e) { /* private mode: try once per load */ }
    location.href = appLink(p);
    // If the app isn't installed the page stays here, and the invite sheet offers the App Store link.
  }
  function offerInvite() {
    const p = readInvite();
    if (!p || !TO.account || !TO.data || !TO.data.onboarded) return;
    const own = p.invite && St.sameUser(p.invite, TO.account.username);
    const already = p.team && TO.data.teams.some((t) => t.id === p.team && t.members.some((m) => St.sameUser(m, TO.account.username)));
    if (own && (!p.team || already)) { clearInvite(); return; }
    if (ui.sheetOpen('invite')) return;
    const who = p.invite ? `@${esc(p.invite)}` : 'Someone';
    const joining = p.team && p.teamName;
    ui.sheet('invite', {
      render: () => ({
        title: joining ? `Join ${esc(p.teamName)}` : 'Friend link',
        body: joining
          ? `<p class="sub" style="margin-top:0">${who} invited you to <b style="color:var(--text)">${esc(p.teamName)}</b>${p.start && p.end ? `, ${esc(TO.fmtDate(TO.dayStart(p.start)))} – ${esc(TO.fmtDate(TO.dayStart(p.end)))}` : ''}. Joining also adds them as a friend. It is still screen time, not money.</p>`
          : `<p class="sub" style="margin-top:0">${who} sent you their TimeOut link. Add them as a friend to compare screen time without putting money on the games.</p>`,
        foot: `<button class="btn primary full" data-act="invite-accept">${joining ? 'Add friend and join' : 'Add friend'}</button>${onIPhone() ? `<a class="btn ghost full" href="${esc(appLink(p))}">Open in the TimeOut app</a>${TO.appLink.appStoreUrl ? `<a class="btn quiet sm full" href="${esc(TO.appLink.appStoreUrl)}">Get the app from the App Store</a>` : ''}` : ''}<button class="btn quiet sm" data-act="invite-dismiss">Not now</button>`,
      }),
    });
  }
  async function acceptInvite() {
    const p = readInvite();
    if (!p) return;
    let friendResult = null, failure = null;
    if (p.invite && !St.sameUser(p.invite, TO.account.username)) {
      if (St.usesServerSocial()) {
        try {
          friendResult = await TO.api.acceptFriendInvite(p.invite, p.code);
          await TO.app.syncSocial(true);
        } catch (e) { failure = TO.friendlyMessage(e); }
      } else {
        St.addFriend(p.invite);
        friendResult = 'friends';
      }
    }
    let team = null;
    if (p.team && p.teamName && p.start && p.end) {
      try { team = St.joinTeam({ id: p.team, name: p.teamName, start: p.start, end: p.end, owner: p.invite, shareKey: /^[a-f0-9]{32}$/.test(p.key) ? p.key : null, members: p.invite ? [p.invite] : [] }); }
      catch (e) {
        if (!(e instanceof TO.AppError)) throw e;
        ui.toast({ kind: 'warn', title: 'Could not join that team', msg: e.message });
      }
    }
    clearInvite();
    ui.closeSheet('invite');
    if (team) view.tab = 'teams';
    else if (friendResult === 'requested') view.tab = 'requests';
    else if (p.invite) view.tab = 'board';
    TO.app.tab = 'social';
    TO.app.render();
    if (failure) ui.toast({ kind: 'loss', title: `Couldn't add @${p.invite}`, msg: failure });
    else if (team) ui.toast({ kind: 'win', title: `You joined ${team.name}` });
    else if (friendResult === 'requested') ui.toast({ kind: 'win', title: `Friend request sent to @${p.invite}`, msg: 'That link has expired, so they\'ll need to accept.' });
    else ui.toast({ kind: 'win', title: `You and @${p.invite} are now friends` });
  }
  TO.invites = { capture: captureInvite, offer: offerInvite, friendLink, teamLink };

  function meCard() {
    const st = St.myStats();
    const wl = St.wallet();
    return `<div class="card me-card">
      ${ui.avatar(TO.account.photo, 'lg')}
      <div class="grow">
        <div class="row-s"><b style="font-size:17px">@${esc(TO.account.username)}</b></div>
        <div class="row-s" style="margin-top:5px;flex-wrap:wrap">${ui.tierBadge(wl.tier.id, true)}<span class="tiny bold ${wl.streak ? 'yellow' : 'faint'} row-s">${icon('flame', 12)}${wl.streak}-day streak</span></div>
        <div class="row" style="margin-top:8px;gap:16px"><span class="small"><b>${st.w}-${st.l}</b> <span class="muted">record</span></span><span class="small"><b class="${st.net > 0 ? 'green' : st.net < 0 ? 'red' : ''}">${TO.signedMin(st.net)}</b> <span class="muted">all time</span></span></div>
      </div>
    </div>`;
  }

  function peopleForQuery(q) {
    const query = String(q || '').trim();
    if (!query) return [];
    const me = String(TO.account.username || '').toLowerCase();
    const seen = new Set();
    const out = [];
    const push = (p) => {
      const key = String(p.username || '').toLowerCase();
      if (!key || key === me || seen.has(key)) return;
      seen.add(key);
      out.push(p);
    };
    // Demo profiles and accounts on this device already have names and photos.
    // A server row for the same username should not replace them.
    const local = St.searchPeople(query);
    const localKeys = new Set(local.map((p) => String(p.username || '').toLowerCase()));
    for (const p of view.remote) if (!localKeys.has(String(p.username || '').toLowerCase())) push(p);
    for (const p of local) push(p);
    return out.slice(0, 8);
  }

  /** A profile for someone search found on the server, or a friend who isn't a demo account on this device. */
  function personFor(username) {
    const known = St.person(username);
    if (known) return known;
    const key = String(username || '').toLowerCase();
    const hit = view.remote.find((r) => String(r.username || '').toLowerCase() === key);
    const listed = !!hit
      || TO.data.friends.some((f) => String(f).toLowerCase() === key)
      || TO.data.requestsOut.some((r) => String(r.to).toLowerCase() === key)
      || TO.data.requestsIn.some((r) => String(r.from).toLowerCase() === key);
    if (!listed) return null;
    return {
      username: hit ? hit.username : username,
      name: (hit && hit.name) || username,
      photo: (hit && hit.photo) || TO.initialsAvatar(username),
      w: 0, l: 0, net: 0, tier: 'rookie', streak: 0,
      share: { record: false, minutes: false, challenges: false },
      remote: true,
    };
  }

  function searchResults() {
    const q = view.query.trim();
    if (!q) return '';
    const results = peopleForQuery(q);
    if (!results.length) {
      if (view.searching) return `<div class="note">${icon('search', 16)}<div><b style="color:var(--text)">Searching usernames…</b></div></div>`;
      return `<div class="note">${icon('search', 16)}<div><b style="color:var(--text)">No one found with the username "${esc(q)}".</b><div style="margin-top:3px">They might not be on TimeOut yet. Send them your invite link instead.</div><button class="btn xs primary" style="margin-top:8px" data-act="share-invite">${icon('share', 14)} Share invite link</button></div></div>`;
    }
    return `<div class="list">${results.map((p) => {
      const rel = St.relation(p.username);
      const btn = rel === 'friend' ? `<span class="tag green">Friends</span>`
        : rel === 'requested' ? `<button class="btn xs ghost" data-act="cancel-request" data-u="${esc(p.username)}">Requested</button>`
        : rel === 'incoming' ? `<button class="btn xs primary" data-act="add-friend" data-u="${esc(p.username)}">Accept</button>`
        : `<button class="btn xs primary" data-act="add-friend" data-u="${esc(p.username)}">${icon('userPlus', 14)} Add</button>`;
      const where = p.local ? ' · on this device' : p.remote ? ' · TimeOut account' : '';
      return `<div class="person-row"><button class="row grow" style="text-align:left" data-act="profile" data-u="${esc(p.username)}">${ui.avatar(p.photo || TO.initialsAvatar(p.username))}<span class="grow" style="min-width:0"><b class="ellipsis" style="display:block">@${esc(p.username)}</b><span class="small muted">${esc(p.name || '')}${where}</span></span></button>${btn}</div>`;
    }).join('')}</div>`;
  }

  function findCard() {
    return `<div class="card stack-s" style="margin:0 16px">
      <h2 style="margin:0;font-size:17px">Find friends</h2>
      <div class="input-wrap"><input class="input" id="social-search" placeholder="Search by username" value="${esc(view.query)}" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="icon-btn" style="pointer-events:none">${icon('search', 18)}</span></div>
      <div id="search-results" class="stack-s">${searchResults()}</div>
      <div class="row-layout small" style="margin-top:2px"><span class="muted ellipsis">Or send your invite link</span><span class="row-s"><button class="btn xs primary" data-act="share-invite">${icon('share', 14)} Share</button><button class="btn xs ghost" data-act="copy-invite">${icon('link', 14)} Copy</button></span></div>
    </div>`;
  }

  function leaderboard() {
    if (!TO.data.friends.length) {
      return `<div class="empty">${icon('users', 40)}<h3>Keep up with your friends</h3><p>Compare screen-time records and build teams that compete for a week or a season. Add your first friend to get started.</p><button class="btn primary" data-act="share-invite">${icon('share', 16)} Invite a friend</button><button class="btn quiet sm" data-act="focus-search">Search usernames instead</button></div>`;
    }
    const rows = St.leaderboard();
    return `<div class="stack-s pad"><div class="row-layout"><span class="eyebrow">Leaderboard · minutes won or lost</span><button class="link-btn tiny" data-act="settings" data-section="privacy">What friends see</button></div>
      <div class="list">${rows.map((r, i) => `<button class="lb-row ${r.me ? 'me' : ''}" data-act="profile" data-u="${esc(r.username)}">
        <span class="rk">${r.share.minutes ? i + 1 : '–'}</span>${ui.avatar(r.photo)}
        <span style="min-width:0"><span class="nm ellipsis" style="display:block">${r.me ? 'You' : `@${esc(r.username)}`}</span><span class="sub">${ui.tierBadge(r.tier, true)}${r.share.record ? `<span>${r.w}-${r.l}</span>` : '<span>Record private</span>'}${r.streak ? `<span class="yellow row-s">${icon('flame', 11)}${r.streak}</span>` : ''}</span></span>
        <span class="val">${r.share.minutes ? `<span class="${r.net > 0 ? 'green' : r.net < 0 ? 'red' : ''}">${TO.signed(r.net)}</span><small>min</small>` : `<span class="faint" style="font-size:14px">Private</span>`}</span>
      </button>`).join('')}</div>
      <div class="tiny faint">Friends only show the stats they've chosen to share.</div></div>`;
  }

  function requests() {
    const d = TO.data;
    const parts = [];
    if (d.requestsIn.length) {
      parts.push(`<div class="eyebrow">Friend requests</div><div class="list">${d.requestsIn.map((r) => {
        const p = St.person(r.from);
        return `<div class="person-row">${ui.avatar(p ? p.photo : TO.initialsAvatar(r.from))}<div class="grow"><b>@${esc(r.from)}</b><div class="tiny faint">${p && p.name && p.name !== r.from ? `${esc(p.name)} · ` : ''}Received ${TO.ago(r.at)}</div></div><button class="btn xs ghost" data-act="decline-fr" data-id="${r.id}">Decline</button><button class="btn xs primary" data-act="accept-fr" data-id="${r.id}">Accept</button></div>`;
      }).join('')}</div>`);
    }
    if (d.requestsOut.length) {
      parts.push(`<div class="eyebrow">Sent requests</div><div class="list">${d.requestsOut.map((r) => {
        const p = St.person(r.to);
        const wait = St.resendWait(r);
        const resend = wait
          ? `<button class="btn xs ghost" disabled title="You can send it again in ${TO.fmtIn(wait)}">${icon('check', 13)} Sent</button>`
          : `<button class="btn xs primary" data-act="resend-request" data-u="${esc(r.to)}">${icon('refresh', 13)} Send again</button>`;
        return `<div class="person-row">${ui.avatar(p ? p.photo : TO.initialsAvatar(r.to))}<div class="grow" style="min-width:0"><b>@${esc(r.to)}</b><div class="tiny faint">Sent ${TO.ago(r.at)} · ${wait ? `send again in ${TO.fmtIn(wait)}` : 'waiting for them to accept'}</div></div><div class="row-s">${resend}<button class="btn xs quiet" data-act="cancel-request" data-u="${esc(r.to)}">Cancel</button></div></div>`;
      }).join('')}</div>`);
    }
    if (!parts.length) return `<div class="empty">${icon('bell', 36)}<h3>You're all caught up</h3><p>Friend requests show up here.</p></div>`;
    return `<div class="stack-s pad">${parts.join('')}</div>`;
  }

  function teams() {
    const list = TO.data.teams;
    const cards = list.map((t) => {
      const status = St.teamStatus(t);
      const standings = St.teamStandings(t);
      const myPlace = standings.findIndex((s) => s.me);
      const statusTag = status === 'active' ? `<span class="tag green">Ends in ${TO.fmtIn(TO.dayStart(t.end) + TO.DAY - TO.now())}</span>` : status === 'upcoming' ? `<span class="tag blue">Starts ${TO.fmtDate(TO.dayStart(t.start))}</span>` : '<span class="tag">Ended</span>';
      const rankLine = status !== 'upcoming' && standings.length && myPlace >= 0
        ? `<div class="small">You're <b>${TO.ordinal(myPlace + 1)}</b> of ${standings.length} · leader <b>${standings[0].me ? 'you' : `@${esc(standings[0].username)}`}</b></div>`
        : '';
      return `<button class="card team-card tappable" style="text-align:left" data-act="team" data-id="${t.id}">
        <div class="row-layout"><b style="font-size:16px">${esc(t.name)}</b>${statusTag}</div>
        <div class="row-layout small muted"><span>${TO.fmtDate(TO.dayStart(t.start))} – ${TO.fmtDate(TO.dayStart(t.end))} · ${t.members.length} members</span><span class="avatars">${standings.slice(0, 5).map((s) => `<img src="${esc(s.photo)}" alt="">`).join('')}</span></div>
        ${rankLine}
      </button>`;
    }).join('');
    return `<div class="stack-s pad">
      <div class="small muted">Teams compete over the dates you pick. Whoever wins the most minutes in that stretch tops the team.</div>
      <div class="row-s" style="flex-wrap:wrap"><button class="btn primary sm" data-act="team-new">${icon('plus', 16)} Create a team</button><button class="btn ghost sm" data-act="team-how">${icon('info', 16)} How teams work</button></div>
      ${cards || `<div class="empty">${icon('trophy', 36)}<h3>No teams yet</h3><p>Start one with a few friends and pick a start and end date.</p></div>`}
    </div>`;
  }

  function render() {
    const d = TO.data;
    const reqCount = d.requestsIn.length;
    const tab = (k, label, n) => `<button class="${view.tab === k ? 'on' : ''}" data-act="social-tab" data-t="${k}">${label}${n ? ` <span class="count-pill" style="background:var(--live-fill);color:#fff">${n}</span>` : ''}</button>`;
    let body;
    if (view.tab === 'requests') body = requests();
    else if (view.tab === 'teams') body = teams();
    else body = leaderboard();
    return `<div class="page-head"><h1>Social</h1><p>Compete with friends: compare screen-time records and join teams.</p></div>
      <div class="stack social-cols">
        <div class="stack social-side">
          ${meCard()}
          ${findCard()}
        </div>
        <div class="stack social-main">
          <div class="pad"><div class="seg">${tab('board', 'Friends')}${tab('requests', 'Requests', reqCount)}${tab('teams', 'Teams')}</div></div>
          ${body}
        </div>
      </div>`;
  }

  TO.views.social = { render, view, badge: () => TO.data.requestsIn.length };

  // ---------- Profile sheet ----------
  function profile(username) {
    const isMe = username === TO.account.username;
    ui.sheet('profile', {
      render: () => {
        const p = isMe ? null : personFor(username);
        if (!isMe && !p) return { title: 'Profile', body: '<div class="muted">This person could not be found.</div>' };
        const rel = isMe ? 'me' : St.relation(username);
        const st = isMe ? St.myStats() : null;
        const share = isMe ? { record: true, minutes: true, challenges: true } : p.share;
        const showAll = isMe || rel === 'friend';
        const rec = isMe ? `${st.w}-${st.l}` : `${p.w}-${p.l}`;
        const net = isMe ? st.net : p.net;
        const tierId = isMe ? St.wallet().tier.id : p.tier;
        const streak = isMe ? St.wallet().streak : p.streak;
        const picks = !isMe && showAll ? St.sharedPicks(p) : [];
        const stat = (label, val, ok) => `<div><b>${ok ? val : '<span class="faint" style="font-size:16px">Private</span>'}</b><span>${label}</span></div>`;
        let actions = '';
        if (rel === 'friend') actions = `<button class="btn quiet sm" data-act="remove-friend" data-u="${esc(username)}">Remove friend</button>`;
        else if (rel === 'requested') actions = `<button class="btn ghost full" data-act="cancel-request" data-u="${esc(username)}">Friend request sent · Cancel</button>`;
        else if (rel === 'incoming' || rel === 'none') actions = `<button class="btn primary full" data-act="add-friend" data-u="${esc(username)}">${icon('userPlus', 18)} ${rel === 'incoming' ? 'Accept friend request' : 'Add friend'}</button>`;
        return {
          title: isMe ? 'Your profile' : `@${esc(username)}`,
          body: `<div class="row" style="gap:14px">${ui.avatar(isMe ? TO.account.photo : p.photo, 'xl')}<div><div style="font-size:20px;font-weight:800">${isMe ? `@${esc(username)}` : esc(p.name)}</div>${isMe ? '' : `<div class="muted small">@${esc(username)}</div>`}<div class="row-s" style="margin-top:8px">${ui.tierBadge(tierId, true)}${streak ? `<span class="tiny bold yellow row-s">${icon('flame', 12)}${streak}-day streak</span>` : ''}</div></div></div>
            ${showAll ? `<div class="record-big">${stat('Record', rec, share.record)}${stat('Minutes won/lost', `<span class="${net > 0 ? 'green' : net < 0 ? 'red' : ''}">${TO.signed(net)}</span>`, share.minutes)}${stat('Clean streak', `${streak}d`, true)}</div>` : `<div class="note">${icon('lock', 16)}<span>Add @${esc(username)} as a friend to see their stats.</span></div>`}
            ${!isMe && showAll ? (share.challenges ? `<div class="stack-s"><div class="eyebrow">Active challenges they're sharing</div>${picks.length ? picks.map((k) => `<div class="card tight row-layout"><div><b>${esc(k.label)}</b><div class="small muted">${esc(k.matchup)}</div></div><div style="text-align:right"><div class="display green" style="font-size:16px">${TO.multiplierText(k.price)}</div><div class="tiny faint">${k.pledgeMinutes} min</div></div></div>`).join('') : '<div class="small muted">No active challenges right now.</div>'}</div>` : `<div class="small muted">${esc(p.name)} keeps their active challenges private.</div>`) : ''}
            ${isMe ? `<button class="btn ghost sm" data-act="settings" data-section="privacy">${icon('eye', 16)} Choose what friends can see</button>` : ''}`,
          foot: isMe ? '' : actions,
        };
      },
    });
  }

  // ---------- Team sheets ----------
  function teamSheet(id) {
    ui.sheet('team', {
      tall: true,
      render: () => {
        const t = TO.data.teams.find((x) => x.id === id);
        if (!t) return { title: 'Team', body: '' };
        const status = St.teamStatus(t);
        const rows = St.teamStandings(t);
        const invitable = TO.data.friends.filter((f) => !t.members.some((m) => St.sameUser(m, f)));
        const owner = St.sameUser(t.owner, TO.account.username) ? 'You own this team' : `Owned by @${esc(t.owner)}`;
        return {
          title: esc(t.name),
          body: `<div class="row-layout small muted"><span class="row-s">${icon('calendar', 14)} ${TO.fmtDate(TO.dayStart(t.start))} – ${TO.fmtDate(TO.dayStart(t.end))}</span><span>${status === 'active' ? `Ends in ${TO.fmtIn(TO.dayStart(t.end) + TO.DAY - TO.now())}` : status === 'upcoming' ? `Starts in ${TO.fmtIn(TO.dayStart(t.start) - TO.now())}` : 'Ended'}</span></div>
            <div class="small muted">${owner} · ${t.members.length} on the roster</div>
            <div class="list">${rows.map((r, i) => `<div class="lb-row ${r.me ? 'me' : ''}"><span class="rk">${r.hidden ? '–' : i + 1}</span>${ui.avatar(r.photo)}<span><span class="nm">${r.me ? 'You' : `@${esc(r.username)}`}</span><span class="sub">${r.w}-${r.l} during this team</span></span><span class="val">${r.hidden ? '<span class="faint" style="font-size:14px">Private</span>' : `<span class="${r.net > 0 ? 'green' : r.net < 0 ? 'red' : ''}">${TO.signed(r.net)}</span><small>min</small>`}</span></div>`).join('')}</div>
            <div class="tiny faint">Standings count screen-time challenges placed between the start and end dates. Friend challenges don't count.</div>
            ${invitable.length ? `<div class="field"><span class="label">Invite more friends</span><div class="pick-friends">${invitable.map((u) => { const p = personFor(u); return p ? `<button class="pick-friend" data-act="team-invite" data-id="${t.id}" data-u="${esc(u)}"><img src="${esc(p.photo)}" alt="">${icon('plus', 14)} ${esc(u)}</button>` : ''; }).join('')}</div></div>` : ''}`,
          foot: `<div class="row-s"><button class="btn primary sm grow" data-act="share-team" data-id="${t.id}">${icon('share', 16)} Share team link</button><button class="btn ghost sm" data-act="copy-team" data-id="${t.id}">${icon('link', 16)} Copy</button></div><button class="btn quiet sm" data-act="team-leave" data-id="${t.id}">Leave team</button>`,
        };
      },
    });
  }

  function teamHow() {
    ui.sheet('team-how', {
      render: () => ({
        title: 'How teams work',
        body: `<p class="sub" style="margin-top:0">Teams are how friends compete here without putting money on games. TimeOut puts screen time on the number instead of cash, and a team is the stretch of days you compare.</p>
          <div class="how-card"><span class="n">1</span><div><h3>Pick a name and the dates</h3><p>Create a team for a week or a season. You can start it on your own and invite people later.</p></div></div>
          <div class="how-card"><span class="n">2</span><div><h3>Minutes decide the standings</h3><p>Between the start and end dates, screen-time challenges count. Whoever earns the most minutes leads.</p></div></div>
          <div class="how-card"><span class="n">3</span><div><h3>Invite friends onto the roster</h3><p>Open the team and add a friend, or copy the team link. When they open it, you become friends and they join the roster.</p></div></div>
          <div class="how-card"><span class="n">4</span><div><h3>Leave whenever you want</h3><p>Leaving takes you off the standings. The team stays for everyone else.</p></div></div>
          <div class="tiny faint">The team is saved in this browser. When this page can reach the TimeOut server, the roster is saved there too, one member at a time, so it is still here the next time you open the app.</div>`,
        foot: `<button class="btn primary full" data-act="close-sheet" data-name="team-how">Got it</button>`,
      }),
    });
  }

  const draft = { name: '', start: '', end: '', members: [], errors: {} };
  function newTeamSheet() {
    Object.assign(draft, { name: '', start: TO.dayKey(), end: TO.addDays(TO.dayKey(), 7), members: [], errors: {} });
    ui.sheet('team-new', {
      tall: true,
      render: () => ({
        title: 'Create a team',
        body: `${ui.field({ id: 'team-name', label: 'Team name', value: draft.name, placeholder: 'Sunday Squad', err: draft.errors.name, attrs: 'maxlength="30"' })}
          <div class="row" style="align-items:flex-start">${`<div class="grow">${ui.field({ id: 'team-start', label: 'Start date', type: 'date', value: draft.start, err: draft.errors.start })}</div><div class="grow">${ui.field({ id: 'team-end', label: 'End date', type: 'date', value: draft.end, err: draft.errors.end })}</div>`}</div>
          <div class="field"><span class="label">Invite friends</span>${TO.data.friends.length ? `<div class="pick-friends">${TO.data.friends.map((u) => { const p = personFor(u); return p ? `<button class="pick-friend ${draft.members.includes(u) ? 'on' : ''}" data-act="team-pick" data-u="${esc(u)}"><img src="${esc(p.photo)}" alt="">${esc(u)}</button>` : ''; }).join('')}</div>` : '<div class="note">No friends yet. You can still create the team and invite people later.</div>'}${draft.errors.members ? `<div class="err">${esc(draft.errors.members)}</div>` : ''}</div>`,
        foot: `<button class="btn primary full" data-act="team-create">Create team</button>`,
      }),
    });
  }

  // ---------- Actions ----------
  const A = TO.actions;
  A['social-tab'] = (el) => { view.tab = el.dataset.t; TO.app.render(); if (view.tab === 'teams') St.refreshTeams(); else TO.app.syncSocial(); };
  A.profile = (el) => profile(el.dataset.u);
  A['copy-invite'] = async () => {
    const link = await inviteLink();
    const ok = await ui.copy(link);
    ui.toast({ kind: ok ? 'win' : 'info', title: ok ? 'Invite link copied' : 'Your invite link', msg: ok ? link : `Copy this: ${link}`, ms: 5000 });
  };
  A['share-invite'] = async () => shareOrCopy(await inviteLink(), 'Join me on TimeOut', 'Invite link copied');
  A['focus-search'] = () => { const i = document.getElementById('social-search'); if (i) i.focus(); };
  /** Runs a friend action on the server and refreshes, or uses this browser's accounts in offline mode. */
  async function perform(server, offline) {
    if (!St.usesServerSocial()) { offline(); rerender(); return true; }
    try {
      await server();
      await TO.app.syncSocial(true);
      rerender();
      return true;
    } catch (e) {
      ui.toast({ kind: 'loss', title: 'Couldn\'t update your friends', msg: TO.friendlyMessage(e) });
      return false;
    }
  }
  A['add-friend'] = async (el) => {
    const u = el.dataset.u;
    if (St.usesServerSocial()) {
      const incoming = St.relation(u) === 'incoming' && TO.data.requestsIn.find((r) => String(r.from).toLowerCase() === u.toLowerCase());
      if (incoming) { ui.closeSheet('profile'); return A['accept-fr']({ dataset: { id: incoming.id } }); }
      try {
        const result = await TO.api.sendFriendRequest(u);
        await TO.app.syncSocial(true);
        ui.toast({ kind: 'win', title: result === 'friends' ? `You and @${u} are now friends` : `Friend request sent to @${u}` });
      } catch (e) { ui.toast({ kind: 'loss', title: 'Couldn\'t send that request', msg: TO.friendlyMessage(e) }); }
      rerender();
      return;
    }
    const rel = St.relation(u);
    St.sendFriendRequest(u);
    ui.toast({ kind: 'win', title: rel === 'incoming' ? `You and @${u} are now friends` : `Friend request sent to @${u}` });
    rerender();
  };
  A['cancel-request'] = (el) => perform(() => TO.api.cancelFriendRequest(el.dataset.u), () => St.cancelFriendRequest(el.dataset.u));
  A['resend-request'] = async (el) => {
    const u = el.dataset.u;
    if (St.usesServerSocial()) {
      if (await perform(() => TO.api.sendFriendRequest(u))) ui.toast({ kind: 'win', title: `Request sent again to @${u}`, msg: 'You can send another one in an hour.' });
      return;
    }
    try {
      St.resendFriendRequest(u);
      ui.toast({ kind: 'win', title: `Request sent again to @${u}`, msg: 'You can send another one in an hour.' });
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      ui.toast({ kind: 'warn', title: 'Not yet', msg: e.message });
    }
    rerender();
  };
  A['accept-fr'] = async (el) => {
    const r = TO.data.requestsIn.find((x) => x.id === el.dataset.id);
    if (!r) return;
    if (!St.usesServerSocial()) {
      St.acceptFriendRequest(r.id);
      view.tab = 'board';
      rerender();
      ui.toast({ kind: 'win', title: `You and @${r.from} are now friends`, msg: 'They\'re in your Friends list.' });
      return;
    }
    // The request goes away and the person appears under Friends right now; the server confirms in the background.
    const undo = St.acceptServerRequest(r.from);
    view.tab = 'board';
    rerender();
    ui.toast({ kind: 'win', title: `You and @${r.from} are now friends`, msg: 'They\'re in your Friends list.' });
    try {
      await TO.api.answerFriendRequest(r.from, true);
      await TO.app.syncSocial(true);
    } catch (e) {
      undo();
      view.tab = 'requests';
      ui.toast({ kind: 'loss', title: `Couldn't accept @${r.from}`, msg: TO.friendlyMessage(e) });
    }
    rerender();
  };
  A['decline-fr'] = async (el) => {
    const r = TO.data.requestsIn.find((x) => x.id === el.dataset.id);
    if (!r) return;
    if (!St.usesServerSocial()) { St.declineFriendRequest(r.id); rerender(); return; }
    const undo = St.declineServerRequest(r.from);
    rerender();
