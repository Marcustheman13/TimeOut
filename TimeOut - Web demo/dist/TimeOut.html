<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimeOut</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722.5%27 fill=%27%2322D66E%27/%3E%3Cg transform=%27translate(48 50) skewX(-10) translate(-50 -50)%27 fill=%27%2303140A%27%3E%3Crect x=%2719%27 y=%2723%27 width=%2762%27 height=%2716%27 rx=%278%27/%3E%3Crect x=%2742%27 y=%2744%27 width=%2716%27 height=%2733%27 rx=%278%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="description" content="TimeOut is a sportsbook where you bet screen time instead of money.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* TimeOut app layout. */
:root {
  --bg: #0a0d12;
  --surface: #141922;
  --raised: #1d2430;
  --raised-2: #262f3d;
  --stroke: #283141;
  --text: #f2f5f9;
  --text-2: #8c96a8;
  --muted: #5e687a;
  --accent: #22d66e;
  --accent-ink: #03140a;
  --accent-soft: rgba(34, 214, 110, 0.13);
  --loss: #ff5a5f;
  --loss-soft: rgba(255, 90, 95, 0.13);
  --live: #ff3b4a;
  --warn: #ffc940;
  --warn-soft: rgba(255, 201, 64, 0.12);
  --blue: #4fb3ff;
  --blue-soft: rgba(79, 179, 255, 0.13);
  --purple: #c58cff;
  --scrim: rgba(0, 0, 0, 0.6);

  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --tabbar-h: 70px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { flex: none; display: block; }
.num, .display { font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.005em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Full-viewport app surface; native app shells can provide their own safe areas. */
.app-surface { position: relative; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; background: var(--bg); isolation: isolate; }

/* ---------- App shell ---------- */
.app { position: absolute; inset: 0; display: flex; flex-direction: column; }

.topbar {
  flex: none;
  height: 52px;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 0 14px 0 8px;
}
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 12px;
  color: var(--text);
  position: relative;
}
.icon-btn:hover { background: var(--surface); }
.icon-btn .dotbadge { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 2px var(--bg); }
.brand { display: flex; align-items: center; gap: 7px; min-width: 0; }
.brand-mark { color: var(--accent); }
.brand-word { font-family: var(--font-display); font-weight: 900; font-style: italic; font-size: 25px; letter-spacing: 0.02em; line-height: 1; }
.brand-word b { color: var(--accent); font-weight: 900; }
.top-title { font-family: var(--font-display); font-weight: 800; font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bal-pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 12px;
  border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 800; font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.bal-pill.locked { background: var(--raised); color: var(--loss); }

.view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding-bottom: 116px;
}
.view::-webkit-scrollbar { display: none; }

/* Floating pill tab bar: hovers over the content with a darker inner pill on the active tab. */
.tabbar {
  position: absolute;
  left: 14px; right: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  height: var(--tabbar-h);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 6px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(44, 50, 60, 0.94), rgba(30, 35, 43, 0.94));
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  backdrop-filter: blur(18px) saturate(1.4);
  z-index: 5;
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border-radius: 999px;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 14px; font-weight: 800; letter-spacing: 0.01em;
  position: relative;
  transition: background 0.2s, color 0.2s;
}
.tab:hover:not(.on) { background: rgba(255, 255, 255, 0.04); }
.tab.on { color: var(--accent); background: rgba(5, 7, 10, 0.85); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
.tab .badge {
  position: absolute; top: 4px; left: calc(50% + 8px);
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--live); color: #fff;
  font-family: var(--font-body);
  font-size: 11px; font-weight: 800; display: grid; place-items: center;
  box-shadow: 0 0 0 2px rgba(30, 35, 43, 1);
}
.tab .badge.green { background: var(--accent); color: var(--accent-ink); }

.page-head { padding: 4px 16px 10px; }
.page-head h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1; letter-spacing: 0.005em; }
.page-head p { margin: 6px 0 0; color: var(--text-2); font-size: 14px; max-width: 34ch; }

/* ---------- Generic building blocks ---------- */
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-s { display: flex; align-items: center; gap: 6px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.pad { padding-inline: 16px; }
.mt { margin-top: 14px; }
.muted { color: var(--text-2); }
.faint { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.bold { font-weight: 700; }
.green { color: var(--accent); }
.red { color: var(--loss); }
.yellow { color: var(--warn); }
.blue { color: var(--blue); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }

.card {
  background: var(--surface);
  border: 1px solid var(--stroke);
  border-radius: 16px;
  padding: 14px;
}
.card.tight { padding: 12px; }
.card.flush { padding: 0; overflow: hidden; }
.card.tappable { cursor: pointer; transition: border-color 0.15s; }
.card.tappable:hover { border-color: #3a4558; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px; }
.section-title h2 { margin: 0; font-size: 17px; font-weight: 800; }
.link-btn { color: var(--accent); font-weight: 700; font-size: 13.5px; }
.count-pill { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 800; }
.count-pill.off { background: var(--raised); color: var(--text-2); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 18px;
  border-radius: 14px;
  font-weight: 800; font-size: 16px;
  background: var(--raised); color: var(--text);
  border: 1px solid var(--stroke);
  transition: filter 0.15s, transform 0.08s;
  white-space: nowrap;
}
.btn:active:not(:disabled) { transform: scale(0.985); }
.btn.full { width: 100%; }
.btn.sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.btn.xs { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 9px; gap: 5px; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.warn { background: var(--warn); border-color: transparent; color: #1d1600; }
.btn.danger { background: var(--loss); border-color: transparent; color: #fff; }
.btn.ghost { background: transparent; border-color: var(--stroke); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--text-2); }
.btn:disabled { opacity: 0.42; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 13px;
  border-radius: 999px;
  background: var(--surface); border: 1px solid var(--stroke);
  font-size: 14px; font-weight: 700; white-space: nowrap;
}
.chip .n { font-size: 11px; font-weight: 800; color: var(--muted); }
.chip.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.chip.on .n { color: rgba(3, 20, 10, 0.6); }
.chip.dashed { background: transparent; border-style: dashed; color: var(--text-2); }
.chip.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }

.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; }
.hscroll::-webkit-scrollbar { display: none; }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  height: 20px; padding: 0 7px; border-radius: 6px;
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--raised); color: var(--text-2);
  white-space: nowrap;
}
.tag.green { background: var(--accent-soft); color: var(--accent); }
.tag.red { background: var(--loss-soft); color: var(--loss); }
.tag.yellow { background: var(--warn-soft); color: var(--warn); }
.tag.blue { background: var(--blue-soft); color: var(--blue); }
.status-pill { display: inline-grid; place-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: 0.05em; }
.status-pill.won { background: var(--accent); color: var(--accent-ink); }
.status-pill.lost { background: var(--loss); color: #fff; }
.status-pill.void, .status-pill.push { background: var(--muted); color: #fff; }
.status-pill.open { background: var(--raised); color: var(--text); }

.live { display: inline-flex; align-items: center; gap: 4px; color: var(--live); font-size: 11px; font-weight: 900; letter-spacing: 0.04em; }
.live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: 0.3; } }

.team-badge {
  flex: none;
  display: grid; place-items: center;
  width: 26px; height: 26px; border-radius: 50%;
  color: #fff; font-weight: 900; font-size: 9px; letter-spacing: -0.02em;
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.14);
  font-family: var(--font-display);
}
.team-badge img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--raised); }
.avatar.lg { width: 64px; height: 64px; }
.avatar.xl { width: 96px; height: 96px; }
.avatar.sm { width: 28px; height: 28px; }

.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s; }

.note {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 10px 12px; border-radius: 12px;
  font-size: 13px; font-weight: 600;
  background: var(--raised); color: var(--text-2);
}
.note .ic { margin-top: 1px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.red { background: var(--loss-soft); color: var(--loss); }
.note.green { background: var(--accent-soft); color: var(--accent); }
.note.blue { background: var(--blue-soft); color: var(--blue); }

.divider { height: 1px; background: var(--stroke); border: 0; margin: 0; }

.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
  padding: 28px 22px;
}
.empty .ic { color: var(--muted); }
.empty h3 { margin: 0; font-size: 18px; }
.empty p { margin: 0; color: var(--text-2); font-size: 14px; max-width: 30ch; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field .label { font-size: 13px; font-weight: 700; color: var(--text-2); }
.input, .textarea, .select {
  width: 100%;
  height: 48px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid var(--stroke);
  background: var(--raised);
  font-size: 16px;
  outline: none;
}
.textarea { height: auto; min-height: 76px; padding: 12px 14px; resize: none; line-height: 1.4; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--accent); }
.input.bad, .textarea.bad { border-color: var(--loss); }
.field .err { color: var(--loss); font-size: 12.5px; font-weight: 600; }
.field .hint { color: var(--muted); font-size: 12.5px; }
.input-wrap { position: relative; }
.input-wrap .input { padding-right: 44px; }
.input-wrap .icon-btn { position: absolute; right: 4px; top: 4px; color: var(--text-2); }
input[type='date'].input { color-scheme: dark; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--stroke); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { height: 34px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--text-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button.on { background: var(--raised-2); color: var(--text); }
.seg button .count-pill { height: 18px; min-width: 18px; font-size: 11px; padding: 0 5px; }

.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 15px; background: var(--raised-2); transition: background 0.2s; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.checkbox { width: 24px; height: 24px; flex: none; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; }
.checkbox.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.list { background: var(--surface); border: 1px solid var(--stroke); border-radius: 16px; overflow: hidden; }
.list-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  min-height: 54px; padding: 10px 14px;
  text-align: left;
  border-top: 1px solid var(--stroke);
}
.list-row:first-child { border-top: 0; }
button.list-row:hover, label.list-row:hover { background: rgba(255, 255, 255, 0.02); }
label.list-row { cursor: pointer; }
.list-row .lr-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--raised); color: var(--text-2); flex: none; }
.list-row .lr-main { flex: 1; min-width: 0; }
.list-row .lr-title { font-weight: 700; font-size: 15px; }
.list-row .lr-sub { color: var(--text-2); font-size: 12.5px; margin-top: 1px; }
.list-row .chev { color: var(--muted); }

/* ---------- Home ---------- */
.wallet { margin: 4px 16px 0; padding: 16px; }
.wallet .big { font-family: var(--font-display); font-weight: 900; font-size: 54px; line-height: 0.9; color: var(--accent); font-variant-numeric: tabular-nums; }
.wallet .big small { font-size: 22px; font-weight: 700; opacity: 0.85; margin-left: 3px; }
.wallet .cd { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.wallet-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; border-top: 1px solid var(--stroke); padding-top: 12px; }
.wallet-stats > div { text-align: center; }
.wallet-stats > div + div { border-left: 1px solid var(--stroke); }
.wallet-stats b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.wallet-stats span { font-size: 11px; font-weight: 700; color: var(--muted); }
.wallet .explain { display: flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--text-2); font-size: 12.5px; font-weight: 600; }
.wallet.locked .lockhead { display: flex; align-items: center; gap: 6px; color: var(--loss); font-size: 12px; font-weight: 900; letter-spacing: 0.06em; }
.wallet.locked .bigcd { font-family: var(--font-display); font-weight: 900; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }

.status-strip {
  margin: 0 16px;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  width: calc(100% - 32px);
  text-align: left;
  overflow: hidden;
}
.status-strip .sp { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.tier-badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  font-size: 11px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase;
  color: #06110a; white-space: nowrap; flex: none;
}
.tier-badge.rookie { background: var(--raised); color: var(--text); }
.tier-badge.sm { height: 20px; font-size: 10px; padding: 0 7px; }

.mini-bets { padding-bottom: 2px; }
.mini-bet { flex: none; width: 222px; min-height: 96px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.mini-bet .t { font-weight: 800; font-size: 14px; }

.filterbar { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 10px 0; }
.cfb-select-label { display: block; margin: 9px 16px 4px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.cfb-select { display: block; width: calc(100% - 32px); height: 38px; margin: 0 16px; padding: 0 10px; color: var(--text); background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px; font: inherit; font-weight: 700; }
.league-head { display: flex; align-items: center; gap: 8px; padding: 6px 16px 0; }
.league-head h3 { margin: 0; font-size: 18px; font-weight: 800; }
.league-head .cnt { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }

.game-card { margin: 0 16px; padding: 12px 10px 12px 12px; }
.gc-status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 8px; min-height: 18px; }
.gc-status .lg { margin-left: auto; color: var(--muted); font-weight: 800; font-size: 11px; letter-spacing: 0.04em; }
.gc-grid { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 60px); gap: 5px; align-items: center; }
.gc-grid.two { grid-template-columns: minmax(0, 1fr) repeat(2, 66px); }
.gc-grid .colh { font-size: 10px; font-weight: 800; color: var(--muted); text-align: center; letter-spacing: 0.04em; text-transform: uppercase; }
.gc-team { display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; height: 46px; }
.gc-team .nm { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc-team .rec { font-size: 11px; color: var(--muted); }
.gc-team .sc { margin-left: auto; padding-right: 2px; flex: none; font-family: var(--font-display); font-weight: 900; font-size: 23px; font-variant-numeric: tabular-nums; }
.gc-team .sc.trail { color: var(--text-2); }
.gc-live-layout { display: grid; grid-template-columns: minmax(112px, .9fr) minmax(0, 1.2fr); gap: 9px; align-items: center; }
.gc-live-teams { min-width: 0; }
.gc-live-team { min-width: 0; height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 5px; }
.gc-live-team-open { min-width: 0; display: flex; align-items: center; gap: 7px; text-align: left; }
.gc-live-logo { width: 27px; height: 27px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--raised); color: var(--text); font-size: 9px; font-weight: 900; overflow: hidden; }
.gc-live-logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
.gc-live-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 700; }
.gc-live-score { min-width: 23px; text-align: right; font-family: var(--font-display); font-weight: 900; font-size: 23px; font-variant-numeric: tabular-nums; }
.gc-live-score.trail { color: var(--text-2); }
.gc-live-bets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.gc-live-bets .odds-btn.big { height: 48px; min-width: 0; border-radius: 8px; }
.gc-live-bets .odds-btn.big .lbl { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
.gc-live-bets .odds-btn .ln { font-size: 11px; }
.gc-live-bets .odds-btn .pr { font-size: 12px; }
.gc-more { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--text-2); }
.gc-more .yourbet { color: var(--accent); display: inline-flex; gap: 4px; align-items: center; }
.bump { animation: bump 0.6s ease; }
@keyframes bump { 0% { color: var(--accent); transform: scale(1.18); } 100% { transform: scale(1); } }

.odds-btn {
  height: 46px;
  width: 100%;
  border-radius: 10px;
  background: var(--raised);
  border: 1px solid var(--stroke);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: background 0.12s, border-color 0.12s;
}
.odds-btn:hover:not(:disabled) { border-color: #3d4a5e; }
.odds-btn .ln { font-size: 12.5px; font-weight: 700; color: var(--text); }
.odds-btn .pr { font-size: 13.5px; font-weight: 800; color: var(--accent); display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.odds-btn .pr.solo { font-size: 15px; }
.odds-btn .mv { font-size: 8px; }
.odds-btn .mv.up { color: var(--accent); }
.odds-btn .mv.down { color: var(--loss); }
.odds-btn.on { background: var(--accent); border-color: transparent; }
.odds-btn.on .ln, .odds-btn.on .pr, .odds-btn.on .mv { color: var(--accent-ink); }
.odds-btn.locked { opacity: 0.55; }
.odds-btn.locked .pr { color: var(--muted); }
.odds-btn.big { height: 56px; }
.odds-btn.big .lbl { font-size: 12px; font-weight: 700; color: var(--text-2); }
.odds-btn.big.on .lbl { color: var(--accent-ink); }

.pred-card { margin: 0 16px; }
.pred-card .q { font-weight: 700; font-size: 15.5px; line-height: 1.3; margin: 6px 0 10px; }
.pred-card .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pred-card .prob { height: 4px; border-radius: 2px; background: var(--loss-soft); overflow: hidden; margin-top: 10px; }
.pred-card .prob i { display: block; height: 100%; background: var(--accent); }

.promo {
  margin: 0 16px;
  display: flex; gap: 12px; align-items: center;
  text-align: left;
  background: linear-gradient(120deg, rgba(79, 179, 255, 0.12), rgba(34, 214, 110, 0.08));
  border: 1px solid var(--stroke);
}
.promo .lr-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; flex: none; }

/* ---------- Game detail ---------- */
.scoreboard { margin: 0 16px; padding: 16px 12px; }
.sb-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.sb-team { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.sb-team .team-badge { width: 52px; height: 52px; font-size: 15px; }
.sb-team .nm { font-weight: 800; font-size: 15px; }
.sb-team .rec { font-size: 12px; color: var(--muted); }
.sb-mid { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 120px; }
.sb-score { font-family: var(--font-display); font-weight: 900; font-size: 50px; line-height: 1; font-variant-numeric: tabular-nums; display: flex; gap: 10px; align-items: baseline; }
.sb-score .dash { color: var(--muted); font-size: 30px; }
.sb-score .trail { color: var(--text-2); }
.sb-clock { font-weight: 800; font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }

.market { display: flex; flex-direction: column; gap: 8px; }
.market h4 { margin: 0; font-size: 13px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.06em; }
.market .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }

.cmp-row { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 10px; }
.cmp-row .v { font-family: var(--font-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.cmp-row .v.r { text-align: right; }
.cmp-row .mid { display: flex; flex-direction: column; gap: 5px; }
.cmp-row .lab { text-align: center; font-size: 12px; font-weight: 700; color: var(--text-2); }
.cmp-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; height: 5px; }
.cmp-bars > span { background: var(--raised); border-radius: 3px; overflow: hidden; display: flex; }
.cmp-bars > span:first-child { justify-content: flex-end; }
.cmp-bars i { display: block; height: 100%; border-radius: 3px; }

.play { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--stroke); }
.play:first-child { border-top: 0; }
.play .k { font-weight: 700; font-size: 14px; }
.play .c { font-size: 12px; color: var(--muted); font-weight: 600; }
.play .s { font-family: var(--font-display); font-weight: 800; font-size: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }

.form-dots { display: inline-flex; gap: 3px; }
.form-dots i { width: 18px; height: 18px; border-radius: 5px; font-style: normal; font-size: 10px; font-weight: 900; display: grid; place-items: center; }
.form-dots i.W { background: var(--accent-soft); color: var(--accent); }
.form-dots i.L { background: var(--loss-soft); color: var(--loss); }
.research { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 12px; align-items: center; font-size: 14px; }
.research .c { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.research .r { text-align: right; justify-self: end; }
.research .v { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Bet cards (My Bets) ---------- */
.bet-card { margin: 0 16px; display: flex; flex-direction: column; gap: 10px; }
.bet-top { display: flex; align-items: flex-start; gap: 10px; }
.bet-top .t { font-weight: 800; font-size: 16px; line-height: 1.2; }
.bet-top .odds { font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--text-2); margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.leg { display: flex; gap: 10px; align-items: flex-start; }
.leg + .leg { border-top: 1px dashed var(--stroke); padding-top: 10px; }
.leg-dot { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; margin-top: 1px; background: var(--raised); color: var(--text-2); }
.leg-dot.won { background: var(--accent); color: var(--accent-ink); }
.leg-dot.lost { background: var(--loss); color: #fff; }
.leg-dot.void, .leg-dot.push { background: var(--muted); color: #fff; }
.leg-dot.winning { background: var(--accent-soft); color: var(--accent); }
.leg-dot.losing { background: var(--loss-soft); color: var(--loss); }
.leg .lt { font-weight: 700; font-size: 14.5px; }
.leg .lm { font-size: 12.5px; color: var(--text-2); }
.livebox { background: var(--bg); border: 1px solid var(--stroke); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.livebox .lb-score { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.livebox .lb-score .sc { font-family: var(--font-display); font-weight: 900; font-size: 20px; font-variant-numeric: tabular-nums; }
.livebox .lb-stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); font-weight: 600; }
.livebox .lb-stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.standing { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; }
.standing.winning { color: var(--accent); }
.standing.losing { color: var(--loss); }
.standing.even, .standing.upcoming { color: var(--text-2); }
.stake-row { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--bg); border-radius: 12px; padding: 9px 4px; border: 1px solid var(--stroke); }
.stake-row > div { text-align: center; }
.stake-row > div + div { border-left: 1px solid var(--stroke); }
.stake-row b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.stake-row span { font-size: 11px; font-weight: 700; color: var(--muted); }
.bet-actions { display: flex; gap: 8px; }
.bet-actions .btn { flex: 1; }

.record-card { margin: 0 16px; }
.record-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.record-big > div { background: var(--bg); border: 1px solid var(--stroke); border-radius: 12px; padding: 10px; text-align: center; }
.record-big b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.record-big span { font-size: 11px; font-weight: 700; color: var(--muted); }
.sport-bars { display: flex; flex-direction: column; gap: 8px; }
.sport-bar { display: grid; grid-template-columns: 70px 1fr 60px; gap: 10px; align-items: center; font-size: 12.5px; font-weight: 700; }
.sport-bar .bar { height: 8px; }
.sport-bar .bar i.neg { background: var(--loss); }

/* ---------- Social ---------- */
.me-card { margin: 0 16px; display: flex; gap: 14px; align-items: center; }
.lb-row { display: grid; grid-template-columns: 22px 36px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--stroke); width: 100%; text-align: left; }
.lb-row:first-child { border-top: 0; }
.lb-row.me { background: var(--accent-soft); }
.lb-row .rk { font-family: var(--font-display); font-weight: 900; font-size: 18px; color: var(--text-2); text-align: center; }
.lb-row .nm { font-weight: 800; font-size: 14.5px; }
.lb-row .sub { font-size: 12px; color: var(--text-2); display: flex; gap: 6px; align-items: center; }
.lb-row .val { text-align: right; font-family: var(--font-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.lb-row .val small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--muted); }
.person-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--stroke); }
.person-row:first-child { border-top: 0; }
.team-card { display: flex; flex-direction: column; gap: 10px; }
.avatars { display: flex; }
.avatars img { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -8px; object-fit: cover; }
.avatars img:first-child { margin-left: 0; }
.pick-friends { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-friend { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px 0 4px; border-radius: 999px; border: 1px solid var(--stroke); background: var(--surface); font-weight: 700; font-size: 13.5px; }
.pick-friend img { width: 30px; height: 30px; border-radius: 50%; }
.pick-friend.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* ---------- Overlays ---------- */
.layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
.layer > * { pointer-events: auto; }
.scrim { position: absolute; inset: 0; background: var(--scrim); animation: fade 0.2s ease; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  max-height: 90%;
  display: flex; flex-direction: column;
  background: #0e1218;
  border-top: 1px solid var(--stroke);
  border-radius: 26px 26px 0 0;
  animation: up 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
  box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.45);
}
.sheet.tall { height: 90%; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--raised-2); margin: 8px auto 2px; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px 10px 18px; flex: none; }
.sheet-head h2 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 26px; flex: 1; min-width: 0; }
.sheet-body { overflow-y: auto; padding: 0 16px 22px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: none; }
.sheet-body::-webkit-scrollbar { display: none; }
.sheet-foot { flex: none; padding: 12px 16px 22px; border-top: 1px solid var(--stroke); display: flex; flex-direction: column; gap: 10px; background: #0e1218; }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slidein { from { transform: translateX(100%); } to { transform: none; } }
@keyframes slideleft { from { transform: translateX(-100%); } to { transform: none; } }

.page {
  position: absolute; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  animation: slidein 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
  z-index: 0; /* keeps a page's floating button under sheets opened on top of it */
}
.page .page-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 52px; padding: 0 8px; flex: none; }
.page .page-top .t { text-align: center; font-weight: 800; font-size: 17px; }
.page .page-scroll { flex: 1; overflow-y: auto; padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
.page .page-scroll::-webkit-scrollbar { display: none; }

.drawer {
  position: absolute; top: 0; bottom: 0; left: 0;
  width: 84%;
  background: #0e1218;
  border-right: 1px solid var(--stroke);
  display: flex; flex-direction: column;
  animation: slideleft 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.drawer-head { padding: 18px 18px 14px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--stroke); }
.drawer nav { flex: 1; overflow-y: auto; padding: 8px 8px 20px; display: flex; flex-direction: column; gap: 2px; }
.drawer .dn { display: flex; align-items: center; gap: 14px; height: 50px; padding: 0 12px; border-radius: 12px; font-weight: 700; font-size: 15.5px; text-align: left; }
.drawer .dn:hover { background: var(--surface); }
.drawer .dn .ic { color: var(--text-2); }
.drawer .dn .sub { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 700; }

.dialog-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; }
.dialog {
  width: 100%; max-width: 330px;
  background: #151a23; border: 1px solid var(--stroke); border-radius: 22px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px;
  animation: pop 0.2s ease;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
}
.dialog h3 { margin: 0; font-size: 19px; font-weight: 800; }
.dialog .body { color: var(--text-2); font-size: 14.5px; line-height: 1.45; }
.dialog .acts { display: flex; gap: 10px; margin-top: 4px; }
.dialog .acts .btn { flex: 1; }
@keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: none; opacity: 1; } }

.toasts { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 50; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  pointer-events: auto;
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px;
  background: var(--raised);
  border: 1px solid var(--stroke);
  border-radius: 16px;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
  animation: drop 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
  cursor: pointer;
}
.toast .tt { font-weight: 800; font-size: 14.5px; }
.toast .tm { font-size: 13px; color: var(--text-2); margin-top: 1px; }
.toast.win { border-color: rgba(34, 214, 110, 0.5); }
.toast.win > .ic { color: var(--accent); }
.toast.loss { border-color: rgba(255, 90, 95, 0.5); }
.toast.loss > .ic { color: var(--loss); }
.toast.warn { border-color: rgba(255, 201, 64, 0.5); }
.toast.warn > .ic { color: var(--warn); }
.toast.info > .ic { color: var(--blue); }
.toast.out { opacity: 0; transform: translateY(-8px); transition: 0.25s; }
@keyframes drop { from { transform: translateY(-16px); opacity: 0; } to { transform: none; opacity: 1; } }

.slipbar {
  position: absolute; left: 12px; right: 12px;
  bottom: calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom, 0px));
  z-index: 6;
  display: flex; align-items: center; gap: 10px;
  height: 54px; padding: 0 16px 0 12px;
  border-radius: 16px;
  background: var(--raised-2);
  border: 1px solid #3a4557;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  font-weight: 800;
  animation: drop 0.25s ease;
}
.slipbar .n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 900; }
.slipbar .o { margin-left: auto; font-family: var(--font-display); font-weight: 900; font-size: 19px; color: var(--accent); }
.slipbar.parlay-finalize { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
.slipbar.parlay-finalize .n { background: rgba(3, 20, 10, 0.15); color: var(--accent-ink); }
.slipbar.parlay-finalize .o { color: var(--accent-ink); }
.build-parlay { width: calc(100% - 32px); min-height: 58px; margin: 0 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(34, 214, 110, 0.28); border-radius: 16px; background: linear-gradient(110deg, rgba(34, 214, 110, 0.13), rgba(34, 214, 110, 0.05)); color: var(--text); text-align: left; }
.build-parlay > svg:first-child { color: var(--accent); flex: none; }
.build-parlay > svg:last-child { color: var(--muted); margin-left: auto; flex: none; }
.build-parlay span:not(.lr-icon) { display: grid; gap: 2px; }
.build-parlay b { font-size: 14px; }
.build-parlay small { color: var(--muted); font-size: 12px; }
.build-parlay.active { background: var(--surface); border-color: var(--stroke); }
.build-parlay.active .lr-icon { width: 34px; height: 34px; flex: none; }
.build-parlay.active .link-btn { flex: none; }

/* Bet slip */
.slip-leg { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--stroke); }
.slip-leg.changed { border-color: rgba(255, 201, 64, 0.6); }
.slip-leg.closed { border-color: rgba(255, 90, 95, 0.5); opacity: 0.85; }
.slip-leg .price { font-family: var(--font-display); font-weight: 900; font-size: 20px; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
.slip-leg .old { text-decoration: line-through; color: var(--muted); font-size: 14px; margin-right: 4px; }
.stake-box { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
.stake-box .step { height: 52px; border-radius: 14px; background: var(--raised); border: 1px solid var(--stroke); display: grid; place-items: center; }
.stake-input { position: relative; }
.stake-input input { width: 100%; height: 52px; text-align: center; border-radius: 14px; border: 1px solid var(--stroke); background: var(--raised); font-family: var(--font-display); font-weight: 900; font-size: 30px; outline: none; font-variant-numeric: tabular-nums; padding-right: 36px; padding-left: 36px; -moz-appearance: textfield; }
.stake-input input::-webkit-outer-spin-button, .stake-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stake-input input:focus { border-color: var(--accent); }
.stake-input input.bad { border-color: var(--loss); color: var(--loss); }
.stake-input span { position: absolute; right: 14px; top: 50%; translate: 0 -50%; font-weight: 700; color: var(--text-2); font-size: 14px; pointer-events: none; }
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.quick button { height: 34px; border-radius: 10px; background: var(--surface); border: 1px solid var(--stroke); font-weight: 800; font-size: 13.5px; }
.quick button.on { border-color: var(--accent); color: var(--accent); }
.outcomes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.outcomes > div { border-radius: 14px; padding: 12px; border: 1px solid var(--stroke); background: var(--surface); }
.outcomes b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.outcomes .w b { color: var(--accent); }
.outcomes .l b { color: var(--loss); }
.outcomes span { font-size: 12px; font-weight: 700; color: var(--text-2); }
.perk-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--stroke); }
.perk-row .lr-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }

/* Share card preview */

@keyframes webin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@container area (min-width: 820px) {
  .web .page[data-page="game"] .page-scroll {
    display: grid;
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    align-content: start; align-items: start;
    grid-auto-flow: row dense;
  }
  .web .page[data-page="game"] .page-scroll > * { grid-column: 1 / -1; }
  .web .page[data-page="game"] .page-scroll > .card:has(.market) { grid-column: 1; grid-row: span 3; }
  .web .page[data-page="game"] .page-scroll > .card:not(.scoreboard):not(:has(.market)) { grid-column: 2; }
  .web .page[data-page="game"] .page-scroll:not(:has(.market)) > .card:not(.scoreboard) { grid-column: auto; }
}
@container area (min-width: 600px) {
  .web .scoreboard { padding: 28px 24px; }
  .web .sb-team .team-badge { width: 68px; height: 68px; font-size: 19px; }
  .web .sb-team .nm { font-size: 17px; }
  .web .sb-score { font-size: 68px; }
  .web .sb-score .dash { font-size: 40px; }
}
.web .market .opts { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }

/* ---------- Sheets become centered dialogs ---------- */
.web .sheet {
  left: 50%; top: 50%; right: auto; bottom: auto;
  translate: -50% -50%;
  width: min(580px, calc(100% - 48px));
  max-height: min(88%, 880px);
  border: 1px solid var(--stroke);
  border-radius: 24px;
  animation: pop 0.2s ease;
  box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6);
}
.web .sheet.tall { height: min(88%, 880px); }
.web .sheet .grab { display: none; }
.web .sheet-head { padding: 18px 14px 12px 24px; }
.web .sheet-body { padding: 0 24px 24px; }
.web .sheet-foot { padding: 14px 24px 20px; border-radius: 0 0 24px 24px; }
.web .dialog { max-width: 400px; padding: 24px; }

/* Docked bet slip */
@media (min-width: 900px) {
  .web .sheet-wrap[data-sheet="slip"] { left: auto !important; width: var(--rail-w); }
  .web .sheet-wrap[data-sheet="slip"] .scrim { display: none; }
  .web .sheet-wrap[data-sheet="slip"] .sheet {
    inset: 0; translate: none;
    width: auto; height: auto; max-height: none;
    border: 0; border-left: 1px solid var(--stroke); border-radius: 0;
    background: var(--panel);
    box-shadow: none;
    animation: fade 0.18s ease;
  }
  .web .sheet-wrap[data-sheet="slip"] .sheet-head { height: var(--bar-h); flex: none; padding: 0 22px; margin-bottom: 18px; border-bottom: 1px solid var(--stroke); }
  .web .game-fab.has-slip, .web .parlay-fab { display: none; } /* the docked slip is already on screen */
  .web .sheet-wrap[data-sheet="slip"] .sheet-body { padding: 0 20px 20px; }
  .web .sheet-wrap[data-sheet="slip"] .sheet-foot { padding: 14px 20px 20px; border-radius: 0; background: var(--panel); }
}

/* Offline banner across the top of the content area */
.web .net-banner { top: calc(var(--bar-h) + 12px); left: calc(var(--side-w) + 24px); right: calc(var(--rail-w) + 24px); justify-content: center; }
.web .auth ~ .net-banner, .web #app-body:has(.auth) ~ .net-banner { top: 16px; left: 24px; right: 24px; }

/* Toasts drop in at the top of the content area */
.web .toasts { top: calc(var(--bar-h) + 12px); left: var(--side-w); right: var(--rail-w); align-items: center; }
.web .toast { width: min(440px, calc(100% - 32px)); }

/* Shown only when the slip can't dock (narrow windows) */
.web .slipbar { left: 50%; right: auto; translate: -50% 0; width: min(440px, calc(100% - 32px)); bottom: 24px; }

/* ---------- Welcome, log in, sign up, onboarding ---------- */
.web .auth {
  scrollbar-width: thin;
  background:
    radial-gradient(900px 600px at 15% 0%, rgba(34, 214, 110, 0.10), transparent 60%),
    radial-gradient(700px 500px at 100% 100%, rgba(79, 179, 255, 0.07), transparent 60%),
    var(--bg);
}
.web .auth:has(.welcome-hero) { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(400px, 0.9fr); align-items: center; }
.web .welcome-hero { height: 100%; padding: 48px 64px 72px; gap: 20px; background: none; border-right: 1px solid var(--stroke); }
.web .welcome-hero .wordmark { font-size: clamp(84px, 9vw, 150px); }
.web .welcome-hero .brand-icon { width: clamp(72px, 6.5vw, 108px); height: auto; }
.web .welcome-hero .tagline { font-size: clamp(30px, 3vw, 46px); max-width: 16ch; }
.web .welcome-points { gap: 14px; margin-top: 14px; }
.web .welcome-points div { font-size: 17px; max-width: 46ch; }
.web .auth:has(.welcome-hero) > .auth-inner {
  justify-self: center;
  width: calc(100% - 96px); max-width: 420px;
  padding: 32px;
  gap: 12px !important;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 24px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
}
.web .auth:has(.welcome-hero) > .auth-inner::before {
  content: 'Get started';
  font-family: var(--font-display); font-weight: 900; font-size: 32px; line-height: 1;
  margin-bottom: 10px;
}
.web .auth:not(:has(.welcome-hero)) { align-items: center; padding: 48px 24px; }
.web .auth:not(:has(.welcome-hero)) > .auth-inner {
  flex: none;
  width: 100%; max-width: 500px;
  margin-block: auto;
  padding: 32px 36px 36px;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 24px;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
}
.web .auth .auth-inner .input { background: var(--bg); }

/* ---------- Smaller windows ---------- */
@media (max-width: 1360px) {
  .web { --rail-w: 340px; --gutter: 28px; }
}
@media (max-width: 1100px) {
  .web { --rail-w: 320px; }
}
/* Sidebar shrinks to icons */
@media (min-width: 721px) and (max-width: 1180px) {
  .web { --side-w: 76px; }
  .side-brand { justify-content: center; padding: 0; }
  .side-brand .brand-word, .side .sn-l, .side .sn-sub, .side-label { display: none; }
  .side-nav { padding: 12px 10px; }
  .sn { justify-content: center; padding: 0; }
  .sn-n { position: absolute; top: 3px; right: 3px; height: 18px; min-width: 18px; font-size: 10.5px; padding: 0 5px; }
  .side-user { justify-content: center; padding: 8px 0; }
  .side-foot { padding: 10px; }
}
/* No room to dock the slip: it opens as a dialog from the floating slip bar */
@media (max-width: 899px) {
  .web .app { grid-template-columns: var(--side-w) minmax(0, 1fr); }
  .rail { display: none; }
  .web .page, .web .toasts { right: 0; }
  .web .net-banner { right: 16px; }
  .web .auth:has(.welcome-hero) { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .web .welcome-hero { border-right: 0; padding: 40px 28px 24px; min-height: 60vh; }
  .web .auth:has(.welcome-hero) > .auth-inner { margin-bottom: 40px; width: calc(100% - 48px); }
}
/* Small windows: the sidebar hides behind a menu button and slides in over the page */
.side-scrim { display: none; }
@media (max-width: 720px) {
  .web { --side-w: 0px; }
  .web .app { grid-template-columns: minmax(0, 1fr); }
  .web .side {
    position: absolute; top: 0; bottom: 0; left: 0; z-index: 41;

    transform: translateX(-100%); visibility: hidden;
    transition: transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1), visibility 0.24s;
  }
  .web.side-open .side { transform: none; visibility: visible; }
  .web.side-open .side-scrim { display: block; position: absolute; inset: 0; z-index: 40; background: var(--scrim); animation: fade 0.2s ease; }
  .wt-menu { display: grid; }
  .web .net-banner { left: 16px; right: 16px; }
}
@media (max-width: 560px) {
  .web .welcome-hero { padding: 32px 20px 20px; }
  .web .auth:not(:has(.welcome-hero)) { padding: 24px 12px; }
  .web .auth:not(:has(.welcome-hero)) > .auth-inner { padding: 24px 20px 28px; }
  .web .auth:has(.welcome-hero) > .auth-inner { width: calc(100% - 24px); padding: 24px; }
  .web .sheet { width: calc(100% - 20px); }
  .web .sheet-head { padding-left: 18px; }
  .web .sheet-body { padding: 0 16px 18px; }
  .web .sheet-foot { padding: 12px 16px 16px; }
}

<script>
/* TimeOut web demo — core helpers: storage, demo clock, hashing, formatting, odds math, icons. */
window.TO = window.TO || {};
(function (TO) {
  'use strict';

  // ---------- Storage (localStorage with in-memory fallback) ----------
  const mem = {};
  TO.store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw != null) return JSON.parse(raw);
      } catch (e) { /* private mode or blocked */ }
      return key in mem ? mem[key] : fallback;
    },
    set(key, value) {
      mem[key] = value;
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    },
    del(key) {
      delete mem[key];
      try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
    },
  };

  TO.now = () => Date.now();

  const MIN = 60 * 1000;
  const HOUR = 60 * MIN;
  const DAY = 24 * HOUR;
  TO.MIN = MIN; TO.HOUR = HOUR; TO.DAY = DAY;

  const pad = (n) => String(n).padStart(2, '0');
  TO.dayKey = (ts = TO.now()) => {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  TO.dayStart = (key) => {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d).getTime();
  };
  TO.addDays = (key, n) => {
    const [y, m, d] = key.split('-').map(Number);
    return TO.dayKey(new Date(y, m - 1, d + n, 12).getTime());
  };
  TO.nextMidnight = (ts = TO.now()) => {
    const d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
  };
  TO.weekKey = (ts = TO.now()) => {
    const d = new Date(ts);
    const day = (d.getDay() + 6) % 7; // Monday = 0
    return TO.dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - day, 12).getTime());
  };

  // ---------- Hashing / seeded randomness ----------
  TO.hash = (str) => {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  };
  /** Stable value in [-1, 1] for a string. */
  TO.unit = (str) => (TO.hash(str) % 20001) / 10000 - 1;
  /** Stable value in [0, 1). */
  TO.u01 = (str) => (TO.hash(str) % 100000) / 100000;
  TO.rng = (seed) => {
    let a = typeof seed === 'string' ? TO.hash(seed) : seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  TO.shuffle = (arr, rand) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  TO.uid = (prefix = 'id') => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;

  // Password hashing for the demo only (accounts live in this browser; this is not real security).
  TO.pwHash = (password, salt) => {
    let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7;
    const str = `${salt}:${password}:timeout`;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  };

  // ---------- Math ----------
  /** Standard normal CDF (Abramowitz–Stegun erf approximation). */
  TO.phi = (x) => {
    const z = Math.abs(x) / Math.SQRT2;
    const t = 1 / (1 + 0.3275911 * z);
    const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z);
    return 0.5 * (1 + (x >= 0 ? y : -y));
  };

  TO.hook = (x) => Math.floor(x) + 0.5;
  TO.clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

  TO.odds = {
    decimal(american) { return american > 0 ? 1 + american / 100 : 1 + 100 / Math.abs(american); },
    fromDecimal(dec) {
      if (dec <= 1) return -10000;
      return dec >= 2 ? Math.round((dec - 1) * 100) : Math.round(-100 / (dec - 1));

    /** Fair (no house edge) American price, rounded to sportsbook-looking steps. */
    fromProb(raw) {
      const p = TO.clamp(raw, 0.038, 0.962);
      const val = p >= 0.5 ? (-100 * p) / (1 - p) : (100 * (1 - p)) / p;
      const step = Math.abs(val) >= 300 ? 25 : 5;
      let r = Math.round(val / step) * step;
      if (r > -100 && r < 100) r = r < 0 ? -100 : 100;
      return r;
    },
    fmt(price) { return price > 0 ? `+${price}` : `${price}`; },
    fmtLine(line, signed = true) {
      const body = Number.isInteger(line) ? String(line) : line.toFixed(1);
      if (!signed) return body;
      return line > 0 ? `+${body}` : body;
    },
  };

  // ---------- Formatting ----------
  TO.esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  TO.signed = (n) => (n > 0 ? `+${n}` : n < 0 ? `−${Math.abs(n)}` : '0');
  TO.countdown = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
  };
  TO.fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  TO.fmtDate = (ts) => new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
  TO.fmtDay = (ts) => {
    const key = TO.dayKey(ts);
    const today = TO.dayKey();
    if (key === today) return 'Today';
    if (key === TO.addDays(today, 1)) return 'Tomorrow';
    if (key === TO.addDays(today, -1)) return 'Yesterday';
    return new Date(ts).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  };
  TO.fmtIn = (ms) => {
    const m = Math.max(0, Math.round(ms / MIN));
    if (m < 1) return 'under a minute';
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60);
    return `${h} hr${m % 60 ? ` ${m % 60} min` : ''}`;
  };
  TO.ago = (ts) => {
    const m = Math.round((TO.now() - ts) / MIN);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    if (h < 24) return `${h} hr ago`;
    return TO.fmtDay(ts);
  };
  TO.plural = (n, word, plural) => `${n} ${n === 1 ? word : plural || word + 's'}`;
  TO.ordinal = (n) => {
    const s = ['th', 'st', 'nd', 'rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };

  // ---------- Avatars ----------
  TO.initialsAvatar = (name, color) => {
    const initials = String(name || '?').replace(/[^a-zA-Z0-9]/g, ' ').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase() || '?';

    return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
  };

  // ---------- Icons (24px stroke icons) ----------

<script>
/* TimeOut web demo — simulated sports feed, live stats, fair odds and prediction markets.
 *
 * Every league runs on rolling 20-minute slots. Each game lasts 12 real minutes (sped up for the demo),
 * and every score, stat and price is a pure function of the game ID and the (demo) clock, so the same
 * game looks the same on every refresh and can be graded at any time.
 */
(function (TO) {
  'use strict';
  const MIN = TO.MIN;
  const SLOT = 20 * MIN;
  const DURATION = 12 * MIN;
  const STEP = 5000;
  const STEPS = DURATION / STEP; // 144
  const ODDS_BUCKET_LIVE = 15000;
  const ODDS_BUCKET_PRE = 2 * MIN;

  const SPORTS = {
    football: { periods: 4, periodMin: 15, marginSigma: 13.5, totalSigma: 10, perTeam: 21.6, homeEdge: 1.5, spread: 'dynamic', spreadLabel: 'Spread', discrete: false, unit: 'pts' },
    basketball: { periods: 4, periodMin: 12, marginSigma: 12, totalSigma: 15, perTeam: 111, homeEdge: 2.5, spread: 'dynamic', spreadLabel: 'Spread', discrete: false, unit: 'pts' },

    soccer: { periods: 2, marginSigma: 1.6, totalSigma: 1.6, perTeam: 1.35, homeEdge: 0.3, spread: null, draw: true, discrete: true, unit: 'goals' },
  };

  const t = (abbr, name, city, color) => ({ abbr, name, city, color });
  const LEAGUES = {
    nfl: {
