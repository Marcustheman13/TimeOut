    if (!/^[a-zA-Z0-9_.]{3,20}$/.test(username)) throw new TO.AppError('invalid', 'Use 3–20 letters, numbers, dots or underscores.', { fields: { username: 'Use 3–20 letters, numbers, dots or underscores.' } });
    const result = await authRequest(`signup?redirect_to=${encodeURIComponent(returnUrl())}`, { email: String(email || '').trim(), password, data: { username, display_name: username, avatar_url: photoUrl || null } });
    // Supabase answers a sign-up for an email that's already registered with a user that has no identities.
    if (Array.isArray(result.identities) && result.identities.length === 0) {
      throw new TO.AppError('taken', 'An account with this email already exists. Log in instead.', { fields: { email: 'An account with this email already exists.' } });
    }
    // Email confirmation is on: there's no session until the link in the email is opened.
    if (!result.session?.access_token && !result.access_token) return { needsConfirmation: true, email: String(email || '').trim() };
    saveSession(result.session || result);
    lastSettingsSnapshot = '';
    supportsAppPreferences = true;
    const user = await api.me();
    const state = await api.loadState();
    return { user, state };
  };
  api.me = async () => {
    await ensureFreshSession();
    const res = await fetch(`${config.url}/auth/v1/user`, { headers: authHeaders(true) });
    const user = await parseResponse(res);
    const profileRows = await rest(`profiles?select=username,display_name,avatar_url,created_at&id=eq.${encodeURIComponent(user.id)}&limit=1`);
    const profile = profileRows[0] || {};
    return { id: user.id, username: profile.username || user.user_metadata?.username || user.email?.split('@')[0] || 'player', email: user.email,
      photoUrl: profile.avatar_url || user.user_metadata?.avatar_url || null, createdAt: profile.created_at || user.created_at, isDemo: false };
  };
  api.loadState = async () => {
    const id = tokenUserId();
    if (!id) return null;
    const safeId = encodeURIComponent(id);
    let hasTierBonusColumns = true;
    let hasTierPerkColumns = true;
    const baseWalletFields = `balance_minutes,current_day,is_locked,streak`;
    const bonusWalletFields = `${baseWalletFields},tier_bonus_day,tier_bonus_minutes`;
    const walletRequest = rest(`wallets?select=${bonusWalletFields},tier_boosts_by_day,tier_insurance_by_week&user_id=eq.${safeId}&limit=1`).catch((error) => {
      if (!/tier_boosts_by_day|tier_insurance_by_week|column .*does not exist/i.test(error.message || '')) throw error;
      hasTierPerkColumns = false;
      return rest(`wallets?select=${bonusWalletFields}&user_id=eq.${safeId}&limit=1`).catch((bonusError) => {
        if (!/tier_bonus_day|tier_bonus_minutes|column .*does not exist/i.test(bonusError.message || '')) throw bonusError;
        hasTierBonusColumns = false;
        return rest(`wallets?select=${baseWalletFields}&user_id=eq.${safeId}&limit=1`);
      });
    });
    const [betRows, walletRows] = await Promise.all([
      rest(`bets?select=*,bet_legs(*)&user_id=eq.${safeId}&order=placed_at.desc`),
      walletRequest,
    ]);
    supportsTierBonusColumns = hasTierBonusColumns;
    supportsTierPerkColumns = hasTierPerkColumns;
    let settingsRows;
    try {
      settingsRows = await rest(`user_settings?select=followed_sports,timezone,notifications_enabled,app_preferences&user_id=eq.${safeId}&limit=1`);
      supportsAppPreferences = true;
    } catch (e) {
      if (!/app_preferences.*does not exist|column .*app_preferences/i.test(e.message || '')) throw e;
      supportsAppPreferences = false;
      settingsRows = await rest(`user_settings?select=followed_sports,timezone,notifications_enabled&user_id=eq.${safeId}&limit=1`);
    }
    const status = { pending: 'open', won: 'won', lost: 'lost', pushed: 'push', voided: 'void', cancelled: 'void' };
    const result = { pending: 'pending', win: 'won', loss: 'lost', push: 'push', void: 'void' };
    const bets = betRows.map((row) => {
      const legs = (row.bet_legs || []).map((leg) => ({
        selId: `${leg.espn_event_id}|${leg.market}|${leg.side}`, kind: 'game', gameId: leg.espn_event_id, league: leg.league, market: leg.market, side: leg.side,
        line: leg.line == null ? null : Number(leg.line), price: Number(leg.accepted_odds), label: `${leg.market} · ${leg.side}${leg.line == null ? '' : ` ${leg.line}`}`,
        marketLabel: leg.market, matchup: leg.matchup, result: result[leg.result] || 'pending', final: null,
      }));
      const decimal = Number(row.combined_odds);
      const placedAt = Date.parse(row.placed_at);
      return { id: `supabase-${row.id}`, supabaseId: row.id, kind: 'sports', placedAt, dayKey: TO.dayKey(placedAt),
        stake: Number(row.stake_minutes), legs, decimal, american: TO.odds.fromDecimal(decimal), boosted: !!row.boosted, insured: !!row.insured,
        multiplier: Number(row.multiplier || 1), status: status[row.status] || 'open', payout: Number(row.actual_payout_minutes || 0), potentialPayout: Number(row.potential_payout_minutes || 0),
        settledAt: row.settled_at ? Date.parse(row.settled_at) : null, supabaseSynced: row.status !== 'pending' };
    });
    const wallet = walletRows[0];
    const settings = settingsRows[0];
    const walletState = wallet ? { balance: Number(wallet.balance_minutes), dayKey: wallet.current_day, lockedOut: !!wallet.is_locked, streakDays: Number(wallet.streak || 0) } : null;
    if (walletState && hasTierBonusColumns) {
      walletState.bonusDay = wallet.tier_bonus_day;
      walletState.bonusGranted = Number(wallet.tier_bonus_minutes || 0);
    }
    if (walletState && hasTierPerkColumns) {
      walletState.boostsByDay = wallet.tier_boosts_by_day || {};
      walletState.insuranceByWeek = wallet.tier_insurance_by_week || {};
    }
    const appPreferences = settings?.app_preferences || {};
    const storedSports = [
      ...(Array.isArray(settings?.followed_sports) ? settings.followed_sports : []),
      ...(Array.isArray(appPreferences.sports) ? appPreferences.sports : []),
    ];
    const followedSports = [...new Set(storedSports.filter((league) => TO.sim.REAL_LEAGUES.includes(league)))];
    const remotePreferences = { ...appPreferences };
    if (followedSports.length) remotePreferences.sports = followedSports;
    return {
      bets,
      ...(walletState ? { wallet: walletState } : {}),
      ...(settings ? { settings: remotePreferences, appPreferencesReady: supportsAppPreferences } : {}),
    };
  };
  api.queueStateSave = (data) => {
    if (!api.configured || !token()) return;
    pendingState = JSON.parse(JSON.stringify(data));
    if (!saveTimer) saveTimer = setTimeout(() => {
      saveTimer = null;
      api.flushState().catch((e) => {
        if (e.outOfBettingMinutes || isOutOfBettingMinutes(e)) {
          notifyOutOfBettingMinutes();
          return;
        }
        console.warn('Could not sync TimeOut data to Supabase:', e.message);
        if (Date.now() - lastSyncAlertAt > 15000 && TO.ui?.toast) {
          lastSyncAlertAt = Date.now();
          TO.ui.toast({ kind: 'loss', title: 'Couldn’t save to Supabase', msg: e.message });
        }
      });
    }, Math.max(0, 1500 - (Date.now() - lastSaveAt)));
  };
  api.flushState = async () => {
    clearTimeout(saveTimer); saveTimer = null;
    if (!pendingState || !token()) return;
    const data = pendingState;
    pendingState = null;
    const id = tokenUserId();
    if (!id) { pendingState = data; throw new TO.AppError('bad_token', 'Your session is invalid. Log in again.'); }
    try {
      const settingsValue = { followed_sports: data.settings?.sports || [], timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Denver', notifications_enabled: Object.values(data.settings?.notify || {}).some(Boolean) };
      if (supportsAppPreferences) settingsValue.app_preferences = data.settings || {};
      const settingsSnapshot = JSON.stringify(settingsValue);
      if (settingsSnapshot !== lastSettingsSnapshot) {
        await rest(`user_settings?user_id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: settingsSnapshot });
        lastSettingsSnapshot = settingsSnapshot;
      }
      for (const bet of data.bets || []) {
        if (bet.kind !== 'sports' || !Number(bet.stake) || !bet.legs?.length || bet.legs.some((leg) => !isPersistableGameLeg(leg) || !leg.gameId)) continue;
        if (!bet.supabaseId && !placing.has(bet.id)) {
          placing.add(bet.id);
          try {
            const payout = Number(bet.payout) > 0 ? Number(bet.payout) : Math.max(0,
              Number(bet.stake) + Math.round((Math.round(Number(bet.stake) * Number(bet.decimal)) - Number(bet.stake)) * Number(bet.multiplier || 1)));
            const bonusToday = data.wallet?.bonusDay === (data.wallet?.dayKey || bet.dayKey) ? Number(data.wallet?.bonusGranted || 0) : 0;
            const betArgs = {
              p_stake_minutes: Number(bet.stake), p_combined_odds: Number(bet.decimal), p_potential_payout: payout,
              p_current_day: data.wallet?.dayKey || bet.dayKey,
              p_use_boost: !!bet.boosted, p_use_insurance: !!bet.insured,
              p_multiplier: Number(bet.multiplier || 1),
              p_legs: bet.legs.map((leg) => ({ espn_event_id: String(leg.gameId), league: leg.league || 'unknown', matchup: leg.matchup || '', market: leg.market || 'moneyline', side: leg.side || '', line: leg.line, accepted_odds: Number(leg.price) })),
            };
            const legacyBetArgs = {
              p_stake_minutes: betArgs.p_stake_minutes, p_combined_odds: betArgs.p_combined_odds,
              p_potential_payout: betArgs.p_potential_payout, p_current_day: betArgs.p_current_day, p_legs: betArgs.p_legs,
            };
            let saved;
            try {
              if ((bet.boosted || bet.insured) && supportsTierPerkColumns === false) {
                const migrationError = new Error('The tier perk migration is not installed.');
                migrationError.tierPerkMigrationMissing = true;
                migrationError.failedBetId = bet.id;
                throw migrationError;
              }
              saved = await rest('rpc/timeout_place_bet_with_perks', { method: 'POST', body: JSON.stringify(betArgs) });
            } catch (error) {
              if (error.tierPerkMigrationMissing) throw error;
              if (isTierPerkRpcUnavailable(error)) {
                if (bet.boosted || bet.insured) {
                  error.tierPerkMigrationMissing = true;
                  error.failedBetId = bet.id;
                  throw error;
                }
                const fallbackRpc = bonusToday > 0 ? 'timeout_place_bet_with_tiers' : 'timeout_place_bet';
                try {
                  saved = await rest(`rpc/${fallbackRpc}`, { method: 'POST', body: JSON.stringify(legacyBetArgs) });
                } catch (fallbackError) {
                  if (isOutOfBettingMinutes(fallbackError)) {
                    fallbackError.outOfBettingMinutes = true;
                    if (supportsTierBonusColumns === false && bonusToday > 0) fallbackError.tierBonusMigrationMissing = true;
                  }
                  fallbackError.failedBetId = bet.id;
                  throw fallbackError;
                }
              } else if (isTierSystemRpcUnavailable(error) && !(bet.boosted || bet.insured)) {
                const fallbackRpc = 'timeout_place_bet';
                try {
                  saved = await rest(`rpc/${fallbackRpc}`, { method: 'POST', body: JSON.stringify(legacyBetArgs) });
                } catch (fallbackError) {
                  if (isOutOfBettingMinutes(fallbackError)) fallbackError.outOfBettingMinutes = true;
                  if (isOutOfBettingMinutes(fallbackError) && supportsTierBonusColumns === false && bonusToday > 0) fallbackError.tierBonusMigrationMissing = true;
                  fallbackError.failedBetId = bet.id;
                  throw fallbackError;
                }
              } else {
                if (isOutOfBettingMinutes(error)) error.outOfBettingMinutes = true;
                if (isOutOfBettingMinutes(error) && supportsTierBonusColumns === false && bonusToday > 0) error.tierBonusMigrationMissing = true;
                if (isTierPerkLimitError(error)) error.tierPerkExhausted = true;
                error.failedBetId = bet.id;
                throw error;
              }
            }
            const betId = typeof saved === 'string' ? saved : saved.id;
            if (!betId) throw new Error('Supabase did not return the saved bet ID.');
            bet.supabaseId = betId;
            bet.supabaseSynced = false;
            const current = TO.data?.bets?.find((b) => b.id === bet.id);
            if (current) { current.supabaseId = betId; current.supabaseSynced = false; TO.store.set(`timeout.data.${TO.account.id}`, TO.data); }
          } finally { placing.delete(bet.id); }
        }
        if (bet.supabaseId && bet.status !== 'open' && !bet.supabaseSynced && !settling.has(bet.supabaseId)) {
          settling.add(bet.supabaseId);
          try {
            const settled = await rest('rpc/timeout_settle_bet', { method: 'POST', body: JSON.stringify({
              p_bet_id: bet.supabaseId, p_status: ({ push: 'pushed', void: 'voided' })[bet.status] || bet.status,
              p_actual_payout: Number(bet.payout || 0),
              p_leg_results: bet.legs.map((leg) => ({ espn_event_id: String(leg.gameId), market: leg.market, side: leg.side, line: leg.line, result: leg.result })),
            }) });
            bet.supabaseSynced = settled !== false;
            const current = TO.data?.bets?.find((b) => b.supabaseId === bet.supabaseId);
            if (current) { current.supabaseSynced = bet.supabaseSynced; TO.store.set(`timeout.data.${TO.account.id}`, TO.data); }
          } finally { settling.delete(bet.supabaseId); }
        }
      }
      lastSaveAt = Date.now();
      api.syncError = null;
    } catch (e) {
      if (e.outOfBettingMinutes || e.tierBonusMigrationMissing || e.tierPerkMigrationMissing || e.tierPerkExhausted) {
        const rejectedId = e.failedBetId;
        const rejected = (data.bets || []).find((bet) => bet.id === rejectedId);
        pendingState = null;
        data.bets = (data.bets || []).filter((bet) => bet.id !== rejectedId);
        if (rejected && data.wallet) {
          data.wallet.balance = Math.max(0, Number(data.wallet.balance || 0) + Number(rejected.stake || 0));
          data.wallet.lockedOut = data.wallet.balance <= 0;
        }
        if (TO.data) {
          TO.data.bets = TO.data.bets.filter((bet) => bet.id !== rejectedId);
          if (rejected && TO.data.wallet) {
            TO.data.wallet.balance = Math.max(0, Number(TO.data.wallet.balance || 0) + Number(rejected.stake || 0));
            TO.data.wallet.lockedOut = TO.data.wallet.balance <= 0;
          }
          if (TO.account) TO.store.set(`timeout.data.${TO.account.id}`, TO.data);
        }
        if (e.tierPerkMigrationMissing) notifyTierPerkMigrationRequired();
        else if (e.tierPerkExhausted) notifyTierPerkAlreadyUsed();
        else if (e.tierBonusMigrationMissing) notifyTierBonusMigrationRequired();
        else notifyOutOfBettingMinutes();
        TO.app?.render?.();
        return;
      }
      pendingState = data;
      throw e;
    }
  };
  api.updateProfile = async (patch) => {
    await ensureFreshSession();
    const userId = tokenUserId();
    if (!userId) throw new TO.AppError('bad_token', 'Your session is invalid. Log in again.');
    const body = { id: userId };
    if (patch.username != null) body.username = patch.username;
    if (patch.photoUrl != null) body.avatar_url = patch.photoUrl;
    if (Object.keys(body).length > 1) await rest(`profiles?id=eq.${encodeURIComponent(userId)}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ username: body.username, avatar_url: body.avatar_url }) });
    if (patch.email || patch.password) {
      const res = await fetch(`${config.url}/auth/v1/user`, { method: 'PUT', headers: authHeaders(true), body: JSON.stringify({ ...(patch.email ? { email: patch.email } : {}), ...(patch.password ? { password: patch.password } : {}) }) });
      await parseResponse(res);
    }
  };
  api.logout = async () => {
    await api.flushState().catch(() => {});
    if (token()) {
      try { const res = await fetch(`${config.url}/auth/v1/logout`, { method: 'POST', headers: authHeaders(true) }); await parseResponse(res); } catch (e) { /* session can already be expired */ }
    }
    api.clearToken();
    lastSettingsSnapshot = '';
  };

  /** Usernames that match a query, from Supabase profiles (when signed in) and this app's API.
   *  Either source can be missing — GitHub Pages has no API, and profiles may be hidden — so a failure is just no extra rows. */
  api.searchUsers = async (query) => {
    const safe = String(query || '').trim().replace(/^@/, '').slice(0, 20).replace(/[^a-zA-Z0-9_.]/g, '');
    if (!safe) return [];
    const me = String(TO.account?.username || '').toLowerCase();
    const found = new Map();
    const add = (username, name, photo) => {
      const u = String(username || '').trim();
      const key = u.toLowerCase();
      if (!u || key === me || found.has(key) || !/^[a-zA-Z0-9_.]{1,20}$/.test(u)) return;
      found.set(key, { username: u, name: name || u, photo: photo || null, remote: true });
    };
    const tasks = [];
    if (api.configured && token()) {
      tasks.push((async () => {
        try {
          const like = safe.replace(/[_\\*]/g, (ch) => `\\${ch}`);
          const rows = await rest(`profiles?select=username,display_name,avatar_url&username=ilike.*${encodeURIComponent(like)}*&limit=8`, { signal: AbortSignal.timeout(4000) });
          if (Array.isArray(rows)) for (const r of rows) add(r.username, r.display_name, r.avatar_url);
        } catch (e) { /* RLS or a slow network: local results still show */ }
      })());
    }
    tasks.push((async () => {
      try {
        const res = await fetch(`/api/users/search?q=${encodeURIComponent(safe)}`, { signal: AbortSignal.timeout(4000), headers: { accept: 'application/json' } });
        if (!res.ok) return;
        const json = await res.json().catch(() => ({}));
        for (const r of json.users || []) add(r.username, r.username, r.photoUrl);
      } catch (e) { /* opened as a static page, or the API is down */ }
    })());
    await Promise.all(tasks);
    return [...found.values()].slice(0, 8);
  };

  let expressReady = null;
  async function expressUp() {
    if (expressReady != null) return expressReady;
    try {
      const res = await fetch('/api/health', { signal: AbortSignal.timeout(1500), headers: { accept: 'application/json' } });
      const json = await res.json().catch(() => null);
      expressReady = !!(res.ok && json && json.ok);
    } catch (e) { expressReady = false; }
    return expressReady;
  }

  const teamBody = (team, extra) => JSON.stringify({ ...extra, key: team.shareKey });

  async function expressTeam(path, options) {
    const res = await fetch(path, { ...options, signal: AbortSignal.timeout(4000), headers: { 'content-type': 'application/json', accept: 'application/json', ...(options.headers || {}) } });
    if (res.status === 404) return false;
    if (!res.ok) return null;
    const json = await res.json().catch(() => null);
    return json && Object.prototype.hasOwnProperty.call(json, 'team') ? json.team : null;
  }

  /** Save one new team. A repeat with the same link returns the roster and does not add people again. */
  api.publishTeam = async (team) => {
    if (!team?.shareKey) return null;
    try {
      if (await expressUp()) {
        return await expressTeam('/api/teams', { method: 'POST', body: JSON.stringify({ id: team.id, name: team.name, start: team.start, end: team.end, owner: team.owner, key: team.shareKey, members: team.members }) });
      }
      if (!(api.configured && token())) return null;
      return await rest('rpc/timeout_save_team', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: team.id, p_name: team.name, p_start: team.start, p_end: team.end, p_key: team.shareKey, p_members: team.members }) });
    } catch (e) { return null; }
  };

  api.addTeamMember = async (team, username) => {
    if (!team?.shareKey || !username) return null;
    const send = async () => {
      if (await expressUp()) return expressTeam(`/api/teams/${encodeURIComponent(team.id)}/members`, { method: 'POST', body: teamBody(team, { username }) });
      if (!(api.configured && token())) return null;
      return rest('rpc/timeout_add_team_member', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: team.id, p_key: team.shareKey, p_username: username }) });
    };
    try {
      let result = await send();
      if (result === false) {
        await api.publishTeam(team);
        result = await send();
      }
      return result === false ? null : result;
    } catch (e) { return null; }
  };

  api.leaveTeamRemote = async (team, username) => {
    if (!team?.shareKey || !username) return null;
    try {
      if (await expressUp()) return expressTeam(`/api/teams/${encodeURIComponent(team.id)}/leave`, { method: 'POST', body: teamBody(team, { username }) });
      if (!(api.configured && token())) return null;
      return await rest('rpc/timeout_leave_team', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: team.id, p_key: team.shareKey, p_username: username }) });
    } catch (e) { return null; }
  };

  /** The roster, false when the link is wrong or the team is gone, null when the server can't be reached. */
  api.fetchTeam = async (id, key) => {
    if (!id || !key) return null;
    try {
      if (await expressUp()) return expressTeam(`/api/teams/${encodeURIComponent(id)}?key=${encodeURIComponent(key)}`, { method: 'GET', headers: { accept: 'application/json' } });
      if (!(api.configured && token())) return null;
      const row = await rest('rpc/timeout_get_team', { method: 'POST', signal: AbortSignal.timeout(4000), body: JSON.stringify({ p_id: id, p_key: key }) });
      return row && row.id ? row : false;
    } catch (e) { return null; }
  };

  /** Teams this signed-in Supabase profile is on. Null means "don't change the local list". */
  api.myTeams = async () => {
    if (await expressUp()) return null;
    if (!(api.configured && token())) return null;
    try {
      const rows = await rest('rpc/timeout_my_teams', { method: 'POST', signal: AbortSignal.timeout(4000), body: '{}' });
      return Array.isArray(rows) ? rows : null;
    } catch (e) { return null; }
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — shared UI: rendering helpers, sheets, dialogs, toasts and small components. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;

  const ui = (TO.ui = {});
  TO.actions = {};   // click handlers, keyed by data-act
  TO.inputs = {};    // input handlers, keyed by element id
  TO.changes = {};   // change handlers, keyed by data-change
  TO.views = {};
  ui.root = () => document.getElementById('screen');
  ui.layer = () => document.getElementById('layer');

  // ---------- Components ----------
  ui.teamBadge = (team, size) =>
    `<span class="team-badge" style="background:${team.color || 'var(--raised)'}${size ? `;width:${size}px;height:${size}px;font-size:${Math.round(size * 0.3)}px` : ''}">${team.logo ? `<img src="${esc(team.logo)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">` : ''}<span style="${team.logo ? 'display:none' : ''}">${esc(team.abbr)}</span></span>`;

  ui.tierBadge = (tierId, sm) => {
    const t = TO.state.tierById(tierId);
    return `<span class="tier-badge ${t.id === 'rookie' ? 'rookie' : ''} ${sm ? 'sm' : ''}" style="${t.id === 'rookie' ? '' : `background:${t.color}`}">${icon(t.icon, sm ? 11 : 13)}${esc(t.title)}</span>`;
  };

  ui.avatar = (src, cls = '') => `<img class="avatar ${cls}" src="${esc(src)}" alt="">`;

  ui.statusPill = (status) => {
    const label = { won: 'Won', lost: 'Lost', void: 'Void', push: 'Push', open: 'Open' }[status] || status;
    return `<span class="status-pill ${status}">${label.toUpperCase()}</span>`;
  };

  ui.oddsText = (price) => TO.odds.fmt(price);

  ui.leagueTitle = (id) => (id === 'pred' ? 'Predictions' : id === 'todo' ? 'To-Do' : id === 'parlay' ? 'Parlays' : (S.LEAGUES[id] || {}).title || id);
  ui.leagueShort = (id) => (id === 'pred' ? 'PRED' : id === 'todo' ? 'TO-DO' : id === 'parlay' ? 'PARLAY' : (S.LEAGUES[id] || {}).short || id);

  ui.gameStatus = (g) => {
    if (g.state === 'live') return `<span class="live">LIVE</span><span style="color:var(--text)">${esc(g.clock)}</span>`;
    if (g.state === 'scheduled') {
      const mins = Math.round((g.start - TO.now()) / TO.MIN);
      return `<span>${TO.fmtDay(g.start)} · ${TO.fmtTime(g.start)}</span>${mins <= 60 ? `<span class="faint">· starts in ${mins < 1 ? '<1' : mins} min</span>` : ''}`;
    }
    if (g.state === 'final') return `<span>${esc(g.statusText)}</span>`;
    if (g.state === 'canceled') return `<span class="yellow row-s">${icon('alert', 13)} Canceled · all bets voided, stakes returned</span>`;
    return `<span class="yellow row-s">${icon('alert', 13)} Postponed · all bets voided, stakes returned</span>`;
  };

  /** One odds button. Tapping adds or removes the pick on the bet slip. */
  ui.oddsBtn = (sel, { suspended, move, big, label } = {}) => {
    const on = TO.slip.has(sel.id);
    const locked = suspended;
    let ln = '';
    if (sel.market === 'spread') ln = TO.odds.fmtLine(sel.line);
    if (sel.market === 'total') ln = `${sel.side === 'over' ? 'O' : 'U'} ${TO.odds.fmtLine(sel.line, false)}`;
    const mv = move ? `<span class="mv ${move > 0 ? 'up' : 'down'}">${move > 0 ? '▲' : '▼'}</span>` : '';
    const inner = locked
      ? `${icon('lock', 14)}`
      : `${big && label ? `<span class="lbl">${esc(label)}</span>` : ''}${ln ? `<span class="ln">${ln}</span>` : ''}<span class="pr ${ln || (big && label) ? '' : 'solo'}">${mv}${ui.oddsText(sel.price)}</span>`;
    return `<button class="odds-btn ${on ? 'on' : ''} ${locked ? 'locked' : ''} ${big ? 'big' : ''}" data-act="pick" data-sel="${esc(sel.id)}" ${locked ? 'disabled' : ''} aria-pressed="${on}" aria-label="${esc(label || '')} ${ln} ${ui.oddsText(sel.price)}${locked ? ' suspended' : ''}">${inner}</button>`;
  };

  ui.countdownEl = (target, cls = '') => `<span class="${cls}" data-countdown="${target}">${TO.countdown(target - TO.now())}</span>`;

  ui.field = ({ id, label, type = 'text', value = '', placeholder = '', err, hint, attrs = '' }) => `
    <div class="field">
      <label for="${id}">${esc(label)}</label>
      ${type === 'password'
        ? `<div class="input-wrap"><input class="input ${err ? 'bad' : ''}" id="${id}" name="${id}" type="password" value="${esc(value)}" placeholder="${esc(placeholder)}" ${attrs}><button type="button" class="icon-btn" data-act="toggle-pw" data-for="${id}" aria-label="Show password">${icon('eye', 18)}</button></div>`
        : `<input class="input ${err ? 'bad' : ''}" id="${id}" name="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${attrs}>`}
      ${err ? `<div class="err">${esc(err)}</div>` : hint ? `<div class="hint">${esc(hint)}</div>` : ''}
    </div>`;

  ui.switchEl = (id, checked, attrs = '') => `<span class="switch"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${attrs}><span></span></span>`;

  // ---------- Sheets ----------
  let sheetSeq = 0;
  /** Opens a bottom sheet. Returns its id. `render` returns {title, body, foot}. */
  ui.sheet = (name, opts = {}) => {
    ui.closeSheet(name, true);
    const id = `sheet-${++sheetSeq}`;
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.dataset.sheet = name;
    wrap.id = id;
    wrap.style.cssText = 'position:absolute;inset:0;';
    wrap.innerHTML = `<div class="scrim" data-act="close-sheet" data-name="${name}"></div><div class="sheet ${opts.tall ? 'tall' : ''}" role="dialog" aria-modal="true"><div class="grab"></div><div class="sheet-head"><h2></h2><button class="icon-btn" data-act="close-sheet" data-name="${name}" aria-label="Close">${icon('x', 20)}</button></div><div class="sheet-body"></div><div class="sheet-foot" hidden></div></div>`;
    ui.layer().appendChild(wrap);
    wrap._opts = opts;
    ui.refreshSheet(name);
    return id;
  };

  ui.refreshSheet = (name, parts) => {
    const wrap = ui.layer().querySelector(`[data-sheet="${name}"]`);
    if (!wrap) return false;
    const r = wrap._opts.render ? wrap._opts.render() : {};
    const sheet = wrap.querySelector('.sheet');
    const which = parts || ['title', 'body', 'foot'];
    if (which.includes('title')) sheet.querySelector('.sheet-head h2').innerHTML = r.title || '';
    if (which.includes('body')) {
      const body = sheet.querySelector('.sheet-body');
      const st = body.scrollTop;
      body.innerHTML = r.body || '';
      body.scrollTop = st;
    }
    if (which.includes('foot')) {
      const foot = sheet.querySelector('.sheet-foot');
      foot.hidden = !r.foot;
      foot.innerHTML = r.foot || '';
    }
    if (wrap._opts.after) wrap._opts.after(sheet);
    return true;
  };

  ui.sheetOpen = (name) => !!ui.layer().querySelector(`[data-sheet="${name}"]`);
  ui.closeSheet = (name, silent) => {
    const wrap = ui.layer().querySelector(`[data-sheet="${name}"]`);
    if (!wrap) return;
    wrap.remove();
    if (!silent && wrap._opts.onClose) wrap._opts.onClose();
  };
  ui.closeAllSheets = () => ui.layer().querySelectorAll('[data-sheet]').forEach((w) => ui.closeSheet(w.dataset.sheet));

  // ---------- Pages (full-screen overlays: game detail, settings) ----------
  ui.openPage = (name, opts) => {
    ui.closePage(name, true);
    const el = document.createElement('div');
    el.className = 'page';
    el.dataset.page = name;
    el._opts = opts;
    el.innerHTML = `<div class="page-top"><button class="icon-btn" data-act="close-page" data-name="${name}" aria-label="Back">${icon('chevL', 22)}</button><div class="t"></div><div class="pt-right"></div></div><div class="page-scroll"></div>`;
    // Newer pages stack above older ones (a game opened from the parlay builder), but below sheets and dialogs.
    const pages = ui.layer().querySelectorAll('[data-page]');
    ui.layer().insertBefore(el, pages.length ? pages[pages.length - 1].nextSibling : ui.layer().firstChild);
    ui.refreshPage(name);
    return el;
  };
  ui.refreshPage = (name) => {
    const el = ui.layer().querySelector(`[data-page="${name}"]`);
    if (!el) return false;
    const r = el._opts.render();
    el.querySelector('.page-top .t').innerHTML = r.title || '';
    el.querySelector('.pt-right').innerHTML = r.right || '';
    const sc = el.querySelector('.page-scroll');
    const st = sc.scrollTop;
    sc.innerHTML = r.body || '';
    sc.scrollTop = st;
    if (el._opts.after) el._opts.after(el);
    return true;
  };
  ui.pageOpen = (name) => !!ui.layer().querySelector(`[data-page="${name}"]`);
  ui.closePage = (name, silent) => {
    const el = ui.layer().querySelector(`[data-page="${name}"]`);
    if (el) { el.remove(); if (!silent && el._opts.onClose) el._opts.onClose(); }
  };
  ui.closeAllPages = () => ui.layer().querySelectorAll('[data-page]').forEach((p) => p.remove());

  // ---------- Dialogs (the artifact viewer blocks window.confirm, so this is in-page) ----------
  ui.confirm = ({ title, body, confirm = 'Confirm', cancel = 'Cancel', danger = false, tone }) =>
    new Promise((resolve) => {
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:absolute;inset:0;z-index:40';
      wrap.innerHTML = `<div class="scrim"></div><div class="dialog-wrap"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${title}</h3><div class="body">${body || ''}</div><div class="acts">${cancel ? `<button class="btn ghost" data-r="0">${esc(cancel)}</button>` : ''}<button class="btn ${danger ? 'danger' : tone || 'primary'}" data-r="1">${esc(confirm)}</button></div></div></div>`;
      ui.layer().appendChild(wrap);
      const done = (v) => { wrap.remove(); resolve(v); };
      wrap.addEventListener('click', (e) => {
        const b = e.target.closest('[data-r]');
        if (b) done(b.dataset.r === '1');
        else if (e.target.classList.contains('scrim') || e.target.classList.contains('dialog-wrap')) done(false);
      });
      setTimeout(() => { const b = wrap.querySelector('[data-r="1"]'); if (b) b.focus(); }, 30);
    });

  // ---------- Toasts ----------
  ui.toast = ({ title, msg = '', kind = 'info', ms = 4200 }) => {
    const host = document.getElementById('toasts');
    if (!host) return;
    const ic = { win: 'check', loss: 'x', warn: 'alert', info: 'info' }[kind] || 'info';
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.setAttribute('role', 'status');
    el.innerHTML = `${icon(ic, 20)}<div class="grow"><div class="tt">${esc(title)}</div>${msg ? `<div class="tm">${esc(msg)}</div>` : ''}</div>`;
    const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
    el.addEventListener('click', kill);
    host.appendChild(el);
    while (host.children.length > 3) host.firstChild.remove();
    setTimeout(kill, ms);
  };
  TO.on('toast', (t) => ui.toast(t));

  /** For actions that need a connection (placing bets). False, with a toast, when offline. */
  TO.net.guard = () => {
    if (TO.net.online()) return true;
    ui.toast({ kind: 'loss', title: 'No internet connection', msg: 'Betting is paused until you\'re back online.' });
    return false;
  };

  // ---------- Images ----------
  /** Reads an uploaded photo and returns a square 256px JPEG data URL. */
  ui.readPhoto = (file) =>
    new Promise((resolve, reject) => {
      if (!file || !/^image\//.test(file.type)) return reject(new Error('Choose an image file.'));
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const size = 256;
          const c = document.createElement('canvas');
          c.width = c.height = size;
          const ctx = c.getContext('2d');
          const s = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
          resolve(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => reject(new Error('That image could not be read.'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('That image could not be read.'));
      reader.readAsDataURL(file);
    });

  ui.copy = async (text, input) => {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      if (input) { input.focus(); input.select(); }
      return false;
    }
  };

  /** True when running inside the claude.ai artifact viewer (downloads are blocked there). */
  ui.embedded = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
})(window.TO);

</script>
<script>
/* TimeOut web demo — bet slip (Screen 3). */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;

  const slip = (TO.slip = {
    legs: [],
    parlayMode: false, // picks stack up only in parlay mode; otherwise a new pick replaces the old one
    stake: null,
    boost: false,
    insure: false,
    error: null,
    capped: false,
    notifiedChange: '',
    has(id) { return this.legs.some((l) => l.selId === id); },
    clear() {
      Object.assign(this, { legs: [], parlayMode: false, stake: null, boost: false, insure: false, error: null, capped: false, notifiedChange: '' });
    },
  });

  const refOf = (sel) => sel.gameId || sel.predId || sel.raceId;

  /** Tap on an odds button. Outside parlay mode the pick replaces whatever is on the slip and opens it;
   *  in parlay mode (Build parlay on Home, or Add another pick) it's added, or swapped for a second pick on the same game. */
  slip.toggle = (selId) => {
    if (slip.has(selId)) {
      slip.legs = slip.legs.filter((l) => l.selId !== selId);
      afterChange();
      return;
    }
    const cur = S.currentSelection(selId);
    if (!cur || !cur.sel || !cur.open) { ui.toast({ kind: 'warn', title: 'Betting is closed on this pick' }); return; }
    const sel = cur.sel;
    const hasRace = slip.legs.some((l) => String(l.ref).startsWith('race-'));
    if (slip.parlayMode && (sel.kind === 'race' || hasRace)) {
      ui.toast({ kind: 'warn', title: 'Virtual races are single picks', msg: 'Place a virtual race bet on its own, outside a parlay.' });
      return;
    }
    const sameGame = slip.legs.findIndex((l) => l.ref === refOf(sel));
    const leg = { selId: sel.id, price: sel.price, line: sel.line, ref: refOf(sel) };
    if (!slip.parlayMode) {
      slip.legs = [leg];
      slip.error = null;
      open();
      afterChange();
      return;
    }
    if (sameGame >= 0) {
      slip.legs[sameGame] = leg;
      ui.toast({ kind: 'info', title: 'Pick swapped', msg: 'A parlay can only have one pick per game.', ms: 2600 });
    } else {
      if (slip.legs.length >= TO.RULES.maxLegs) {
        ui.toast({ kind: 'warn', title: `Parlays are limited to ${TO.RULES.maxLegs} picks`, msg: 'Remove a pick to add another.' });
        return;
      }
      slip.legs.push(leg);
    }
    slip.error = null;
    if (ui.sheetOpen('slip')) open();
    afterChange();
  };

  TO.actions['toggle-parlay'] = () => {
    const entering = !slip.parlayMode;
    slip.parlayMode = entering;
    slip.legs = [];
    slip.error = null;
    ui.closeSheet('slip', true); // not discard(): that would also switch parlay mode back off
    ui.closePage('parlay', true);
    TO.app.render();
  };

  function afterChange() {
    if (!slip.legs.length) { ui.closeSheet('slip'); ui.closePage('parlay', true); }
    else if (ui.sheetOpen('slip')) ui.refreshSheet('slip');
    TO.app.renderChrome();
    TO.app.refreshOddsButtons();
  }

  /** Closing the slip (X, tapping outside, Escape) throws the picks away, so nothing lingers on Home. */
  function discard() {
    slip.clear();
    ui.closePage('parlay', true);
    TO.app.renderChrome();
    TO.app.refreshOddsButtons();
  }

  function legState(leg) {
    const cur = S.currentSelection(leg.selId);
    const closed = !cur || !cur.sel || !cur.open;
    const changed = !closed && (cur.sel.price !== leg.price || cur.sel.line !== leg.line);
    return { cur, closed, changed };
  }

  slip.status = () => {
    const states = slip.legs.map(legState);
    return { states, closed: states.some((s) => s.closed), changed: states.some((s) => s.changed) };
  };

  function numbers() {
    const wl = TO.state.wallet();
    const stake = parseInt(slip.stake, 10);
    const dec = slip.legs.reduce((p, l) => p * TO.odds.decimal(l.price), 1);
    let mult = wl.multiplier;
    if (slip.boost && wl.boostsLeft > 0) mult *= 1 + TO.RULES.boostPercent;
    const s = Number.isFinite(stake) ? stake : 0;
    const winnings = Math.round((Math.round(s * dec) - s) * mult);
    return { wl, stake, dec, american: TO.odds.fromDecimal(dec), mult, winnings, valid: Number.isInteger(stake) && stake >= 1 && stake <= wl.balance && TO.net.online() };
  }

  // ---------- Rendering ----------
  function legsHtml() {
    const st = slip.status();
    const legs = slip.legs.map((leg, i) => {
      const { cur, closed, changed } = st.states[i];
      const sel = cur && cur.sel;
      let title, sub, liveLine = '';
      if (String(leg.ref).startsWith('race-')) {
        const race = TO.races.get(leg.ref);
        const runner = sel && TO.races.horse(sel.horseId || sel.side);
        title = runner ? runner.name : 'Virtual race pick';
        sub = `Virtual Racing · Race #${esc(String(leg.ref).replace('race-', ''))}`;
        if (race && race.status === 'running') liveLine = `<div class="row-s tiny" style="margin-top:4px"><span class="live">LIVE</span><span class="muted bold">Race in progress</span></div>`;
        if (race && race.status === 'final') liveLine = `<div class="tiny muted bold" style="margin-top:4px">Race finished</div>`;
      } else if (leg.ref.startsWith('pm-')) {
        const p = S.prediction(leg.ref);
        title = sel ? S.selectionLabel(sel) : '';
        sub = `Prediction · ${esc(p.q)}`;
      } else {
        const g = S.game(leg.ref);
        title = sel ? S.selectionLabel(Object.assign({}, sel, { line: changed ? sel.line : leg.line }), g) : '';
        sub = `${S.marketLabel(sel || { market: 'ml' }, g)} · ${esc(g.away.name)} @ ${esc(g.home.name)}`;
        if (g.state === 'live') liveLine = `<div class="row-s tiny" style="margin-top:4px"><span class="live">LIVE</span><span class="muted bold">${g.away.abbr} ${g.awayScore} – ${g.home.abbr} ${g.homeScore} · ${esc(g.clock)}</span></div>`;
        if (g.state === 'postponed') liveLine = `<div class="tiny yellow bold" style="margin-top:4px">Postponed</div>`;
        if (g.state === 'final') liveLine = `<div class="tiny muted bold" style="margin-top:4px">Game over · ${esc(g.statusText)}</div>`;
      }
      const priceHtml = closed
        ? `<span class="tag red">Closed</span>`
        : changed
          ? `<div style="text-align:right"><span class="old">${TO.odds.fmt(leg.price)}</span><span class="price" style="color:var(--warn)">${TO.odds.fmt(sel.price)}</span>${sel.line !== leg.line ? `<div class="tiny yellow bold">Line moved</div>` : ''}</div>`
          : `<span class="price">${TO.odds.fmt(leg.price)}</span>`;
      return `<div class="slip-leg ${closed ? 'closed' : changed ? 'changed' : ''}">
        <div class="grow"><div class="bold" style="font-size:15.5px">${esc(title)}</div><div class="small muted">${sub}</div>${liveLine}</div>
        ${priceHtml}
        <button class="icon-btn" style="width:30px;height:30px;margin:-4px -6px 0 0" data-act="slip-remove" data-sel="${esc(leg.selId)}" aria-label="Remove pick">${icon('x', 16)}</button>
      </div>`;
    }).join('');
    let banner = '';
    if (st.closed) banner = `<div class="note red">${icon('alert', 16)}<span>A pick is no longer available (the game ended, was postponed, or betting closed). Remove it to continue.</span></div>`;
    else if (st.changed) banner = `<div class="note warn">${icon('alert', 16)}<span>The odds changed while your slip was open. Check the new odds, then tap <b>Accept new odds</b> to continue.</span></div>`;
    const parlay = slip.legs.length > 1 && !st.closed ? `<div class="spread small"><span class="muted bold">${slip.legs.length}-pick parlay · every pick must win</span><span class="display" style="font-size:19px;color:var(--accent)">${TO.odds.fmt(TO.odds.fromDecimal(slip.legs.reduce((p, l) => p * TO.odds.decimal(l.price), 1)))}</span></div>` : '';
    return banner + legs + parlay;
  }

  function summaryHtml() {
    const n = numbers();
    const { wl } = n;
    if (wl.lockedOut || wl.balance <= 0) return '';
    const stake = Number.isFinite(n.stake) ? n.stake : 0;
    let err = '';
    if (slip.capped) err = `<div class="note red">${icon('alert', 16)}<span><b>Not enough screentime.</b> You have ${wl.balance} min left to bet today, so that's the most you can stake.</span></div>`;
    else if (Number.isFinite(n.stake) && n.stake > wl.balance) err = `<div class="note red">${icon('alert', 16)}<span><b>Not enough screentime.</b> You have ${wl.balance} min left to bet today.</span></div>`;
    else if (slip.stake !== null && slip.stake !== '' && (!Number.isFinite(n.stake) || n.stake < 1)) err = `<div class="note red">${icon('alert', 16)}<span>Enter a stake of at least 1 minute.</span></div>`;
    const after = Math.max(wl.balance - stake, 0);
    return `${err}
      <div class="outcomes">
        <div class="w"><span>If you win</span><b>+${n.valid ? n.winnings : 0} min</b><span>added to tomorrow's phone time</span></div>
        <div class="l"><span>If you lose</span><b>−${n.valid ? stake : 0} min</b><span>taken from tomorrow's phone time</span></div>
      </div>
      <div class="spread small"><span class="muted">Betting balance after this bet</span><b class="num">${n.valid ? after : wl.balance} of ${wl.balance} min</b></div>
      ${n.mult > 1 ? `<div class="spread small"><span class="muted">Winnings multiplier${slip.boost ? ' (streak + boost)' : ' (clean streak)'}</span><b class="green">${TO.state.fmtMult(+n.mult.toFixed(3))}</b></div>` : ''}
      ${slip.error ? `<div class="form-error">${esc(slip.error)}</div>` : ''}`;
  }

  function footHtml() {
    const st = slip.status();
    const more = slip.legs.length < TO.RULES.maxLegs && !st.closed ? `<button class="btn quiet sm" data-act="slip-more">${icon('plus', 16)} ${slip.parlayMode ? 'Add another pick' : 'Add another pick for a parlay'}</button>` : '';
    if (!TO.net.online()) return `<div class="note red">${icon('wifiOff', 16)}<span><b>No internet connection.</b> Betting is paused until you're back online, because odds can't update.</span></div><button class="btn full" disabled>${icon('wifiOff', 18)} Waiting for connection</button>`;
    if (st.closed) return `<button class="btn primary full" disabled>Remove unavailable picks to continue</button>`;
    if (st.changed) return `<button class="btn warn full" data-act="slip-accept">Accept new odds</button>`;
    const n = numbers();
    if (n.wl.lockedOut || n.wl.balance <= 0) return `<button class="btn full" disabled>${icon('lock', 18)} Betting locked until midnight</button>`;
    return `<button class="btn primary full" data-act="slip-place" ${n.valid ? '' : 'disabled'}>Place bet${n.valid ? ` · ${n.stake} min` : ''}</button>${more}`;
  }

  function bodyHtml() {
    const wl = TO.state.wallet();
    if (slip.stake === null) slip.stake = String(Math.max(1, Math.min(TO.data.lastStake || 5, wl.balance || 1)));
    let controls;
    if (wl.lockedOut || wl.balance <= 0) {
      controls = `<div class="card" style="border-color:rgba(255,90,95,.4)"><div class="row-s red tiny bold" style="letter-spacing:.06em">${icon('lock', 14)} OUT OF BETTING MINUTES</div>
        <div class="bold" style="margin-top:6px">New bets are blocked until midnight.</div>
        <div class="display" style="font-size:36px;margin-top:4px">${ui.countdownEl(TO.nextMidnight())}</div>
        <div class="small muted">Your betting balance resets at midnight.</div></div>`;
    } else {
      const quick = [5, 10, 15, 30].map((v) => `<button data-act="slip-quick" data-v="${v}" class="${String(v) === String(slip.stake) ? 'on' : ''}" ${v > wl.balance ? 'disabled style="opacity:.35"' : ''}>${v}</button>`).join('');
      const perks = [];
      if (wl.boostsLeft > 0) perks.push(`<label class="perk-row" for="slip-boost"><span class="lr-icon" style="background:var(--blue-soft);color:var(--blue)">${icon('bolt', 17)}</span><span class="grow"><b>Use an odds boost</b><div class="tiny muted">+10% winnings · ${wl.boostsLeft} left today (${esc(wl.tier.title)} perk)</div></span>${ui.switchEl('slip-boost', slip.boost, 'data-change="slip-boost"')}</label>`);

  }

  function open() {
    if (ui.sheetOpen('slip')) { ui.refreshSheet('slip'); return; }
    ui.sheet('slip', {
      render: () => ({
        title: slip.legs.length > 1 ? `Parlay · ${slip.legs.length} picks` : 'Bet Slip',
        body: bodyHtml(),

  }

  /** Live refresh without touching the inputs the user may be typing in. */
  slip.update = () => {

  // ---------- Parlay builder: a page of games to add picks from ----------
  function parlayPage() {
    const games = TO.views.home.boardGames().filter((g) => g.state === 'live' || g.state === 'scheduled');
    const inSlip = new Set(slip.legs.map((l) => l.ref));
    const groups = S.LEAGUE_ORDER.filter((l) => games.some((g) => g.league === l)).map((l) => {
      const lg = games.filter((g) => g.league === l);
      return `<div class="league-head"><h3>${esc(S.LEAGUES[l].title)}</h3><span class="cnt">${lg.length} games</span></div>${lg.map((g) => TO.views.home.gameCard(g)).join('')}`;
    }).join('');
    const n = slip.legs.length;
    const dec = slip.legs.reduce((p, l) => p * TO.odds.decimal(l.price), 1);
    const full = n >= TO.RULES.maxLegs;
    return {
      title: 'Build a parlay',
      body: `<div class="note blue">${icon('info', 16)}<span>Pick up to ${TO.RULES.maxLegs} sides from <b>different games</b>. Every pick has to win for the parlay to pay. ${inSlip.size ? `Games already on your slip are highlighted.` : ''}</span></div>
        <div class="parlay-days">${TO.views.home.dayBar()}</div>

      render: parlayPage,

      onClose: () => { if (slip.legs.length && !ui.sheetOpen('slip')) open(); },

  const A = TO.actions;
  A['parlay-review'] = () => { ui.closePage('parlay'); TO.app.render(); };
  A.pick = (el) => slip.toggle(el.dataset.sel);
  A['slip-remove'] = (el) => { slip.legs = slip.legs.filter((l) => l.selId !== el.dataset.sel); afterChange(); };

    if (!slip.docked()) ui.closeSheet('slip', true); // hide it without discarding the picks
    openParlayPage();
    TO.app.renderChrome();
  };
  A['open-slip'] = () => open();
  A['slip-quick'] = (el) => { slip.stake = el.dataset.v; slip.error = null; slip.capped = false; ui.refreshSheet('slip', ['body', 'foot']); };
  A['slip-step'] = (el) => {
    const v = (parseInt(slip.stake, 10) || 0) + Number(el.dataset.d);
    const max = TO.state.wallet().balance;
    slip.capped = v > max;
    slip.stake = String(Math.max(1, Math.min(v, max)));
    const input = document.getElementById('slip-stake');
    if (input) input.value = slip.stake;
    slip.error = null;
    slip.update();
  };
  A['slip-accept'] = () => {
    for (const leg of slip.legs) {
      const cur = S.currentSelection(leg.selId);
      if (cur && cur.sel) { leg.price = cur.sel.price; leg.line = cur.sel.line; }
    }
    slip.error = null;
    ui.refreshSheet('slip');
  };
  A['slip-place'] = () => {
    if (!TO.net.online()) { ui.refreshSheet('slip'); return; }
    const n = numbers();
    try {
      const bet = TO.state.placeBet({ picks: slip.legs, stake: n.stake, boost: slip.boost, insure: slip.insure });
      const label = bet.legs.length > 1 ? `${bet.legs.length}-pick parlay` : bet.legs[0].label;
      ui.toast({ kind: 'win', title: 'Bet placed', msg: `${label} · ${bet.stake} min to win ${Math.round((Math.round(bet.stake * bet.decimal) - bet.stake) * bet.multiplier)} min. It's in My Bets.` });
      slip.clear();
      ui.closeSheet('slip');
      ui.closePage('parlay', true);
      TO.app.render();
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      slip.error = e.code === 'odds_changed' ? null : e.message;
      if (e.code === 'odds_changed') ui.toast({ kind: 'warn', title: 'Odds changed', msg: 'Review the new odds and confirm again.' });
      ui.refreshSheet('slip');
    }
  };

  // The stake can't go above today's betting balance: a bigger number snaps back to it.
  TO.inputs['slip-stake'] = (el) => {
    const max = TO.state.wallet().balance;
    const n = parseInt(el.value, 10);
    slip.capped = Number.isFinite(n) && n > max;
    if (slip.capped) el.value = String(max);
    slip.stake = el.value;
    slip.error = null;
    el.classList.remove('bad');
    document.querySelectorAll('.quick button').forEach((b) => b.classList.toggle('on', b.dataset.v === el.value && b.textContent !== 'Max'));
    slip.update();
  };
  TO.changes['slip-boost'] = (el) => { slip.boost = el.checked; slip.update(); };
  TO.changes['slip-insure'] = (el) => { slip.insure = el.checked; slip.update(); };
})(window.TO);

<script>
/* TimeOut virtual horse racing: track animation and screen-time race selections. */
(function (TO) {

  const horses = [

    { id: 2, number: 2, name: 'Silicon Sprint', americanOdds: 220, form: '1-3-1', jockey: 'K. Chen', color: '#22d66e', speed: 1.018, variance: 0.19 },
    { id: 3, number: 3, name: 'Digital Blitz', americanOdds: 260, form: '3-2-1', jockey: 'T. Hayes', color: '#ffc940', speed: 1.010, variance: 0.20 },
    { id: 4, number: 4, name: 'Golden Hour', americanOdds: 310, form: '2-1-4', jockey: 'L. Moreno', color: '#ff718d', speed: 1.002, variance: 0.21 },
    { id: 5, number: 5, name: 'Circuit Breaker', americanOdds: 380, form: '1-4-2', jockey: 'D. Sterling', color: '#c58cff', speed: 0.995, variance: 0.22 },
  ];
  const KEY = 'timeout.virtualRaces';
  const saved = TO.store.get(KEY, null) || { next: 48, current: null, history: [] };
  let data = saved;
  let mounted = null;
  let frame = 0;
  let lastComment = 0;

  function persist() { TO.store.set(KEY, data); }
  function current() {
    if (!data.current) data.current = { number: data.next || 48, status: 'open' };
    return data.current;
  }
  function get(raceId) {
    const number = Number(String(raceId).replace(/^race-/, ''));
    const active = current();
    if (active.number === number) return active;
    return data.history.find((race) => race.number === number) || null;
  }
  const horse = (id) => horses.find((item) => item.id === Number(id)) || horses[0];
  const selectionId = (race, runner) => `race-${race.number}|race|${runner.id}`;
  function selection(race, runner) {
    return { id: selectionId(race, runner), raceId: `race-${race.number}`, horseId: runner.id, kind: 'race', market: 'race', side: String(runner.id), line: null, price: runner.americanOdds };
  }
  function currentSelection(selId) {
    const [ref, market, side] = String(selId).split('|');
    if (market !== 'race') return null;
    const race = get(ref);
    const runner = horse(side);
    return { sel: selection(race || { number: Number(ref.replace(/^race-/, '')) }, runner), open: !!race && race.status === 'open' };
  }
  function selectionLabel(sel) { return horse(sel.horseId || sel.side).name; }
  function implied(american) { return american > 0 ? 100 / (american + 100) : Math.abs(american) / (Math.abs(american) + 100); }
  function weightedWinner(seed) {
    const rng = TO.rng(seed);
    const total = horses.reduce((sum, h) => sum + implied(h.americanOdds), 0);
    let roll = rng() * total;
    for (const h of horses) { roll -= implied(h.americanOdds); if (roll <= 0) return h.id; }
    return horses[0].id;
  }
  function beginRace(race, seed, now = TO.now(), betId = null) {
    const winnerId = weightedWinner(`${race.number}-${seed}-${now}`);
    const rest = horses.filter((h) => h.id !== winnerId).sort((a, b) => {
      const ra = TO.u01(`${seed}-${a.id}`) * a.speed;
      const rb = TO.u01(`${seed}-${b.id}`) * b.speed;
      return rb - ra;
    });
    race.status = 'running';
    race.startedAt = now;
    race.finishAt = now + 12000;
    race.winnerId = winnerId;
    race.order = [winnerId, ...rest.map((h) => h.id)];
    race.betId = betId;
    persist();
  }
  function startForBet(bet, now = TO.now()) {
    const race = current();

    beginRace(race, bet.id, now, bet.id);
  }
  function startForViewing() {
    const race = current();
    if (race.status !== 'open') return;
    beginRace(race, `watch-${TO.uid('race')}`);
  }
  function finalize(race, now) {
    if (!race || race.status !== 'running' || now < race.finishAt) return;
    race.status = 'final';
    race.finishedAt = race.finishAt;
    data.history.unshift({ ...race });
    data.history = data.history.slice(0, 20);
    data.next = race.number + 1;
    data.current = { number: data.next, status: 'open' };
    persist();
  }
  function grade(sel, now = TO.now()) {
    const race = get(sel.raceId || sel.id.split('|')[0]);
    if (!race) return 'void';
    finalize(race, now);
    if (race.status !== 'final') return 'pending';
    return race.winnerId === Number(sel.horseId || sel.side) ? 'won' : 'lost';
  }

  function statusText(race) {
    if (race.status === 'running') return 'Race in progress';
    return race.status === 'final' ? `Race #${race.number} finished` : 'Bets open';
  }
  function latestResultHtml(race) {
    return race ? `<div class="card race-card race-result"><span class="eyebrow">Last result · Race #${race.number}</span><b>${esc(horse(race.winnerId).name)} won</b><span class="small muted">${race.order.map((id, i) => `${i + 1}. ${esc(horse(id).name)}`).join(' · ')}</span></div>` : '';
  }
  function rosterHtml(race) {
    return horses.map((runner) => {
      const sel = selection(race, runner);
      const isWinner = race.status === 'final' && race.winnerId === runner.id;
      return `<div class="race-entry ${isWinner ? 'race-winner' : ''}">
        <div class="race-horse-info"><span class="race-silk" style="--silk:${runner.color}">#${runner.number}</span><span class="race-horse-copy"><b>${esc(runner.name)}</b><small>Form ${runner.form} · ${esc(runner.jockey)}</small></span></div>
        <div class="race-odds">${TO.ui.oddsBtn(sel, { suspended: race.status !== 'open', big: true, label: runner.name })}</div>
      </div>`;
    }).join('');
  }
  function render() {
    const race = current();
    const latest = data.history[0];
    return `<div class="stack race-page" data-race-id="${race.number}" data-race-status="${race.status}">
      <div class="page-head"><h1>Virtual Racing</h1><p>Pick a winner and stake screen-time minutes using your regular bet slip.</p></div>
      <div class="card race-card">
        <div class="race-card-head"><div><span id="race-status" class="tag ${race.status === 'running' ? 'red' : 'green'}">${esc(statusText(race))}</span><span class="race-caption">· 1,200m Cyber Turf Classic #${race.number}</span></div><span class="race-clock" id="race-clock">12 sec</span></div>
        <div class="race-track-wrap"><canvas class="race-track" id="race-track" aria-label="Animated virtual horse race"></canvas><div class="race-finish-line" aria-hidden="true"></div></div>
        <div class="race-caller"><span>${icon('radio', 14)} Caller</span><span id="race-commentary">${race.status === 'running' ? 'The field is underway!' : 'Welcome to Silicon Downs. Select a horse to add it to your bet slip.'}</span></div>
        <button class="btn primary full" id="race-start" data-act="race-start" ${race.status === 'open' ? '' : 'disabled'}>${race.status === 'open' ? 'Start race now' : race.status === 'running' ? 'Race in progress' : 'Race finished'}</button>
      </div>
      <div class="card race-card stack-s">
        <div class="spread"><div><h2 class="race-heading">Field odds</h2><div class="small muted">Tap a price to open your standard screen-time bet slip.</div></div><span class="tag">5 runners</span></div>
        <div id="race-roster" class="race-roster">${rosterHtml(race)}</div>
        <div class="note blue">${icon('info', 16)}<span>Place a bet to start the race with your pick, or start it now to watch without a bet. Bets use your regular screen-time balance.</span></div>
      </div>
      ${latestResultHtml(latest)}
    </div>`;
  }

  function drawHorse(ctx, x, y, runner, elapsed) {
    const phase = elapsed / 90 + runner.id;
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = runner.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.fillStyle = runner.color;
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -2); ctx.lineTo(17, -13); ctx.lineTo(22, -10); ctx.lineTo(19, -1); ctx.fill();
    ctx.fillStyle = '#f2f5f9'; ctx.beginPath(); ctx.arc(0, -10, 3, 0, Math.PI * 2); ctx.fill();

    }

  }
  function paint(canvas, race, now) {

    if (canvas.width !== Math.round(box.width * dpr) || canvas.height !== Math.round(250 * dpr)) {
      canvas.width = Math.round(box.width * dpr);
      canvas.height = Math.round(250 * dpr);
    }

    horses.forEach((runner, idx) => {
      let progress = 0;
      if (race.status === 'running' || race.status === 'final') {
        const rank = ranks.get(runner.id) || 0;

  }

    if (!mounted || !mounted.isConnected) { mounted = null; return; }

    const page = mounted.querySelector('.race-page');
    if (page && page.dataset.raceId !== String(race.number)) {
      page.dataset.raceId = race.number;
      page.dataset.raceStatus = race.status;
      const statusTag = mounted.querySelector('#race-status');
      if (statusTag) statusTag.outerHTML = `<span id="race-status" class="tag green">Bets open</span>`;
      const caption = mounted.querySelector('.race-caption');
      if (caption) caption.textContent = `· 1,200m Cyber Turf Classic #${race.number}`;
      const roster = mounted.querySelector('#race-roster');
      if (roster) roster.innerHTML = rosterHtml(race);
      const result = mounted.querySelector('.race-result');
      if (result) result.outerHTML = latestResultHtml(data.history[0]);

      const comment = mounted.querySelector('#race-commentary');
      if (comment) comment.textContent = 'The previous race is official. Place your next screen-time bet.';
    } else if (page && page.dataset.raceStatus !== race.status) {
      page.dataset.raceStatus = race.status;
      const roster = mounted.querySelector('#race-roster');
      if (roster) roster.innerHTML = rosterHtml(race);
    }
    const statusTag = mounted.querySelector('#race-status');
    if (statusTag && race.status === 'running') { statusTag.textContent = 'Race in progress'; statusTag.className = 'tag red'; }
    const startButton = mounted.querySelector('#race-start');
    if (startButton) {
      startButton.disabled = race.status !== 'open';
      startButton.textContent = race.status === 'open' ? 'Start race now' : race.status === 'running' ? 'Race in progress' : 'Race finished';
    }
    const clock = mounted.querySelector('#race-clock');
    if (clock) clock.textContent = race.status === 'running' ? `${Math.max(0, Math.ceil((race.finishAt - TO.now()) / 1000))} sec` : '12 sec';
    const canvas = mounted.querySelector('#race-track');
    paint(canvas, race, TO.now());
    if (race.status === 'running' && TO.now() >= race.finishAt) {
      finalize(race, TO.now());
      TO.app.tick(true);
    }
    if (race.status === 'running' && TO.now() - lastComment > 2200) {
      lastComment = TO.now();
      const leader = (race.order || []).find((id, index) => (TO.now() - race.startedAt) / (9400 + index * 450) < 1) || race.order[0];
      const comment = mounted.querySelector('#race-commentary');
      if (comment) comment.textContent = `#${horse(leader).number} ${horse(leader).name} is driving for the lead.`;
    }
    if (mounted) frame = requestAnimationFrame(updateMounted);
  }
  function mount(page) {
    mounted = page;
    cancelAnimationFrame(frame);
    updateMounted();
  }

  TO.races = { horses, current, get, horse, currentSelection, selectionLabel, startForBet, grade, mount };
  TO.actions['race-start'] = startForViewing;
  TO.views.races = { render };
})(window.TO);

  const activeDay = () => (activeFilter() === 'live' ? 0 : feedDay);

  function boardGames(day = activeDay(), peek = false) {
    return S.board(TO.now(), { offDay: offDay(), day, peek, leagues: S.LEAGUE_ORDER.filter((l) => l !== 'sim' && followed().includes(l)) }).filter((g) => !g.simulated && g.league !== 'sim');
  }

  function dayLabel(offset) {
    if (offset === 0) return 'Today';
    if (offset === 1) return 'Tomorrow';
    const d = new Date(TO.now() + offset * TO.DAY);
    return `${d.toLocaleDateString([], { weekday: 'short' })} ${d.getMonth() + 1}/${d.getDate()}`;
  }

  /** Today and tomorrow. Counts are games still to be played that day, in the sports being shown. */
  function dayBar() {
    if (activeFilter() === 'live' || TO.live.offline) return '';
    const f = activeFilter();
    const chips = [];
    for (let i = 0; i <= TO.live.days; i++) {
      const games = boardGames(i, true).filter((g) => g.state !== 'final' && (f === 'all' || g.league === f));
      const n = games.length;
      chips.push(`<button class="chip sm day-chip ${feedDay === i ? 'on' : ''}" data-act="feed-day" data-day="${i}" aria-pressed="${feedDay === i}">${esc(dayLabel(i))}${n ? `<span class="n">${n}</span>` : ''}</button>`);
    }
    return `<div class="hscroll day-bar" data-hkey="days" aria-label="Pick a day">${chips.join('')}</div>`;
  }

  function myOpenBetOn(ref) {
    return TO.data.bets.filter((b) => b.status === 'open' && b.legs.some((l) => l.gameId === ref || l.predId === ref || l.raceId === ref));
  }

  // ---------- Wallet header (PRD: screen time + current bets always at the top) ----------
  function walletCard(wl) {
    if (wl.lockedOut || wl.balance <= 0) {
      return `<div class="card wallet locked" style="border-color:rgba(255,90,95,.45)">
        <div class="lockhead">${icon('lock', 14)} OUT OF BETTING MINUTES</div>
        <div class="bold" style="margin-top:8px;font-size:16px">Betting is locked. It reopens at midnight.</div>
        <div class="bigcd" style="margin-top:6px">${ui.countdownEl(TO.nextMidnight())}</div>
        <div class="small muted" style="margin-top:4px">Your open bets still settle and count toward tomorrow's phone time.</div>
        ${statsRow(wl)}
      </div>`;
    }
    const pct = Math.min(100, (wl.balance / (TO.RULES.daily + wl.bonusToday)) * 100);
    return `<div class="card wallet">
      <div class="spread" style="align-items:flex-end">
        <div>
          <div class="spread" style="justify-content:flex-start;gap:8px"><div class="eyebrow">Betting balance today</div>${wl.bonusToday ? `<span class="tiny green bold">+${wl.bonusToday} min ${esc(wl.tier.title)} bonus included</span>` : ''}</div>
          <div class="big" style="margin-top:4px">${wl.balance}<small>min</small></div>
        </div>
        <div style="text-align:right">
          <div class="eyebrow" style="color:var(--muted)">Resets in</div>
          ${ui.countdownEl(TO.nextMidnight(), 'cd')}
        </div>
      </div>
      <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
      ${statsRow(wl)}
      <button class="explain" data-act="how">${icon('info', 14)} You bet with tomorrow's phone time. How it works</button>
    </div>`;
  }

  function statsRow(wl) {
    const tomorrowDelta = wl.tomorrowLimit - TO.RULES.daily;
    const tColor = tomorrowDelta > 0 ? 'green' : tomorrowDelta < 0 ? 'red' : '';
    const pColor = wl.appsLocked ? 'red' : wl.phoneLeft <= TO.data.settings.lowWarn ? 'yellow' : '';
    return `<div class="wallet-stats">
      <div><b class="${pColor}">${TO.data.settings.enforce ? `${wl.phoneLeft} min` : 'Off'}</b><span>Phone time left</span></div>
      <div><b class="${wl.atRisk ? 'yellow' : ''}">${wl.atRisk} min</b><span>In open bets</span></div>
      <div><b class="${tColor}">${wl.tomorrowLimit} min</b><span>Tomorrow's limit</span></div>
    </div>`;
  }

  function statusStrip(wl) {
    const parts = [ui.tierBadge(wl.tier.id)];
    parts.push(`<span class="sp ${wl.streak ? 'yellow' : 'faint'}">${icon('flame', 14)}${wl.streak ? `${wl.streak}-day streak` : 'No streak yet'}</span>`);
    if (wl.multiplier > 1) parts.push(`<span class="sp green">${icon('trend', 14)}${TO.state.fmtMult(wl.multiplier)} wins</span>`);
    if (wl.boostsLeft > 0) parts.push(`<span class="sp blue">${icon('bolt', 14)}${wl.boostsLeft} boost${wl.boostsLeft === 1 ? '' : 's'}</span>`);
    return `<button class="status-strip" data-act="settings" data-section="status">${parts.join('')}<span style="margin-left:auto" class="faint">${icon('chevR', 16)}</span></button>`;
  }

  function miniBet(bet) {
    const title = bet.kind === 'todo' ? `To-do parlay (${bet.legs.length})` : bet.legs.length > 1 ? `${bet.legs.length}-pick parlay` : bet.legs[0].label;
    let line = '';
    const leg = bet.legs.find((l) => l.result === 'pending') || bet.legs[0];
    if (bet.kind === 'todo') line = `${bet.legs.filter((l) => l.result === 'won').length}/${bet.legs.length} done · due midnight`;
    else if (leg.kind === 'pred') line = `Resolves in ${TO.fmtIn(leg.start - TO.now())}`;
    else if (leg.kind === 'race') {
      const race = TO.races.get(leg.raceId);
      line = race && race.status === 'running' ? `<span class="live">LIVE</span> Virtual Race #${race.number}` : `Virtual Race #${String(leg.raceId).replace('race-', '')} · ${race && race.status === 'final' ? 'Finished' : 'Starting soon'}`;
    }
    else {
      const g = S.game(leg.gameId);
      if (!g) line = 'Loading the latest score…';
      else if (g.state === 'live') line = `<span class="live">LIVE</span> ${g.away.abbr} ${g.awayScore} – ${g.home.abbr} ${g.homeScore} · ${esc(g.clock)}`;
      else if (g.state === 'scheduled') line = `${g.away.abbr} @ ${g.home.abbr} · ${TO.fmtTime(g.start)}`;
      else line = `${g.away.abbr} ${g.awayScore} – ${g.home.abbr} ${g.homeScore} · ${esc(g.statusText)}`;
    }
    const bottom = `<div class="row-s small bold"><span class="muted">${bet.stake} min</span>${icon('chevR', 12)}<span class="green">${Math.round(bet.stake * bet.decimal) - bet.stake > 0 ? `win ${Math.round((Math.round(bet.stake * bet.decimal) - bet.stake) * (bet.multiplier || 1))} min` : ''}</span></div>`;
    return `<button class="card tight mini-bet" data-act="tab" data-tab="bets">
      <div class="spread"><span class="t ellipsis">${esc(title)}</span><span class="display muted" style="font-size:15px">${TO.odds.fmt(bet.american)}</span></div>
      <div class="small muted row-s ellipsis" style="font-weight:600">${line}</div>
      <div style="margin-top:auto">${bottom}</div>
    </button>`;
  }

  function openBetsStrip() {
    const open = TO.data.bets.filter((b) => b.status === 'open' && sportsOnly(b)).sort((a, b) => b.placedAt - a.placedAt);
    return `<div class="stack-s open-bets">
      <div class="section-title"><div class="row-s"><h2>Open bets</h2><span class="count-pill ${open.length ? '' : 'off'}">${open.length}</span></div>${open.length ? `<button class="link-btn" data-act="tab" data-tab="bets">See all</button>` : ''}</div>
      ${open.length
        ? `<div class="hscroll mini-bets" data-hkey="minibets">${open.map(miniBet).join('')}</div>`
        : `<div class="card tight small muted" style="margin:0 16px">No open bets. Tap any odds below to start one.</div>`}
    </div>`;
  }

  // ---------- Filters ----------
  function filterBar(games) {
    const f = activeFilter();
    const live = games.filter((g) => g.state === 'live').length;
    const chip = (key, label, n, ic) => `<button class="chip ${f === key ? 'on' : ''}" data-act="filter" data-f="${key}">${ic ? icon(ic, 14) : ''}${esc(label)}${n ? `<span class="n">${n}</span>` : ''}</button>`;
    const chips = [chip('live', 'Live', live, 'radio'), chip('all', 'All', 0, 'grid')];
    for (const l of S.LEAGUE_ORDER) {
      if (l === 'sim' || !followed().includes(l)) continue;
      const n = games.filter((g) => g.league === l && g.state !== 'final').length;
      chips.push(chip(l, l === 'ncaaf' ? 'College Football' : S.LEAGUES[l].short === 'SIM' ? 'Sim League' : S.LEAGUES[l].short, n));
    }
    chips.push(`<button class="chip dashed" data-act="settings" data-section="sports">${icon('sliders', 14)}Edit</button>`);
    const cfb = (f === 'ncaaf' || f === 'all') && !TO.live.offline ? `<label class="cfb-select-label" for="cfb-group">College Football</label><select id="cfb-group" class="cfb-select" aria-label="College football conference">${TO.live.groups.map(([id, name]) => `<option value="${id}" ${TO.live.selectedGroup() === id ? 'selected' : ''}>${esc(name)}</option>`).join('')}</select>` : '';
    return `<div class="filterbar"><div class="hscroll" data-hkey="filters">${chips.join('')}</div>${dayBar()}${cfb}</div>`;
  }

  // ---------- Game card ----------
  function scoreCls(g, side) {
    const key = `${g.id}-${side}`;
    const val = side === 'home' ? g.homeScore : g.awayScore;
    const changed = prevScores[key] !== undefined && prevScores[key] !== val;
    prevScores[key] = val;
    return changed ? 'bump' : '';
  }

  function gameCard(g) {
    const o = S.odds(g.id);
    const bettable = g.state === 'live' || g.state === 'scheduled';
    const mine = myOpenBetOn(g.id);
    const Sp = S.SPORTS[g.sport];
    let body;
    if (bettable) {
      if (g.eventID) {
        const sides = [
          ['away', g.away, g.awayScore, g.homeScore],
          ['home', g.home, g.homeScore, g.awayScore],
        ];
        const teamLine = (side, team, score, opponent) => `<div class="gc-live-team">
          <button class="gc-live-team-open" data-act="open-game" data-id="${g.id}" aria-label="Open ${esc(team.name)} game stats">
            <span class="gc-live-logo">${team.logo ? `<img src="${esc(team.logo)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">` : ''}<span style="${team.logo ? 'display:none' : ''}">${esc(team.abbr)}</span></span>
            <span class="gc-live-name">${esc(team.name)}</span>
          </button>
          <span class="gc-live-score ${g.state === 'live' && score < opponent ? 'trail' : ''} ${g.state === 'live' ? scoreCls(g, side) : ''}">${g.state === 'scheduled' ? '–' : score}</span>
        </div>`;
        const picks = [
          [o.spread.find((sel) => sel.side === 'away'), `Away · ${g.away.abbr}`],
          [o.spread.find((sel) => sel.side === 'home'), `Home · ${g.home.abbr}`],
          [o.total.find((sel) => sel.side === 'over'), 'Over'],
          [o.total.find((sel) => sel.side === 'under'), 'Under'],
          [o.moneyline.find((sel) => sel.side === 'away'), `Away ML · ${g.away.abbr}`, true],
          [o.moneyline.find((sel) => sel.side === 'home'), `Home ML · ${g.home.abbr}`, true],
        ];
        if (g.sport === 'soccer') picks.push([o.moneyline.find((sel) => sel.side === 'draw'), 'Draw', true]);
        body = `<div class="gc-live-layout">
          <div class="gc-live-teams">${sides.map(([side, team, score, opponent]) => teamLine(side, team, score, opponent)).join('')}</div>
          <div class="gc-live-bets">${picks.map(([sel, label, isMoneyline]) => sel
            ? ui.oddsBtn(sel, { suspended: o.suspended, move: o.move[sel.id], big: true, label })
            : `<button class="odds-btn locked big" disabled aria-label="${esc(label)} unavailable"><span class="lbl">${esc(label)}</span><span class="pr">${isMoneyline ? 'N/A' : '—'}</span></button>`).join('')}</div>
        </div>`;
      } else {
      const cols = [];
      if (o.spread.length === 2) cols.push([Sp.spreadLabel, o.spread]);
      if (o.total.length === 2) cols.push(['Total', o.total]);
      if (o.moneyline.length === 2) cols.push(['Money', o.moneyline]);
      const teamRow = (team, side, row) => {
        const score = side === 'home' ? g.homeScore : g.awayScore;
        const opp = side === 'home' ? g.awayScore : g.homeScore;
        return `<button class="gc-team" data-act="open-game" data-id="${g.id}">
            ${ui.teamBadge(team)}
            <span style="min-width:0"><span class="nm" style="display:block">${esc(g.state === 'live' ? team.abbr : team.name)}</span></span>
            ${g.state === 'live' ? `<span class="sc ${score < opp ? 'trail' : ''} ${scoreCls(g, side)}">${score}</span>` : ''}
          </button>
          ${cols.map(([, sels]) => ui.oddsBtn(sels[row], { suspended: o.suspended, move: o.move[sels[row].id], label: team.name })).join('')}`;
      };
      const draw = o.moneyline.find((s) => s.side === 'draw');
        body = `<div class="gc-grid ${cols.length === 2 ? 'two' : ''}" style="grid-template-columns:minmax(0,1fr) repeat(${cols.length},60px)">
          <span></span>${cols.map(([h]) => `<span class="colh">${esc(h)}</span>`).join('')}
          ${teamRow(g.away, 'away', 0)}
          ${teamRow(g.home, 'home', 1)}
          ${draw ? `<span class="gc-team muted bold" style="height:40px">Draw</span>${cols.length === 2 ? '<span></span>' : '<span></span><span></span>'}${ui.oddsBtn(draw, { suspended: o.suspended, move: o.move[draw.id], label: 'Draw' })}` : ''}
        </div>${cols.length ? '' : '<div class="tiny faint" style="margin:6px 2px 0">Betting lines are not available for this game yet.</div>'}`;
      }
    } else {
      const row = (team, score, won) => `<button class="gc-team" style="width:100%" data-act="open-game" data-id="${g.id}">${ui.teamBadge(team)}<span class="nm" style="${won ? '' : 'color:var(--text-2)'}">${esc(team.name)}</span>${g.state === 'final' ? `<span class="sc ${won ? '' : 'trail'}">${score}</span>` : ''}</button>`;
      body = row(g.away, g.awayScore, g.awayScore > g.homeScore) + row(g.home, g.homeScore, g.homeScore > g.awayScore);
      if (g.state === 'postponed') body += `<div class="note warn" style="margin-top:6px">${icon('info', 15)}<span>This game was postponed. Every bet on it is void and the full stake goes back to the bettor.</span></div>`;
    }
    const status = `${ui.gameStatus(g)}${o.suspended && g.state === 'live' ? `<span class="tag">${icon('lock', 10)} Betting closed</span>` : ''}`;
    return `<div class="card game-card" data-game="${g.id}">
      <div class="gc-status">${status}<span class="lg">${g.otherConferenceLive ? `LIVE · ${esc(g.conferenceName || 'UNRANKED')}` : g.simulated ? 'SIMULATED' : esc(S.LEAGUES[g.league].short)}</span></div>
      ${body}
      <div class="gc-more">${mine.length ? `<span class="yourbet">${icon('ticket', 14)} You have ${mine.length === 1 ? 'a bet' : `${mine.length} bets`} on this game</span>` : '<span></span>'}<button class="row-s link-btn" style="font-size:12.5px" data-act="open-game" data-id="${g.id}">Stats & all odds ${icon('chevR', 14)}</button></div>
    </div>`;
  }

  function emptyBoard(f) {
    const day = activeDay();
    const when = day === 0 ? 'today' : day === 1 ? 'tomorrow' : `on ${dayLabel(day)}`;
    const loading = day > 0 && TO.live.upcomingLoading;
    const title = f === 'live' ? 'No live games right now' : loading ? 'Loading the schedule…' : `Sorry, no games are happening for this sport ${when}.`;
    const next = f !== 'live' && !loading ? Array.from({ length: TO.live.days + 1 }, (_, i) => i).find((i) => i !== day && boardGames(i, true).some((g) => f === 'all' || g.league === f)) : null;
    if (TO.live.failed) {
      return `<div class="empty">${icon('alert', 40)}<h3>Sports couldn’t load</h3><p>Check your connection and try again.</p><button class="btn primary" data-act="refresh-live">Try again</button></div>`;
    }
    return `<div class="empty">
      ${icon(loading ? 'clock' : 'target', 40)}
      <h3>${title}</h3>
      ${f === 'live' ? '<p>Check back when a game is underway.</p>' : ''}
      ${next != null ? `<button class="btn primary" data-act="feed-day" data-day="${next}">See games ${next === 1 ? 'tomorrow' : `on ${esc(dayLabel(next))}`}</button>` : ''}
    </div>`;
  }

  function buildParlayControl() {
    const slip = TO.slip;
    if (!slip.parlayMode) return `<button class="build-parlay" data-act="toggle-parlay">${icon('ticket', 18)}<span><b>Build parlay</b><small>Select picks from multiple games</small></span>${icon('chevR', 18)}</button>`;
    return `<div class="build-parlay active"><span class="lr-icon">${icon('ticket', 18)}</span><span class="grow"><b>Choose your parlay picks</b><small>${slip.legs.length} of ${TO.RULES.maxLegs} picks · choose one bet per game</small></span><button class="link-btn" data-act="toggle-parlay">Cancel</button></div>`;
  }

  function feed(games) {
    const f = activeFilter();
    let list = games;
    if (f === 'live') list = games.filter((g) => g.state === 'live');
    else if (f !== 'all') list = games.filter((g) => g.league === f);
    if (!list.length && f !== 'pred' && f !== 'todo') return emptyBoard(f);
    if (f === 'all') {
      const groups = S.LEAGUE_ORDER.filter((l) => l !== 'sim' && list.some((g) => g.league === l)).map((l) => {
        const lg = list.filter((g) => g.league === l);
