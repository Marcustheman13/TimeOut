        ${wl.atRisk ? `<div class="tiny faint">${wl.atRisk} min in open bets will change this when they settle.</div>` : ''}
      </div>

      <div class="card stack-s" style="border-color:rgba(255,201,64,.35)">
        <div class="row"><span class="lr-icon" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)">${icon('unlock', 18)}</span><div class="grow"><h2 style="margin:0;font-size:17px">Emergency unlock</h2><div class="small muted">${overridesLeft} of ${TO.RULES.maxOverrides} left today</div></div></div>
        <div class="small muted">Need your phone right now? Get ${TO.RULES.overrideMinutes} more minutes today. It costs ${TO.RULES.overridePenalty} minutes from tomorrow's limit and resets your clean streak.</div>
        <button class="btn warn" data-act="emergency" ${overridesLeft > 0 ? '' : 'disabled'}>${overridesLeft > 0 ? `Unlock ${TO.RULES.overrideMinutes} minutes now` : 'No unlocks left today'}</button>
      </div>

      <div class="stack-s">
        <div class="eyebrow">Controls</div>
        <div class="list">
          ${listRow('shield', 'Enforce app limits', 'Blocks your locked apps when today\'s phone time runs out', ui.switchEl('set-enforce', s.enforce, 'data-change="set-enforce"'), 'for="set-enforce"')}
          <button class="list-row" data-act="locked-apps"><span class="lr-icon">${icon('lock', 17)}</span><span class="lr-main"><div class="lr-title">Locked apps & sites</div><div class="lr-sub">${s.lockedApps.length} locked · ${St.lockPoints()} lock points</div></span>${icon('chevR', 18, 'chev')}</button>
          <div class="list-row" style="flex-wrap:wrap"><span class="lr-icon">${icon('clock', 17)}</span><span class="lr-main"><div class="lr-title">Minimum phone time per day</div><div class="lr-sub">Losses can't push your limit below this</div></span><div class="seg" style="width:100%;margin-top:4px">${[0, 15, 30].map((v) => `<button class="${s.minLimit === v ? 'on' : ''}" data-act="set-minlimit" data-v="${v}">${v ? `${v} min` : 'None'}</button>`).join('')}</div></div>
          <div class="list-row" style="flex-wrap:wrap"><span class="lr-icon">${icon('bell', 17)}</span><span class="lr-main"><div class="lr-title">Warn me when phone time is low</div><div class="lr-sub">Shows a heads-up before apps lock</div></span><div class="seg" style="width:100%;margin-top:4px">${[5, 10, 15].map((v) => `<button class="${s.lowWarn === v ? 'on' : ''}" data-act="set-lowwarn" data-v="${v}">${v} min left</button>`).join('')}</div></div>
        </div>
        <div class="tiny faint">Changes to limits ask you to confirm first, so nothing changes by accident.</div>
      </div>`;
  }

  function status() {
    const wl = St.wallet();
    const t = wl.tier;
    const next = St.TIERS[St.TIERS.indexOf(t) + 1];
    const ladder = St.TIERS.slice(1).map((r) => {
      const reached = St.TIERS.indexOf(t) >= St.TIERS.indexOf(r);
      return `<div class="row" style="align-items:flex-start"><span style="color:${reached ? r.color : 'var(--muted)'};margin-top:1px">${icon(reached ? 'check' : r.icon, 18)}</span><div class="grow"><div class="row-s"><b style="${reached ? '' : 'color:var(--text-2)'}">${esc(r.title)}</b><span class="tiny faint bold">${r.min}+ pts</span></div><div class="small ${reached ? 'muted' : 'faint'}">${St.tierPerks(r).join(' · ')}</div></div></div>`;
    }).join('');
    const ms = St.nextStreakMilestone(wl.streak);
    return `<div class="card stack">
        <div class="spread"><h2 style="margin:0;font-size:17px">Your tier</h2>${ui.tierBadge(t.id)}</div>
        ${next ? `<div class="stack-s"><div class="spread small"><b>${wl.points} lock point${wl.points === 1 ? '' : 's'}</b><span class="muted">${next.min - wl.points} more for ${esc(next.title)}</span></div><div class="bar"><i style="width:${Math.min(100, ((wl.points - t.min) / (next.min - t.min)) * 100)}%;background:${next.color}"></i></div></div>` : `<div class="bold" style="color:${t.color}">Top tier. ${wl.points} lock points.</div>`}
        ${!TO.data.settings.enforce ? `<div class="note warn">${icon('info', 15)}<span>App limits are off, so your lock points don't count. Turn them on in Screen time.</span></div>` : ''}
        <div class="stack-s">${ladder}</div>
        <div class="tiny faint">Lock more of your real screen time to climb. Apps and websites are 1 point; whole categories (like Social) are 3.</div>
        <button class="btn ghost sm" data-act="locked-apps">${icon('lock', 16)} Choose locked apps</button>
      </div>
      <div class="card stack-s">
        <div class="spread"><div class="row-s">${icon('flame', 20, wl.streak ? 'yellow' : 'faint')}<b style="font-size:16px">${wl.streak ? `${wl.streak}-day clean streak` : 'No clean streak yet'}</b></div>${wl.multiplier > 1 ? `<span class="tag green" style="height:24px;font-size:12px">Wins ${St.fmtMult(wl.multiplier)}</span>` : ''}</div>
        ${ms ? `<div class="bar"><i style="width:${(wl.streak / ms.days) * 100}%;background:var(--warn)"></i></div><div class="small muted bold">${ms.days - wl.streak} more clean day${ms.days - wl.streak === 1 ? '' : 's'} for ${St.fmtMult(ms.mult)} winnings.</div>` : '<div class="small green bold">Max multiplier reached. Keep it going.</div>'}
        <div class="small muted">A clean day means limits were on, you stayed under your phone time, and you didn't use an emergency unlock. Winnings get ×1.1 at 3 days and ×1.25 at 7. An emergency unlock resets the streak.</div>
      </div>`;
  }

  function sports() {
    const s = TO.data.settings;
    const row = (id, title, sub, checked, change) => listRow('grid', title, sub, ui.switchEl(`sp-${id}`, checked, `data-change="${change}" data-id="${id}"`), `for="sp-${id}"`).replace(`<span class="lr-icon">${icon('grid', 17)}</span>`, `<span class="sport-opt"><span class="sq">${esc(id === 'pred' ? 'PRED' : id === 'todo' ? 'TODO' : S.LEAGUES[id] ? S.LEAGUES[id].short : '')}</span></span>`);
    return `<div class="small muted">Choose what shows up on your Home feed. You can change this any time.</div>
      <div class="list">${S.LEAGUE_ORDER.map((l) => row(l, esc(S.LEAGUES[l].title), l === 'sim' ? 'Simulated games that run all day, for days without sports' : `${S.LEAGUES[l].sport[0].toUpperCase()}${S.LEAGUES[l].sport.slice(1)}`, s.sports.includes(l), 'set-sport')).join('')}</div>
      <div class="eyebrow">More ways to bet</div>
      <div class="list">
        ${row('pred', 'Prediction markets', 'Yes-or-no questions about movies, weather and more', s.showPredictions, 'set-pred')}
        ${row('todo', 'To-do parlays', 'Bet minutes on finishing your own tasks', s.showTodos, 'set-todo')}
      </div>`;
  }

  function notifications() {
    const n = TO.data.settings.notify;
    const row = (k, t, sub, ic) => listRow(ic, t, sub, ui.switchEl(`nt-${k}`, n[k], `data-change="set-notify" data-k="${k}"`), `for="nt-${k}"`);
    return `<div class="small muted">In the demo these show as banners at the top of the screen.</div><div class="list">
      ${row('settled', 'Bet results', 'When a bet wins, loses or is voided', 'ticket')}
      ${row('odds', 'Odds changes', 'When odds move on a pick in your bet slip', 'trend')}
      ${row('friends', 'Friend requests', 'When someone adds or accepts you', 'userPlus')}
      ${row('challenges', 'Bet challenges', 'When a friend challenges or accepts a bet', 'target')}
      ${row('lowTime', 'Low phone time', 'Before your locked apps close', 'phone')}
    </div>`;
  }

  function privacy() {
    const p = TO.data.settings.privacy;
    const row = (k, t, sub, ic) => listRow(ic, t, sub, ui.switchEl(`pv-${k}`, p[k], `data-change="set-privacy" data-k="${k}"`), `for="pv-${k}"`);
    return `<div class="small muted">Friends only see what you turn on here. Anything off shows as "Private" to them.</div><div class="list">
      ${row('record', 'My record', 'Wins and losses', 'chart')}
      ${row('minutes', 'Minutes won or lost', 'Your leaderboard number', 'hourglass')}
      ${row('bets', 'My open bets', 'Picks you currently have open', 'ticket')}
    </div>`;
  }

  let acctErr = {};
  const fmtStamp = (iso) => (iso ? `${TO.fmtDate(Date.parse(iso))}, ${TO.fmtTime(Date.parse(iso))}` : 'Never');

  /** Values read from PostgreSQL through GET /api/auth/me — the login vertical slice. */
  function serverAccountCard(s) {
    const line = (k, v, id) => `<div class="spread"><span class="muted">${k}</span><b${id ? ` id="${id}"` : ''}>${esc(String(v))}</b></div>`;
    return `<div class="card stack-s" id="db-account">
      <div class="row-s">${icon('check', 16)}<b>Saved in the TimeOut database</b></div>
      ${line('User ID', s.id)}
      ${line('Member since', TO.fmtDate(Date.parse(s.createdAt)))}
      ${line('Last login', fmtStamp(s.lastLoginAt), 'db-last-login')}
      ${line('Total logins', s.loginCount, 'db-login-count')}
    </div>`;
  }

  function account() {
    const a = TO.account;
    if (TO.api.online && a.server) {
      return `<div class="photo-pick"><span class="ph"><img src="${esc(a.photo)}" alt="Profile photo"></span><div><b>@${esc(a.username)}</b><div class="small muted">${esc(a.email)}</div></div></div>
        ${serverAccountCard(a.server)}
        <div class="card stack-s"><b>Not connected to the database yet</b><div class="small muted">Changing your photo, username, email or password, and deleting your account, still need API routes. Add them in server/src/auth.js.</div></div>
        <div class="stack-s"><button class="btn ghost" data-act="logout">${icon('logout', 18)} Log out</button></div>`;
    }
    return `<div class="photo-pick"><label class="ph" for="acct-photo" style="cursor:pointer"><img src="${esc(a.photo)}" alt="Profile photo"><span class="cam">${icon('camera', 15)}</span></label><div><b>Profile photo</b><div class="small muted">Tap the photo to change it.</div></div><input type="file" id="acct-photo" accept="image/*" class="sr" data-change="acct-photo"></div>
      <div class="card stack">
        ${ui.field({ id: 'acct-username', label: 'Username', value: a.username, err: acctErr.username, attrs: 'autocapitalize="off" spellcheck="false"' })}
        ${ui.field({ id: 'acct-email', label: 'Email', type: 'email', value: a.email, err: acctErr.email })}
        <button class="btn primary" data-act="acct-save">Save changes</button>
      </div>
      <div class="card stack">
        <h2 style="margin:0;font-size:17px">Change password</h2>
        ${ui.field({ id: 'acct-cur', label: 'Current password', type: 'password', err: acctErr.currentPassword })}
        ${ui.field({ id: 'acct-new', label: 'New password', type: 'password', err: acctErr.newPassword, hint: 'At least 8 characters' })}
        <button class="btn ghost" data-act="acct-pw">Update password</button>
      </div>
      <div class="stack-s">
        <button class="btn ghost" data-act="logout">${icon('logout', 18)} Log out</button>
        <button class="btn quiet" style="color:var(--loss)" data-act="acct-delete">Delete account</button>
        <div class="tiny faint" style="text-align:center">Demo accounts are stored only in this browser.</div>
      </div>`;
  }

  function render(section) {
    const map = { screentime, status, sports, notifications, privacy, account, tester: () => TO.tester.panelHtml(true) };
    return { title: SECTIONS[section].title, body: map[section]() };
  }

  function openSection(section) {
    closeDrawer();
    acctErr = {};
    ui.openPage('settings', { render: () => render(section) });
    if (section === 'status') TO.tester.mark('tier');
  }

  // ---------- How it works ----------
  function howItWorks() {
    ui.sheet('how', {
      render: () => ({
        title: 'How TimeOut works',
        body: `<div class="how-card"><span class="n">1</span><div><h3>Bet screen time, not money</h3><p>You get ${TO.RULES.daily} betting minutes every day. They reset at midnight.</p></div></div>
          <div class="how-card"><span class="n">2</span><div><h3>Winning buys you phone time</h3><p>Win a bet and the minutes you win are added to tomorrow's phone time. Lose and they come off it.</p></div></div>
          <div class="how-card"><span class="n">3</span><div><h3>Bets settle on their own</h3><p>When a game ends, your bet pays out within minutes. Postponed games are voided and you get your stake back.</p></div></div>
          <div class="how-card"><span class="n">4</span><div><h3>Out of minutes? Wait for midnight</h3><p>At 0 minutes, betting locks until the reset. Emergency unlocks exist, but they cost you tomorrow.</p></div></div>
          <div class="how-card"><span class="n">5</span><div><h3>Play friends for anything</h3><p>Send a bet to a friend and put something else on the line, like "loser does the dishes".</p></div></div>`,
        foot: `<button class="btn primary full" data-act="close-sheet" data-name="how">Got it</button>`,
      }),
    });
  }

  // ---------- Locked apps ----------
  let lockDraft = [];
  function lockedAppsSheet() {
    lockDraft = TO.data.settings.lockedApps.slice();
    ui.sheet('locked', {
      tall: true,
      render: () => {
        const pts = lockDraft.reduce((s, id) => s + St.LOCKABLE.find((x) => x.id === id).pts, 0);
        const t = St.tierForPoints(TO.data.settings.enforce ? pts : 0);
        const group = (kind) => St.LOCKABLE.filter((x) => x.kind === kind).map((x) => `<button class="list-row" data-act="lock-toggle" data-id="${x.id}"><span class="lr-icon" style="background:${x.color}22;color:${x.color}">${icon(kind === 'Category' ? 'grid' : kind === 'Website' ? 'globe' : 'phone', 17)}</span><span class="lr-main"><div class="lr-title">${esc(x.name)}</div><div class="lr-sub">${x.note ? `${esc(x.note)} · ` : ''}${x.pts} pt${x.pts === 1 ? '' : 's'}</div></span><span class="checkbox ${lockDraft.includes(x.id) ? 'on' : ''}">${icon('check', 15)}</span></button>`).join('');
        return {
          title: 'Locked apps & sites',
          body: `<div class="small muted">These are the apps TimeOut blocks when your phone time runs out. The more you lock, the higher your tier.</div>
            <div class="card tight spread"><span class="bold">${pts} lock points</span>${ui.tierBadge(t.id)}</div>
            <div class="eyebrow">Categories · 3 pts each</div><div class="list">${group('Category')}</div>
            <div class="eyebrow">Apps · 1 pt each</div><div class="list">${group('App')}</div>
            <div class="eyebrow">Websites · 1 pt each</div><div class="list">${group('Website')}</div>`,
          foot: `<button class="btn primary full" data-act="lock-save">Save locked apps</button>`,
        };
      },
    });
  }

  // ---------- Actions ----------
  const A = TO.actions;
  A.menu = () => openDrawer();
  A['close-drawer'] = () => closeDrawer();
  A.settings = (el) => { ui.closeAllSheets(); openSection(el.dataset.section); };
  A.how = () => { closeDrawer(); howItWorks(); };
  A['locked-apps'] = () => lockedAppsSheet();
  A['lock-toggle'] = (el) => {
    const id = el.dataset.id;
    lockDraft = lockDraft.includes(id) ? lockDraft.filter((x) => x !== id) : [...lockDraft, id];
    ui.refreshSheet('locked');
  };
  A['lock-save'] = async () => {
    const before = TO.data.settings.lockedApps;
    const removed = before.filter((x) => !lockDraft.includes(x));
    const oldTier = St.tier();
    const newTier = St.tierForPoints(TO.data.settings.enforce ? lockDraft.reduce((s, id) => s + St.LOCKABLE.find((x) => x.id === id).pts, 0) : 0);
    const body = `${lockDraft.length} apps, sites and categories will be locked when your phone time runs out.${newTier.id !== oldTier.id ? `<br><br>Your tier changes from <b>${esc(oldTier.title)}</b> to <b>${esc(newTier.title)}</b>.` : ''}${removed.length ? '<br><br>Unlocked apps stop counting right away.' : ''}`;
    if (!(await ui.confirm({ title: 'Update locked apps?', body, confirm: 'Save' }))) return;
    St.setSetting('lockedApps', lockDraft.slice());
    ui.closeSheet('locked');
    ui.toast({ kind: 'win', title: 'Locked apps updated', msg: `You're ${St.tier().title} now.` });
    refresh();
  };
  A.emergency = async () => {
    const wl = St.wallet();
    const ok = await ui.confirm({
      title: `Unlock ${TO.RULES.overrideMinutes} minutes now?`,
      body: `You'll get ${TO.RULES.overrideMinutes} more minutes of phone time today.<br><br><b style="color:var(--loss)">It costs ${TO.RULES.overridePenalty} minutes from tomorrow's limit</b>${wl.streak ? ` and ends your ${wl.streak}-day clean streak` : ''}. You have ${TO.RULES.maxOverrides - wl.overridesUsed} of ${TO.RULES.maxOverrides} unlocks left today.`,
      confirm: 'Unlock now',
      tone: 'warn',
    });
    if (!ok) return;
    try {
      St.useEmergencyUnlock();
      ui.toast({ kind: 'warn', title: `+${TO.RULES.overrideMinutes} min unlocked`, msg: `Tomorrow's limit dropped by ${TO.RULES.overridePenalty} min.` });
      TO.tester.mark('emergency');
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      ui.toast({ kind: 'loss', title: 'No unlocks left', msg: e.message });
    }
    refresh();
  };
  A['set-minlimit'] = async (el) => {
    const v = Number(el.dataset.v);
    if (v === TO.data.settings.minLimit) return;
    const ok = await ui.confirm({ title: 'Change your minimum phone time?', body: v ? `No matter how many bets you lose, you'll always get at least <b>${v} minutes</b> of phone time a day.` : 'Losses will be able to take your phone time all the way to 0 minutes.', confirm: 'Change it' });
    if (!ok) return;
    St.setSetting('minLimit', v);
    refresh();
  };
  A['set-lowwarn'] = (el) => { St.setSetting('lowWarn', Number(el.dataset.v)); refresh(); };
  A.logout = async () => {
    closeDrawer();
    if (!(await ui.confirm({ title: 'Log out?', body: 'Your bets and settings stay saved on this device.', confirm: 'Log out' }))) return;
    TO.slip.clear();
    if (TO.api.online) await TO.api.logout();
    St.logout();
    TO.app.boot();
  };
  A['acct-save'] = () => {
    acctErr = {};
    try {
      St.updateAccount({ username: document.getElementById('acct-username').value, email: document.getElementById('acct-email').value });
      ui.toast({ kind: 'win', title: 'Account saved' });
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      acctErr = e.fields || {};
    }
    refresh();
  };
  A['acct-pw'] = () => {
    acctErr = {};
    try {
      St.updateAccount({ currentPassword: document.getElementById('acct-cur').value, newPassword: document.getElementById('acct-new').value });
      ui.toast({ kind: 'win', title: 'Password updated' });
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      acctErr = e.fields || {};
    }
    refresh();
  };
  A['acct-delete'] = async () => {
    if (!(await ui.confirm({ title: 'Delete your account?', body: 'This removes your account, bets and friends from this device. It can\'t be undone.', confirm: 'Delete account', danger: true }))) return;
    St.deleteAccount();
    TO.slip.clear();
    TO.app.boot();
  };

  const C = TO.changes;
  C['set-enforce'] = async (el) => {
    const want = el.checked;
    el.checked = !want;
    const ok = await ui.confirm(want
      ? { title: 'Turn app limits on?', body: 'Your locked apps will close when today\'s phone time runs out.', confirm: 'Turn on' }
      : { title: 'Turn app limits off?', body: 'Your locked apps won\'t close anymore. Your tier drops to Rookie and today won\'t count as a clean day.', confirm: 'Turn off', danger: true });
    if (!ok) return;
    St.setSetting('enforce', want);
    refresh();
  };
  C['set-sport'] = (el) => {
    const id = el.dataset.id;
    const cur = TO.data.settings.sports;
    St.setSetting('sports', el.checked ? S.LEAGUE_ORDER.filter((l) => cur.includes(l) || l === id) : cur.filter((l) => l !== id));
    if (!el.checked && TO.data.feedFilter === id) TO.data.feedFilter = 'all';
    TO.tester.mark('sports');
    TO.app.render();
  };
  C['set-pred'] = (el) => { St.setSetting('showPredictions', el.checked); if (!el.checked && TO.data.feedFilter === 'pred') TO.data.feedFilter = 'all'; TO.app.render(); };
  C['set-todo'] = (el) => { St.setSetting('showTodos', el.checked); if (!el.checked && TO.data.feedFilter === 'todo') TO.data.feedFilter = 'all'; TO.app.render(); };
  C['set-notify'] = (el) => St.setSetting(`notify.${el.dataset.k}`, el.checked);
  C['set-privacy'] = (el) => St.setSetting(`privacy.${el.dataset.k}`, el.checked);
  C['acct-photo'] = async (el) => {
    try {
      const url = await ui.readPhoto(el.files[0]);
      St.updateAccount({ photo: url });
      ui.toast({ kind: 'win', title: 'Photo updated' });
      refresh();
      TO.app.renderChrome();
    } catch (e) { ui.toast({ kind: 'loss', title: e.message }); }
  };

  function refresh() {
    ui.refreshPage('settings');
    TO.app.render();
  }

  TO.views.settings = { openSection, howItWorks, closeDrawer, refresh };
})(window.TO);

</script>
<script>
/* TimeOut web demo — welcome, log in, create account and onboarding. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;
  const St = TO.state;

  const av = { screen: 'welcome', errors: {}, formError: '', values: {}, photo: null, step: 1, sports: null, locks: [] };

  function ticker() {
    const games = S.board(TO.now()).filter((g) => g.state === 'live' && !g.simulated).slice(0, 8);
    if (!games.length) return '';
    const items = games.map((g) => `<span class="tk"><span class="live"></span>${esc(g.away.abbr)} <b>${g.awayScore}</b> ${esc(g.home.abbr)} <b>${g.homeScore}</b> <span class="faint">${esc(g.clock)}</span></span>`).join('');
    return `<div class="ticker" aria-hidden="true"><div class="ticker-track">${items}${items}</div></div>`;
  }

  function welcome() {
    return `<div class="auth">
      <div class="welcome-hero">
        ${ticker()}
        <div style="margin-top:auto"></div>
        <div class="wordmark">Time<b>Out</b></div>
        <div class="tagline">Bet your screen time, not your money.</div>
        <div class="welcome-points">
          <div>${icon('hourglass', 18)}<span>60 betting minutes a day. Win and you get more phone time tomorrow.</span></div>
          <div>${icon('radio', 18)}<span>Live scores and odds for NFL, NBA, MLB, NHL, college football and soccer.</span></div>
          <div>${icon('users', 18)}<span>Challenge friends and play for anything but cash.</span></div>
        </div>
      </div>
      <div class="auth-inner" style="flex:none;gap:10px">
        <button class="btn primary full" data-act="auth-go" data-s="signup">Create account</button>
        <button class="btn ghost full" data-act="auth-go" data-s="login">Log in</button>
        <button class="btn quiet full sm" data-act="auth-demo">${icon('flask', 16)} Try the demo account</button>
      </div>
    </div>`;
  }

  function back() {
    return `<button type="button" class="icon-btn" style="margin-left:-10px" data-act="auth-go" data-s="welcome" aria-label="Back">${icon('chevL', 22)}</button>`;
  }

  function login() {
    const v = av.values;
    return `<div class="auth"><form class="auth-inner" data-form="login" novalidate>
      ${back()}
      <h1>Welcome back</h1>
      <p class="sub">Log in with your username or email.</p>
      ${av.formError ? `<div class="form-error">${esc(av.formError)}</div>` : ''}
      ${ui.field({ id: 'li-id', label: 'Username or email', value: v['li-id'] || '', err: av.errors.identifier, attrs: 'autocomplete="username" autocapitalize="off" spellcheck="false"' })}
      ${ui.field({ id: 'li-pw', label: 'Password', type: 'password', value: '', err: av.errors.password, attrs: 'autocomplete="current-password"' })}
      <button type="submit" class="btn primary full">Log in</button>
      <button type="button" class="btn quiet sm" data-act="forgot">Forgot password?</button>
      <div class="divider"></div>
      <button type="button" class="btn ghost full" data-act="auth-demo">${icon('flask', 16)} Log in with the demo account</button>
      <div class="small muted" style="text-align:center">New here? <button type="button" class="link-btn" data-act="auth-go" data-s="signup">Create an account</button></div>
    </form></div>`;
  }

  function signup() {
    const v = av.values;
    const photo = av.photo || TO.initialsAvatar(v['su-user'] || '?', '#1d2430');
    return `<div class="auth"><form class="auth-inner" data-form="signup" novalidate>
      ${back()}
      <h1>Create your account</h1>
      <p class="sub">Friends find you by your username.</p>
      ${av.formError ? `<div class="form-error">${esc(av.formError)}</div>` : ''}
      <div class="photo-pick">
        <label class="ph" for="su-photo" style="cursor:pointer"><img id="su-photo-img" src="${esc(photo)}" alt="Profile photo"><span class="cam">${icon('camera', 15)}</span></label>
        <div><b>Profile photo</b><div class="small muted">${av.photo ? 'Looking good. Tap to change it.' : 'Tap to add a photo. Optional, but it helps friends find you.'}</div>${av.errors.photo ? `<div class="small red bold">${esc(av.errors.photo)}</div>` : ''}</div>
        <input type="file" id="su-photo" accept="image/*" class="sr" data-change="su-photo">
      </div>
      ${ui.field({ id: 'su-user', label: 'Username', value: v['su-user'] || '', err: av.errors.username, hint: '3–20 letters, numbers, dots or underscores', attrs: 'autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="20"' })}
      ${ui.field({ id: 'su-email', label: 'Email', type: 'email', value: v['su-email'] || '', err: av.errors.email, attrs: 'autocomplete="email"' })}
      ${ui.field({ id: 'su-pw', label: 'Password', type: 'password', value: v['su-pw'] || '', err: av.errors.password, hint: 'At least 8 characters', attrs: 'autocomplete="new-password"' })}
      ${ui.field({ id: 'su-pw2', label: 'Confirm password', type: 'password', value: v['su-pw2'] || '', err: av.errors.confirm, attrs: 'autocomplete="new-password"' })}
      <button type="submit" class="btn primary full">Create account</button>
      <div class="tiny faint" style="text-align:center">${TO.api.online ? 'Your account is saved in the TimeOut database.' : 'Offline demo: accounts are saved in this browser, not on a server.'}</div>
      <div class="small muted" style="text-align:center">Already have an account? <button type="button" class="link-btn" data-act="auth-go" data-s="login">Log in</button></div>
    </form></div>`;
  }

  function onboard() {
    const step = av.step;
    const steps = `<div class="steps">${[1, 2, 3].map((i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
    let body, next;
    if (step === 1) {
      body = `<h1>Here's the deal, @${esc(TO.account.username)}</h1>
        <div class="how-card"><span class="n">1</span><div><h3>You get 60 betting minutes a day</h3><p>They reset every night at midnight.</p></div></div>
        <div class="how-card"><span class="n">2</span><div><h3>You're betting tomorrow's phone time</h3><p>Win and tomorrow's limit goes up. Lose and it goes down.</p></div></div>
        <div class="how-card"><span class="n">3</span><div><h3>No money, ever</h3><p>Not now, not later. Just minutes, bragging rights, and whatever you bet your friends.</p></div></div>`;
      next = `<button class="btn primary full" data-act="ob-next">Next</button>`;
    } else if (step === 2) {
      const sel = av.sports;
      body = `<h1>Pick your sports</h1><p class="sub">These show up on your Home feed. You can change them in Settings.</p>
        <div class="list">${S.LEAGUE_ORDER.map((l) => `<button class="list-row" data-act="ob-sport" data-id="${l}"><span class="sport-opt"><span class="sq">${esc(S.LEAGUES[l].short)}</span></span><span class="lr-main"><div class="lr-title">${esc(S.LEAGUES[l].title)}</div><div class="lr-sub">${l === 'sim' ? 'Simulated games for days without sports' : esc(S.LEAGUES[l].sport[0].toUpperCase() + S.LEAGUES[l].sport.slice(1))}</div></span><span class="checkbox ${sel.includes(l) ? 'on' : ''}">${icon('check', 15)}</span></button>`).join('')}</div>`;
      next = `<button class="btn primary full" data-act="ob-next" ${sel.length ? '' : 'disabled'}>${sel.length ? 'Next' : 'Pick at least one'}</button>`;
    } else {
      const pts = av.locks.reduce((s, id) => s + St.LOCKABLE.find((x) => x.id === id).pts, 0);
      const t = St.tierForPoints(pts);
      body = `<h1>Lock your time-wasters</h1><p class="sub">When today's phone time runs out, these apps lock. Lock more to reach a higher tier with bonus minutes and odds boosts.</p>
        <div class="card tight spread"><span class="bold">${pts} lock points</span>${ui.tierBadge(t.id)}</div>
        <div class="list">${St.LOCKABLE.filter((x) => x.kind !== 'Website').map((x) => `<button class="list-row" data-act="ob-lock" data-id="${x.id}"><span class="lr-icon" style="background:${x.color}22;color:${x.color}">${icon(x.kind === 'Category' ? 'grid' : 'phone', 17)}</span><span class="lr-main"><div class="lr-title">${esc(x.name)}</div><div class="lr-sub">${x.kind} · ${x.pts} pt${x.pts === 1 ? '' : 's'}</div></span><span class="checkbox ${av.locks.includes(x.id) ? 'on' : ''}">${icon('check', 15)}</span></button>`).join('')}</div>`;
      next = `<button class="btn primary full" data-act="ob-finish">Start betting</button><button class="btn quiet sm" data-act="ob-finish" data-skip="1">Skip for now</button>`;
    }
    return `<div class="auth"><div class="auth-inner">${steps}${step > 1 ? `<button class="icon-btn" style="margin-left:-10px" data-act="ob-back" aria-label="Back">${icon('chevL', 22)}</button>` : ''}${body}<div class="stack-s" style="margin-top:auto">${next}</div></div></div>`;
  }

  function render() {
    const root = document.getElementById('app-body');
    const map = { welcome, login, signup, onboard };
    root.innerHTML = map[av.screen]();
    const first = root.querySelector('input:not([type=file])');
    if (first && av.screen !== 'welcome' && !av.errors.password && av.screen !== 'onboard') setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
  }

  function show(screen) {
    av.screen = screen; av.errors = {}; av.formError = '';
    if (screen === 'welcome') { av.values = {}; av.photo = null; }
    render();
  }

  function startOnboarding() {
    av.screen = 'onboard'; av.step = 1; av.sports = TO.data.settings.sports.slice(); av.locks = [];
    render();
  }

  function collect(form) {
    form.querySelectorAll('input:not([type=file])').forEach((i) => { av.values[i.id] = i.value; });
  }

  function showError(e) {
    if (!(e instanceof TO.AppError)) throw e;
    Object.assign(av.errors, e.fields || {});
    av.formError = e.message;
    render();
  }

  function setBusy(form, label) {
    const btn = form.querySelector('button[type=submit]');
    if (btn) { btn.disabled = true; btn.textContent = label; }
  }

  /** Vertical slice: POST /api/auth/login -> server updates users.last_login_at and login_count -> show them. */
  async function serverLogin(identifier, password) {
    const { user, previousLoginAt } = await TO.api.login(identifier, password);
    St.adoptServerUser(user);
    av.values = {};
    TO.tester.mark('login');
    TO.app.boot();
    ui.toast({
      kind: 'win',
      title: `Logged in as @${user.username}`,
      msg: `Login #${user.loginCount}, saved to the database. ${previousLoginAt ? `Previous login: ${TO.fmtDate(Date.parse(previousLoginAt))}, ${TO.fmtTime(Date.parse(previousLoginAt))}.` : 'First login.'}`,
    });
  }

  async function submit(form) {
    collect(form);
    av.errors = {}; av.formError = '';
    const v = av.values;
    if (form.dataset.form === 'login') {
      try {
        if (TO.api.online) {
          setBusy(form, 'Logging in…');
          await serverLogin(v['li-id'] || '', v['li-pw'] || '');
          return;
        }
        St.login(v['li-id'], v['li-pw']);
        av.values = {};
        TO.app.boot();
      } catch (e) {
        av.errors = {};
        showError(e);
      }
      return;
    }
    // signup
    if (v['su-pw'] !== v['su-pw2']) av.errors.confirm = 'Passwords don\'t match.';
    if (TO.api.online) {
      try {
        if (av.errors.confirm) throw new TO.AppError('invalid', 'Fix the highlighted fields.');
        setBusy(form, 'Creating account…');
        const { user } = await TO.api.register({ username: (v['su-user'] || '').trim(), email: (v['su-email'] || '').trim(), password: v['su-pw'] || '', photoUrl: av.photo });
        St.adoptServerUser(user);
        av.values = {}; av.photo = null;
        TO.tester.mark('signup');
        startOnboarding();
      } catch (e) { showError(e); }
      return;
    }
    try {
      if (av.errors.confirm) {
        // Still report other field errors in the same pass.
        const probe = { username: St.validateUsername((v['su-user'] || '').trim()), email: St.validateEmail((v['su-email'] || '').trim()), password: St.validatePassword(v['su-pw'] || '') };
        for (const k of Object.keys(probe)) if (probe[k]) av.errors[k] = probe[k];
        throw new TO.AppError('invalid', 'Fix the highlighted fields.');
      }
      const acc = St.createAccount({ username: v['su-user'] || '', email: v['su-email'] || '', password: v['su-pw'] || '', photo: av.photo });
      St.startSession(acc.id);
      av.values = {}; av.photo = null;
      TO.tester.mark('signup');
      startOnboarding();
    } catch (e) { showError(e); }
  }

  TO.views.auth = { render, show, startOnboarding, submit };

  const A = TO.actions;
  A['auth-go'] = (el) => show(el.dataset.s);
  A['auth-demo'] = async (el) => {
    if (!TO.api.online) { St.loginDemo(); TO.tester.mark('login'); TO.app.boot(); return; }
    el.disabled = true;
    try {
      await serverLogin(St.DEMO.username, St.DEMO.password);
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      el.disabled = false;
      ui.toast({ kind: 'loss', title: 'Couldn\'t log in to the demo account', msg: e.message });
    }
  };
  A.forgot = () => ui.confirm({ title: 'Reset your password', body: TO.api.online ? 'Password reset emails aren\'t built yet. Log in with the demo account or create a new account.' : 'In this demo, accounts live only in this browser, so there\'s no email reset. Create a new account or log in with the demo account.', confirm: 'OK', cancel: null });
  A['toggle-pw'] = (el) => {
    const input = document.getElementById(el.dataset.for);
    if (!input) return;
    input.type = input.type === 'password' ? 'text' : 'password';
    el.innerHTML = icon(input.type === 'password' ? 'eye' : 'eyeOff', 18);
  };
  A['ob-next'] = () => { av.step++; render(); };
  A['ob-back'] = () => { av.step--; render(); };
  A['ob-sport'] = (el) => { const id = el.dataset.id; av.sports = av.sports.includes(id) ? av.sports.filter((x) => x !== id) : [...av.sports, id]; render(); };
  A['ob-lock'] = (el) => { const id = el.dataset.id; av.locks = av.locks.includes(id) ? av.locks.filter((x) => x !== id) : [...av.locks, id]; render(); };
  A['ob-finish'] = (el) => {
    St.setSetting('sports', S.LEAGUE_ORDER.filter((l) => av.sports.includes(l)));
    if (!el.dataset.skip) St.setSetting('lockedApps', av.locks.slice());
    TO.data.onboarded = true;
    St.grantTierBonus();
    St.save();
    TO.app.boot();
    ui.toast({ kind: 'win', title: `Welcome to TimeOut, @${TO.account.username}`, msg: `You have ${TO.data.wallet.balance} betting minutes today. Tap any odds to start.` });
  };
  TO.changes['su-photo'] = async (el) => {
    try {
      const form = el.closest('form');
      if (form) collect(form);
      av.photo = await ui.readPhoto(el.files[0]);
      av.errors.photo = null;
    } catch (e) { av.errors.photo = e.message; }
    render();
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — tester console. Not part of the app: it lets testers trigger situations from the PRD on demand. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;

  const CHECKLIST = [
    ['login', 'Log in (demo account or your own)'],
    ['signup', 'Create an account with a photo'],
    ['place', 'Place a bet from Home in 3 taps or fewer'],
    ['odds', 'See odds change on your slip and accept the new odds'],
    ['overstake', 'Try to stake more minutes than you have'],
    ['settle', 'Watch a bet settle (finish a live game)'],
    ['void', 'See a postponed game void a bet'],
    ['zero', 'Run your balance to 0 and see the midnight countdown'],
    ['midnight', 'Jump to midnight and check tomorrow\'s limit'],
    ['share', 'Share a bet as an image'],
    ['friend', 'Send or accept a friend bet with a custom stake'],
    ['search', 'Search a username that doesn\'t exist'],
    ['team', 'Create a team with start and end dates'],
    ['emergency', 'Use an emergency unlock'],
    ['todo', 'Place a to-do parlay'],
    ['pred', 'Bet on a prediction market'],
    ['sports', 'Change which sports show on Home'],
    ['offday', 'Turn on "no real games" and find the Sim League'],
    ['tier', 'Check your tier and clean streak'],
  ];
  const KEY = 'timeout.checklist';
  const done = () => TO.store.get(KEY, {});

  function mark(k) {
    const d = done();
    if (d[k]) return;
    d[k] = TO.now();
    TO.store.set(KEY, d);
    render();
  }

  function panelHtml(inApp) {
    const loggedIn = !!TO.account;
    const d = done();
    const off = TO.store.get('timeout.offDay', false);
    const now = new Date(TO.now());
    const shifted = Math.round(TO.clock.offset / TO.MIN);
    const dis = loggedIn ? '' : 'disabled';
    const b = (act, ic, label, extra = '') => `<button class="tbtn ${extra}" data-act="${act}" ${dis}>${icon(ic, 15)}<span>${label}</span></button>`;
    return `${inApp ? `<div class="note warn">${icon('flask', 16)}<span>These tools aren't part of TimeOut. They let testers trigger situations from the spec without waiting.</span></div>` : ''}
      <div class="tgroup"><h3>Demo clock</h3>
        <div class="clockface"><span>${now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' })} <b>${now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}</b></span><span class="faint">${shifted ? `+${TO.fmtIn(TO.clock.offset)}` : 'real time'}</span></div>
        <div class="tgrid">
          ${b('t-skip', 'ff', 'Skip 5 min')}${b('t-skip15', 'ff', 'Skip 15 min')}
          ${b('t-1159', 'moon', 'Jump to 11:59 PM')}${b('t-midnight', 'moon', 'Jump past midnight')}
          <button class="tbtn wide" data-act="t-real">${icon('refresh', 15)}<span>Back to real time</span></button>
        </div>
      </div>
      <div class="tgroup"><h3>Games & odds</h3>
        <div class="tgrid">
          ${b('t-finish', 'check', 'Finish games I bet on', 'wide')}
          ${b('t-postpone', 'alert', 'Postpone a game I bet on', 'wide')}
          ${b('t-odds', 'trend', 'Move odds on my bet slip', 'wide')}
          <button class="tbtn wide ${off ? 'on' : ''}" data-act="t-offday">${icon('moon', 15)}<span>${off ? 'No real games today: ON' : 'Simulate a day with no real games'}</span></button>
        </div>
      </div>
      <div class="tgroup"><h3>Screen time</h3>
        <div class="tgrid">
          ${b('t-use', 'phone', 'Use phone +10 min')}${b('t-use30', 'phone', 'Use phone +30 min')}
          ${b('t-zero', 'lock', 'Set betting balance to 0', 'wide')}
        </div>
      </div>
      <div class="tgroup"><h3>Friends</h3>
        <div class="tgrid">
          ${b('t-fr', 'userPlus', 'Get a friend request')}${b('t-ch', 'target', 'Get a bet challenge')}
        </div>
      </div>
      <div class="tgroup"><h3>Data</h3>
        <div class="tgrid">
          ${b('t-reset', 'refresh', 'Reset my bets & wallet', 'wide')}
          <button class="tbtn wide" data-act="t-wipe">${icon('trash', 15)}<span>Erase every account on this device</span></button>
        </div>
        <div class="creds">Demo login: <b>${esc(TO.state.DEMO.username)}</b> / <b>${esc(TO.state.DEMO.password)}</b></div>
      </div>
      <div class="tgroup"><h3>Test checklist · ${Object.keys(d).length}/${CHECKLIST.length}</h3>
        ${CHECKLIST.map(([k, t]) => `<button class="check-item ${d[k] ? 'done' : ''}" data-act="t-check" data-k="${k}"><span class="checkbox ${d[k] ? 'on' : ''}">${icon('check', 12)}</span><span>${esc(t)}</span></button>`).join('')}
        <button class="tbtn" data-act="t-check-clear">${icon('x', 15)}<span>Clear checklist</span></button>
      </div>`;
  }

  function render() {
    const host = document.getElementById('tester-body');
    if (host) {
      const st = host.scrollTop;
      host.innerHTML = panelHtml(false);
      host.scrollTop = st;
    }
    if (ui.pageOpen('settings') && document.querySelector('[data-page="settings"] .page-top .t').textContent === 'Tester tools') ui.refreshPage('settings');
  }

  function myGames() {
    const ids = new Set();
    TO.data.bets.filter((b) => b.status === 'open').forEach((b) => b.legs.forEach((l) => { if (l.gameId && l.result === 'pending') ids.add(l.gameId); }));
    return [...ids];
  }

  function after(msg) {
    TO.app.tick(true);
    if (msg) ui.toast(Object.assign({ kind: 'info' }, msg));
    render();
  }

  const A = TO.actions;
  A['t-skip'] = () => { TO.clock.add(5 * TO.MIN); after({ title: 'Skipped ahead 5 minutes' }); };
  A['t-skip15'] = () => { TO.clock.add(15 * TO.MIN); after({ title: 'Skipped ahead 15 minutes' }); };
  A['t-1159'] = () => {
    const target = TO.nextMidnight() - 60 * 1000;
    if (target > TO.now()) TO.clock.set(target);
    after({ title: 'It\'s 11:59 PM', msg: 'Watch the countdown hit zero.' });
  };
  A['t-midnight'] = () => {
    TO.clock.set(TO.nextMidnight() + 5000);
    after();
    mark('midnight');
  };
  A['t-real'] = () => {
    TO.clock.reset();
    // Moving back in time can't un-settle bets, so the wallet just follows the current day.
    after({ title: 'Back to real time' });
  };
  A['t-finish'] = () => {
    const ids = myGames().filter((id) => S.game(id).state !== 'postponed');
    if (!ids.length) { ui.toast({ kind: 'warn', title: 'No open game bets', msg: 'Place a bet on a game first.' }); return; }
    const now = TO.now();
    for (const id of ids) {
      const g = S.game(id, now);
      const warp = (S.overrides()[id] || {}).warp || 0;
      S.setOverride(id, { warp: warp + (g.end - now) + 1000 });
    }
    after({ title: `Finished ${ids.length} game${ids.length === 1 ? '' : 's'}`, msg: 'Bets settle within seconds.' });
    mark('settle');
  };
  A['t-postpone'] = () => {
    const ids = myGames().filter((id) => { const g = S.game(id); return g.state === 'scheduled' || g.state === 'live'; });
    const id = ids[0];
    if (!id) { ui.toast({ kind: 'warn', title: 'No open game bets', msg: 'Place a bet on a game that hasn\'t ended.' }); return; }
    S.setOverride(id, { state: 'postponed' });
    const g = S.game(id);
    after({ title: `${g.away.abbr} @ ${g.home.abbr} postponed`, msg: 'Bets on it are voided and stakes returned.' });
    mark('void');
  };
  A['t-odds'] = () => {
    const legs = TO.slip.legs.filter((l) => !l.ref.startsWith('pm-'));
    if (!legs.length) { ui.toast({ kind: 'warn', title: 'Add a game pick to your slip first', msg: 'Then tap this to move its odds.' }); return; }
    for (const l of legs) {
      const n = (S.overrides()[l.ref] || {}).nudge || 0;
      S.setOverride(l.ref, { nudge: n + (Math.random() < 0.5 ? -0.3 : 0.3) });
    }
    after({ title: 'Odds moved', msg: 'Your slip now asks you to accept the new odds.' });
  };
  A['t-offday'] = () => {
    const v = !TO.store.get('timeout.offDay', false);
    TO.store.set('timeout.offDay', v);
    if (v) { TO.data.feedFilter = 'all'; TO.state.save(); }
    TO.app.go('home');
    after({ title: v ? 'No real games today' : 'Real games are back' });
  };
  A['t-use'] = () => { TO.state.addUsage(10); after(); };
  A['t-use30'] = () => { TO.state.addUsage(30); after(); };
  A['t-zero'] = () => {
    const w = TO.data.wallet;
    w.balance = 0; w.lockedOut = true;
    TO.state.save();
    TO.app.go('home');
    after({ kind: 'loss', title: 'Betting balance is 0', msg: 'Betting is locked until midnight.' });
    mark('zero');
  };
  A['t-fr'] = () => {
    const candidates = TO.state.PEOPLE.filter((p) => TO.state.relation(p.username) === 'none');
    const p = candidates[Math.floor(Math.random() * candidates.length)];
    if (!p) { ui.toast({ kind: 'warn', title: 'Everyone is already your friend' }); return; }
    TO.data.requestsIn.push({ id: TO.uid('fr'), from: p.username, at: TO.now() });
    TO.state.save();
    after({ title: `@${p.username} sent you a friend request`, msg: 'See it in Social > Requests.' });
  };
  A['t-ch'] = () => {
    const from = TO.data.friends[Math.floor(Math.random() * TO.data.friends.length)] || 'mike_t';
    const ch = TO.state.incomingChallenge(from);
    if (!ch) { ui.toast({ kind: 'warn', title: 'No upcoming games to challenge on' }); return; }
    after({ title: `@${from} challenged you`, msg: `${ch.theirPick} · "${ch.terms}". See Social > Requests.` });
  };
  A['t-reset'] = async () => {
    if (!(await ui.confirm({ title: 'Reset your bets and wallet?', body: TO.account.demo ? 'The demo account goes back to its starting bets, friends and history.' : 'Your bets, wallet and streak start fresh. Friends and settings stay.', confirm: 'Reset', danger: true }))) return;
    TO.slip.clear();
    TO.store.set('timeout.gameOverrides', {});
    TO.state.resetMyData();
    ui.closeAllSheets();
    after({ title: 'Data reset' });
  };
  A['t-wipe'] = async () => {
    if (!(await ui.confirm({ title: 'Erase every account?', body: TO.api.online ? 'Logs you out and removes all bets and settings saved in this browser, then reloads. Accounts in the database stay (use npm run db:reset for those).' : 'Removes all TimeOut accounts, bets and settings saved in this browser, then reloads.', confirm: 'Erase everything', danger: true }))) return;
    try {
      Object.keys(localStorage).filter((k) => k.startsWith('timeout.')).forEach((k) => localStorage.removeItem(k));
    } catch (e) { /* ignore */ }
    location.reload();
  };
  A['t-check'] = (el) => {
    const d = done();
    if (d[el.dataset.k]) delete d[el.dataset.k]; else d[el.dataset.k] = TO.now();
    TO.store.set(KEY, d);
    render();
  };
  A['t-check-clear'] = () => { TO.store.set(KEY, {}); render(); };

  TO.tester = { mark, render, panelHtml };
})(window.TO);

</script>
<script>
/* TimeOut web demo — app shell, navigation, live refresh loop and event wiring. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const ui = TO.ui;
  const St = TO.state;

  const app = (TO.app = { tab: 'home', pressing: false });
  const TABS = [
    ['home', 'Home', 'home'],
    ['bets', 'My Bets', 'ticket'],
    ['social', 'Social', 'users'],
  ];

  const shellHtml = () => `<div class="app" id="shell">
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view" tabindex="-1"></main>
      <div id="slipbar-host"></div>
      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
    </div>`;

  app.boot = () => {
    ui.closeAllSheets();
    ui.closeAllPages();
    TO.views.settings.closeDrawer();
    const body = document.getElementById('app-body');
    if (!St.loadSession()) {
      body.innerHTML = '';
      TO.views.auth.show('welcome');
      TO.tester.render();
      return;
    }
    if (!TO.data.onboarded) {
      body.innerHTML = '';
      TO.views.auth.startOnboarding();
      TO.tester.render();
      return;
    }
    body.innerHTML = shellHtml();
    app.tab = 'home';
    app.render();
    TO.tester.render();
  };

  const inShell = () => !!document.getElementById('shell') && !!TO.data;

  app.renderChrome = () => {
    if (!inShell()) return;
    const wl = St.wallet();
    const locked = wl.lockedOut || wl.balance <= 0;
    const socialBadge = TO.views.social.badge();
    document.getElementById('topbar').innerHTML = `
      <button class="icon-btn" data-act="menu" aria-label="Menu and settings">${icon('menu', 22)}${wl.appsLocked ? '<span class="dotbadge"></span>' : ''}</button>
      <div class="brand">${icon('hourglass', 20, 'brand-mark')}<span class="brand-word">Time<b>Out</b></span></div>
      <button class="bal-pill ${locked ? 'locked' : ''}" data-act="settings" data-section="screentime" aria-label="${locked ? 'Betting locked until midnight' : `${wl.balance} minutes available to bet`}">${icon(locked ? 'lock' : 'hourglass', 15)}${locked ? 'Locked' : `${wl.balance} min`}</button>`;
    const open = TO.data.bets.filter((b) => b.status === 'open').length;
    document.getElementById('tabbar').innerHTML = TABS.map(([k, label, ic]) => {
      const badge = k === 'bets' && open ? `<span class="badge green">${open}</span>` : k === 'social' && socialBadge ? `<span class="badge">${socialBadge}</span>` : '';
      return `<button class="tab ${app.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}" aria-current="${app.tab === k ? 'page' : 'false'}">${icon(ic, 23)}<span>${label}</span>${badge}</button>`;
    }).join('');
    const host = document.getElementById('slipbar-host');
    const slip = TO.slip;
    if (slip.legs.length && !ui.sheetOpen('slip')) {
      const st = slip.status();
      const dec = slip.legs.reduce((p, l) => p * TO.odds.decimal(l.price), 1);
      host.innerHTML = `<button class="slipbar" data-act="open-slip"><span class="n">${slip.legs.length}</span><span>${slip.legs.length > 1 ? 'Parlay' : 'Bet Slip'}</span>${st.changed || st.closed ? `<span class="o row-s" style="font-family:var(--font-body);font-size:13px;color:var(--warn)">${icon('alert', 15)} ${st.closed ? 'Pick unavailable' : 'Odds changed'}</span>` : `<span class="o">${TO.odds.fmt(TO.odds.fromDecimal(dec))}</span>`}</button>`;
    } else host.innerHTML = '';
  };

  app.renderView = () => {
    if (!inShell()) return;
    const view = document.getElementById('view');
    const h = {};
    view.querySelectorAll('[data-hkey]').forEach((el) => { h[el.dataset.hkey] = el.scrollLeft; });
    const st = view.scrollTop;
    view.innerHTML = TO.views[app.tab].render();
    view.scrollTop = st;
    view.querySelectorAll('[data-hkey]').forEach((el) => { if (h[el.dataset.hkey]) el.scrollLeft = h[el.dataset.hkey]; });
  };

  app.render = () => { app.renderChrome(); app.renderView(); };
  app.refreshOddsButtons = () => {
    app.renderView();
    if (ui.pageOpen('game')) TO.views.game.refresh();
  };

  app.go = (tab) => {
    ui.closeAllPages();
    TO.views.settings.closeDrawer();
    app.tab = tab;
    app.render();
    const v = document.getElementById('view');
    if (v) v.scrollTop = 0;
  };

  // ---------- Live loop ----------
  let lastFull = 0;
  function betTitle(b) { return TO.views.bets.betTitle(b); }

  function notifySettled(list) {
    const n = TO.data.settings.notify;
    for (const b of list) {
      if (b.friend) {
        if (!n.challenges) continue;
        const who = b.friend.with.join(', ');
        if (b.status === 'won') ui.toast({ kind: 'win', title: `You beat @${who}`, msg: `They owe you: "${b.friend.terms}"` });
        else if (b.status === 'lost') ui.toast({ kind: 'loss', title: `@${who} won your friend bet`, msg: `You owe them: "${b.friend.terms}"` });
        else ui.toast({ kind: 'info', title: 'Friend bet voided', msg: `${betTitle(b)} · no winner` });
        continue;
      }
      if (!n.settled) continue;
      if (b.status === 'won') ui.toast({ kind: 'win', title: `Won: ${betTitle(b)}`, msg: `+${b.payout - b.stake} min added to tomorrow's phone time.` });
      else if (b.status === 'lost') ui.toast({ kind: 'loss', title: `Lost: ${betTitle(b)}`, msg: `−${b.stake} min from tomorrow's phone time.` });
      else ui.toast({ kind: 'info', title: `Voided: ${betTitle(b)}`, msg: `${b.insurancePaid ? 'Parlay insurance paid out.' : 'The game was postponed.'} Your ${b.stake} min stake came back.` });
    }
  }

  app.tick = (force) => {
    const now = TO.now();
    // Every second: clocks and countdowns.
    document.querySelectorAll('[data-countdown]').forEach((el) => { el.textContent = TO.countdown(Number(el.dataset.countdown) - now); });
    const sb = document.getElementById('sb-time');
    if (sb) sb.textContent = new Date(now).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M$/i, '');
    const cf = document.querySelector('#tester-body .clockface b');
    if (cf) cf.textContent = new Date(now).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });

    if (!force && Date.now() - lastFull < 5000) return;
    lastFull = Date.now();
    if (!inShell()) { TO.tester.render(); return; }

    // Midnight reset, settlement (PRD: within 5 minutes of a game ending; here within seconds) and friend activity.
    if (St.rollover(now)) {
      St.save();
      ui.toast({ kind: 'info', title: 'New day, new 60 minutes', msg: `Today's phone limit is ${St.wallet().todayLimit} min after yesterday's bets.` });
    }
    const settled = St.settle(now);
    notifySettled(settled);
    for (const ev of St.socialTick(now)) {
      if (ev.type === 'friend' && TO.data.settings.notify.friends) ui.toast({ kind: 'win', title: `@${ev.username} accepted your friend request` });
      if (ev.type === 'challenge' && TO.data.settings.notify.challenges) ui.toast({ kind: 'win', title: `@${ev.bet.friend.with.join(', ')} accepted your friend bet`, msg: `"${ev.bet.friend.terms}"` });
    }
    St.checkPhoneTime();

    const slip = TO.slip;
    if (slip.legs.length) {
      const st = slip.status();
      const sig = slip.legs.map((l) => { const c = TO.sim.currentSelection(l.selId); return c && c.sel ? `${c.sel.price}|${c.sel.line}` : 'x'; }).join(',');
      if (st.changed && sig !== slip.notifiedChange) {
        slip.notifiedChange = sig;
        if (TO.data.settings.notify.odds && !ui.sheetOpen('slip')) ui.toast({ kind: 'warn', title: 'Odds changed on your bet slip', msg: 'Open the slip to review and accept the new odds.' });
      }
      slip.update();
    }

    if (!app.pressing && !isTyping()) {
      app.renderChrome();
      app.renderView();
      if (ui.pageOpen('game')) TO.views.game.refresh();
      const sp = document.querySelector('[data-page="settings"] .page-top .t');
      if (sp && ['Screen time', 'Tier & streak'].includes(sp.textContent)) ui.refreshPage('settings');
    } else {
      app.renderChrome();
    }
    TO.tester.render();
  };

  function isTyping() {
    const a = document.activeElement;
    return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.type !== 'checkbox';
  }

  // ---------- Core actions ----------
  const A = TO.actions;
  A.tab = (el) => { ui.closeAllSheets(); app.go(el.dataset.tab); };
  A['close-sheet'] = (el) => ui.closeSheet(el.dataset.name);
  A['close-page'] = (el) => { ui.closePage(el.dataset.name); app.render(); };

  // ---------- Event wiring ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A' && el.dataset.act !== 'share-saved') e.preventDefault();
    // A click on a label wrapper shouldn't also fire the nested control's action twice.
    fn(el, e);
  });
  document.addEventListener('input', (e) => { const fn = TO.inputs[e.target.id]; if (fn) fn(e.target); });
  document.addEventListener('change', (e) => { const k = e.target.dataset && e.target.dataset.change; if (k && TO.changes[k]) TO.changes[k](e.target); });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    TO.views.auth.submit(form);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const layer = ui.layer();
    const last = layer.lastElementChild;
    if (!last) return;
    if (last.dataset.sheet) ui.closeSheet(last.dataset.sheet);
    else if (last.dataset.drawer) TO.views.settings.closeDrawer();
    else if (last.dataset.page) { ui.closePage(last.dataset.page); app.render(); }
  });
  document.addEventListener('pointerdown', () => { app.pressing = true; });
  document.addEventListener('pointerup', () => { setTimeout(() => { app.pressing = false; }, 60); });
  document.addEventListener('pointercancel', () => { app.pressing = false; });

  // ---------- Fit the phone frame to the window ----------
  function fit() {
    const slot = document.getElementById('device-slot');
    const device = document.getElementById('device');
    const tester = document.getElementById('tester');
    if (!slot || !device) return;
    if (window.innerWidth <= 560) {
      slot.style.width = slot.style.height = '';
      device.style.transform = '';
      return;
    }
    const scale = Math.min(1, Math.max(0.6, (window.innerHeight - 48) / 852));
    device.style.transform = `scale(${scale})`;
    slot.style.width = `${393 * scale}px`;
    slot.style.height = `${852 * scale}px`;
    if (tester) tester.style.height = `${852 * scale}px`;
  }
  window.addEventListener('resize', fit);

  /** Server mode: the database decides who is logged in. Re-reads the user on every page load,
   *  so values the server changed (last login, login count) survive a refresh. */
  async function restoreServerSession() {
    if (!TO.api.hasToken()) { St.logout(); return; }
    try {
      St.adoptServerUser(await TO.api.me());
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      if (e.status === 401) TO.api.clearToken();
      St.logout();
      if (e.status !== 401) ui.toast({ kind: 'loss', title: 'Couldn\'t load your account', msg: e.message });
    }
  }

  async function start() {
    fit();
    if (await TO.api.init()) await restoreServerSession();
    else St.ensureDemoAccount();
    app.boot();
    setInterval(() => app.tick(false), 1000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})(window.TO);

</script>
