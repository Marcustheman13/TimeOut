        return `<div class="league-head"><h3>${esc(S.LEAGUES[l].title)}</h3>${S.LEAGUES[l].simulated ? '<span class="tag">Simulated</span>' : ''}<span class="cnt">${lg.filter((g) => g.state === 'live').length} live · ${lg.length} games</span></div>${lg.map(gameCard).join('')}`;
      });
      return groups.join('');
    }
    return list.map(gameCard).join('');
  }

  function render() {
    const wl = TO.state.wallet();
    const games = boardGames();
    const lock = wl.appsLocked
      ? `<button class="app-lock" data-act="settings" data-section="screentime">${icon('phone', 22, 'red')}<span class="grow"><b class="red">Your locked apps are blocked</b><div class="small muted">You've used all ${wl.todayLimit} min of today's phone time. Emergency unlocks are in Settings.</div></span>${icon('chevR', 16)}</button>`
      : '';
    return `<div class="stack home" style="padding-top:2px">
      ${walletCard(wl)}
      ${lock}
      ${statusStrip(wl)}
      ${openBetsStrip()}
      <div class="stack feed" style="gap:12px">
        ${filterBar(games)}
        ${buildParlayControl()}
        ${TO.live.offline ? `<div class="note blue simulated-note">${icon('info', 16)}<span>Live ESPN odds can't be reached here, so these are simulated games with real team names. Everything else works the same.</span></div>` : ''}
        ${feed(games)}
      </div>
    </div>`;
  }

  function syncNode(current, fresh) {
    if (!current || !fresh || current.nodeType !== fresh.nodeType
      || (current.nodeType === 1 && current.tagName !== fresh.tagName)) {
      current?.parentNode?.replaceChild(fresh.cloneNode(true), current);
      return;
    }
    if (current.nodeType === 3) {
      if (current.nodeValue !== fresh.nodeValue) current.nodeValue = fresh.nodeValue;
      return;
    }
    const currentAttrs = [...current.attributes];
    for (const attr of currentAttrs) if (!fresh.hasAttribute(attr.name)) current.removeAttribute(attr.name);
    for (const attr of [...fresh.attributes]) if (current.getAttribute(attr.name) !== attr.value) current.setAttribute(attr.name, attr.value);
    const next = [...fresh.childNodes];
    for (let i = 0; i < next.length; i++) {
      const old = current.childNodes[i];
      if (!old) current.appendChild(next[i].cloneNode(true));
      else syncNode(old, next[i]);
    }
    while (current.childNodes.length > next.length) current.lastChild.remove();
  }

  function refreshLive() {
    const view = document.getElementById('view');
    if (!view || TO.app.tab !== 'home' || !view.firstElementChild) return;
    const next = document.createElement('div');
    next.innerHTML = render();
    if (next.firstElementChild) syncNode(view.firstElementChild, next.firstElementChild);
  }

  TO.views.home = { render, gameCard, refreshLive, boardGames, dayBar };

  // ---------- Actions ----------
  const A = TO.actions;
  A['feed-day'] = (el) => {
    feedDay = Number(el.dataset.day) || 0;
    TO.app.render();
    if (TO.ui.pageOpen('parlay')) TO.ui.refreshPage('parlay');
    const v = document.getElementById('view');
    const fb = v && v.querySelector('.filterbar');
    if (fb && v.scrollTop > fb.offsetTop) v.scrollTop = fb.offsetTop;
  };
  A.filter = (el) => { TO.data.feedFilter = el.dataset.f; TO.state.save(); TO.app.render(); const v = document.getElementById('view'); const fb = v.querySelector('.filterbar'); if (fb && v.scrollTop > fb.offsetTop) v.scrollTop = fb.offsetTop; };
  A['refresh-live'] = () => TO.live.refresh(TO.now(), true);
  A['go-sim'] = () => {
    if (!followed().includes('sim')) TO.state.setSetting('sports', [...followed(), 'sim']);
    TO.data.feedFilter = 'sim';
    TO.state.save();
    TO.app.render();
  };
  A.how = () => TO.views.settings.howItWorks();
})(window.TO);

</script>
<script>
/* TimeOut web demo — Game detail (Screen 2): live score, stats, research and every market. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;

  let currentId = null;

  function scoreboard(g) {
    const live = g.state === 'live', fin = g.state === 'final';
    const showScore = live || fin;
    const aTrail = g.awayScore < g.homeScore, hTrail = g.homeScore < g.awayScore;
    let mid;
    if (showScore) {
      mid = `<div class="sb-score"><span class="${aTrail ? 'trail' : ''}">${g.awayScore}</span><span class="dash">–</span><span class="${hTrail ? 'trail' : ''}">${g.homeScore}</span></div>
        <div class="sb-clock">${live ? `<span class="live">LIVE</span>${esc(g.clock)}` : esc(g.statusText)}</div>`;
    } else if (g.state === 'postponed' || g.state === 'canceled') {
      mid = `<div class="tag yellow" style="height:26px;font-size:12px">${g.state === 'canceled' ? 'Canceled' : 'Postponed'}</div>`;
    } else {
      mid = `<div class="display" style="font-size:26px">${TO.fmtTime(g.start)}</div><div class="sb-clock">${TO.fmtDay(g.start)} · in ${TO.fmtIn(g.start - TO.now())}</div>`;
    }
    const team = (t) => `<div class="sb-team">${ui.teamBadge(t, 52)}<div class="nm">${esc(!t.city || t.city === t.name ? t.name : `${t.city} ${t.name}`)}</div>${t.rank ? `<div class="rec">#${t.rank}</div>` : ''}</div>`;
    return `<div class="card scoreboard">
      <div class="spread tiny bold faint" style="margin-bottom:12px"><span>${esc(S.LEAGUES[g.league].title)}${g.simulated ? ' · Simulated' : ''}</span><span>Away @ Home</span></div>
      <div class="sb-grid">${team(g.away)}<div class="sb-mid">${mid}</div>${team(g.home)}</div>
    </div>`;
  }

  function banner(g, o) {
    if (g.state === 'postponed') return `<div class="note warn">${icon('alert', 16)}<span><b>This game was postponed.</b> All bets on it are void, and every stake has been returned in full. It no longer counts toward anyone's record.</span></div>`;
    if (g.state === 'canceled') return `<div class="note warn">${icon('alert', 16)}<span>This game was canceled. Bets on it will be voided.</span></div>`;
    if (g.state === 'final') return `<div class="note">${icon('lock', 16)}<span><b>Final: ${esc(g.away.abbr)} ${g.awayScore}, ${esc(g.home.abbr)} ${g.homeScore}${g.ot ? ` (${g.ot.label === '10' ? '10 innings' : 'OT'})` : ''}.</b> Betting is closed on this game.</span></div>`;
    if (o.suspended) return `<div class="note">${icon('lock', 16)}<span>Betting is closed for the final moments of this game.</span></div>`;
    return '';
  }

  function myBets(g) {
    const bets = TO.data.bets.filter((b) => b.legs.some((l) => l.gameId === g.id)).sort((a, b) => (a.status === 'open' ? -1 : 1) - (b.status === 'open' ? -1 : 1));
    if (!bets.length) return '';
    return `<div class="stack-s"><div class="eyebrow">Your bets on this game</div>${bets.map((b) => TO.views.bets.betCard(b, { compact: true })).join('')}</div>`;
  }

  function markets(g, o) {
    if (g.state !== 'live' && g.state !== 'scheduled') return '';
    const Sp = S.SPORTS[g.sport];
    const name = (side) => (side === 'home' ? g.home.name : side === 'away' ? g.away.name : 'Draw');
    const block = (title, sels, labelFn) => `<div class="market"><h4>${esc(title)}</h4><div class="opts">${sels.map((s) => ui.oddsBtn(s, { suspended: o.suspended, move: o.move[s.id], big: true, label: labelFn(s) })).join('')}</div></div>`;
    const moneyline = o.moneyline.length
      ? `${block('Moneyline · who wins', o.moneyline, (s) => name(s.side))}${g.sport === 'soccer' && !o.moneyline.some((s) => s.side === 'draw') ? '<div class="market"><h4>Draw</h4><div class="opts"><span class="tag">N/A</span></div></div>' : ''}`
      : '<div class="market"><h4>Moneyline · who wins</h4><div class="opts"><span class="tag">Moneyline N/A</span></div></div>';
    const available = [
      moneyline,
      o.spread.length ? block(`${Sp.spreadLabel} · win by more than the line`, o.spread, (s) => name(s.side)) : '',
      o.total.length ? block(`Total ${Sp.unit} · both teams combined`, o.total, (s) => (s.side === 'over' ? 'Over' : 'Under')) : '',
    ].filter(Boolean);
    if (!available.length) return `<div class="card small muted">ESPN betting lines are not available for this game yet.</div>`;
    return `<div class="card stack" id="game-markets">
      <div class="spread"><h2 style="margin:0;font-size:17px">Pick a side</h2><span class="tiny faint bold">ESPN odds refresh every 25 seconds</span></div>
      ${available.join('')}
      <div class="tiny faint">ESPN lines and prices. Tap a price to add it to your bet slip.</div>
    </div>`;
  }

  function statsCard(g) {
    if (!g.eventID) return '';
    const rows = TO.live.stats(g);
    if (!rows.length) return `<div class="card small muted">ESPN live stats are not available for this game yet.</div>`;
    return `<div class="card stack">
      <div class="spread"><h2 style="margin:0;font-size:17px">${g.state === 'live' ? 'Live stats' : 'Final stats'}</h2><span class="row-s tiny bold faint">${ui.teamBadge(g.away, 18)} vs ${ui.teamBadge(g.home, 18)}</span></div>
      ${rows.map((r) => {
        return `<div class="cmp-row"><span class="v">${esc(r.awayValue)}</span><div class="mid"><span class="lab">${esc(r.label)}</span></div><span class="v r">${esc(r.homeValue)}</span></div>`;
      }).join('')}
    </div>`;
  }

  function researchCard(g) {
    const teams = g.eventID ? [g.away, g.home].filter((team) => team.rank || team.record) : [];
    if (!teams.length) return '';
    return `<div class="card stack"><h2 style="margin:0;font-size:17px">ESPN team information</h2>${teams.map((team) => `<div class="spread"><span class="row-s bold">${ui.teamBadge(team, 22)}${esc(team.name)}</span><span class="small muted">${[team.rank ? `#${team.rank}` : '', team.record || ''].filter(Boolean).map(esc).join(' · ')}</span></div>`).join('')}</div>`;
  }

  /** Floating button: jumps to the odds, or back to the slip once there's a pick on it. */
  function fab(g, o) {
    if (g.state !== 'live' && g.state !== 'scheduled') return '';
    const n = TO.slip.legs.length;
    if (n) return `<div class="page-fab game-fab has-slip"><button class="btn primary full" data-act="open-slip">${icon('ticket', 18)} Open bet slip · ${n} pick${n === 1 ? '' : 's'}</button></div>`;
    return `<div class="page-fab game-fab"><button class="btn primary full" data-act="game-bet" ${o.suspended ? 'disabled' : ''}>${icon(o.suspended ? 'lock' : 'ticket', 18)} ${o.suspended ? 'Betting is closed on this game' : 'Make a bet'}</button></div>`;
  }

  function render() {
    const g = S.game(currentId);
    const o = S.odds(currentId);
    return {
      title: `${esc(g.away.abbr)} @ ${esc(g.home.abbr)}`,
      body: `${scoreboard(g)}${banner(g, o)}${myBets(g)}${markets(g, o)}${statsCard(g)}${researchCard(g)}${fab(g, o)}`,
    };
  }

  function open(id) {
    currentId = id;
    ui.openPage('game', { render });
    if (S.game(id)?.eventID) TO.live.loadDetails(id);
  }

  TO.on('live:details-updated', (id) => { if (id === currentId && ui.pageOpen('game')) TO.views.game.refresh(); });

  TO.views.game = { open, refresh: () => ui.refreshPage('game') };
  TO.actions['open-game'] = (el) => open(el.dataset.id);
  TO.actions['game-bet'] = () => {
    const m = document.getElementById('game-markets');
    if (!m) return;
    m.scrollIntoView({ behavior: 'smooth', block: 'start' });
    m.classList.remove('flash');
    void m.offsetWidth; // restart the highlight
    m.classList.add('flash');
    ui.toast({ kind: 'info', title: 'Pick a price', msg: 'Tap any odds and your bet slip opens with it.', ms: 2600 });
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — My Bets (Screen 4), bet sharing and to-do parlays. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;

  const view = { tab: 'open', filter: 'all' };

  const toWin = (b) => Math.round((Math.round(b.stake * b.decimal) - b.stake) * (b.multiplier || 1));
  const betTitle = (b) => (b.kind === 'todo' ? `To-do parlay · ${b.legs.length} task${b.legs.length === 1 ? '' : 's'}` : b.legs.length > 1 ? `${b.legs.length}-pick parlay` : b.legs[0].label);

  function legStanding(leg) {
    if (leg.result !== 'pending') return leg.result;
    if (leg.kind === 'todo') return 'upcoming';
    if (leg.kind === 'race') {
      const race = TO.races.get(leg.raceId);
      if (!race || race.status === 'open') return 'upcoming';
      if (race.status === 'running') return race.winnerId === Number(leg.horseId) ? 'winning' : 'losing';
      return 'even';
    }
    return S.liveStanding(leg);
  }

  function standingTag(st) {
    const map = { winning: ['Winning right now', 'trend'], losing: ['Losing right now', 'trend'], even: ['Too close to call', 'minus'], upcoming: ['Not started', 'clock'], void: ['Voided', 'x'] };
    const [t, ic] = map[st] || map.upcoming;
    return `<span class="standing ${st}">${icon(ic, 13)}${t}</span>`;
  }

  function overallStanding(bet) {
    const sts = bet.legs.filter((l) => l.result === 'pending').map(legStanding);
    if (sts.includes('losing')) return 'losing';
    if (sts.length && sts.every((s) => s === 'winning')) return 'winning';
    if (sts.every((s) => s === 'upcoming')) return 'upcoming';
    return 'even';
  }

  /** Live score + key stats for a leg, so users can follow a bet without leaving My Bets. */
  function liveBox(leg) {
    if (leg.kind === 'race') {
      const race = TO.races.get(leg.raceId);
      const horse = TO.races.horse(leg.horseId);
      const status = !race ? 'Race result unavailable' : race.status === 'open' ? 'Bets open' : race.status === 'running' ? 'Race in progress' : `Race #${race.number} finished`;
      const leader = race && race.status === 'running' ? TO.races.horse(race.winnerId).name : '';
      return `<div class="livebox"><div class="spread small"><b>${esc(horse.name)} · ${esc(leg.matchup)}</b><span class="${race && race.status === 'running' ? 'live' : 'muted'}">${esc(status)}</span></div>${leader ? `<div class="small muted" style="margin-top:4px">Current leader: ${esc(leader)}</div>` : ''}</div>`;
    }
    if (leg.kind === 'pred') {
      const p = S.prediction(leg.predId);
      const chance = Math.round((leg.side === 'yes' ? p.pYes : 1 - p.pYes) * 100);
      return `<div class="livebox"><div class="small muted">${esc(p.q)}</div><div class="spread small"><span class="bold">${chance}% chance your side hits</span><span class="faint bold">${p.state === 'resolved' ? `Resolved ${p.outcome.toUpperCase()}` : `Resolves in ${TO.fmtIn(p.resolves - TO.now())}`}</span></div></div>`;
    }
    const g = S.game(leg.gameId);
    if (!g) return `<div class="livebox"><div class="small bold">${esc(leg.matchup || 'Sports game')}</div><div class="small muted">Loading the latest score…</div></div>`;
    let head;
    if (g.state === 'live' || g.state === 'final') {
      head = `<div class="lb-score">${ui.teamBadge(g.away, 22)}<span>${esc(g.away.abbr)}</span><span class="sc">${g.awayScore}</span><span class="faint">–</span><span class="sc">${g.homeScore}</span><span>${esc(g.home.abbr)}</span>${ui.teamBadge(g.home, 22)}<span style="margin-left:auto" class="small ${g.state === 'live' ? '' : 'muted'}">${g.state === 'live' ? `<span class="live">LIVE</span> ${esc(g.clock)}` : esc(g.statusText)}</span></div>`;
    } else if (g.state === 'postponed') {
      head = `<div class="lb-score">${esc(g.away.name)} @ ${esc(g.home.name)}<span class="tag yellow" style="margin-left:auto">Postponed</span></div>`;
    } else {
      head = `<div class="lb-score">${ui.teamBadge(g.away, 22)}${esc(g.away.abbr)} @ ${esc(g.home.abbr)}${ui.teamBadge(g.home, 22)}<span style="margin-left:auto" class="small muted">${TO.fmtDay(g.start)} ${TO.fmtTime(g.start)} · in ${TO.fmtIn(g.start - TO.now())}</span></div>`;
    }
    if (g.eventID) TO.live.loadDetails(g.id);
    const stats = g.eventID ? TO.live.stats(g).slice(0, 3) : [];
    const statsHtml = stats.length && g.state === 'live' ? `<div class="lb-stats">${stats.map((r) => `<span>${esc(r.label)} <b>${esc(r.awayValue)}–${esc(r.homeValue)}</b></span>`).join('')}</div>` : '';
    return `<div class="livebox" data-act="open-game" data-id="${g.id}" style="cursor:pointer">${head}${statsHtml}</div>`;
  }

  function nowOdds(leg) {
    if (leg.result !== 'pending' || leg.kind === 'todo') return '';
    const cur = S.currentSelection(leg.selId);
    if (!cur || !cur.sel) return '';
    if (!cur.open) return `<span class="tag">Betting closed</span>`;
    if (cur.sel.price === leg.price && cur.sel.line === leg.line) return `<span class="tag">Odds now ${TO.odds.fmt(cur.sel.price)}</span>`;
    const better = TO.odds.decimal(cur.sel.price) < TO.odds.decimal(leg.price);
    return `<span class="tag ${better ? 'green' : 'red'}">Odds now ${cur.sel.market === 'spread' || cur.sel.market === 'total' ? `${TO.odds.fmtLine(cur.sel.line, cur.sel.market === 'spread')} ` : ''}${TO.odds.fmt(cur.sel.price)}</span>`;
  }

  function openCard(bet, opts) {
    const single = bet.legs.length === 1;
    const st = bet.kind === 'todo' ? null : overallStanding(bet);
    let legs;
    if (bet.kind === 'todo') {
      legs = bet.legs.map((l, i) => `<div class="leg" style="align-items:center">
        <button class="checkbox ${l.result === 'won' ? 'on' : ''}" data-act="todo-done" data-bet="${bet.id}" data-i="${i}" ${l.result === 'won' ? 'disabled' : ''} aria-label="Mark done">${icon('check', 15)}</button>
        <div class="grow"><div class="lt" style="${l.result === 'won' ? 'text-decoration:line-through;color:var(--text-2)' : ''}">${esc(l.text)}</div><div class="lm">${esc(l.difficulty)} · ${TO.odds.fmt(l.price)}${l.result === 'won' ? ` · ${esc(l.final)}` : ''}</div></div></div>`).join('');
      legs += `<div class="note">${icon('clock', 15)}<span>Finish every task before midnight (${ui.countdownEl(bet.deadline)} left). Tap a box when it's done. Honor system.</span></div>`;
    } else if (single) {
      const leg = bet.legs[0];
      legs = `${liveBox(leg)}<div class="spread">${standingTag(st)}${nowOdds(leg)}</div>`;
    } else {
      legs = bet.legs.map((l) => {
        const ls = legStanding(l);
        const dotIc = { won: 'check', lost: 'x', void: 'minus', push: 'minus', winning: 'trend', losing: 'trend' }[ls] || 'clock';
        return `<div class="leg"><span class="leg-dot ${ls}">${icon(dotIc, 12)}</span><div class="grow stack-s" style="gap:6px"><div><div class="lt">${esc(l.label)} <span class="faint" style="font-weight:600">${TO.odds.fmt(l.price)}</span></div><div class="lm">${esc(l.marketLabel)} · ${esc(l.matchup)}</div></div>${l.result === 'pending' ? liveBox(l) : `<div class="lm bold">${esc(l.final || '')}</div>`}</div></div>`;
      }).join('') + `<div class="spread">${standingTag(st)}${bet.insured ? '<span class="tag" style="color:var(--purple)">Insured</span>' : ''}</div>`;
    }
    const sub = bet.kind === 'todo' ? 'Bet on yourself' : single ? `${esc(bet.legs[0].marketLabel)} · ${esc(bet.legs[0].matchup)}` : 'Every pick must win';
    const stakeRow = `<div class="stake-row"><div><b>${bet.stake}</b><span>Min staked</span></div><div><b class="green">+${toWin(bet)}</b><span>Min to win</span></div><div><b>${TO.fmtTime(bet.placedAt)}</b><span>Placed ${TO.fmtDay(bet.placedAt).toLowerCase()}</span></div></div>`;
    const perks = [bet.boosted ? `<span class="tag blue">${icon('bolt', 10)} Boosted</span>` : '', bet.multiplier > 1 && !bet.boosted ? `<span class="tag green">${TO.state.fmtMult(bet.multiplier)} streak</span>` : ''].join('');
    const actions = opts && opts.compact ? '' : `<div class="bet-actions">
      ${bet.kind !== 'todo' ? `<button class="btn sm ghost" data-act="share" data-bet="${bet.id}">${icon('share', 16)} Share</button>` : ''}
    </div>`;
    return `<div class="card bet-card">
      <div class="bet-top"><div class="grow"><div class="t">${esc(betTitle(bet))}</div><div class="small muted" style="margin-top:2px">${sub}</div></div><div class="odds">${TO.odds.fmt(bet.american)}</div></div>
      ${perks ? `<div class="row-s">${perks}</div>` : ''}
      ${legs}
      ${stakeRow}
      ${actions}
    </div>`;
  }

  function historyCard(bet, opts) {
    const single = bet.legs.length === 1;
    let result;
    if (bet.status === 'won') result = `<span class="display green" style="font-size:22px">+${bet.payout - bet.stake} min</span>`;
    else if (bet.status === 'lost') result = `<span class="display red" style="font-size:22px">−${bet.stake} min</span>`;
    else result = `<span class="small bold muted">${bet.insurancePaid ? 'Insurance refund' : 'Stake returned'} · ${bet.stake} min</span>`;
    const legs = bet.legs.map((l) => `<div class="leg"><span class="leg-dot ${l.result}">${icon({ won: 'check', lost: 'x' }[l.result] || 'minus', 12)}</span><div class="grow"><div class="lt">${esc(l.label)} <span class="faint" style="font-weight:600">${TO.odds.fmt(l.price)}</span></div><div class="lm">${esc(l.kind === 'todo' ? l.marketLabel : l.matchup)}${l.final ? ` · <b>${esc(l.final)}</b>` : ''}</div></div></div>`).join('');
    const why = bet.status === 'void' ? `<div class="note warn">${icon('info', 15)}<span>${bet.kind === 'todo' ? '' : 'The game was postponed or cancelled, so this bet was voided and your full stake came back.'}</span></div>` : '';
    return `<div class="card bet-card">
      <div class="bet-top"><div class="grow"><div class="row-s" style="margin-bottom:4px">${ui.statusPill(bet.status)}${single ? '' : `<span class="tag">${bet.kind === 'todo' ? 'To-do' : 'Parlay'}</span>`}</div><div class="t">${esc(betTitle(bet))}</div></div><div style="text-align:right"><div class="odds" style="font-size:16px">${TO.odds.fmt(bet.american)}</div>${result}</div></div>
      ${legs}
      ${why}
      <div class="spread tiny faint bold"><span>${bet.stake} min staked · placed ${TO.fmtDay(bet.placedAt)} ${TO.fmtTime(bet.placedAt)}</span><span>Settled ${TO.ago(bet.settledAt)}</span></div>
      ${opts && opts.compact ? '' : bet.kind !== 'todo' ? `<div class="bet-actions"><button class="btn sm ghost" data-act="share" data-bet="${bet.id}">${icon('share', 16)} Share</button></div>` : ''}
    </div>`;
  }

  const betCard = (bet, opts) => (bet.status === 'open' ? openCard(bet, opts) : historyCard(bet, opts));
  const gameLeg = (leg) => leg.kind === 'race' || leg.kind === 'game' || (leg.kind === 'sports' && !!leg.gameId);
  const isLiveBet = (bet) => bet.legs.some((leg) => leg.result === 'pending' && (leg.kind === 'race' ? TO.races.get(leg.raceId)?.status === 'running' : gameLeg(leg) && S.game(leg.gameId)?.state === 'live'));

  function recordCard() {
    const st = TO.state.myStats();
    const wl = TO.state.wallet();
    const sports = Object.entries(st.bySport).sort((a, b) => (b[1].w + b[1].l) - (a[1].w + a[1].l)).slice(0, 5);
    const maxAbs = Math.max(1, ...sports.map(([, v]) => Math.abs(v.net)));
    return `<div class="card record-card stack">
      <div class="spread"><h2 style="margin:0;font-size:17px">Your record</h2>${st.recent.length ? `<span class="form-dots">${st.recent.map((x) => `<i class="${x}">${x}</i>`).join('')}</span>` : ''}</div>
      <div class="record-big">
        <div><b>${st.w}-${st.l}${st.v ? `-${st.v}` : ''}</b><span>Won-Lost${st.v ? '-Void' : ''}</span></div>
        <div><b>${st.pct === null ? '—' : `${st.pct}%`}</b><span>Win rate</span></div>
        <div><b class="${st.net > 0 ? 'green' : st.net < 0 ? 'red' : ''}">${TO.signed(st.net)}</b><span>Total minutes</span></div>
      </div>
      ${sports.length ? `<div class="sport-bars">${sports.map(([k, v]) => `<div class="sport-bar"><span class="muted">${esc(ui.leagueShort(k))}</span><div class="bar"><i class="${v.net < 0 ? 'neg' : ''}" style="width:${(Math.abs(v.net) / maxAbs) * 100}%"></i></div><span style="text-align:right" class="${v.net > 0 ? 'green' : v.net < 0 ? 'red' : 'muted'}">${TO.signedMin(v.net)}</span></div>`).join('')}</div>` : ''}
      <div class="spread small muted"><span>Today: <b class="${wl.todayNet > 0 ? 'green' : wl.todayNet < 0 ? 'red' : ''}">${TO.signedMin(wl.todayNet)}</b> so far</span></div>
    </div>`;
  }

  function render() {
    const bets = TO.data.bets.filter((b) => (b.kind === 'sports' || b.kind === 'race') && b.legs.length && b.legs.every(gameLeg));
    const open = bets.filter((b) => b.status === 'open').sort((a, b) => b.placedAt - a.placedAt);
    const liveNow = open.filter(isLiveBet);
    const otherOpen = open.filter((b) => !isLiveBet(b));
    let settled = bets.filter((b) => b.status !== 'open').sort((a, b) => b.settledAt - a.settledAt);
    const counts = { all: settled.length, won: 0, lost: 0, void: 0 };
    settled.forEach((b) => { if (b.status === 'won') counts.won++; else if (b.status === 'lost') counts.lost++; else counts.void++; });
    if (view.filter !== 'all') settled = settled.filter((b) => (view.filter === 'void' ? b.status === 'void' || b.status === 'push' : b.status === view.filter));

    let list;
    if (view.tab === 'open') {
      list = open.length
        ? `${liveNow.length ? `<div class="eyebrow row-s" style="padding:2px 16px;margin-top:4px"><span class="live"></span>Live now <span class="count-pill">${liveNow.length}</span></div>${liveNow.map((b) => openCard(b)).join('')}` : ''}${otherOpen.length ? `<div class="eyebrow" style="padding:2px 16px;margin-top:4px">Upcoming</div>${otherOpen.map((b) => openCard(b)).join('')}` : ''}`
        : `<div class="empty">${icon('ticket', 40)}<h3>No open bets</h3><p>Go to Home and tap any odds to start a bet. It takes two taps: pick a price, then tap Place bet.</p><button class="btn primary" data-act="tab" data-tab="home">Find a game</button></div>`;
    } else {
      const chip = (k, t) => `<button class="chip sm ${view.filter === k ? 'on' : ''}" data-act="bets-filter" data-f="${k}">${t}<span class="n">${counts[k]}</span></button>`;
      list = `<div class="hscroll">${chip('all', 'All')}${chip('won', 'Won')}${chip('lost', 'Lost')}${chip('void', 'Voided')}</div>`
        + (settled.length ? settled.map((b) => historyCard(b)).join('') : `<div class="empty">${icon('chart', 40)}<h3>${bets.length ? 'Nothing here yet' : 'No settled bets yet'}</h3><p>Bets move here within a few minutes of their game ending, marked Won, Lost or Voided.</p>${bets.length ? '' : '<button class="btn primary" data-act="tab" data-tab="home">Place your first bet</button>'}</div>`);
    }
    return `<div class="page-head"><h1>My Bets</h1><p>Follow your open bets live and see how every past bet turned out.</p></div>
      <div class="stack">
        ${recordCard()}
        <div class="pad"><div class="seg">
          <button class="${view.tab === 'open' ? 'on' : ''}" data-act="bets-tab" data-t="open">Open bets <span class="count-pill ${open.length ? '' : 'off'}">${open.length}</span></button>
          <button class="${view.tab === 'history' ? 'on' : ''}" data-act="bets-tab" data-t="history">Bet history <span class="count-pill off">${counts.all}</span></button>
        </div></div>
        ${list}
      </div>`;
  }

  TO.views.bets = { render, betCard, betTitle, toWin, view };

  // ---------- Share ----------
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrapText(ctx, text, x, y, maxW, lineH, maxLines = 3) {
    const words = String(text).split(' ');
    let line = '', lines = 0;
    for (let i = 0; i < words.length; i++) {
      const test = line ? `${line} ${words[i]}` : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x, y); y += lineH; line = words[i]; lines++;
        if (lines >= maxLines - 1) { line = words.slice(i).join(' '); break; }
      } else line = test;
    }
    ctx.fillText(line, x, y);
    return y + lineH;
  }

  /** Draws the share image: teams, pick, odds and stake (PRD bet sharing requirement). */
  async function drawShare(bet) {
    try { await document.fonts.ready; } catch (e) { /* ignore */ }
    const W = 1080, H = 1350;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    const D = '"Barlow Condensed", "Arial Narrow", sans-serif', B = 'Barlow, Arial, sans-serif';
    ctx.fillStyle = '#0a0d12'; ctx.fillRect(0, 0, W, H);
    const glow = ctx.createRadialGradient(W * 0.85, 60, 10, W * 0.85, 60, 700);
    glow.addColorStop(0, 'rgba(34,214,110,0.28)'); glow.addColorStop(1, 'rgba(34,214,110,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    // Wordmark
    ctx.font = `italic 900 84px ${D}`;
    ctx.fillStyle = '#f2f5f9'; ctx.fillText('Time', 80, 150);
    const tw = ctx.measureText('Time').width;
    ctx.fillStyle = '#22d66e'; ctx.fillText('Out', 80 + tw, 150);
    ctx.font = `700 30px ${B}`; ctx.fillStyle = '#8c96a8';
    ctx.fillText(`@${TO.account.username}'s bet`, 80, 200);

    // Status pill
    const status = bet.status.toUpperCase();
    const pillColor = { OPEN: '#1d2430', WON: '#22d66e', LOST: '#ff5a5f', VOID: '#5e687a', PUSH: '#5e687a' }[status];
    ctx.font = `900 30px ${B}`;
    const pw = ctx.measureText(status).width + 48;
    roundRect(ctx, W - 80 - pw, 104, pw, 56, 28); ctx.fillStyle = pillColor; ctx.fill();
    ctx.fillStyle = status === 'WON' ? '#03140a' : '#fff'; ctx.fillText(status, W - 80 - pw + 24, 143);

    // Card
    roundRect(ctx, 60, 260, W - 120, 800, 44); ctx.fillStyle = '#141922'; ctx.fill();
    ctx.strokeStyle = '#283141'; ctx.lineWidth = 3; ctx.stroke();

    let y = 340;
    const single = bet.legs.length === 1 && bet.legs[0].kind === 'game';
    if (single) {
      const g = S.game(bet.legs[0].gameId);
      const disc = (team, cx) => {
        ctx.beginPath(); ctx.arc(cx, y + 90, 90, 0, Math.PI * 2); ctx.fillStyle = team.color; ctx.fill();
        ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = `900 ${team.abbr.length > 3 ? 52 : 64}px ${D}`; ctx.textAlign = 'center'; ctx.fillText(team.abbr, cx, y + 112);
        ctx.font = `700 34px ${B}`; ctx.fillStyle = '#f2f5f9'; ctx.fillText(team.name, cx, y + 240);
      };
      disc(g.away, 300); disc(g.home, W - 300);
      ctx.font = `900 60px ${D}`; ctx.fillStyle = '#5e687a'; ctx.textAlign = 'center';
      ctx.fillText(g.state === 'live' || g.state === 'final' ? `${g.awayScore} – ${g.homeScore}` : '@', W / 2, y + 112);
      ctx.font = `700 26px ${B}`; ctx.fillStyle = '#8c96a8';
      ctx.fillText(g.state === 'live' ? `LIVE · ${g.clock}` : g.state === 'final' ? g.statusText : g.state === 'postponed' ? 'Postponed' : `${TO.fmtDay(g.start)} ${TO.fmtTime(g.start)}`, W / 2, y + 160);
      ctx.textAlign = 'left';
      y += 320;
      ctx.fillStyle = '#283141'; ctx.fillRect(110, y - 20, W - 220, 3);
      ctx.font = `700 30px ${B}`; ctx.fillStyle = '#8c96a8'; ctx.fillText(`${bet.legs[0].marketLabel.toUpperCase()} · MY PICK`, 110, y + 40);
      ctx.font = `900 88px ${D}`; ctx.fillStyle = '#f2f5f9';
      y = wrapText(ctx, bet.legs[0].label, 110, y + 130, W - 220, 90, 2);
    } else {
      ctx.font = `700 30px ${B}`; ctx.fillStyle = '#8c96a8';
      ctx.fillText(bet.legs.length > 1 ? `${bet.legs.length}-PICK PARLAY` : 'MY PICK', 110, y + 10);
      y += 80;
      for (const l of bet.legs) {
        ctx.font = `900 60px ${D}`; ctx.fillStyle = '#f2f5f9';
        ctx.fillText(l.label, 110, y + 30);
        ctx.font = `600 28px ${B}`; ctx.fillStyle = '#8c96a8';
        y = wrapText(ctx, `${l.marketLabel} · ${l.matchup}`, 110, y + 76, W - 360, 34, 2);
        ctx.font = `900 50px ${D}`; ctx.fillStyle = '#22d66e'; ctx.textAlign = 'right';
        ctx.fillText(TO.odds.fmt(l.price), W - 110, y - 60);
        ctx.textAlign = 'left';
        y += 30;
      }
    }

    // Bottom stats
    const by = 900;
    ctx.fillStyle = '#283141'; ctx.fillRect(110, by - 30, W - 220, 3);
    const col = (label, value, x, color) => {
      ctx.font = `700 26px ${B}`; ctx.fillStyle = '#8c96a8'; ctx.fillText(label, x, by + 20);
      ctx.font = `900 76px ${D}`; ctx.fillStyle = color; ctx.fillText(value, x, by + 100);
    };
    col('ODDS', TO.odds.fmt(bet.american), 110, '#f2f5f9');
    col('STAKE', `${bet.stake} min`, 420, '#f2f5f9');
    col(bet.status === 'lost' ? 'LOST' : bet.status === 'won' ? 'WON' : 'TO WIN', bet.status === 'lost' ? `−${bet.stake}` : `+${bet.status === 'won' ? bet.payout - bet.stake : toWin(bet)}`, 730, bet.status === 'lost' ? '#ff5a5f' : '#22d66e');

    ctx.font = `600 30px ${B}`; ctx.fillStyle = '#8c96a8'; ctx.textAlign = 'center';
    ctx.fillText('Betting screen time, not money.', W / 2, 1160);
    ctx.font = `italic 900 40px ${D}`; ctx.fillStyle = '#22d66e';
    ctx.fillText('TimeOut', W / 2, 1230);
    ctx.textAlign = 'left';
    return c.toDataURL('image/png');
  }

  function shareText(bet) {
    const picks = bet.legs.map((l) => `${l.label} (${TO.odds.fmt(l.price)}) · ${l.matchup}`).join('\n');
    const stake = `${bet.stake} min of screen time to win ${toWin(bet)} min`;
    return `My TimeOut ${bet.legs.length > 1 ? 'parlay' : 'bet'}:\n${picks}\nOdds ${TO.odds.fmt(bet.american)} · ${stake}`;
  }

  TO.actions.share = async (el) => {
    const bet = TO.data.bets.find((b) => b.id === el.dataset.bet);
    if (!bet) return;
    let url = '';
    ui.sheet('share', {
      render: () => ({
        title: 'Share bet',
        body: `${url ? `<img class="share-img" src="${url}" alt="Bet card image showing the teams, pick, odds and stake">` : '<div class="card muted small">Creating image…</div>'}
          <div class="small muted">${ui.embedded ? 'To save the image, right-click it or press and hold it.' : 'Save the image and post it anywhere.'}</div>
          <textarea class="textarea sr" id="share-text" readonly>${esc(shareText(bet))}</textarea>`,
        foot: `${!ui.embedded && url ? `<a class="btn primary full" href="${url}" download="timeout-bet.png" data-act="share-saved">${icon('share', 18)} Save image</a>` : ''}
          <div class="row"><button class="btn ghost grow" data-act="share-copy">${icon('copy', 16)} Copy bet text</button></div>`,
      }),
    });
    url = await drawShare(bet);
    ui.refreshSheet('share');
  };
  TO.actions['share-copy'] = async () => {
    const ok = await ui.copy(document.getElementById('share-text').value);
    ui.toast({ kind: ok ? 'win' : 'info', title: ok ? 'Bet copied' : 'Copy the text manually', msg: ok ? 'Paste it into any chat.' : '' });
  };
  TO.actions['share-saved'] = () => { /* default link behavior downloads the image */ };

  // ---------- My Bets actions ----------
  TO.actions['bets-tab'] = (el) => { view.tab = el.dataset.t; TO.app.render(); };
  TO.actions['bets-filter'] = (el) => { view.filter = el.dataset.f; TO.app.render(); };

  // ---------- To-do parlay (Could-have) ----------
  const PRESETS = [['Read 20 pages', 'medium'], ['Wash the dishes', 'easy'], ['Fold laundry', 'easy'], ['Work out for 30 min', 'medium'], ['Study for 1 hour', 'hard'], ['Clean my room', 'medium'], ['No phone after 10 PM', 'hard']];
  const todo = { tasks: [{ text: '', difficulty: 'easy' }], stake: '10', error: '' };

  function todoBody() {
    const wl = TO.state.wallet();
    const legs = todo.tasks.filter((t) => t.text.trim());
    const dec = legs.reduce((p, t) => p * TO.odds.decimal(TO.state.TODO_ODDS[t.difficulty]), 1);
    const stake = parseInt(todo.stake, 10) || 0;
    const win = legs.length ? Math.round((Math.round(stake * dec) - stake) * wl.multiplier) : 0;
    return `<div class="small muted">Stake minutes on getting things done today. Finish every task before midnight and you win; miss one and you lose the stake. Up to ${TO.RULES.maxLegs} tasks.</div>
      ${todo.tasks.map((t, i) => `<div class="card tight stack-s">
        <div class="row"><input class="input grow" id="todo-${i}" placeholder="Task ${i + 1}, like 'Read 20 pages'" value="${esc(t.text)}" maxlength="60">${todo.tasks.length > 1 ? `<button class="icon-btn" data-act="todo-del" data-i="${i}" aria-label="Remove task">${icon('x', 18)}</button>` : ''}</div>
        <div class="seg">${['easy', 'medium', 'hard'].map((d) => `<button class="${t.difficulty === d ? 'on' : ''}" data-act="todo-diff" data-i="${i}" data-d="${d}">${d[0].toUpperCase() + d.slice(1)} <span class="faint">${TO.odds.fmt(TO.state.TODO_ODDS[d])}</span></button>`).join('')}</div>
      </div>`).join('')}
      ${todo.tasks.length < TO.RULES.maxLegs ? `<button class="btn ghost sm" data-act="todo-add">${icon('plus', 16)} Add a task</button>` : ''}
      <div class="field"><span class="label">Quick add</span><div class="hscroll" style="padding:0">${PRESETS.map(([t, d]) => `<button class="chip sm" data-act="todo-preset" data-t="${esc(t)}" data-d="${d}">${esc(t)}</button>`).join('')}</div></div>
      <div class="field"><label for="todo-stake">Minutes to stake (max ${TO.RULES.todoMaxStake})</label><input class="input" id="todo-stake" type="number" min="1" max="${TO.RULES.todoMaxStake}" value="${esc(todo.stake)}"></div>
      <div class="outcomes"><div class="w"><span>Finish them all</span><b>+${win} min</b><span>for tomorrow · ${legs.length ? TO.odds.fmt(TO.odds.fromDecimal(dec)) : '—'}</span></div><div class="l"><span>Miss one</span><b>−${stake} min</b><span>from tomorrow</span></div></div>
      ${todo.error ? `<div class="form-error">${esc(todo.error)}</div>` : ''}`;
  }

  TO.actions['todo-builder'] = () => {
    todo.error = '';
    ui.sheet('todo', { tall: true, render: () => ({ title: 'To-do parlay', body: todoBody(), foot: `<button class="btn primary full" data-act="todo-place">Place to-do parlay</button>` }) });
  };
  const refreshTodo = () => ui.refreshSheet('todo', ['body']);
  TO.actions['todo-add'] = () => { todo.tasks.push({ text: '', difficulty: 'easy' }); refreshTodo(); };
  TO.actions['todo-del'] = (el) => { todo.tasks.splice(Number(el.dataset.i), 1); refreshTodo(); };
  TO.actions['todo-diff'] = (el) => { todo.tasks[Number(el.dataset.i)].difficulty = el.dataset.d; refreshTodo(); };
  TO.actions['todo-preset'] = (el) => {
    const empty = todo.tasks.find((t) => !t.text.trim());
    if (empty) { empty.text = el.dataset.t; empty.difficulty = el.dataset.d; }
    else if (todo.tasks.length < TO.RULES.maxLegs) todo.tasks.push({ text: el.dataset.t, difficulty: el.dataset.d });
    else { ui.toast({ kind: 'warn', title: `Up to ${TO.RULES.maxLegs} tasks per parlay` }); return; }
    refreshTodo();
  };
  TO.inputs['todo-stake'] = (el) => { todo.stake = el.value; };
  for (let i = 0; i < 3; i++) TO.inputs[`todo-${i}`] = (el) => { todo.tasks[i].text = el.value; };
  TO.actions['todo-place'] = () => {
    if (!TO.net.guard()) return;
    try {
      TO.state.placeTodoParlay({ tasks: todo.tasks, stake: parseInt(todo.stake, 10) });
      ui.closeSheet('todo');
      ui.toast({ kind: 'win', title: 'To-do parlay placed', msg: 'Check off each task in My Bets before midnight.' });
      todo.tasks = [{ text: '', difficulty: 'easy' }]; todo.stake = '10'; todo.error = '';
      view.tab = 'open';
      TO.app.render();
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      todo.error = e.message;
      refreshTodo();
    }
  };
  TO.actions['todo-done'] = async (el) => {
    const bet = TO.data.bets.find((b) => b.id === el.dataset.bet);
    const leg = bet && bet.legs[Number(el.dataset.i)];
    if (!leg) return;
    const ok = await ui.confirm({ title: 'Mark this task done?', body: `"${esc(leg.text)}"<br><br>TimeOut runs on the honor system for to-do parlays. You can't undo this.`, confirm: 'It\'s done' });
    if (!ok) return;
    const settled = TO.state.completeTodo(bet.id, Number(el.dataset.i));
    if (settled && settled.status === 'won') ui.toast({ kind: 'win', title: `To-do parlay won: +${settled.payout - settled.stake} min`, msg: 'Added to tomorrow\'s phone time.' });
    TO.app.render();
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — Social: friends, leaderboard, requests and teams. */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const ui = TO.ui;
  const St = TO.state;

  const view = { tab: 'board', query: '', remote: [], searching: false, searchSeq: 0 };

  // Invite links stay on this page so they open the app (phone or computer view).
  // ?invite=username is the friend link. ?join=username is accepted too, so another
  // share-link change can use either name. A team link adds team, teamName, start, end, and key.
  function friendLink(username = TO.account.username) {
    const url = new URL(`${location.origin}${location.pathname}`);
    url.searchParams.set('invite', username);
    return url.toString();
  }
  function teamLink(team) {
    const url = new URL(friendLink(team.owner || TO.account.username));
    url.searchParams.set('team', team.id);
    url.searchParams.set('teamName', team.name);
    url.searchParams.set('start', team.start);
    url.searchParams.set('end', team.end);
    if (team.shareKey) url.searchParams.set('key', team.shareKey);
    return url.toString();
  }
  const inviteLink = () => friendLink();

  const INVITE_KEY = 'timeout.invite';
  function readInvite() {
    try { return JSON.parse(sessionStorage.getItem(INVITE_KEY) || 'null'); } catch (e) { return null; }
  }
  function clearInvite() {
    try { sessionStorage.removeItem(INVITE_KEY); } catch (e) { /* private mode */ }
  }
  function captureInvite() {
    const q = new URLSearchParams(location.search);
    const invite = String(q.get('invite') || q.get('join') || '').replace(/^@/, '').trim();
    const team = String(q.get('team') || '').trim();
    if (!invite && !team) return null;
    const pending = { invite, team, teamName: q.get('teamName') || '', start: q.get('start') || '', end: q.get('end') || '', key: q.get('key') || '' };
    try { sessionStorage.setItem(INVITE_KEY, JSON.stringify(pending)); } catch (e) { /* keep going */ }
    ['invite', 'join', 'team', 'teamName', 'start', 'end', 'key'].forEach((k) => q.delete(k));
    const next = `${location.pathname}${q.toString() ? `?${q}` : ''}${location.hash}`;
    history.replaceState(null, '', next);
    return pending;
  }
  function offerInvite() {
    const p = readInvite();
    if (!p || !TO.account || !TO.data || !TO.data.onboarded) return;
    const own = p.invite && St.sameUser(p.invite, TO.account.username);
    const already = p.team && TO.data.teams.some((t) => t.id === p.team && t.members.some((m) => St.sameUser(m, TO.account.username)));
    if (own && (!p.team || already)) { clearInvite(); return; }
    if (ui.sheetOpen('invite')) return;
    const who = p.invite ? `@${esc(p.invite)}` : 'Someone';
    const joining = p.team && p.teamName;
    ui.sheet('invite', {
      render: () => ({
        title: joining ? `Join ${esc(p.teamName)}` : 'Friend link',
        body: joining
          ? `<p class="sub" style="margin-top:0">${who} invited you to <b style="color:var(--text)">${esc(p.teamName)}</b>${p.start && p.end ? `, ${esc(TO.fmtDate(TO.dayStart(p.start)))} – ${esc(TO.fmtDate(TO.dayStart(p.end)))}` : ''}. Joining also adds them as a friend. It is still screen time, not money.</p>`
          : `<p class="sub" style="margin-top:0">${who} sent you their TimeOut link. Add them as a friend to compare screen time instead of betting money.</p>`,
        foot: `<button class="btn primary full" data-act="invite-accept">${joining ? 'Add friend and join' : 'Add friend'}</button><button class="btn quiet sm" data-act="invite-dismiss">Not now</button>`,
      }),
    });
  }
  function acceptInvite() {
    const p = readInvite();
    if (!p) return;
    if (p.invite && !St.sameUser(p.invite, TO.account.username)) St.addFriend(p.invite);
    let team = null;
    if (p.team && p.teamName && p.start && p.end) {
      try { team = St.joinTeam({ id: p.team, name: p.teamName, start: p.start, end: p.end, owner: p.invite, shareKey: /^[a-f0-9]{32}$/.test(p.key) ? p.key : null, members: p.invite ? [p.invite] : [] }); }
      catch (e) {
        if (!(e instanceof TO.AppError)) throw e;
        ui.toast({ kind: 'warn', title: 'Could not join that team', msg: e.message });
      }
    }
    clearInvite();
    ui.closeSheet('invite');
    if (team) view.tab = 'teams';
    else if (p.invite) view.tab = 'board';
    TO.app.tab = 'social';
    TO.app.render();
    ui.toast({ kind: 'win', title: team ? `You joined ${team.name}` : `You and @${p.invite} are now friends` });
  }
  TO.invites = { capture: captureInvite, offer: offerInvite, friendLink, teamLink };

  function meCard() {
    const st = St.myStats();
    const wl = St.wallet();
    return `<div class="card me-card">
      ${ui.avatar(TO.account.photo, 'lg')}
      <div class="grow">
        <div class="row-s"><b style="font-size:17px">@${esc(TO.account.username)}</b></div>
        <div class="row-s" style="margin-top:5px;flex-wrap:wrap">${ui.tierBadge(wl.tier.id, true)}<span class="tiny bold ${wl.streak ? 'yellow' : 'faint'} row-s">${icon('flame', 12)}${wl.streak}-day streak</span></div>
        <div class="row" style="margin-top:8px;gap:16px"><span class="small"><b>${st.w}-${st.l}</b> <span class="muted">record</span></span><span class="small"><b class="${st.net > 0 ? 'green' : st.net < 0 ? 'red' : ''}">${TO.signedMin(st.net)}</b> <span class="muted">all time</span></span></div>
      </div>
    </div>`;
  }

  function peopleForQuery(q) {
    const query = String(q || '').trim();
    if (!query) return [];
    const me = String(TO.account.username || '').toLowerCase();
    const seen = new Set();
    const out = [];
    const push = (p) => {
      const key = String(p.username || '').toLowerCase();
      if (!key || key === me || seen.has(key)) return;
      seen.add(key);
      out.push(p);
    };
    // Demo profiles and accounts on this device already have names and photos.
    // A server row for the same username should not replace them.
    const local = St.searchPeople(query);
    const localKeys = new Set(local.map((p) => String(p.username || '').toLowerCase()));
    for (const p of view.remote) if (!localKeys.has(String(p.username || '').toLowerCase())) push(p);
    for (const p of local) push(p);
    return out.slice(0, 8);
  }

  /** A profile for someone search found on the server, or a friend who isn't a demo account on this device. */
  function personFor(username) {
    const known = St.person(username);
    if (known) return known;
    const key = String(username || '').toLowerCase();
    const hit = view.remote.find((r) => String(r.username || '').toLowerCase() === key);
    const listed = !!hit
      || TO.data.friends.some((f) => String(f).toLowerCase() === key)
      || TO.data.requestsOut.some((r) => String(r.to).toLowerCase() === key)
      || TO.data.requestsIn.some((r) => String(r.from).toLowerCase() === key);
    if (!listed) return null;
    return {
      username: hit ? hit.username : username,
      name: (hit && hit.name) || username,
      photo: (hit && hit.photo) || TO.initialsAvatar(username),
      w: 0, l: 0, net: 0, tier: 'rookie', streak: 0,
      share: { record: false, minutes: false, bets: false },
      remote: true,
    };
  }

  function searchResults() {
    const q = view.query.trim();
    if (!q) return '';
    const results = peopleForQuery(q);
    if (!results.length) {
      if (view.searching) return `<div class="note">${icon('search', 16)}<div><b style="color:var(--text)">Searching usernames…</b></div></div>`;
      return `<div class="note">${icon('search', 16)}<div><b style="color:var(--text)">No one found with the username "${esc(q)}".</b><div style="margin-top:3px">They might not be on TimeOut yet. Send them your invite link instead.</div><button class="btn xs primary" style="margin-top:8px" data-act="copy-invite">${icon('link', 14)} Copy invite link</button></div></div>`;
    }
    return `<div class="list">${results.map((p) => {
      const rel = St.relation(p.username);
      const btn = rel === 'friend' ? `<span class="tag green">Friends</span>`
        : rel === 'requested' ? `<button class="btn xs ghost" data-act="cancel-request" data-u="${esc(p.username)}">Requested</button>`
        : rel === 'incoming' ? `<button class="btn xs primary" data-act="add-friend" data-u="${esc(p.username)}">Accept</button>`
        : `<button class="btn xs primary" data-act="add-friend" data-u="${esc(p.username)}">${icon('userPlus', 14)} Add</button>`;
      const where = p.local ? ' · on this device' : p.remote ? ' · TimeOut account' : '';
      return `<div class="person-row"><button class="row grow" style="text-align:left" data-act="profile" data-u="${esc(p.username)}">${ui.avatar(p.photo || TO.initialsAvatar(p.username))}<span class="grow" style="min-width:0"><b class="ellipsis" style="display:block">@${esc(p.username)}</b><span class="small muted">${esc(p.name || '')}${where}</span></span></button>${btn}</div>`;
    }).join('')}</div>`;
  }

  function findCard() {
    return `<div class="card stack-s" style="margin:0 16px">
      <h2 style="margin:0;font-size:17px">Find friends</h2>
      <div class="input-wrap"><input class="input" id="social-search" placeholder="Search by username" value="${esc(view.query)}" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="icon-btn" style="pointer-events:none">${icon('search', 18)}</span></div>
      <div id="search-results" class="stack-s">${searchResults()}</div>
      <div class="spread small" style="margin-top:2px"><span class="muted ellipsis">Or share your invite link</span><button class="btn xs ghost" data-act="copy-invite">${icon('link', 14)} Copy link</button></div>
    </div>`;
  }

  function leaderboard() {
    if (!TO.data.friends.length) {
      return `<div class="empty">${icon('users', 40)}<h3>Keep up with your friends</h3><p>Compare screen-time records and build teams that compete for a week or a season. Add your first friend to get started.</p><button class="btn primary" data-act="copy-invite">${icon('link', 16)} Invite a friend</button><button class="btn quiet sm" data-act="focus-search">Search usernames instead</button></div>`;
    }
    const rows = St.leaderboard();
    return `<div class="stack-s pad"><div class="spread"><span class="eyebrow">Leaderboard · minutes won or lost</span><button class="link-btn tiny" data-act="settings" data-section="privacy">What friends see</button></div>
      <div class="list">${rows.map((r, i) => `<button class="lb-row ${r.me ? 'me' : ''}" data-act="profile" data-u="${esc(r.username)}">
        <span class="rk">${r.share.minutes ? i + 1 : '–'}</span>${ui.avatar(r.photo)}
        <span style="min-width:0"><span class="nm ellipsis" style="display:block">${r.me ? 'You' : `@${esc(r.username)}`}</span><span class="sub">${ui.tierBadge(r.tier, true)}${r.share.record ? `<span>${r.w}-${r.l}</span>` : '<span>Record private</span>'}${r.streak ? `<span class="yellow row-s">${icon('flame', 11)}${r.streak}</span>` : ''}</span></span>
        <span class="val">${r.share.minutes ? `<span class="${r.net > 0 ? 'green' : r.net < 0 ? 'red' : ''}">${TO.signed(r.net)}</span><small>min</small>` : `<span class="faint" style="font-size:14px">Private</span>`}</span>
      </button>`).join('')}</div>
      <div class="tiny faint">Friends only show the stats they've chosen to share.</div></div>`;
  }

  function requests() {
    const d = TO.data;
    const parts = [];
    if (d.requestsIn.length) {
      parts.push(`<div class="eyebrow">Friend requests</div><div class="list">${d.requestsIn.map((r) => {
        const p = St.person(r.from);
        return `<div class="person-row">${ui.avatar(p ? p.photo : TO.initialsAvatar(r.from))}<div class="grow"><b>@${esc(r.from)}</b><div class="tiny faint">${p && p.name && p.name !== r.from ? `${esc(p.name)} · ` : ''}Received ${TO.ago(r.at)}</div></div><button class="btn xs ghost" data-act="decline-fr" data-id="${r.id}">Decline</button><button class="btn xs primary" data-act="accept-fr" data-id="${r.id}">Accept</button></div>`;
      }).join('')}</div>`);
    }
    if (d.requestsOut.length) {
      parts.push(`<div class="eyebrow">Sent requests</div><div class="list">${d.requestsOut.map((r) => {
        const p = St.person(r.to);
        const wait = St.resendWait(r);
        const resend = wait
          ? `<button class="btn xs ghost" disabled title="You can send it again in ${TO.fmtIn(wait)}">${icon('check', 13)} Sent</button>`
          : `<button class="btn xs primary" data-act="resend-request" data-u="${esc(r.to)}">${icon('refresh', 13)} Send again</button>`;
        return `<div class="person-row">${ui.avatar(p ? p.photo : TO.initialsAvatar(r.to))}<div class="grow" style="min-width:0"><b>@${esc(r.to)}</b><div class="tiny faint">Sent ${TO.ago(r.at)} · ${wait ? `send again in ${TO.fmtIn(wait)}` : 'waiting for them to accept'}</div></div><div class="row-s">${resend}<button class="btn xs quiet" data-act="cancel-request" data-u="${esc(r.to)}">Cancel</button></div></div>`;
      }).join('')}</div>`);
    }
    if (!parts.length) return `<div class="empty">${icon('bell', 36)}<h3>You're all caught up</h3><p>Friend requests show up here.</p></div>`;
    return `<div class="stack-s pad">${parts.join('')}</div>`;
  }

  function teams() {
    const list = TO.data.teams;
    const cards = list.map((t) => {
      const status = St.teamStatus(t);
      const standings = St.teamStandings(t);
      const myPlace = standings.findIndex((s) => s.me);
      const statusTag = status === 'active' ? `<span class="tag green">Ends in ${TO.fmtIn(TO.dayStart(t.end) + TO.DAY - TO.now())}</span>` : status === 'upcoming' ? `<span class="tag blue">Starts ${TO.fmtDate(TO.dayStart(t.start))}</span>` : '<span class="tag">Ended</span>';
      const rankLine = status !== 'upcoming' && standings.length && myPlace >= 0
        ? `<div class="small">You're <b>${TO.ordinal(myPlace + 1)}</b> of ${standings.length} · leader <b>${standings[0].me ? 'you' : `@${esc(standings[0].username)}`}</b></div>`
        : '';
      return `<button class="card team-card tappable" style="text-align:left" data-act="team" data-id="${t.id}">
        <div class="spread"><b style="font-size:16px">${esc(t.name)}</b>${statusTag}</div>
        <div class="spread small muted"><span>${TO.fmtDate(TO.dayStart(t.start))} – ${TO.fmtDate(TO.dayStart(t.end))} · ${t.members.length} members</span><span class="avatars">${standings.slice(0, 5).map((s) => `<img src="${esc(s.photo)}" alt="">`).join('')}</span></div>
        ${rankLine}
      </button>`;
    }).join('');
    return `<div class="stack-s pad">
      <div class="small muted">Teams compete over the dates you pick. Whoever wins the most minutes in that stretch tops the team.</div>
      <div class="row-s" style="flex-wrap:wrap"><button class="btn primary sm" data-act="team-new">${icon('plus', 16)} Create a team</button><button class="btn ghost sm" data-act="team-how">${icon('info', 16)} How teams work</button></div>
      ${cards || `<div class="empty">${icon('trophy', 36)}<h3>No teams yet</h3><p>Start one with a few friends and pick a start and end date.</p></div>`}
    </div>`;
  }

  function render() {
    const d = TO.data;
    const reqCount = d.requestsIn.length;
    const tab = (k, label, n) => `<button class="${view.tab === k ? 'on' : ''}" data-act="social-tab" data-t="${k}">${label}${n ? ` <span class="count-pill" style="background:var(--live);color:#fff">${n}</span>` : ''}</button>`;
    let body;
    if (view.tab === 'requests') body = requests();
    else if (view.tab === 'teams') body = teams();
    else body = leaderboard();
    return `<div class="page-head"><h1>Social</h1><p>Compete with friends: compare screen-time records and join teams.</p></div>
      <div class="stack social-cols">
        <div class="stack social-side">
          ${meCard()}
          ${findCard()}
        </div>
        <div class="stack social-main">
          <div class="pad"><div class="seg">${tab('board', 'Friends')}${tab('requests', 'Requests', reqCount)}${tab('teams', 'Teams')}</div></div>
          ${body}
        </div>
      </div>`;
  }

  TO.views.social = { render, view, badge: () => TO.data.requestsIn.length };

  // ---------- Profile sheet ----------
  function profile(username) {
    const isMe = username === TO.account.username;
    ui.sheet('profile', {
      render: () => {
        const p = isMe ? null : personFor(username);
        if (!isMe && !p) return { title: 'Profile', body: '<div class="muted">This person could not be found.</div>' };
        const rel = isMe ? 'me' : St.relation(username);
        const st = isMe ? St.myStats() : null;
        const share = isMe ? { record: true, minutes: true, bets: true } : p.share;
        const showAll = isMe || rel === 'friend';
        const rec = isMe ? `${st.w}-${st.l}` : `${p.w}-${p.l}`;
        const net = isMe ? st.net : p.net;
        const tierId = isMe ? St.wallet().tier.id : p.tier;
        const streak = isMe ? St.wallet().streak : p.streak;
        const picks = !isMe && showAll ? St.sharedPicks(p) : [];
        const stat = (label, val, ok) => `<div><b>${ok ? val : '<span class="faint" style="font-size:16px">Private</span>'}</b><span>${label}</span></div>`;
        let actions = '';
        if (rel === 'friend') actions = `<button class="btn quiet sm" data-act="remove-friend" data-u="${esc(username)}">Remove friend</button>`;
        else if (rel === 'requested') actions = `<button class="btn ghost full" data-act="cancel-request" data-u="${esc(username)}">Friend request sent · Cancel</button>`;
        else if (rel === 'incoming' || rel === 'none') actions = `<button class="btn primary full" data-act="add-friend" data-u="${esc(username)}">${icon('userPlus', 18)} ${rel === 'incoming' ? 'Accept friend request' : 'Add friend'}</button>`;
        return {
          title: isMe ? 'Your profile' : `@${esc(username)}`,
          body: `<div class="row" style="gap:14px">${ui.avatar(isMe ? TO.account.photo : p.photo, 'xl')}<div><div style="font-size:20px;font-weight:800">${isMe ? `@${esc(username)}` : esc(p.name)}</div>${isMe ? '' : `<div class="muted small">@${esc(username)}</div>`}<div class="row-s" style="margin-top:8px">${ui.tierBadge(tierId, true)}${streak ? `<span class="tiny bold yellow row-s">${icon('flame', 12)}${streak}-day streak</span>` : ''}</div></div></div>
            ${showAll ? `<div class="record-big">${stat('Record', rec, share.record)}${stat('Minutes won/lost', `<span class="${net > 0 ? 'green' : net < 0 ? 'red' : ''}">${TO.signed(net)}</span>`, share.minutes)}${stat('Clean streak', `${streak}d`, true)}</div>` : `<div class="note">${icon('lock', 16)}<span>Add @${esc(username)} as a friend to see their stats.</span></div>`}
            ${!isMe && showAll ? (share.bets ? `<div class="stack-s"><div class="eyebrow">Open bets they're sharing</div>${picks.length ? picks.map((k) => `<div class="card tight spread"><div><b>${esc(k.label)}</b><div class="small muted">${esc(k.matchup)}</div></div><div style="text-align:right"><div class="display green" style="font-size:18px">${TO.odds.fmt(k.price)}</div><div class="tiny faint">${k.stake} min</div></div></div>`).join('') : '<div class="small muted">No open bets right now.</div>'}</div>` : `<div class="small muted">${esc(p.name)} keeps their open bets private.</div>`) : ''}
            ${isMe ? `<button class="btn ghost sm" data-act="settings" data-section="privacy">${icon('eye', 16)} Choose what friends can see</button>` : ''}`,
          foot: isMe ? '' : actions,
        };
      },
    });
  }

  // ---------- Team sheets ----------
  function teamSheet(id) {
    ui.sheet('team', {
      tall: true,
      render: () => {
        const t = TO.data.teams.find((x) => x.id === id);
        if (!t) return { title: 'Team', body: '' };
        const status = St.teamStatus(t);
        const rows = St.teamStandings(t);
        const invitable = TO.data.friends.filter((f) => !t.members.some((m) => St.sameUser(m, f)));
        const owner = St.sameUser(t.owner, TO.account.username) ? 'You own this team' : `Owned by @${esc(t.owner)}`;
        return {
          title: esc(t.name),
          body: `<div class="spread small muted"><span class="row-s">${icon('calendar', 14)} ${TO.fmtDate(TO.dayStart(t.start))} – ${TO.fmtDate(TO.dayStart(t.end))}</span><span>${status === 'active' ? `Ends in ${TO.fmtIn(TO.dayStart(t.end) + TO.DAY - TO.now())}` : status === 'upcoming' ? `Starts in ${TO.fmtIn(TO.dayStart(t.start) - TO.now())}` : 'Ended'}</span></div>
            <div class="small muted">${owner} · ${t.members.length} on the roster</div>
            <div class="list">${rows.map((r, i) => `<div class="lb-row ${r.me ? 'me' : ''}"><span class="rk">${r.hidden ? '–' : i + 1}</span>${ui.avatar(r.photo)}<span><span class="nm">${r.me ? 'You' : `@${esc(r.username)}`}</span><span class="sub">${r.w}-${r.l} during this team</span></span><span class="val">${r.hidden ? '<span class="faint" style="font-size:14px">Private</span>' : `<span class="${r.net > 0 ? 'green' : r.net < 0 ? 'red' : ''}">${TO.signed(r.net)}</span><small>min</small>`}</span></div>`).join('')}</div>
            <div class="tiny faint">Standings count screen-time bets placed between the start and end dates. Friend bets don't count.</div>
            ${invitable.length ? `<div class="field"><span class="label">Invite more friends</span><div class="pick-friends">${invitable.map((u) => { const p = personFor(u); return p ? `<button class="pick-friend" data-act="team-invite" data-id="${t.id}" data-u="${esc(u)}"><img src="${esc(p.photo)}" alt="">${icon('plus', 14)} ${esc(u)}</button>` : ''; }).join('')}</div></div>` : ''}`,
          foot: `<button class="btn ghost sm" data-act="copy-team" data-id="${t.id}">${icon('link', 16)} Copy team link</button><button class="btn quiet sm" data-act="team-leave" data-id="${t.id}">Leave team</button>`,
        };
      },
    });
  }

  function teamHow() {
    ui.sheet('team-how', {
      render: () => ({
        title: 'How teams work',
        body: `<p class="sub" style="margin-top:0">Teams are how friends compete here without betting money. TimeOut puts screen time on the line instead of cash, and a team is the stretch of days you compare.</p>
          <div class="how-card"><span class="n">1</span><div><h3>Pick a name and the dates</h3><p>Create a team for a week or a season. You can start it on your own and invite people later.</p></div></div>
          <div class="how-card"><span class="n">2</span><div><h3>Minutes decide the standings</h3><p>Between the start and end dates, screen-time bets count. Whoever comes out ahead on minutes leads. A side bet with a friend does not count.</p></div></div>
          <div class="how-card"><span class="n">3</span><div><h3>Invite friends onto the roster</h3><p>Open the team and add a friend, or copy the team link. When they open it, you become friends and they join the roster.</p></div></div>
          <div class="how-card"><span class="n">4</span><div><h3>Leave whenever you want</h3><p>Leaving takes you off the standings. The team stays for everyone else.</p></div></div>
          <div class="tiny faint">The team is saved in this browser. When this page can reach the TimeOut server, the roster is saved there too, one member at a time, so it is still here the next time you open the app.</div>`,
        foot: `<button class="btn primary full" data-act="close-sheet" data-name="team-how">Got it</button>`,
      }),
    });
  }

  const draft = { name: '', start: '', end: '', members: [], errors: {} };
  function newTeamSheet() {
    Object.assign(draft, { name: '', start: TO.dayKey(), end: TO.addDays(TO.dayKey(), 7), members: [], errors: {} });
    ui.sheet('team-new', {
      tall: true,
      render: () => ({
        title: 'Create a team',
        body: `${ui.field({ id: 'team-name', label: 'Team name', value: draft.name, placeholder: 'Sunday Squad', err: draft.errors.name, attrs: 'maxlength="30"' })}
          <div class="row" style="align-items:flex-start">${`<div class="grow">${ui.field({ id: 'team-start', label: 'Start date', type: 'date', value: draft.start, err: draft.errors.start })}</div><div class="grow">${ui.field({ id: 'team-end', label: 'End date', type: 'date', value: draft.end, err: draft.errors.end })}</div>`}</div>
          <div class="field"><span class="label">Invite friends</span>${TO.data.friends.length ? `<div class="pick-friends">${TO.data.friends.map((u) => { const p = St.person(u); return p ? `<button class="pick-friend ${draft.members.includes(u) ? 'on' : ''}" data-act="team-pick" data-u="${esc(u)}"><img src="${esc(p.photo)}" alt="">${esc(u)}</button>` : ''; }).join('')}</div>` : '<div class="note">No friends yet. You can still create the team and invite people later.</div>'}${draft.errors.members ? `<div class="err">${esc(draft.errors.members)}</div>` : ''}</div>`,
        foot: `<button class="btn primary full" data-act="team-create">Create team</button>`,
      }),
    });
  }

  // ---------- Actions ----------
  const A = TO.actions;
  A['social-tab'] = (el) => { view.tab = el.dataset.t; TO.app.render(); if (view.tab === 'teams') St.refreshTeams(); };
  A.profile = (el) => profile(el.dataset.u);
  A['copy-invite'] = async () => {
    const ok = await ui.copy(inviteLink());
    ui.toast({ kind: ok ? 'win' : 'info', title: ok ? 'Invite link copied' : 'Your invite link', msg: ok ? inviteLink() : `Copy this: ${inviteLink()}`, ms: 5000 });
  };
  A['focus-search'] = () => { const i = document.getElementById('social-search'); if (i) i.focus(); };
  A['add-friend'] = (el) => {
    const u = el.dataset.u;
    const rel = St.relation(u);
    St.sendFriendRequest(u);
    ui.toast({ kind: 'win', title: rel === 'incoming' ? `You and @${u} are now friends` : `Friend request sent to @${u}` });
    rerender();
  };
  A['cancel-request'] = (el) => { St.cancelFriendRequest(el.dataset.u); rerender(); };
  A['resend-request'] = (el) => {
    try {
      St.resendFriendRequest(el.dataset.u);
      ui.toast({ kind: 'win', title: `Request sent again to @${el.dataset.u}`, msg: 'You can send another one in an hour.' });
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      ui.toast({ kind: 'warn', title: 'Not yet', msg: e.message });
    }
    rerender();
  };
  A['accept-fr'] = (el) => { const r = TO.data.requestsIn.find((x) => x.id === el.dataset.id); St.acceptFriendRequest(el.dataset.id); if (r) ui.toast({ kind: 'win', title: `You and @${r.from} are now friends` }); TO.app.render(); };
  A['decline-fr'] = (el) => { St.declineFriendRequest(el.dataset.id); TO.app.render(); };
  A['remove-friend'] = async (el) => {
    const u = el.dataset.u;
    if (!(await ui.confirm({ title: `Remove @${esc(u)}?`, body: 'You can add them again later.', confirm: 'Remove', danger: true }))) return;
    St.removeFriend(u);
    ui.closeSheet('profile');
    TO.app.render();
  };
  A['goto-social'] = () => { ui.closeAllSheets(); ui.closeAllPages(); TO.app.go('social'); };
  A.team = (el) => { teamSheet(el.dataset.id); St.refreshTeams(); };
  A['team-new'] = () => newTeamSheet();
  A['team-how'] = () => teamHow();
  A['team-pick'] = (el) => {
    const u = el.dataset.u;
    draft.members = draft.members.includes(u) ? draft.members.filter((x) => x !== u) : [...draft.members, u];
    el.classList.toggle('on');
  };
  A['team-create'] = () => {
    const nameEl = document.getElementById('team-name');
    const startEl = document.getElementById('team-start');
    const endEl = document.getElementById('team-end');
    if (!nameEl || !startEl || !endEl) return;
    draft.name = nameEl.value;
    draft.start = startEl.value;
    draft.end = endEl.value;
    try {
      const t = St.createTeam(draft);
      ui.closeSheet('team-new');
      const invited = t.members.length - 1;
      ui.toast({ kind: 'win', title: `${t.name} created`, msg: invited ? `${invited} friend${invited === 1 ? '' : 's'} invited.` : 'You can invite friends from the team.' });
      view.tab = 'teams';
      TO.app.render();
    } catch (e) {
      if (!(e instanceof TO.AppError)) throw e;
      draft.errors = e.fields || {};
      ui.refreshSheet('team-new', ['body']);
    }
  };
  A['team-invite'] = (el) => { St.inviteToTeam(el.dataset.id, [el.dataset.u]); ui.toast({ kind: 'win', title: `Invited @${el.dataset.u}` }); ui.refreshSheet('team'); TO.app.render(); };
  A['copy-team'] = async (el) => {
    const t = TO.data.teams.find((x) => x.id === el.dataset.id);
    if (!t) return;
    St.ensureTeamKey(t);
    const link = teamLink(t);
    const ok = await ui.copy(link);
    ui.toast({ kind: ok ? 'win' : 'info', title: ok ? 'Team link copied' : 'Team link', msg: ok ? link : `Copy this: ${link}`, ms: 5000 });
  };
  A['invite-accept'] = () => acceptInvite();
  A['invite-dismiss'] = () => { clearInvite(); ui.closeSheet('invite'); };
  A['team-leave'] = async (el) => {
    if (!(await ui.confirm({ title: 'Leave this team?', body: 'Your results stop counting toward its standings.', confirm: 'Leave team', danger: true }))) return;
    St.leaveTeam(el.dataset.id);
    ui.closeSheet('team');
    TO.app.render();
  };

  function rerender() {
    TO.app.render();
    if (ui.sheetOpen('profile')) ui.refreshSheet('profile');
  }

  TO.inputs['social-search'] = (el) => {
    view.query = el.value;
    view.remote = [];
    const seq = ++view.searchSeq;
    const q = el.value.trim();
    view.searching = !!q && typeof TO.api.searchUsers === 'function';
    const paint = () => {
      if (seq !== view.searchSeq) return;
      const box = document.getElementById('search-results');
      if (box) box.innerHTML = searchResults();
    };
    paint();
    if (!q || !view.searching) {
      return;
    }
    TO.api.searchUsers(q).then((rows) => {
      if (seq !== view.searchSeq) return;
      view.searching = false;
      view.remote = (rows || []).map((r) => ({
        username: r.username,
        name: r.name || r.username,
        photo: r.photo || TO.initialsAvatar(r.username),
        remote: true,
      }));
      paint();
    }).catch(() => {
      if (seq !== view.searchSeq) return;
      view.searching = false;
      paint();
    });
  };
})(window.TO);

</script>
<script>
/* TimeOut web demo — menu drawer and Screentime & Settings (Screen 7). */
(function (TO) {
  'use strict';
  const { esc, icon } = TO;
  const S = TO.sim;
  const ui = TO.ui;
  const St = TO.state;

  const SECTIONS = {
    screentime: { title: 'Screen time', icon: 'hourglass' },
    races: { title: 'Virtual Racing', icon: 'target' },
    status: { title: 'Tier & streak', icon: 'trophy' },
    sports: { title: 'Sports on Home', icon: 'grid' },
    notifications: { title: 'Notifications', icon: 'bell' },
    privacy: { title: 'What friends can see', icon: 'eye' },
    account: { title: 'Account', icon: 'user' },
  };

  // ---------- Drawer ----------
  function openDrawer() {
    closeDrawer();
    const wl = St.wallet();
    const wrap = document.createElement('div');
    wrap.dataset.drawer = '1';
    wrap.style.cssText = 'position:absolute;inset:0';
    const item = (key, sub) => `<button class="dn" data-act="settings" data-section="${key}">${icon(SECTIONS[key].icon, 20)}${SECTIONS[key].title}${sub ? `<span class="sub">${sub}</span>` : ''}</button>`;
    wrap.innerHTML = `<div class="scrim" data-act="close-drawer"></div><aside class="drawer" aria-label="Menu">
      <div class="drawer-head">${ui.avatar(TO.account.photo, 'lg')}<div class="grow" style="min-width:0"><b class="ellipsis" style="display:block;font-size:17px">@${esc(TO.account.username)}</b><div class="small muted ellipsis">${esc(TO.account.email)}</div>${TO.account.server ? `<div class="tiny faint ellipsis">Login #${TO.account.server.loginCount} · from the database</div>` : ''}<div style="margin-top:6px">${ui.tierBadge(wl.tier.id, true)}</div></div></div>
      <nav>
        ${item('screentime', `${wl.phoneLeft} min left`)}
        ${item('races')}
        ${item('status', wl.streak ? `${wl.streak}-day streak` : '')}
        ${item('sports')}
        ${item('notifications')}
        ${item('privacy')}
        ${item('account')}
        <button class="dn" data-act="how">${icon('help', 20)}How TimeOut works</button>
        <button class="dn" data-act="logout">${icon('logout', 20)}Log out</button>
      </nav></aside>`;
    ui.layer().appendChild(wrap);
  }
  function closeDrawer() { ui.layer().querySelectorAll('[data-drawer]').forEach((d) => d.remove()); }

  // ---------- Sections ----------
  const listRow = (ic, title, sub, right, attrs = '') => `<label class="list-row" ${attrs}><span class="lr-icon">${icon(ic, 17)}</span><span class="lr-main"><div class="lr-title">${title}</div>${sub ? `<div class="lr-sub">${sub}</div>` : ''}</span>${right}</label>`;
  const brow = (label, value, cls = '') => `<div class="spread small"><span class="muted">${label}</span><b class="num ${cls}">${value}</b></div>`;

  function screentime() {
    const wl = St.wallet();
    const s = TO.data.settings;
    const usedPct = Math.min(100, (wl.used / Math.max(wl.todayLimit, 1)) * 100);
    const overridesLeft = TO.RULES.maxOverrides - wl.overridesUsed;
    return `
      <div class="card stack-s">
        <h2 style="margin:0;font-size:17px">How your screen time works</h2>
        <div class="how-card"><span class="n">1</span><div><h3>${TO.RULES.daily} betting minutes a day</h3><p>Your betting balance starts at ${TO.RULES.daily} minutes${wl.tier.bonus ? ` (plus ${wl.tier.bonus} from your ${esc(wl.tier.title)} tier)` : ''} and resets at midnight, your local time.</p></div></div>
        <div class="how-card"><span class="n">2</span><div><h3>You bet tomorrow's phone time</h3><p>Every minute you win is added to tomorrow's limit. Every minute you lose comes off it.</p></div></div>
        <div class="how-card"><span class="n">3</span><div><h3>The math</h3><p>Tomorrow's limit = ${TO.RULES.daily} min + today's bet results − emergency unlock penalties.</p></div></div>
      </div>

      <div class="card stack-s">
        <div class="spread"><h2 style="margin:0;font-size:17px">Today</h2><span class="tiny faint bold">Resets in ${ui.countdownEl(TO.nextMidnight())}</span></div>
        ${brow('Base limit', `${TO.RULES.daily} min`)}
        ${brow("Yesterday's bets", TO.signedMin(wl.yesterdayNet), wl.yesterdayNet > 0 ? 'green' : wl.yesterdayNet < 0 ? 'red' : '')}
        ${wl.penaltyToday ? brow('Emergency unlock penalty', `−${wl.penaltyToday} min`, 'red') : ''}
        ${s.minLimit && TO.RULES.daily + wl.yesterdayNet - wl.penaltyToday < s.minLimit ? brow('Raised to your minimum', `${s.minLimit} min`) : ''}
        ${wl.emergencyToday ? brow('Emergency unlocks used', `+${wl.emergencyToday} min`, 'yellow') : ''}
        <hr class="divider">
        ${brow('Phone time allowed today', `${wl.todayLimit} min`)}
        <div class="bar" style="height:8px"><i style="width:${usedPct}%;background:${wl.appsLocked ? 'var(--loss)' : usedPct > 80 ? 'var(--warn)' : 'var(--accent)'}"></i></div>
        <div class="spread tiny bold"><span class="muted">${wl.used} min used on locked apps</span><span class="${wl.appsLocked ? 'red' : ''}">${s.enforce ? `${wl.phoneLeft} min left` : 'Limits are off'}</span></div>
      </div>

      <div class="card stack-s">
        <h2 style="margin:0;font-size:17px">Tomorrow, so far</h2>
        ${brow('Base limit', `${TO.RULES.daily} min`)}
        ${brow("Today's settled bets", TO.signedMin(wl.todayNet), wl.todayNet > 0 ? 'green' : wl.todayNet < 0 ? 'red' : '')}
        ${wl.penaltyTomorrow ? brow('Emergency unlock penalty', `−${wl.penaltyTomorrow} min`, 'red') : ''}
        <hr class="divider">
        ${brow("Tomorrow's phone time", `${wl.tomorrowLimit} min`, wl.tomorrowLimit > TO.RULES.daily ? 'green' : wl.tomorrowLimit < TO.RULES.daily ? 'red' : '')}
        ${wl.atRisk ? `<div class="tiny faint">${wl.atRisk} min in open bets will change this when they settle.</div>` : ''}
      </div>

      <div class="card stack-s" style="border-color:rgba(255,201,64,.35)">
        <div class="row"><span class="lr-icon" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)">${icon('unlock', 18)}</span><div class="grow"><h2 style="margin:0;font-size:17px">Emergency unlock</h2><div class="small muted">${overridesLeft} of ${TO.RULES.maxOverrides} left today</div></div></div>
        <div class="small muted">Need your phone right now? Get ${TO.RULES.overrideMinutes} more minutes today. It costs ${TO.RULES.overridePenalty} minutes from tomorrow's limit and resets your clean streak.</div>
        <button class="btn warn" data-act="emergency" ${overridesLeft > 0 ? '' : 'disabled'}>${overridesLeft > 0 ? `Unlock ${TO.RULES.overrideMinutes} minutes now` : 'No unlocks left today'}</button>
      </div>

      <div class="stack-s">
        <div class="eyebrow">Controls</div>
        <div class="list">
          ${listRow('shield', 'Enforce app limits', s.lockedApps.length ? 'Blocks your locked apps when today\'s phone time runs out' : '<span class="yellow">Lock at least one app or site below to turn this on</span>', ui.switchEl('set-enforce', s.enforce && s.lockedApps.length > 0, 'data-change="set-enforce"'), 'for="set-enforce"')}
          <button class="list-row" data-act="locked-apps"><span class="lr-icon">${icon('lock', 17)}</span><span class="lr-main"><div class="lr-title">Locked apps & sites</div><div class="lr-sub">${s.lockedApps.length} locked · ${St.lockPoints()} lock points</div></span>${icon('chevR', 18, 'chev')}</button>
          <div class="list-row" style="flex-wrap:wrap"><span class="lr-icon">${icon('clock', 17)}</span><span class="lr-main"><div class="lr-title">Minimum phone time per day</div><div class="lr-sub">Losses can't push your limit below this</div></span><div class="seg" style="width:100%;margin-top:4px">${[0, 15, 30].map((v) => `<button class="${s.minLimit === v ? 'on' : ''}" data-act="set-minlimit" data-v="${v}">${v ? `${v} min` : 'None'}</button>`).join('')}</div></div>
          <div class="list-row" style="flex-wrap:wrap"><span class="lr-icon">${icon('bell', 17)}</span><span class="lr-main"><div class="lr-title">Warn me when phone time is low</div><div class="lr-sub">Shows a heads-up before apps lock</div></span><div class="seg" style="width:100%;margin-top:4px">${[5, 10, 15].map((v) => `<button class="${s.lowWarn === v ? 'on' : ''}" data-act="set-lowwarn" data-v="${v}">${v} min left</button>`).join('')}</div></div>
        </div>
        <div class="tiny faint">Changes to limits ask you to confirm first, so nothing changes by accident.</div>
      </div>`;
  }

  function status() {
    const wl = St.wallet();
    const t = wl.tier;
    const next = St.TIERS[St.TIERS.indexOf(t) + 1];
    const ladder = St.TIERS.slice(1).map((r) => {
      const reached = St.TIERS.indexOf(t) >= St.TIERS.indexOf(r);
      return `<div class="row" style="align-items:flex-start"><span style="color:${reached ? r.color : 'var(--muted)'};margin-top:1px">${icon(reached ? 'check' : r.icon, 18)}</span><div class="grow"><div class="row-s"><b style="${reached ? '' : 'color:var(--text-2)'}">${esc(r.title)}</b><span class="tiny faint bold">${r.min}+ pts</span></div><div class="small ${reached ? 'muted' : 'faint'}">${St.tierPerks(r).join(' · ')}</div></div></div>`;
    }).join('');
    const ms = St.nextStreakMilestone(wl.streak);
    return `<div class="card stack">
        <div class="spread"><h2 style="margin:0;font-size:17px">Your tier</h2>${ui.tierBadge(t.id)}</div>
        ${next ? `<div class="stack-s"><div class="spread small"><b>${wl.points} lock point${wl.points === 1 ? '' : 's'}</b><span class="muted">${next.min - wl.points} more for ${esc(next.title)}</span></div><div class="bar"><i style="width:${Math.min(100, ((wl.points - t.min) / (next.min - t.min)) * 100)}%;background:${next.color}"></i></div></div>` : `<div class="bold" style="color:${t.color}">Top tier. ${wl.points} lock points.</div>`}
