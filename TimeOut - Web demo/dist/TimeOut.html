    },
    ncaaf: {
      id: 'ncaaf', title: 'College Football', short: 'NCAAF', sport: 'football', offset: 15 * MIN, stagger: 3 * MIN, perSlot: 2, gp: 5,
      teams: [t('BYU', 'Cougars', 'BYU', '#002E5D'), t('UTAH', 'Utes', 'Utah', '#CC0000'), t('ALA', 'Crimson Tide', 'Alabama', '#9E1B32'), t('UGA', 'Bulldogs', 'Georgia', '#BA0C2F'), t('OSU', 'Buckeyes', 'Ohio State', '#BB0000'), t('MICH', 'Wolverines', 'Michigan', '#00274C'), t('TEX', 'Longhorns', 'Texas', '#BF5700'), t('ORE', 'Ducks', 'Oregon', '#154733'), t('USC', 'Trojans', 'USC', '#990000'), t('ND', 'Fighting Irish', 'Notre Dame', '#0C2340')],
    },
    nba: {
      id: 'nba', title: 'NBA', short: 'NBA', sport: 'basketball', offset: 3 * MIN, stagger: 4 * MIN, perSlot: 2, gp: 12,
      teams: [t('BOS', 'Celtics', 'Boston', '#007A33'), t('LAL', 'Lakers', 'Los Angeles', '#552583'), t('GSW', 'Warriors', 'Golden State', '#1D428A'), t('DEN', 'Nuggets', 'Denver', '#0E2240'), t('MIL', 'Bucks', 'Milwaukee', '#00471B'), t('PHX', 'Suns', 'Phoenix', '#1D1160'), t('MIA', 'Heat', 'Miami', '#98002E'), t('NYK', 'Knicks', 'New York', '#F58426'), t('DAL', 'Mavericks', 'Dallas', '#00538C'), t('OKC', 'Thunder', 'Oklahoma City', '#007AC1'), t('UTA', 'Jazz', 'Utah', '#4B2A8E'), t('MIN', 'Timberwolves', 'Minnesota', '#236192')],
    },
    mlb: {
      id: 'mlb', title: 'MLB', short: 'MLB', sport: 'baseball', offset: 6 * MIN, stagger: 4 * MIN, perSlot: 2, gp: 158,
      teams: [t('NYY', 'Yankees', 'New York', '#0C2340'), t('LAD', 'Dodgers', 'Los Angeles', '#005A9C'), t('ATL', 'Braves', 'Atlanta', '#CE1141'), t('HOU', 'Astros', 'Houston', '#EB6E1F'), t('CHC', 'Cubs', 'Chicago', '#0E3386'), t('BOS', 'Red Sox', 'Boston', '#BD3039'), t('SEA', 'Mariners', 'Seattle', '#005C5C'), t('SD', 'Padres', 'San Diego', '#7A5C3A'), t('PHI', 'Phillies', 'Philadelphia', '#E81828'), t('TOR', 'Blue Jays', 'Toronto', '#134A8E')],
    },
    nhl: {
      id: 'nhl', title: 'NHL', short: 'NHL', sport: 'hockey', offset: 9 * MIN, stagger: 4 * MIN, perSlot: 2, gp: 8,
      teams: [t('COL', 'Avalanche', 'Colorado', '#6F263D'), t('VGK', 'Golden Knights', 'Vegas', '#8C7650'), t('EDM', 'Oilers', 'Edmonton', '#FF4C00'), t('TOR', 'Maple Leafs', 'Toronto', '#00205B'), t('BOS', 'Bruins', 'Boston', '#A87D00'), t('NYR', 'Rangers', 'New York', '#0038A8'), t('TBL', 'Lightning', 'Tampa Bay', '#002868'), t('FLA', 'Panthers', 'Florida', '#C8102E'), t('DAL', 'Stars', 'Dallas', '#006847'), t('CAR', 'Hurricanes', 'Carolina', '#CC0000')],
    },
    epl: {
      id: 'epl', title: 'Premier League', short: 'EPL', sport: 'soccer', offset: 12 * MIN, stagger: 4 * MIN, perSlot: 2, gp: 6,
      teams: [t('ARS', 'Arsenal', 'London', '#EF0107'), t('MCI', 'Man City', 'Manchester', '#4A90C8'), t('LIV', 'Liverpool', 'Liverpool', '#C8102E'), t('CHE', 'Chelsea', 'London', '#034694'), t('MUN', 'Man United', 'Manchester', '#DA291C'), t('TOT', 'Tottenham', 'London', '#132257'), t('NEW', 'Newcastle', 'Newcastle', '#3A3A3A'), t('AVL', 'Aston Villa', 'Birmingham', '#670E36')],
    },
    sim: {
      id: 'sim', title: 'Sim League', short: 'SIM', sport: 'basketball', offset: 1 * MIN, stagger: 6 * MIN, perSlot: 3, gp: 20, simulated: true,
      teams: [t('NCV', 'Volts', 'Neon City', '#00B8D4'), t('HBK', 'Kraken', 'Harbor', '#1E5EB8'), t('DSC', 'Scorpions', 'Desert', '#E09A00'), t('SMY', 'Yetis', 'Summit', '#7E8CC7'), t('BYG', 'Gators', 'Bayou', '#2E7D32'), t('MTC', 'Comets', 'Metro', '#D93A3A'), t('PRS', 'Storm', 'Prairie', '#8E3FB5'), t('IBA', 'Anchors', 'Iron Bay', '#4F6572')],
    },
  };
  const REAL_LEAGUES = ['nfl', 'ncaaf', 'nba', 'mlb', 'nhl', 'epl'];
  const LEAGUE_ORDER = ['nfl', 'ncaaf', 'nba', 'mlb', 'nhl', 'epl', 'sim'];

  const strength = (league, team) => 0.9 * TO.unit(`str-${league}-${team.abbr}`);

  function record(league, team) {
    const L = LEAGUES[league];
    const s = strength(league, team);
    const gp = L.gp;
    if (L.sport === 'soccer') {
      const w = TO.clamp(Math.round(gp * (0.42 + 0.3 * s) + TO.unit(`rw-${team.abbr}`)), 0, gp);
      const d = TO.clamp(Math.round((gp - w) * 0.35), 0, gp - w);
      return `${w}-${d}-${gp - w - d}`;
    }
    const w = TO.clamp(Math.round(gp * (0.5 + 0.3 * s) + 1.2 * TO.unit(`rw-${league}-${team.abbr}`)), 0, gp);
    return `${w}-${gp - w}`;
  }

  function form(league, team) {
    const s = strength(league, team);
    return Array.from({ length: 5 }, (_, i) => (TO.u01(`form-${league}-${team.abbr}-${i}`) < 0.5 + 0.3 * s ? 'W' : 'L'));
  }

  // ---------- Scoring timeline ----------
  const timelines = new Map();

  function scoringRoll(sport, r, r2, mult, step) {
    switch (sport) {
      case 'football': {
        if (r < 0.0165 * mult) {
          const pts = r2 < 0.9 ? 7 : r2 < 0.95 ? 6 : 8;
          const yds = 1 + Math.floor(r2 * 1000) % 45;
          return { pts, kind: (Math.floor(r2 * 100) % 2 ? `${yds}-yd TD pass` : `${yds}-yd TD run`) + (pts === 6 ? ' (missed PAT)' : pts === 8 ? ' + 2-pt conversion' : '') };
        }
        if (r < (0.0165 + 0.0115) * mult) return { pts: 3, kind: `${25 + (Math.floor(r2 * 1000) % 30)}-yd field goal` };
        return null;
      }
      case 'basketball': {
        if (r < 0.335 * mult) {
          const three = r2 < 0.3;
          const kinds = three ? ['3-pointer', 'Corner three', 'Step-back three'] : ['Layup', 'Jumper', 'Dunk', 'Floater', 'Free throws (2)'];
          return { pts: three ? 3 : 2, kind: kinds[Math.floor(r2 * 1000) % kinds.length] };
        }
        return null;
      }
      case 'baseball': {
        if (r < 0.042 * mult) {
          const runs = r2 < 0.68 ? 1 : r2 < 0.88 ? 2 : r2 < 0.97 ? 3 : 4;
          const kinds = { 1: ['RBI single', 'Solo home run', 'Sacrifice fly', 'RBI double'], 2: ['2-run double', '2-run homer'], 3: ['3-run homer', 'Bases-clearing double'], 4: ['Grand slam'] }[runs];
          return { pts: runs, kind: kinds[Math.floor(r2 * 1000) % kinds.length] };
        }
        return null;
      }
      case 'hockey': {
        if (r < 0.021 * mult) {
          const kinds = ['Even-strength goal', 'Power-play goal', 'Wrist shot goal', 'Rebound goal', 'Breakaway goal'];
          return { pts: 1, kind: kinds[Math.floor(r2 * 1000) % kinds.length] };
        }
        return null;
      }
      case 'soccer': {
        if (r < 0.0095 * mult) {
          const kinds = ['Goal (header)', 'Goal (left foot)', 'Goal (right foot)', 'Penalty goal', 'Goal (volley)'];
          return { pts: 1, kind: kinds[Math.floor(r2 * 1000) % kinds.length] };
        }
        return null;
      }
    }
    return null;
  }

  function timeline(game) {
    if (timelines.has(game.id)) return timelines.get(game.id);
    const L = LEAGUES[game.league];
    const S = SPORTS[L.sport];
    const rand = TO.rng(`game-${game.id}`);
    const d = strength(game.league, game.home) - strength(game.league, game.away);
    const homeBoost = S.homeEdge / S.perTeam;
    const multHome = Math.max(0.3, 1 + 0.06 * d + homeBoost);
    const multAway = Math.max(0.3, 1 - 0.06 * d);
    const events = [];
    let h = 0, a = 0;
    for (let step = 0; step < STEPS; step++) {
      for (const side of ['away', 'home']) {
        const r = rand(), r2 = rand();
        if (L.sport === 'baseball') {
          const half = Math.floor(step / (STEPS / 18));
          if ((half % 2 === 0) !== (side === 'away')) continue;
        }
        const ev = scoringRoll(L.sport, r, r2, side === 'home' ? multHome : multAway, step);
        if (ev) {
          if (side === 'home') h += ev.pts; else a += ev.pts;
          events.push({ step, side, pts: ev.pts, kind: ev.kind });
        }
      }
    }
    let extra = null;
    if (h === a && !S.draw) {
      const r = rand();
      const side = r < 0.5 + 0.1 * d ? 'home' : 'away';
      let pts = 1, kind = 'Overtime winner', lose = 0, label = 'OT';
      if (L.sport === 'football') { pts = rand() < 0.6 ? 3 : 6; kind = pts === 3 ? 'Overtime field goal' : 'Overtime touchdown'; }
      if (L.sport === 'basketball') { pts = 4 + Math.floor(rand() * 7); lose = Math.max(0, pts - 1 - Math.floor(rand() * 5)); kind = 'Won in overtime'; }
      if (L.sport === 'baseball') { kind = side === 'home' ? 'Walk-off single in the 10th' : 'Go-ahead run in the 10th'; label = '10'; }
      if (L.sport === 'hockey') { kind = rand() < 0.5 ? 'Overtime goal' : 'Shootout winner'; }
      extra = { side, pts, lose, kind, label };
      if (side === 'home') { h += pts; a += lose; } else { a += pts; h += lose; }
    }
    const tl = { events, extra, finalHome: h, finalAway: a };
    timelines.set(game.id, tl);
    return tl;
  }

  // ---------- Clock text ----------
  function clockText(sport, prog) {
    const S = SPORTS[sport];
    prog = TO.clamp(prog, 0, 0.9999);
    if (sport === 'baseball') {
      const half = Math.floor(prog * 18);
      return `${half % 2 === 0 ? 'Top' : 'Bot'} ${TO.ordinal(Math.floor(half / 2) + 1)}`;
    }
    if (sport === 'soccer') {
      const minute = Math.floor(prog * 90) + 1;
      return `${minute}'`;
    }
    const x = prog * S.periods;
    const per = Math.floor(x);
    const secsLeft = Math.round((1 - (x - per)) * S.periodMin * 60);
    const clock = `${Math.floor(secsLeft / 60)}:${String(secsLeft % 60).padStart(2, '0')}`;
    if (sport === 'hockey') return `${TO.ordinal(per + 1)} · ${clock}`;
    return `Q${per + 1} · ${clock}`;
  }

  // ---------- Games ----------
  function teamsFor(league, slot) {
    const L = LEAGUES[league];
    const order = TO.shuffle(L.teams.map((_, i) => i), TO.rng(`slot-${league}-${slot}`));
    return order;
  }

  function game(id, now = TO.now()) {
    const [league, slotStr, idxStr] = id.split('-');
    const L = LEAGUES[league];
    if (!L) return null;
    const slot = Number(slotStr), idx = Number(idxStr);
    const order = teamsFor(league, slot);
    const home = L.teams[order[idx * 2]];
    const away = L.teams[order[idx * 2 + 1]];
    const start = slot * SLOT + L.offset + idx * L.stagger;
    const S = SPORTS[L.sport];
    const g = {
      id, league, sport: L.sport, slot, idx, start, end: start + DURATION, home, away,
      state: 'scheduled', homeScore: 0, awayScore: 0, progress: 0, statusText: '', clock: '', ot: null,
      simulated: !!L.simulated,
    };
    const elapsed = now - start;
    const naturalPpd = !L.simulated && TO.hash(`ppd-${id}`) % 29 === 0;
    if (naturalPpd && now >= start - 8 * MIN) {
      g.state = 'postponed';
      g.statusText = 'Postponed';
      return g;
    }
    if (elapsed < 0) {
      g.statusText = TO.fmtTime(start);
      return g;
    }
    const tl = timeline(g);
    if (elapsed >= DURATION) {
      g.state = 'final';
      g.progress = 1;
      g.homeScore = tl.finalHome;
      g.awayScore = tl.finalAway;
      g.ot = tl.extra;
      g.statusText = tl.extra ? `Final/${tl.extra.label}` : 'Final';
      g.endedAt = start + DURATION;
      return g;
    }
    const steps = Math.floor(elapsed / STEP);
    let h = 0, a = 0;
    for (const ev of tl.events) {
      if (ev.step >= steps) break;
      if (ev.side === 'home') h += ev.pts; else a += ev.pts;
    }
    g.state = 'live';
    g.homeScore = h;
    g.awayScore = a;
    g.progress = elapsed / DURATION;
    g.clock = clockText(L.sport, g.progress);
    g.statusText = g.clock;
    g.stepsPlayed = steps;
    return g;
  }

  /** Live team stats for the game page and open-bet cards. */
  function stats(g) {
    if (g.state !== 'live' && g.state !== 'final') return [];
    const p = g.progress;
    const u = (k) => TO.unit(`${g.id}-${k}`);
    const u01 = (k) => TO.u01(`${g.id}-${k}`);
    const A = g.awayScore, H = g.homeScore;
    const row = (label, a, h, opts = {}) => ({ label, a, h, ...opts });
    switch (g.sport) {
      case 'football': {
        const yd = (pts, k) => Math.round(p * (250 + 14 * pts) * (1 + 0.12 * u(k)));
        const ya = yd(A, 'ya'), yh = yd(H, 'yh');
        const sa = 0.55 + 0.15 * u('pa'), sh = 0.55 + 0.15 * u('ph');
        const top = Math.round(50 + 8 * u('top'));
        return [
          row('Total yards', ya, yh),
          row('Passing yards', Math.round(ya * sa), Math.round(yh * sh)),
          row('Rushing yards', ya - Math.round(ya * sa), yh - Math.round(yh * sh)),
          row('First downs', Math.round(ya / 17), Math.round(yh / 17)),
          row('Turnovers', Math.floor(p * 2.4 * u01('toa')), Math.floor(p * 2.4 * u01('toh')), { lowerBetter: true }),
          row('Possession', top, 100 - top, { suffix: '%' }),
        ];
      }
      case 'basketball': {
        const fg = (pts, opp, k) => Math.round(TO.clamp(45 + 4 * u(k) + (pts - opp) / 8, 34, 58));
        return [
          row('Field goal %', fg(A, H, 'fga'), fg(H, A, 'fgh'), { suffix: '%' }),
          row('3-pointers made', Math.round(p * 12 * (1 + 0.25 * u('3a'))), Math.round(p * 12 * (1 + 0.25 * u('3h')))),
          row('Rebounds', Math.round(p * 44 * (1 + 0.1 * u('ra'))), Math.round(p * 44 * (1 + 0.1 * u('rh')))),
          row('Assists', Math.round(p * 25 * (1 + 0.15 * u('aa'))), Math.round(p * 25 * (1 + 0.15 * u('ah')))),
          row('Turnovers', Math.round(p * 13 * (1 + 0.25 * u('ta'))), Math.round(p * 13 * (1 + 0.25 * u('th'))), { lowerBetter: true }),
        ];
      }
      case 'baseball': {
        const hits = (r, k) => Math.max(r, Math.round(p * 7.5 * (1 + 0.25 * u(k)) + r * 0.5));
        return [
          row('Hits', hits(A, 'ha'), hits(H, 'hh')),
          row('Home runs', Math.min(A, Math.floor(p * 1.6 * u01('hra') + A * 0.2)), Math.min(H, Math.floor(p * 1.6 * u01('hrh') + H * 0.2))),
          row('Strikeouts (pitching)', Math.round(p * 9 * (1 + 0.2 * u('ka'))), Math.round(p * 9 * (1 + 0.2 * u('kh')))),
          row('Errors', Math.floor(p * 1.6 * u01('ea')), Math.floor(p * 1.6 * u01('eh')), { lowerBetter: true }),
          row('Left on base', Math.round(p * 6.5 * (1 + 0.3 * u('la'))), Math.round(p * 6.5 * (1 + 0.3 * u('lh'))), { lowerBetter: true }),
        ];
      }
      case 'hockey': {
        const sog = (gl, k) => Math.max(gl * 3, Math.round(p * 30 * (1 + 0.15 * u(k))));
        const fo = Math.round(50 + 6 * u('fo'));
        const ppa = Math.floor(p * 4 * u01('ppa')), pph = Math.floor(p * 4 * u01('pph'));
        return [
          row('Shots on goal', sog(A, 'sa'), sog(H, 'sh')),
          row('Power plays', ppa, pph, { text: [`${Math.min(ppa, Math.floor(A / 2))}/${ppa}`, `${Math.min(pph, Math.floor(H / 2))}/${pph}`] }),
          row('Faceoff %', fo, 100 - fo, { suffix: '%' }),
          row('Hits', Math.round(p * 24 * (1 + 0.2 * u('hia'))), Math.round(p * 24 * (1 + 0.2 * u('hih')))),
          row('Blocked shots', Math.round(p * 14 * (1 + 0.2 * u('ba'))), Math.round(p * 14 * (1 + 0.2 * u('bh')))),
        ];
      }
      case 'soccer': {
        const pos = Math.round(50 + 10 * u('pos'));
        const sh = (gl, k) => Math.max(gl, Math.round(p * 13 * (1 + 0.25 * u(k))));
        const sa = sh(A, 'sa'), shh = sh(H, 'sh');
        return [
          row('Possession', pos, 100 - pos, { suffix: '%' }),
          row('Shots', sa, shh),
          row('Shots on target', Math.max(A, Math.round(sa * 0.38)), Math.max(H, Math.round(shh * 0.38))),
          row('Corners', Math.round(p * 5.5 * (1 + 0.3 * u('ca'))), Math.round(p * 5.5 * (1 + 0.3 * u('ch')))),
          row('Fouls', Math.round(p * 11 * (1 + 0.2 * u('fa'))), Math.round(p * 11 * (1 + 0.2 * u('fh'))), { lowerBetter: true }),
          row('Yellow cards', Math.floor(p * 2.4 * u01('ya')), Math.floor(p * 2.4 * u01('yh')), { lowerBetter: true }),
        ];
      }
    }
    return [];
  }

  /** Season research for the game page. */
  function research(g) {
    const S = SPORTS[g.sport];
    const side = (team) => {
      const s = strength(g.league, team);
      return {
        team,
        record: record(g.league, team),
        form: form(g.league, team),
        pf: +(S.perTeam * (1 + 0.1 * s)).toFixed(1),
        pa: +(S.perTeam * (1 - 0.1 * s + 0.03 * TO.unit(`pa-${team.abbr}`))).toFixed(1),
      };
    };
    const hw = TO.u01(`h2h-${g.league}-${[g.home.abbr, g.away.abbr].sort().join('')}`) < 0.5;
    const winner = hw ? g.home : g.away, loser = hw ? g.away : g.home;
    const w = Math.round(S.perTeam * (1.05 + 0.2 * TO.u01(`h2hw-${g.id}`)));
    const l = Math.max(0, Math.round(w - 1 - S.marginSigma * 0.6 * TO.u01(`h2hl-${g.id}`)));
    return { away: side(g.away), home: side(g.home), lastMeeting: `${winner.abbr} ${w}, ${loser.abbr} ${l}`, unit: S.unit };
  }

  /** Games on the board right now: recent finals, live games and the next ~45 minutes. */
  function board(now = TO.now(), { offDay = false, leagues = LEAGUE_ORDER } = {}) {
    const list = [];
    for (const league of leagues) {
      if (offDay && league !== 'sim') continue;
      const L = LEAGUES[league];
      const base = Math.floor((now - L.offset) / SLOT);
      for (let slot = base - 1; slot <= base + 2; slot++) {
        for (let i = 0; i < L.perSlot; i++) {
          const g = game(`${league}-${slot}-${i}`, now);
          if (g.state === 'scheduled' && g.start - now > 45 * MIN) continue;
          if (g.state === 'final' && now - (g.endedAt || g.end) > 8 * MIN) continue;
          if (g.state === 'postponed' && now > g.end) continue;
          list.push(g);
        }
      }
    }
    const rank = { live: 0, scheduled: 1, postponed: 2, final: 3 };
    return list.sort((a, b) => rank[a.state] - rank[b.state] || a.start - b.start);
  }

  // ---------- Odds ----------
  const oddsCache = new Map();

  function expectedMargin(g, now) {
    const S = SPORTS[g.sport];
    const d = strength(g.league, g.home) - strength(g.league, g.away);
    let mu = S.perTeam * 0.12 * d + S.homeEdge;
    if (g.state === 'scheduled') mu += 0.05 * S.marginSigma * TO.unit(`drift-${g.id}-${Math.floor(now / ODDS_BUCKET_PRE)}`);
    return mu;
  }

  function computeOdds(g, now) {
    const S = SPORTS[g.sport];
    const rem = g.state === 'live' ? 1 - g.progress : 1;
    const suspended = !(g.state === 'scheduled' || g.state === 'live') || (g.state === 'live' && rem < 0.03);
    const mu0 = expectedMargin(g, now);
    const minSD = S.discrete ? 0.35 : 0.8;
    let mu, sd;
    if (g.state === 'live') {
      mu = (g.homeScore - g.awayScore) + mu0 * rem;
      sd = Math.max(S.marginSigma * Math.pow(rem, 0.4), minSD);
    } else { mu = mu0; sd = S.marginSigma; }
    const sel = (market, side, line, p) => ({ id: `${g.id}|${market}|${side}`, kind: 'game', gameId: g.id, market, side, line, price: TO.odds.fromProb(p) });

    let moneyline;
    if (S.draw) {
      const pHome = 1 - TO.phi((0.5 - mu) / sd);
      const pAway = TO.phi((-0.5 - mu) / sd);
      const pDraw = Math.max(1 - pHome - pAway, 0.02);
      moneyline = [sel('ml', 'away', null, pAway), sel('ml', 'draw', null, pDraw), sel('ml', 'home', null, pHome)];
    } else {
      const pHome = TO.phi(mu / sd);
      moneyline = [sel('ml', 'away', null, 1 - pHome), sel('ml', 'home', null, pHome)];
    }
    let spread = [];
    if (S.spread) {
      const homeLine = S.spread === 'fixed' ? (mu >= 0 ? -1.5 : 1.5) : -TO.hook(mu);
      const pCover = 1 - TO.phi((-homeLine - mu) / sd);
      spread = [sel('spread', 'away', -homeLine, 1 - pCover), sel('spread', 'home', homeLine, pCover)];
    }
    const base = LEAGUES[g.league].id === 'sim' ? 222 : S.perTeam * 2;
    const baseTotal = base * (1 + 0.06 * TO.unit(`total-${g.id}`));
    let projected, sdT;
    if (g.state === 'live') {
      projected = g.homeScore + g.awayScore + baseTotal * rem;
      sdT = Math.max(S.totalSigma * Math.pow(rem, 0.4), minSD);
    } else { projected = baseTotal; sdT = S.totalSigma; }
    const line = TO.hook(projected);
    const pOver = 1 - TO.phi((line - projected) / sdT);
    const total = [sel('total', 'over', line, pOver), sel('total', 'under', line, 1 - pOver)];
    return { moneyline, spread, total, suspended, all: [...moneyline, ...spread, ...total] };
  }

  /** Current odds for a game. Live prices refresh every 15 seconds; pre-game every 2 minutes. */
  function odds(id, now = TO.now()) {
    const g = game(id, now);
    if (!g) return null;
    const bucketLen = g.state === 'live' ? ODDS_BUCKET_LIVE : ODDS_BUCKET_PRE;
    const bucket = Math.floor(now / bucketLen) * bucketLen;
    const key = `${id}|${bucket}|${g.state}`;
    if (!oddsCache.has(key)) {
      const gb = g.state === 'live' ? game(id, Math.max(bucket, g.start)) : g;
      const o = computeOdds(gb.state === 'live' || gb.state === 'scheduled' ? gb : g, bucket);
      if (g.state !== 'live' && g.state !== 'scheduled') o.suspended = true;
      if (g.state === 'live' && 1 - g.progress < 0.03) o.suspended = true;
      o.updatedAt = bucket;
      // Movement vs the previous refresh, for the up/down arrows.
      const prevT = bucket - bucketLen;
      const gp = game(id, prevT);
      if (gp && (gp.state === 'live' || gp.state === 'scheduled')) {
        const prev = computeOdds(gp, prevT);
        o.move = {};
        for (const s of o.all) {
          const p = prev.all.find((x) => x.id === s.id);
          if (p && p.price !== s.price) o.move[s.id] = s.price > p.price ? 1 : -1;
        }
      } else o.move = {};
      oddsCache.set(key, o);
      if (oddsCache.size > 3000) oddsCache.clear();
    }
    return oddsCache.get(key);
  }

  // ---------- Prediction markets (Could-have) ----------
  const PRED_CYCLE = 60 * MIN;
  const PREDICTIONS = [
    { q: 'Will the top movie this weekend earn over $60M?', cat: 'Movies', p: 0.42 },
    { q: 'Will it rain in Salt Lake City tomorrow?', cat: 'Weather', p: 0.3 },
    { q: 'Will a brand-new song debut at #1 on the charts this week?', cat: 'Music', p: 0.36 },
    { q: 'Will the next rocket launch from Cape Canaveral go up on schedule?', cat: 'Science', p: 0.68 },
    { q: 'Will average gas prices in Utah drop below $3.40 this week?', cat: 'Economy', p: 0.45 },
    { q: 'Will any Sim League team score 130+ in the next hour?', cat: 'Sim League', p: 0.4 },
    { q: 'Will a first-time winner take the next pro golf tournament?', cat: 'Sports', p: 0.55 },
  ];

  function prediction(id, now = TO.now()) {
    const [, iStr, cStr] = id.split('-');
    const i = Number(iStr), cycle = Number(cStr);
    const def = PREDICTIONS[i];
    if (!def) return null;
    const opens = cycle * PRED_CYCLE + i * 8 * MIN;
    const resolves = opens + PRED_CYCLE;
    const closes = resolves - 2 * MIN;
    const drift = 0.12 * TO.unit(`${id}-${Math.floor(now / ODDS_BUCKET_PRE)}`);
    const pYes = TO.clamp(def.p + drift, 0.08, 0.92);
    const outcome = TO.u01(`out-${id}`) < def.p ? 'yes' : 'no';
    const state = now >= resolves ? 'resolved' : now >= closes ? 'closed' : 'open';
    const prevDrift = 0.12 * TO.unit(`${id}-${Math.floor(now / ODDS_BUCKET_PRE) - 1}`);
    const prevYes = TO.clamp(def.p + prevDrift, 0.08, 0.92);
    const yes = { id: `${id}|pred|yes`, kind: 'pred', predId: id, market: 'pred', side: 'yes', line: null, price: TO.odds.fromProb(pYes) };
    const no = { id: `${id}|pred|no`, kind: 'pred', predId: id, market: 'pred', side: 'no', line: null, price: TO.odds.fromProb(1 - pYes) };
    const move = {};
    const py = TO.odds.fromProb(prevYes), pn = TO.odds.fromProb(1 - prevYes);
    if (py !== yes.price) move[yes.id] = yes.price > py ? 1 : -1;
    if (pn !== no.price) move[no.id] = no.price > pn ? 1 : -1;
    return { id, q: def.q, cat: def.cat, opens, closes, resolves, state, outcome: state === 'resolved' ? outcome : null, pYes, yes, no, move, suspended: state !== 'open' };
  }

  function predictions(now = TO.now()) {
    return PREDICTIONS.map((_, i) => {
      const cycle = Math.floor((now - i * 8 * MIN) / PRED_CYCLE);
      return prediction(`pm-${i}-${cycle}`, now);
    }).sort((a, b) => a.resolves - b.resolves);
  }

  // ---------- Selections ----------
  /** Current version of a selection (same pick, latest line and price). */
  function currentSelection(selId, now = TO.now()) {
    const [ref, market, side] = selId.split('|');
    if (market === 'race') return TO.races ? TO.races.currentSelection(selId, now) : null;
    if (market === 'pred') {
      const p = prediction(ref, now);
      if (!p) return null;
      return { sel: side === 'yes' ? p.yes : p.no, open: p.state === 'open' };
    }
    const o = odds(ref, now);
    if (!o) return null;
    const sel = o.all.find((s) => s.id === selId);
    return { sel, open: !!sel && !o.suspended };
  }

  function teamOf(g, side) { return side === 'home' ? g.home : side === 'away' ? g.away : null; }

  /** e.g. "Chiefs −3.5", "Over 44.5", "Lakers ML", "Draw", "Yes". */
  function selectionLabel(sel, g) {
    if (sel.market === 'race') return TO.races ? TO.races.selectionLabel(sel) : '';
    if (sel.market === 'pred') return sel.side === 'yes' ? 'Yes' : 'No';
    const team = g ? teamOf(g, sel.side) : null;
    switch (sel.market) {
      case 'ml': return team ? `${team.name} to win` : 'Draw';
      case 'spread': return `${team.name} ${TO.odds.fmtLine(sel.line)}`;
      case 'total': return `${sel.side === 'over' ? 'Over' : 'Under'} ${TO.odds.fmtLine(sel.line, false)}`;
    }
    return '';
  }

  function marketLabel(sel, g) {
    if (sel.market === 'race') return 'Race winner';
    if (sel.market === 'pred') return 'Prediction';
    if (sel.market === 'ml') return 'Moneyline';
    if (sel.market === 'spread') return g ? SPORTS[g.sport].spreadLabel : 'Spread';
    return 'Total';
  }

  /** Grades a pick against a game or prediction. Returns pending | won | lost | push | void. */
  function grade(sel, now = TO.now()) {
    if (sel.market === 'race') return TO.races ? TO.races.grade(sel, now) : 'pending';
    if (sel.market === 'pred') {
      const p = prediction(sel.predId || sel.id.split('|')[0], now);
      if (!p || p.state !== 'resolved') return 'pending';
      return p.outcome === sel.side ? 'won' : 'lost';
    }
    const g = game(sel.gameId, now);
    if (!g) return 'pending';
    if (g.state === 'postponed') return 'void';
    if (g.state !== 'final') return 'pending';
    return gradeScore(sel, g.homeScore, g.awayScore);
  }

  function gradeScore(sel, H, A) {
    switch (sel.market) {
      case 'ml':
        if (sel.side === 'draw') return H === A ? 'won' : 'lost';
        if (H === A) return 'lost';
        return (sel.side === 'home') === (H > A) ? 'won' : 'lost';
      case 'spread': {
        const m = (sel.side === 'home' ? H - A : A - H) + sel.line;
        return m > 0 ? 'won' : m < 0 ? 'lost' : 'push';
      }
      case 'total': {
        const tot = H + A;
        if (tot === sel.line) return 'push';
        return (sel.side === 'over') === (tot > sel.line) ? 'won' : 'lost';
      }
    }
    return 'pending';
  }

  /** How an open pick is doing right now: winning | losing | even | upcoming. */
  function liveStanding(sel, now = TO.now()) {
    if (sel.market === 'pred') {
      const p = prediction(sel.predId || sel.id.split('|')[0], now);
      if (!p) return 'upcoming';
      return (sel.side === 'yes' ? p.pYes : 1 - p.pYes) >= 0.5 ? 'winning' : 'losing';
    }
    const g = game(sel.gameId, now);
    if (!g || g.state === 'scheduled') return 'upcoming';
    if (g.state === 'postponed') return 'void';
    if (sel.market === 'total') {
      // Compare pace, not the raw score, so an over isn't "losing" in the first minute.
      const pace = g.progress > 0.05 ? (g.homeScore + g.awayScore) / g.progress : sel.line;
      if (Math.abs(pace - sel.line) < 0.5) return 'even';
      return (sel.side === 'over') === (pace > sel.line) ? 'winning' : 'losing';
    }
    const r = gradeScore(sel, g.homeScore, g.awayScore);
    if (r === 'push') return 'even';
    if (sel.market === 'ml' && g.homeScore === g.awayScore) return sel.side === 'draw' ? 'winning' : 'even';
    return r === 'won' ? 'winning' : 'losing';
  }

  TO.sim = {
    SLOT, DURATION, STEP, SPORTS, LEAGUES, REAL_LEAGUES, LEAGUE_ORDER, PREDICTIONS,
    game, board, odds, stats, research, record, form, strength,
    prediction, predictions, currentSelection, selectionLabel, marketLabel, grade, gradeScore, liveStanding, teamOf,
  };
})(window.TO);

</script>

  TO.on = (name, fn) => { (listeners[name] = listeners[name] || []).push(fn); };
  TO.emit = (name, payload) => (listeners[name] || []).forEach((fn) => { try { fn(payload); } catch (e) { console.error(e); } });

  class AppError extends Error {
    constructor(code, message, extra) { super(message); this.code = code; Object.assign(this, extra || {}); }
  }
  TO.AppError = AppError;

  // ---------- Accounts ----------
  const ACC_KEY = 'timeout.accounts';
  const accounts = () => TO.store.get(ACC_KEY, {});
  const saveAccounts = (a) => TO.store.set(ACC_KEY, a);
  const dataKey = (id) => `timeout.data.${id}`;

  function findAccount(identifier) {
    const q = String(identifier || '').trim().toLowerCase().replace(/^@/, '');
    return Object.values(accounts()).find((a) => a.username.toLowerCase() === q || a.email.toLowerCase() === q) || null;
  }
  const findAccountByUsername = (u) => Object.values(accounts()).find((a) => a.username.toLowerCase() === String(u).toLowerCase()) || null;

  function validateUsername(username, exceptId) {
    if (!/^[a-zA-Z0-9_.]{3,20}$/.test(username)) return 'Use 3–20 letters, numbers, dots or underscores.';
    const taken = Object.values(accounts()).some((a) => a.id !== exceptId && a.username.toLowerCase() === username.toLowerCase())
      || PEOPLE.some((p) => p.username.toLowerCase() === username.toLowerCase());
    return taken ? 'That username is taken. Try another.' : null;
  }
  function validateEmail(email, exceptId) {
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return 'Enter a valid email address.';
    const taken = Object.values(accounts()).some((a) => a.id !== exceptId && a.email.toLowerCase() === email.toLowerCase());
    return taken ? 'An account already uses that email. Log in instead.' : null;
  }
  const validatePassword = (pw) => (String(pw).length < 8 ? 'Use at least 8 characters.' : null);

  function createAccount({ username, email, password, photo }, opts = {}) {
    username = username.trim(); email = email.trim();
    const errors = {};
    const u = validateUsername(username); if (u) errors.username = u;
    const e = validateEmail(email); if (e) errors.email = e;
    const p = validatePassword(password); if (p) errors.password = p;
    if (Object.keys(errors).length) throw new AppError('invalid', 'Fix the highlighted fields.', { fields: errors });
    const id = TO.uid('u');
    const salt = TO.uid('s');
    const acc = { id, username, email, salt, pw: TO.pwHash(password, salt), photo: photo || TO.initialsAvatar(username), createdAt: TO.now(), demo: !!opts.demo };
    const all = accounts(); all[id] = acc; saveAccounts(all);
    TO.store.set(dataKey(id), opts.data || freshData(TO.now()));
    return acc;
  }

  function login(identifier, password) {
    if (!String(identifier).trim()) throw new AppError('invalid', 'Enter your username or email.', { fields: { identifier: 'Required' } });
    const acc = findAccount(identifier);
    if (!acc) throw new AppError('not_found', 'No account matches that username or email.', { fields: { identifier: 'No account found' } });
    if (acc.pw !== TO.pwHash(password, acc.salt)) throw new AppError('bad_password', 'That password is incorrect.', { fields: { password: 'Incorrect password' } });
    startSession(acc.id);
    return acc;
  }

  /** Server mode: copies the database user into this browser so the features still saved here keep working.
   *  acc.server always holds the latest values from the database (last login, login count...). */
  function adoptServerUser(user, remoteState = null) {
    const id = `srv_${user.id}`;
    const all = accounts();
    const acc = all[id] || { id, salt: null, pw: null };
    Object.assign(acc, {
      username: user.username, email: user.email, demo: !!user.isDemo, createdAt: Date.parse(user.createdAt), server: user,
      photo: user.photoUrl || acc.photo || TO.initialsAvatar(user.isDemo ? 'Demo User' : user.username, user.isDemo ? '#1AA560' : undefined),
    });
    all[id] = acc; saveAccounts(all);
    if (remoteState) {
      const cached = TO.store.get(dataKey(id), null);
      if (cached) {
        const remoteBets = remoteState.bets || [];
        const mergedBets = new Map(remoteBets.map((bet) => [bet.supabaseId ? `db:${bet.supabaseId}` : `id:${bet.id}`, bet]));
        for (const bet of cached.bets || []) {
          const key = bet.supabaseId ? `db:${bet.supabaseId}` : `id:${bet.id}`;
          const saved = mergedBets.get(key);
          mergedBets.set(key, saved ? Object.assign({}, saved, bet) : bet);
        }
        const hasUnsyncedBets = (cached.bets || []).some((bet) => bet.kind === 'sports' && !bet.supabaseId);
        const remoteHasPreferences = remoteState.appPreferencesReady && Object.keys(remoteState.settings || {}).length > 1;
        const preferences = remoteHasPreferences
          ? Object.assign({}, cached.settings || {}, remoteState.settings || {})
          : Object.assign({}, remoteState.settings || {}, cached.settings || {});
        const savedSports = [
          ...(Array.isArray(cached.settings?.sports) ? cached.settings.sports : []),
          ...(Array.isArray(remoteState.settings?.sports) ? remoteState.settings.sports : []),
        ].filter((league) => S.REAL_LEAGUES.includes(league));
        if (savedSports.length) preferences.sports = [...new Set(savedSports)];
        remoteState = Object.assign({}, cached, remoteState, { bets: [...mergedBets.values()], settings: preferences });
        if (hasUnsyncedBets || !remoteState.wallet) remoteState.wallet = cached.wallet;
        else if (cached.wallet) {
          // Supabase currently owns the balance fields, while clean-day history is local-only.
          // Keep those local streak and usage ledgers when refreshing the server wallet.
          const serverWallet = remoteState.wallet;
          const localWallet = cached.wallet;
          remoteState.wallet = Object.assign({}, localWallet, serverWallet);
          for (const key of ['streakDays', 'netByDay', 'penaltyByDay', 'overridesByDay', 'usageByDay', 'bonusDay', 'bonusGranted', 'warned']) {
            if (localWallet[key] !== undefined) remoteState.wallet[key] = localWallet[key];
          }
          for (const key of ['boostsByDay', 'insuranceByWeek']) {
            const serverCounts = serverWallet[key] || {};
            const localCounts = localWallet[key] || {};
            remoteState.wallet[key] = Object.fromEntries([...new Set([...Object.keys(serverCounts), ...Object.keys(localCounts)])]
              .map((day) => [day, Math.max(Number(serverCounts[day] || 0), Number(localCounts[day] || 0))]));
          }
          // The server may not have credited today's local tier bonus yet. Keep
          // that uncredited portion in the visible balance; the bet RPC applies
          // the same amount atomically before it checks the stake.
          const serverDay = serverWallet.dayKey;
          const localBonus = localWallet.bonusDay === serverDay ? Number(localWallet.bonusGranted || 0) : 0;
          const serverBonus = serverWallet.bonusDay === serverDay ? Number(serverWallet.bonusGranted || 0) : 0;
          const uncreditedBonus = Math.max(localBonus - serverBonus, 0);
          remoteState.wallet.balance = Number(serverWallet.balance || 0) + uncreditedBonus;
          if (uncreditedBonus > 0 && remoteState.wallet.balance > 0) remoteState.wallet.lockedOut = false;
          if (localBonus || serverBonus) {
            remoteState.wallet.bonusDay = serverDay;
            remoteState.wallet.bonusGranted = Math.max(localBonus, serverBonus);
          }
        }
      }
      delete remoteState.appPreferencesReady;
      TO.store.set(dataKey(id), remoteState);
    }
    else if (!TO.store.get(dataKey(id), null)) TO.store.set(dataKey(id), user.isDemo ? seedDemoData(TO.now()) : freshData(TO.now()));
    startSession(id);
    return acc;
  }

  function startSession(id) {
    TO.store.set('timeout.session', id);
    loadSession();
  }

  function logout() {
    TO.store.del('timeout.session');
    TO.account = null; TO.data = null;
  }

  function loadSession() {
    const id = TO.store.get('timeout.session', null);
    const acc = id && accounts()[id];
    if (!acc) { TO.account = null; TO.data = null; return false; }
    TO.account = acc;
    TO.data = migrate(TO.store.get(dataKey(id), null) || freshData(TO.now()));
    rollover(TO.now());
    grantTierBonus();
    save();
    return true;
  }

  function updateAccount(patch) {
    const all = accounts();
    const acc = all[TO.account.id];
    if (patch.username != null && patch.username !== acc.username) {
      const err = validateUsername(patch.username.trim(), acc.id);
      if (err) throw new AppError('invalid', err, { fields: { username: err } });
      renameEverywhere(acc.username, patch.username.trim());
      acc.username = patch.username.trim();
    }
    if (patch.email != null && patch.email !== acc.email) {
      const err = validateEmail(patch.email.trim(), acc.id);
      if (err) throw new AppError('invalid', err, { fields: { email: err } });
      acc.email = patch.email.trim();
    }
    if (patch.photo) acc.photo = patch.photo;
    if (patch.newPassword != null) {
      if (acc.pw !== TO.pwHash(patch.currentPassword || '', acc.salt)) throw new AppError('bad_password', 'Your current password is incorrect.', { fields: { currentPassword: 'Incorrect password' } });
      const err = validatePassword(patch.newPassword);
      if (err) throw new AppError('invalid', err, { fields: { newPassword: err } });
      acc.pw = TO.pwHash(patch.newPassword, acc.salt);
    }
    saveAccounts(all);
    TO.account = acc;
  }

  function renameEverywhere(oldName, newName) {
    for (const acc of Object.values(accounts())) {
      if (acc.id === TO.account.id) continue;
      mutateData(acc.id, (d) => {
        d.friends = d.friends.map((f) => (f === oldName ? newName : f));
        d.teams.forEach((t) => { t.members = t.members.map((m) => (m === oldName ? newName : m)); });
      });
    }
    TO.data.teams.forEach((t) => { t.members = t.members.map((m) => (m === oldName ? newName : m)); if (t.owner === oldName) t.owner = newName; });
  }

  function deleteAccount() {
    const all = accounts();
    delete all[TO.account.id];
    saveAccounts(all);
    TO.store.del(dataKey(TO.account.id));
    logout();
  }

  function mutateData(id, fn) {
    if (TO.account && id === TO.account.id) { fn(TO.data); save(); return; }
    const d = TO.store.get(dataKey(id), null);
    if (!d) return;
    fn(migrate(d));
    TO.store.set(dataKey(id), d);
  }

  // ---------- User data ----------
  function freshData(now) {
    const day = TO.dayKey(now);
    return {
      v: 1,
      wallet: {
        dayKey: day, balance: RULES.daily, lockedOut: false,
        netByDay: {}, penaltyByDay: {}, overridesByDay: {}, usageByDay: {}, boostsByDay: {}, insuranceByWeek: {},
        bonusDay: null, bonusGranted: 0, streakDays: 0, warned: {},
      },
      bets: [],
      lastStake: 5,
      settings: {
        sports: S.REAL_LEAGUES.slice(),
        showPredictions: true,
        showTodos: true,
        enforce: true,
        lockedApps: [],
        minLimit: 0,
        lowWarn: 10,
        notify: { settled: true, friends: true, lowTime: true },
        privacy: { record: true, minutes: true, bets: true },
      },
      onboarded: false,
      friends: [],
      requestsIn: [],
      requestsOut: [],
      teams: [],
    };
  }

  function migrate(d) {
    const f = freshData(TO.now());
    for (const k of Object.keys(f)) if (d[k] === undefined) d[k] = f[k];
    for (const k of Object.keys(f.wallet)) if (d.wallet[k] === undefined) d.wallet[k] = f.wallet[k];
    for (const k of Object.keys(f.settings)) if (d.settings[k] === undefined) d.settings[k] = f.settings[k];
    if (!Array.isArray(d.settings.sports) || d.settings.sports.length === 0) d.settings.sports = S.REAL_LEAGUES.slice();
    d.bets = (d.bets || []).filter((bet) => !bet.friend);
    // Server wallets don't store the daily bet-result ledger. Rebuild it from settled bets
    // so previous-day results continue to determine today's screen-time balance after sync.
    const settledNetByDay = {};
    for (const bet of d.bets || []) {
      if (bet.status === 'open') continue;
      const day = bet.dayKey || (Number.isFinite(Number(bet.placedAt)) ? TO.dayKey(Number(bet.placedAt)) : null);
      if (!day) continue;
      settledNetByDay[day] = (settledNetByDay[day] || 0) + (Number(bet.payout || 0) - Number(bet.stake || 0));
    }
    Object.assign(d.wallet.netByDay, settledNetByDay);
    if (!d.settings.lockedApps.length) d.settings.enforce = false; // nothing to block, so limits can't be on
    delete d.challengesIn;
    if (d.settings.notify) delete d.settings.notify.challenges;
    return d;
  }

  function save() {
    if (TO.account && TO.data) {
      TO.store.set(dataKey(TO.account.id), TO.data);
      if (TO.account.server && TO.api && TO.api.queueStateSave) TO.api.queueStateSave(TO.data);
    }
  }

  // ---------- Wallet ----------
  const W = () => TO.data.wallet;
  const today = () => W().dayKey;

  function lockPoints(d = TO.data) {
    if (!d.settings.enforce) return 0;
    return d.settings.lockedApps.reduce((sum, id) => sum + ((LOCKABLE.find((x) => x.id === id) || {}).pts || 0), 0);
  }
  const tier = (d = TO.data) => tierForPoints(lockPoints(d));

  /** Phone screen time allowed on a day: 60 + the day before's bet results − emergency penalties (never below the user's floor). */
  function baseLimitFor(day, d = TO.data) {
    const w = d.wallet;
    const net = w.netByDay[TO.addDays(day, -1)] || 0;
    const penalty = w.penaltyByDay[day] || 0;
    return Math.max(RULES.daily + net - penalty, d.settings.minLimit || 0, 0);
  }
  const emergencyMinutes = (day, d = TO.data) => (d.wallet.overridesByDay[day] || 0) * RULES.overrideMinutes;
  const limitFor = (day, d = TO.data) => baseLimitFor(day, d) + emergencyMinutes(day, d);

  function wallet() {
    const w = W(), day = today(), tomorrow = TO.addDays(day, 1);
    const used = w.usageByDay[day] || 0;
    const todayLimit = limitFor(day);
    const open = TO.data.bets.filter((b) => b.status === 'open');
    const t = tier();
    return {
      day, balance: w.balance, lockedOut: w.lockedOut,
      todayLimit, tomorrowLimit: baseLimitFor(tomorrow),
      yesterdayNet: w.netByDay[TO.addDays(day, -1)] || 0,
      todayNet: w.netByDay[day] || 0,
      penaltyToday: w.penaltyByDay[day] || 0,
      penaltyTomorrow: w.penaltyByDay[tomorrow] || 0,
      emergencyToday: emergencyMinutes(day),
      overridesUsed: w.overridesByDay[day] || 0,
      used, phoneLeft: Math.max(todayLimit - used, 0),
      appsLocked: TO.data.settings.enforce && used >= todayLimit,
      atRisk: open.reduce((s, b) => s + b.stake, 0),
      openCount: open.length,
      tier: t, points: lockPoints(),
      streak: w.streakDays, multiplier: streakMultiplier(w.streakDays),
      boostsLeft: Math.max(t.boosts - (w.boostsByDay[day] || 0), 0),
      insuranceLeft: Math.max(t.insurance - (w.insuranceByWeek[TO.weekKey(TO.dayStart(day) + 12 * TO.HOUR)] || 0), 0),
      bonusToday: w.bonusDay === day ? w.bonusGranted : 0,
    };
  }

  function grantTierBonus() {
    const w = W(), day = today();
    if (w.bonusDay !== day) { w.bonusDay = day; w.bonusGranted = 0; }
    const owed = tier().bonus - w.bonusGranted;
    if (owed > 0) {
      w.balance += owed;
      w.bonusGranted = tier().bonus;
      if (w.balance > 0) w.lockedOut = false;
    }
  }

  /** Starts a new day at local midnight: closes out the old day, updates the streak, resets the betting balance. */
  function rollover(now) {
    const w = W();
    const target = TO.dayKey(now);
    if (w.dayKey === target) return false;
    if (w.dayKey > target) { w.dayKey = target; return false; } // The local date moved backward.
    let guard = 0;
    while (w.dayKey < target && guard++ < 400) {
      const day = w.dayKey;
      closeTodos(day, now);
      const clean = TO.data.settings.enforce && (w.usageByDay[day] || 0) <= limitFor(day) && !(w.overridesByDay[day] > 0);
      w.streakDays = clean ? w.streakDays + 1 : 0;
      w.dayKey = TO.addDays(day, 1);
    }
    w.balance = RULES.daily;
    w.lockedOut = false;
    w.bonusDay = null; w.bonusGranted = 0;
    grantTierBonus();
    prune();
    TO.emit('newday', { day: w.dayKey });
    return true;
  }

  function prune() {
    const cutoff = TO.addDays(today(), -60);
    const w = W();
    for (const k of ['netByDay', 'penaltyByDay', 'overridesByDay', 'usageByDay', 'boostsByDay']) {
      for (const day of Object.keys(w[k])) if (day < cutoff) delete w[k][day];
    }
  }

  function addUsage(minutes) {
    const w = W(), day = today();
    w.usageByDay[day] = Math.max(0, (w.usageByDay[day] || 0) + minutes);
    save();
    checkPhoneTime();
  }

  function checkPhoneTime() {
    const wl = wallet();
    const w = W();
    w.warned = w.warned || {};
    if (!TO.data.settings.enforce) return;
    if (wl.appsLocked && w.warned.locked !== wl.day) {
      w.warned.locked = wl.day;
      TO.emit('toast', { kind: 'loss', title: 'Locked apps are blocked', msg: 'You used all of today\'s phone time. Use an emergency unlock in Settings if you really need it.' });
    } else if (!wl.appsLocked && wl.phoneLeft <= TO.data.settings.lowWarn && w.warned.low !== wl.day && TO.data.settings.notify.lowTime) {
      w.warned.low = wl.day;
      TO.emit('toast', { kind: 'warn', title: `${wl.phoneLeft} min of phone time left`, msg: 'Your locked apps close when it runs out.' });
    }
    save();
  }

  function useEmergencyUnlock() {
    const w = W(), day = today();
    if ((w.overridesByDay[day] || 0) >= RULES.maxOverrides) throw new AppError('limit', `You've used both emergency unlocks today. They reset at midnight.`);
    w.overridesByDay[day] = (w.overridesByDay[day] || 0) + 1;
    const tomorrow = TO.addDays(day, 1);
    w.penaltyByDay[tomorrow] = (w.penaltyByDay[tomorrow] || 0) + RULES.overridePenalty;
    w.streakDays = 0;
    w.warned.locked = null;
    save();
  }

  function setSetting(path, value) {
    const parts = path.split('.');
    let o = TO.data.settings;
    while (parts.length > 1) o = o[parts.shift()];
    const hadLocks = TO.data.settings.lockedApps.length > 0;
    o[parts[0]] = value;
    // App limits need something to block: they switch off with the last locked app and back on with the first.
    if (path === 'lockedApps') TO.data.settings.enforce = value.length > 0 && (TO.data.settings.enforce || !hadLocks);
    if (path === 'lockedApps' || path === 'enforce') grantTierBonus();
    save();
  }

  // ---------- Bets ----------
  function legFromSelection(sel, now) {
    if (sel.kind === 'pred' || sel.market === 'pred') {
      const p = S.prediction(sel.predId, now);
      return { selId: sel.id, kind: 'pred', predId: sel.predId, market: 'pred', side: sel.side, line: null, price: sel.price,
        label: S.selectionLabel(sel), marketLabel: 'Prediction', matchup: p.q, league: 'pred', start: p.resolves, result: 'pending', final: null };
    }
    if (sel.kind === 'race' || sel.market === 'race') {
      const race = TO.races.get(sel.raceId);
      const horse = TO.races.horse(sel.horseId || sel.side);
      return { selId: sel.id, kind: 'race', raceId: sel.raceId, horseId: horse.id, market: 'race', side: String(horse.id), price: sel.price,
        label: horse.name, marketLabel: 'Race winner', matchup: `Virtual Race #${race.number}`, league: 'race', start: race.startedAt || now, result: 'pending', final: null };
    }
    const g = S.game(sel.gameId, now);
    return { selId: sel.id, kind: 'game', gameId: sel.gameId, market: sel.market, side: sel.side, line: sel.line, price: sel.price,
      label: S.selectionLabel(sel, g), marketLabel: S.marketLabel(sel, g), matchup: `${g.away.name} @ ${g.home.name}`,
      short: `${g.away.abbr} @ ${g.home.abbr}`, league: g.league, start: g.start, result: 'pending', final: null };
  }

  const combine = (legs) => {
    const dec = legs.reduce((p, l) => p * TO.odds.decimal(l.price), 1);
    return { decimal: dec, american: TO.odds.fromDecimal(dec) };
  };

  /** Places a bet from bet-slip picks. Each pick carries the price the user accepted. */
  function placeBet({ picks, stake, boost, insure }, now = TO.now()) {
    rollover(now);
    const w = W();
    if (!picks.length) throw new AppError('empty', 'Add a pick to your bet slip.');
    if (picks.length > RULES.maxLegs) throw new AppError('too_many', `Parlays can have up to ${RULES.maxLegs} picks.`);
    // Every pick must still be open and at the price the user saw.
    const changed = [];
    const legs = picks.map((p) => {
      const cur = S.currentSelection(p.selId, now);
      if (!cur || !cur.sel || !cur.open) throw new AppError('closed', 'One of your picks is no longer available. Remove it to continue.');
      if (cur.sel.price !== p.price || cur.sel.line !== p.line) changed.push(p.selId);
      return legFromSelection(cur.sel, now);
    });
    if (changed.length) throw new AppError('odds_changed', 'The odds changed. Review the new odds and confirm again.', { changed });
    if (legs.some((leg) => leg.kind === 'race') && legs.length !== 1) {
      throw new AppError('race_single', 'Virtual race picks can only be placed as a single bet.');
    }

    if (w.lockedOut || w.balance <= 0) throw new AppError('locked', 'You\'re out of betting minutes for today. Betting reopens at midnight.');
    if (!Number.isInteger(stake) || stake < 1) throw new AppError('stake', 'Enter a stake of at least 1 minute.');
    if (stake > w.balance) throw new AppError('not_enough', `Not enough screentime. You have ${w.balance} min left to bet today.`, { remaining: w.balance });

    const wl = wallet();
    const { decimal, american } = combine(legs);
    const bet = {
      id: TO.uid('bet'), kind: legs[0].kind === 'race' ? 'race' : 'sports', placedAt: now, dayKey: w.dayKey,
      stake, legs, decimal, american,
      boosted: false, insured: false, multiplier: 1, status: 'open', payout: 0, settledAt: null,
    };
    let mult = wl.multiplier;
    if (boost && wl.boostsLeft > 0) {
      bet.boosted = true;
      mult *= 1 + RULES.boostPercent;
      w.boostsByDay[w.dayKey] = (w.boostsByDay[w.dayKey] || 0) + 1;
    }
    if (insure && legs.length > 1 && wl.insuranceLeft > 0) {
      bet.insured = true;
      const wk = TO.weekKey(now);
      w.insuranceByWeek[wk] = (w.insuranceByWeek[wk] || 0) + 1;
    }
    bet.multiplier = +mult.toFixed(4);
    w.balance -= stake;
    TO.data.lastStake = stake;
    if (w.balance <= 0) { w.balance = 0; w.lockedOut = true; }
    TO.data.bets.push(bet);
    if (bet.kind === 'race') TO.races.startForBet(bet, now);
    save();
    return bet;
  }

  /** To-do parlay (Could-have): stake minutes on finishing up to 3 tasks before midnight. */
  const TODO_ODDS = { easy: 50, medium: 100, hard: 200 };
  function placeTodoParlay({ tasks, stake }, now = TO.now()) {
    rollover(now);
    const w = W();
    const clean = tasks.map((t) => ({ text: String(t.text || '').trim(), difficulty: t.difficulty })).filter((t) => t.text);
    if (!clean.length) throw new AppError('empty', 'Add at least one task.');
    if (clean.length > RULES.maxLegs) throw new AppError('too_many', `To-do parlays can have up to ${RULES.maxLegs} tasks.`);
    if (w.lockedOut || w.balance <= 0) throw new AppError('locked', 'You\'re out of betting minutes for today. Betting reopens at midnight.');
    if (!Number.isInteger(stake) || stake < 1) throw new AppError('stake', 'Enter a stake of at least 1 minute.');
    if (stake > RULES.todoMaxStake) throw new AppError('stake', `To-do parlays are capped at ${RULES.todoMaxStake} minutes.`);
    if (stake > w.balance) throw new AppError('not_enough', `Not enough screentime. You have ${w.balance} min left to bet today.`, { remaining: w.balance });
    const legs = clean.map((t, i) => ({ selId: `todo-${i}`, kind: 'todo', market: 'todo', text: t.text, difficulty: t.difficulty, price: TODO_ODDS[t.difficulty] || 100,
      label: t.text, marketLabel: `To-do · ${t.difficulty}`, matchup: 'Finish before midnight', result: 'pending', final: null }));
    const { decimal, american } = combine(legs);
    const bet = { id: TO.uid('bet'), kind: 'todo', placedAt: now, dayKey: w.dayKey, deadline: TO.nextMidnight(now), stake, legs, decimal, american,
      boosted: false, insured: false, multiplier: wallet().multiplier, status: 'open', payout: 0, settledAt: null };
    w.balance -= stake;
    if (w.balance <= 0) { w.balance = 0; w.lockedOut = true; }
    TO.data.bets.push(bet);
    save();
    return bet;
  }

  function completeTodo(betId, legIndex) {
    const bet = TO.data.bets.find((b) => b.id === betId);
    if (!bet || bet.status !== 'open') return null;
    const leg = bet.legs[legIndex];
    leg.result = 'won'; leg.final = `Done ${TO.fmtTime(TO.now())}`;
    const settled = finishIfDone(bet);
    save();
    return settled;
  }

  function closeTodos(day, now) {
    for (const bet of TO.data.bets) {
      if (bet.kind !== 'todo' || bet.status !== 'open' || bet.dayKey !== day) continue;
      bet.legs.forEach((l) => { if (l.result === 'pending') { l.result = 'lost'; l.final = 'Not done by midnight'; } });
      finishIfDone(bet, now);
    }
  }

  function outcome(bet) {
    const legs = bet.legs;
    const lost = legs.filter((l) => l.result === 'lost').length;
    const pending = legs.some((l) => l.result === 'pending');
    if (lost) {
      if (bet.insured) {
        if (pending) return { status: 'open' };
        if (lost === 1) return { status: 'push', payout: bet.stake, insurancePaid: true };
      }
      return { status: 'lost', payout: 0 };
    }
    if (pending) return { status: 'open' };
    const won = legs.filter((l) => l.result === 'won');
    if (!won.length) return { status: legs.every((l) => l.result === 'void') ? 'void' : 'push', payout: bet.stake };
    const dec = won.reduce((p, l) => p * TO.odds.decimal(l.price), 1);
    let payout = Math.round(bet.stake * dec);
    payout = bet.stake + Math.round((payout - bet.stake) * (bet.multiplier || 1));
    return { status: 'won', payout };
  }

  function finishIfDone(bet, now = TO.now()) {
    const res = outcome(bet);
    if (res.status === 'open') return null;
    bet.status = res.status;
    bet.payout = res.payout;
    bet.insurancePaid = !!res.insurancePaid;
    bet.settledAt = now;
    const w = W();
    w.netByDay[bet.dayKey] = (w.netByDay[bet.dayKey] || 0) + (bet.payout - bet.stake);
    // Voids and pushes return the stake; wins and losses only affect the next day's limit.
    if (bet.dayKey === w.dayKey && (bet.status === 'void' || bet.status === 'push')) w.balance += bet.payout;
    return bet;
  }

  /** Grades every open bet against the latest scores. Runs on every tick, so bets settle seconds after a game ends. */
  function settle(now = TO.now()) {
    const settled = [];
    for (const bet of TO.data.bets) {
      if (bet.status !== 'open' || bet.kind === 'todo') continue;
      let changed = false;
      for (const leg of bet.legs) {
        if (leg.result !== 'pending') continue;
        const r = S.grade(leg, now);
        if (r === 'pending') continue;
        leg.result = r;
        changed = true;
        if (leg.kind === 'pred') {
          const p = S.prediction(leg.predId, now);
          leg.final = `Resolved ${p.outcome === 'yes' ? 'YES' : 'NO'}`;
        } else if (leg.kind === 'race') {
          const race = TO.races.get(leg.raceId);
          leg.final = race && race.winnerId ? `Winner: ${TO.races.horse(race.winnerId).name}` : 'Race finished';
        } else {
          const g = S.game(leg.gameId, now);
          leg.final = g.state === 'postponed' ? 'Postponed' : `${g.away.abbr} ${g.awayScore} – ${g.home.abbr} ${g.homeScore}${g.ot ? ` (${g.ot.label === '10' ? '10 inn' : 'OT'})` : ''}`;
        }
      }
      if (changed && finishIfDone(bet, now)) settled.push(bet);
    }
    if (settled.length) save();
    return settled;
  }

  // ---------- Record / stats ----------
  function statsFor(bets) {
    const settled = bets.filter((b) => b.status !== 'open');
    const won = settled.filter((b) => b.status === 'won');
    const lost = settled.filter((b) => b.status === 'lost');
    const voids = settled.filter((b) => b.status === 'void' || b.status === 'push');
    const net = settled.reduce((s, b) => s + (b.payout - b.stake), 0);
    const bySport = {};
    for (const b of settled) {
      const key = b.kind === 'todo' ? 'todo' : b.kind === 'race' ? 'race' : b.legs.length > 1 ? 'parlay' : b.legs[0].league;
      bySport[key] = bySport[key] || { w: 0, l: 0, net: 0 };
      if (b.status === 'won') bySport[key].w++;
      if (b.status === 'lost') bySport[key].l++;
      bySport[key].net += b.payout - b.stake;
    }
    return {
      w: won.length, l: lost.length, v: voids.length, net,
      pct: won.length + lost.length ? Math.round((100 * won.length) / (won.length + lost.length)) : null,
      best: won.reduce((m, b) => Math.max(m, b.payout - b.stake), 0),
      bySport,
      recent: settled.filter((b) => b.status === 'won' || b.status === 'lost').sort((a, b) => b.settledAt - a.settledAt).slice(0, 5).map((b) => (b.status === 'won' ? 'W' : 'L')),
    };
  }
  const myStats = () => statsFor(TO.data.bets);

  // ---------- People & friends ----------
  function person(username) {
    const fake = PEOPLE.find((p) => p.username.toLowerCase() === String(username).toLowerCase());
    if (fake) return fake;
    const acc = findAccountByUsername(username);
    if (!acc) return null;
    const d = acc.id === (TO.account && TO.account.id) ? TO.data : migrate(TO.store.get(dataKey(acc.id), null) || freshData(TO.now()));
    const st = statsFor(d.bets);
    return { username: acc.username, name: acc.username, photo: acc.photo, w: st.w, l: st.l, net: st.net, tier: tier(d).id, streak: d.wallet.streakDays,
      share: d.settings.privacy, local: true, accountId: acc.id, openBets: d.bets.filter((b) => b.status === 'open') };
  }

  /** Open picks a friend has shared (fake friends pick from the live board). */
  function sharedPicks(p, now = TO.now()) {
    if (!p || !p.share.bets) return [];
    if (p.local) return (p.openBets || []).slice(0, 3).map((b) => ({ label: b.legs.map((l) => l.label).join(' + '), matchup: b.legs.length > 1 ? `${b.legs.length}-pick parlay` : b.legs[0].matchup, price: b.american, stake: b.stake }));
    const games = S.board(now).filter((g) => (g.state === 'live' || g.state === 'scheduled') && !g.simulated);
    const rand = TO.rng(`${p.username}-${Math.floor(now / S.SLOT)}`);
    const picks = [];
    const count = 1 + Math.floor(rand() * 2);
    for (let i = 0; i < count && games.length; i++) {
      const g = games[Math.floor(rand() * games.length)];
      const o = S.odds(g.id, now);
      const sel = o.all[Math.floor(rand() * o.all.length)];
      picks.push({ label: S.selectionLabel(sel, g), matchup: `${g.away.name} @ ${g.home.name}`, price: sel.price, stake: 5 + Math.floor(rand() * 4) * 5, gameId: g.id });
    }
    return picks;
  }

  const sameUser = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();

  function searchPeople(query) {
    const q = String(query || '').trim().toLowerCase().replace(/^@/, '');
    if (!q) return [];
    const me = TO.account.username.toLowerCase();
    const locals = Object.values(accounts()).filter((a) => a.username.toLowerCase() !== me).map((a) => ({ username: a.username, name: a.username, photo: a.photo, local: true }));
    return [...PEOPLE, ...locals].filter((p) => {
      const username = p.username.toLowerCase();
      return username !== me && (username.includes(q) || (p.name || '').toLowerCase().includes(q));
    }).slice(0, 8);
  }

  const relation = (username) => {
    const d = TO.data;
    if (d.friends.some((f) => sameUser(f, username))) return 'friend';
    if (d.requestsOut.some((r) => sameUser(r.to, username))) return 'requested';
    if (d.requestsIn.some((r) => sameUser(r.from, username))) return 'incoming';
    return 'none';
  };

  /** An invite link is a yes from the sender, so this connects both people when the other account is on this device. */
  function addFriend(username) {
    const u = String(username || '').trim().replace(/^@/, '');
    if (!u || sameUser(u, TO.account.username) || !/^[a-zA-Z0-9_.]{1,20}$/.test(u)) return false;
    if (!TO.data.friends.some((f) => sameUser(f, u))) TO.data.friends.push(u);
    TO.data.requestsIn = TO.data.requestsIn.filter((r) => !sameUser(r.from, u));
    TO.data.requestsOut = TO.data.requestsOut.filter((r) => !sameUser(r.to, u));
    const acc = findAccountByUsername(u);
    if (acc) {
      mutateData(acc.id, (d) => {
        if (!d.friends.some((f) => sameUser(f, TO.account.username))) d.friends.push(TO.account.username);
        d.requestsOut = d.requestsOut.filter((r) => !sameUser(r.to, TO.account.username));
        d.requestsIn = d.requestsIn.filter((r) => !sameUser(r.from, TO.account.username));
      });
    }
    save();
    return true;
  }

  function sendFriendRequest(username, now = TO.now()) {
    const rel = relation(username);
    if (rel === 'friend' || rel === 'requested') return;
    if (rel === 'incoming') {
      const incoming = TO.data.requestsIn.find((r) => sameUser(r.from, username));
      if (incoming) acceptFriendRequest(incoming.id);
      return;
    }
    const p = person(username);
    const req = { id: TO.uid('fr'), to: username, at: now };
    if (p && p.fake) req.acceptAt = now + 6000; // fake people accept after a few seconds
    TO.data.requestsOut.push(req);
    if (p && p.local) {
      mutateData(p.accountId, (d) => { if (!d.requestsIn.some((r) => r.from === TO.account.username)) d.requestsIn.push({ id: req.id, from: TO.account.username, at: now }); });
    }
    save();
  }

  function acceptFriendRequest(id) {
    const d = TO.data;
    const req = d.requestsIn.find((r) => r.id === id);
    if (!req) return;
    d.requestsIn = d.requestsIn.filter((r) => r.id !== id);
    if (!d.friends.includes(req.from)) d.friends.push(req.from);
    const acc = findAccountByUsername(req.from);
    if (acc) {
      mutateData(acc.id, (o) => {
        o.requestsOut = o.requestsOut.filter((r) => r.to !== TO.account.username);
        if (!o.friends.includes(TO.account.username)) o.friends.push(TO.account.username);
      });
    }
    save();
  }

  function declineFriendRequest(id) {
    const d = TO.data;
    const req = d.requestsIn.find((r) => r.id === id);
    d.requestsIn = d.requestsIn.filter((r) => r.id !== id);
    const acc = req && findAccountByUsername(req.from);
    if (acc) mutateData(acc.id, (o) => { o.requestsOut = o.requestsOut.filter((r) => r.to !== TO.account.username); });
    save();
  }

  /** Resending is allowed once an hour per request. Returns ms until it can be sent again (0 = now). */
  const RESEND_WAIT = TO.HOUR;
  const resendWait = (req, now = TO.now()) => Math.max(0, req.at + RESEND_WAIT - now);

  function resendFriendRequest(username, now = TO.now()) {
    const req = TO.data.requestsOut.find((r) => r.to === username);
    if (!req) return false;
    if (resendWait(req, now) > 0) throw new AppError('too_soon', `You can send @${username} another request in ${TO.fmtIn(resendWait(req, now))}.`);
    req.at = now;
    const acc = findAccountByUsername(username);
    if (acc) mutateData(acc.id, (o) => { const r = o.requestsIn.find((x) => x.from === TO.account.username); if (r) r.at = now; });
    save();
    return true;
  }

  function cancelFriendRequest(username) {
    TO.data.requestsOut = TO.data.requestsOut.filter((r) => r.to !== username);
    const acc = findAccountByUsername(username);
    if (acc) mutateData(acc.id, (o) => { o.requestsIn = o.requestsIn.filter((r) => r.from !== TO.account.username); });
    save();
  }

  function removeFriend(username) {
    TO.data.friends = TO.data.friends.filter((f) => f !== username);
    const acc = findAccountByUsername(username);
    if (acc) mutateData(acc.id, (o) => { o.friends = o.friends.filter((f) => f !== TO.account.username); });
    save();
  }

  /** Background social events: fake friends accept requests after a few seconds. */
  function socialTick(now = TO.now()) {
    const d = TO.data;
    const events = [];
    for (const r of d.requestsOut.slice()) {
      if (r.acceptAt && now >= r.acceptAt) {
        d.requestsOut = d.requestsOut.filter((x) => x.id !== r.id);
        if (!d.friends.includes(r.to)) d.friends.push(r.to);
        events.push({ type: 'friend', username: r.to });
      }
    }
    if (events.length) save();
    return events;
  }

  // ---------- Teams ----------
  function teamStatus(t, now = TO.now()) {
    const start = TO.dayStart(t.start), end = TO.dayStart(t.end) + DAY;
    if (now < start) return 'upcoming';
    if (now >= end) return 'ended';
    return 'active';
  }

  function teamStandings(t, now = TO.now()) {
    const start = TO.dayStart(t.start), end = TO.dayStart(t.end) + DAY;
    const lastDay = TO.dayKey(Math.min(now, end - 1));
    return t.members.map((u) => {
      const mine = sameUser(u, TO.account.username);
      const p = mine ? null : person(u);
      // A username from search that isn't a demo profile or an account on this device
      // still belongs on the roster. Don't borrow the current user's record for them.
      if (!mine && !p) {
        return { username: u, me: false, net: 0, w: 0, l: 0, hidden: true, photo: TO.initialsAvatar(u), tier: 'rookie' };
      }
      let net = 0, w = 0, l = 0, hidden = false;
      if (!p || p.local) {
        const bets = p ? migrate(TO.store.get(dataKey(p.accountId), null) || freshData(now)).bets : TO.data.bets;
        for (const b of bets) {
          if (b.status === 'open' || b.placedAt < start || b.placedAt >= end) continue;
          net += b.payout - b.stake;
          if (b.status === 'won') w++;
          if (b.status === 'lost') l++;
        }
        if (p && !p.share.minutes) hidden = true;
      } else {
        if (now >= start) {
          for (let day = t.start; day <= lastDay; day = TO.addDays(day, 1)) {
            const r = TO.unit(`${t.id}-${u}-${day}`);
            net += Math.round(10 * r + (p.net > 0 ? 2 : -1));
            const games = 1 + Math.floor(TO.u01(`${t.id}-${u}-${day}-n`) * 3);
            const wins = Math.round(games * (0.5 + 0.3 * r));
            w += wins; l += games - wins;
          }
        }
        if (!p.share.minutes) hidden = true;
      }
      return { username: u, me: mine, net, w, l, hidden, photo: p ? p.photo : TO.account.photo, tier: p ? p.tier : tier().id };
    }).sort((a, b) => (a.hidden - b.hidden) || b.net - a.net);
  }

  function saveQuiet() {
    if (TO.account && TO.data) TO.store.set(dataKey(TO.account.id), TO.data);
  }

  function newShareKey() {
    const bytes = new Uint8Array(16);
    if (globalThis.crypto && globalThis.crypto.getRandomValues) globalThis.crypto.getRandomValues(bytes);
    else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
    return [...bytes].map((b) => b.toString(16).padStart(2, '0')).join('');
  }

  function touch(team) {
    team.rev = (team.rev || 0) + 1;
    return team.rev;
  }

  function applyRemote(local, remote) {
    if (remote.name) local.name = remote.name;
    if (remote.start) local.start = String(remote.start).slice(0, 10);
    if (remote.end) local.end = String(remote.end).slice(0, 10);
    if (remote.owner) local.owner = remote.owner;
    if (Array.isArray(remote.members) && remote.members.length) local.members = remote.members.slice();
    local.remote = true;
  }

  function ensureTeamKey(team) {
    if (!team) return null;
    if (!team.shareKey) {
      team.shareKey = newShareKey();
      touch(team);
      save();
      publishTeam(team);
    }
    return team.shareKey;
  }

  function publishTeam(team) {
    if (!team.shareKey || !TO.api || !TO.api.publishTeam) return;
    TO.api.publishTeam(team).then((remote) => {
      const current = TO.data && TO.data.teams.find((t) => t.id === team.id);
      if (!current || !remote) return;
      current.remote = true;
      saveQuiet();
    }).catch(() => {});
  }

  /** Copies the team onto every member who has an account saved in this browser. */
  function syncTeamCopies(team) {
    const copy = JSON.parse(JSON.stringify(team));
    for (const u of team.members) {
      if (sameUser(u, TO.account.username)) continue;
      const acc = findAccountByUsername(u);
      if (!acc) continue;
      mutateData(acc.id, (d) => {
        const existing = d.teams.find((x) => x.id === team.id);
        if (existing) {
          existing.name = copy.name;
          existing.start = copy.start;
          existing.end = copy.end;
          existing.owner = copy.owner;
          existing.members = copy.members.slice();
        } else d.teams.push(JSON.parse(JSON.stringify(copy)));
      });
    }
  }

  function createTeam({ name, start, end, members }) {
    name = String(name || '').trim();
    const errors = {};
    if (!name) errors.name = 'Give your team a name.';
    if (!start) errors.start = 'Pick a start date.';
    if (!end) errors.end = 'Pick an end date.';
    if (start && end && end < start) errors.end = 'End date must be on or after the start date.';
    if (Object.keys(errors).length) throw new AppError('invalid', 'Fix the highlighted fields.', { fields: errors });
    const invited = [];
    const seen = new Set([TO.account.username.toLowerCase()]);
    for (const raw of members || []) {
      const u = String(raw || '').trim();
      const key = u.toLowerCase();
      if (!u || seen.has(key)) continue;
      seen.add(key);
      invited.push(u);
    }
    const team = { id: TO.uid('team'), name, start, end, members: [TO.account.username, ...invited], owner: TO.account.username, createdAt: TO.now(), shareKey: newShareKey(), remote: false, rev: 1 };
    TO.data.teams.push(team);
    syncTeamCopies(team);
    save();
    publishTeam(team);
    return team;
  }

  function leaveTeam(id, opts = {}) {
    const t = TO.data.teams.find((x) => x.id === id);
    const shareKey = t && t.shareKey;
    const username = TO.account.username;
    TO.data.teams = TO.data.teams.filter((x) => x.id !== id);
    if (t) {
      for (const u of t.members) {
        if (sameUser(u, username)) continue;
        const acc = findAccountByUsername(u);
        if (!acc) continue;
        mutateData(acc.id, (d) => {
          const existing = d.teams.find((x) => x.id === id);
          if (!existing) return;
          existing.members = existing.members.filter((m) => !sameUser(m, username));
          if (!existing.members.length) d.teams = d.teams.filter((x) => x.id !== id);
        });
      }
    }
    save();
    if (opts.remote !== false && shareKey && TO.api && TO.api.leaveTeamRemote) TO.api.leaveTeamRemote({ id, shareKey }, username).catch(() => {});
  }

  function inviteToTeam(id, members) {
    const t = TO.data.teams.find((x) => x.id === id);
    if (!t) return;
    const added = [];
    for (const raw of members || []) {
      const u = String(raw || '').trim();
      if (!u || t.members.some((m) => sameUser(m, u))) continue;
      t.members.push(u);
      added.push(u);
    }
    if (!added.length) return;
    touch(t);
    syncTeamCopies(t);
    save();
    if (t.shareKey && TO.api && TO.api.addTeamMember) added.forEach((u) => { TO.api.addTeamMember(t, u).catch(() => {}); });
  }

  /** Join a team from its link. Adds you, and the server roster when the link has a key. */
  function joinTeam(snapshot) {
    const id = String(snapshot.id || '').trim();
    const name = String(snapshot.name || '').trim();
    const start = String(snapshot.start || '').slice(0, 10);
    const end = String(snapshot.end || '').slice(0, 10);
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(id) || !name || !/^\d{4}-\d{2}-\d{2}$/.test(start) || !/^\d{4}-\d{2}-\d{2}$/.test(end) || end < start) {
      throw new AppError('invalid', 'That team link is missing a name or its dates.');
    }
    let team = TO.data.teams.find((t) => t.id === id);
    if (!team) {
      team = { id, name, start, end, members: [], owner: snapshot.owner || TO.account.username, createdAt: TO.now(), shareKey: snapshot.shareKey || null, remote: false, rev: 0 };
      TO.data.teams.push(team);
    }
    if (snapshot.shareKey) team.shareKey = snapshot.shareKey;
    team.name = name;
    team.start = start;
    team.end = end;
    if (snapshot.owner) team.owner = snapshot.owner;
    const add = (u) => { if (u && !team.members.some((m) => sameUser(m, u))) team.members.push(u); };
    add(snapshot.owner);
    for (const raw of snapshot.members || []) add(String(raw || '').trim());
    add(TO.account.username);
    const rev = touch(team);
    syncTeamCopies(team);
    save();
    if (team.shareKey && TO.api && TO.api.addTeamMember) {
      const key = team.shareKey;
      TO.api.addTeamMember(team, TO.account.username).then((remote) => {
        const current = TO.data && TO.data.teams.find((t) => t.id === id);
        if (!current || !remote || (current.rev || 0) !== rev) return;
        applyRemote(current, remote);
        current.shareKey = key;
        syncTeamCopies(current);
        saveQuiet();
      }).catch(() => {});
    }
    return team;
  }

  /** Pull rosters that were saved on the server. A failed request leaves the local team alone. */
  function refreshTeams() {
    if (!TO.data || !TO.api || !TO.api.fetchTeam) return Promise.resolve(false);
    const revs = new Map(TO.data.teams.map((t) => [t.id, t.rev || 0]));
    let changed = false;
    const pulls = TO.data.teams.filter((t) => t.shareKey && t.remote).map(async (team) => {
      const remote = await TO.api.fetchTeam(team.id, team.shareKey);
      const current = TO.data && TO.data.teams.find((t) => t.id === team.id);
      if (!current || (current.rev || 0) !== revs.get(team.id) || remote === null) return;
      if (remote === false || !(remote.members || []).some((m) => sameUser(m, TO.account.username))) {
        leaveTeam(team.id, { remote: false });
        changed = true;
        return;
      }
      applyRemote(current, remote);
      current.shareKey = team.shareKey;
      syncTeamCopies(current);
      changed = true;
    });
    const mine = TO.api.myTeams ? TO.api.myTeams() : Promise.resolve(null);
    return Promise.all([mine, ...pulls]).then(([listed]) => {
      if (Array.isArray(listed) && TO.data) {
        const seen = new Set();
        for (const remote of listed) {
          if (!remote || !remote.id) continue;
          seen.add(remote.id);
          let local = TO.data.teams.find((t) => t.id === remote.id);
          if (!local) {
            local = { id: remote.id, name: remote.name, start: String(remote.start).slice(0, 10), end: String(remote.end).slice(0, 10), members: remote.members || [TO.account.username], owner: remote.owner || TO.account.username, createdAt: TO.now(), remote: true, rev: 1 };
            TO.data.teams.push(local);
            changed = true;
          } else if ((local.rev || 0) === revs.get(local.id)) {
            const key = local.shareKey;
            applyRemote(local, remote);
            if (key) local.shareKey = key;
            changed = true;
          }
        }
        const kept = TO.data.teams.filter((t) => t.shareKey || !t.remote || seen.has(t.id));
        if (kept.length !== TO.data.teams.length) { TO.data.teams = kept; changed = true; }
      }
      if (changed) {
        saveQuiet();
        if (TO.app) TO.app.render();
        if (TO.ui && TO.ui.sheetOpen && TO.ui.sheetOpen('team')) TO.ui.refreshSheet('team');
      }
      return changed;
    }).catch(() => false);
  }

  // ---------- Leaderboard ----------
  function leaderboard() {
    const me = myStats();
    const rows = [{ username: TO.account.username, me: true, photo: TO.account.photo, w: me.w, l: me.l, net: me.net, tier: tier().id, streak: W().streakDays,
      share: { record: true, minutes: true, bets: true } }];
    for (const f of TO.data.friends) {

    }
    return rows.sort((a, b) => (!a.share.minutes - !b.share.minutes) || b.net - a.net);
  }

  // ---------- Demo account ----------
  function seedDemoData(now) {
    const d = freshData(now);
    const day = TO.dayKey(now);
    d.onboarded = true;
    d.settings.lockedApps = ['instagram', 'tiktok', 'youtube', 'cat-social'];

    d.requestsIn = [{ id: TO.uid('fr'), from: 'priya_p', at: now - 20 * MIN }];
    // Still waiting on these two: one can be resent, the other was sent too recently.
