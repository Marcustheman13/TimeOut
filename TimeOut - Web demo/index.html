<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimeOut</title>
<meta name="description" content="Clickable demo of TimeOut, a sportsbook where you bet screen time instead of money.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage">
  <div class="device-slot" id="device-slot">
    <div class="device" id="device">
      <div class="screen" id="screen">
        <div class="island"></div>
        <div class="statusbar" aria-hidden="true">
          <span id="sb-time">9:41</span>
          <span class="sb-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 14 0"/><path d="M3.5 6.8a6.5 6.5 0 0 1 9 0"/><circle cx="8" cy="10" r="1.3" fill="currentColor" stroke="none"/></svg>
            <span class="batt"><i></i></span>
          </span>
        </div>
        <div id="app-body"></div>
        <div class="layer" id="layer"></div>
        <div class="toasts" id="toasts" aria-live="polite"></div>
      </div>
    </div>
  </div>
  <aside class="tester" id="tester" aria-label="Tester console">
    <div class="tester-head">
      <div class="k">Tester console</div>
      <h2>Demo controls</h2>
      <p>Not part of the app. Use these to trigger situations from the spec without waiting.</p>
    </div>
    <div class="tester-body" id="tester-body"></div>
  </aside>
</div>
<script src="js/core.js"></script>
<script src="js/sim.js"></script>
<script src="js/state.js"></script>
<script src="js/live.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/slip.js"></script>
<script src="js/home.js"></script>
<script src="js/game.js"></script>
<script src="js/bets.js"></script>
<script src="js/social.js"></script>
<script src="js/settings.js"></script>
<script src="js/auth.js"></script>
<script src="js/tester.js"></script>
<script src="js/app.js"></script>
</body>
</html>
