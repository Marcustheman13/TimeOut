# Publishes the web demo to GitHub Pages whenever it changes on main:
#   https://marcustheman13.github.io/TimeOut/          the web app (index.html), resizes from phone to desktop
#   https://marcustheman13.github.io/TimeOut/web.html  forwards old links to the main page
# Pages can't serve a folder with spaces in its name directly, so this uploads "TimeOut - Web demo" as the site.
name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'TimeOut - Web demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'TimeOut - Web demo'
      - id: deployment
        uses: actions/deploy-pages@v4
