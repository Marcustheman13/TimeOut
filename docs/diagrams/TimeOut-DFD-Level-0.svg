<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A3F47"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="60" y="45.0" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#0B3B66">TimeOut – Level 0 Context Diagram</text><text x="60" y="82.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" dominant-baseline="middle" fill="#444">The whole TimeOut system (website + iPhone app) as one process, with every external entity it exchanges data with.</text><rect x="560" y="320" width="360" height="140" fill="#FDEEFB" stroke="#EE8AD9" stroke-width="2"/><line x1="574" y1="320" x2="574" y2="460" stroke="#EE8AD9" stroke-width="2"/><line x1="906" y1="320" x2="906" y2="460" stroke="#EE8AD9" stroke-width="2"/><text x="740.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#111">0 TimeOut System</text><rect x="60" y="340" width="230" height="100" fill="#EAF3FE" stroke="#6FA8F0" stroke-width="2"/><text x="175.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#111">Player</text><rect x="420" y="130" width="230" height="80" fill="#EAF3FE" stroke="#6FA8F0" stroke-width="2"/><text x="535.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#111">Email Service</text><rect x="830" y="130" width="230" height="80" fill="#EAF3FE" stroke="#6FA8F0" stroke-width="2"/><text x="945.0" y="159.8" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" tex