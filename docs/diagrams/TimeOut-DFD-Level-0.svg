 d="M605,320 L605,210" fill="none" stroke="#3A3F47" stroke-width="2.4" marker-end="url(#ah)"/><rect x="615" y="254.6" width="164.28" height="20.8" fill="white"/><text x="620" y="265.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#111">Confirmation emails</text><path d="M880,320 L880,210" fill="none" stroke="#3A3F47" stroke-width="2.4" marker-end="url(#ah)"/><rect x="890" y="254.6" width="58.72" height="20.8" fill="white"/><text x="895" y="265.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#111">Alerts</text><path d="M605,620 L605,460" fill="none" stroke="#3A3F47" stroke-width="2.4" stroke-dasharray="14 9" marker-end="url(#ah)"/><rect x="479.44" y="521.2" width="115.55999999999999" height="37.6" fill="white"/><text x="590" y="531.6" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" dominant-baseline="middle" fill="#111">Live scores &amp;</text><text x="590" y="548.4" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" dominant-baseline="middle" fill="#111">final results</text><path d="M870,460 L870,620" fill="none" stroke="#3A3F47" stroke-width="2.4" marker-end="url(#ah)"/><rect x="760.6800000000001" y="529.6" width="99.32" height="20.8" fill="white"/><text x="855" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" dominant-baseline="middle" fill="#111">Time limits</text><path d="M1010,620 L1010,420 L920,420" fill="none" stroke="#3A3F47" stroke-width="2.4" stroke-dasharray="14 9" marker-end="url(#ah)"/><rect x="1020" y="529.6" width="115.55999999999999" height="20.8" fill="white"/><text x="1025" y="540.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" dominant-baseline="middle" fill="#111">Usage reports</text>